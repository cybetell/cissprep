 ex:"Bushes are kept low near the entrance so guards can see everyone (natural surveillance), a single path leads visitors to reception (natural access control), and the lobby carries the company's branding (territorial reinforcement).",
 terms:[["CPTED","Crime Prevention Through Environmental Design."],["Natural surveillance","Design that maximizes visibility of people and spaces."],["Territorial reinforcement","Design that shows ownership of a space."],["Target hardening","Denying access with physical barriers and alarms."]],
 trap:"CPTED uses the environment to influence behavior; target hardening uses barriers to block access. Questions often contrast them.",
 mnem:"CPTED's four: Access, Surveillance, Territory, Maintenance: 'A Safe Tidy Mall'.",
 ref:{a:"ch. 10, p. 417 to 462",o:"Domain 3"}},

{id:"x4-segmentation",d:4,lvl:2,t:"Network segmentation: VLAN hopping, VXLAN, SDN, SD-WAN",
 what:"Segmenting a network limits how far an attacker can move. The 2021 outline adds micro-segmentation and the technologies behind it.",
 pts:["VLAN hopping lets an attacker reach other VLANs. Switch spoofing: the attacker's device pretends to be a switch and negotiates a trunk. Double tagging: the attacker adds a second VLAN tag. Proper switch configuration prevents both.",
      "VLAN IDs are 12 bits, so about 4,000 VLANs at most, and VLANs are tied to one Layer 2 domain.",
      "VXLAN encapsulates Layer 2 frames in UDP datagrams so they can travel anywhere over IP. Its 24-bit network identifier (VNI) allows over 16 million segments. Virtual tunnel end points (VTEPs) connect the overlay to the underlying network. Mostly used in clouds and data centers.",
      "Software-defined networking (SDN) separates control and data planes so segmentation rules can be pushed centrally and follow workloads.",
      "SD-WAN applies the SDN idea to wide area links: it steers traffic over MPLS, Internet, 4G or satellite according to central policy.",
      "Micro-segmentation applies policy down to individual workloads, so even servers in the same subnet cannot talk unless allowed. A screened subnet (DMZ) separates public-facing systems from the internal network."],
 ex:"In a virtualized data center, micro-segmentation lets the web servers talk only to the application servers on one port, and the application servers only to the database. A compromised web server cannot scan the rest.",
 terms:[["VLAN hopping","Gaining access to traffic on other VLANs."],["VXLAN","Layer 2 over UDP with 24-bit segment IDs."],["SD-WAN","Software-defined wide area network."],["Micro-segmentation","Fine-grained policy down to individual workloads."]],
 trap:"VLANs are limited to about 4,000 (12-bit ID); VXLAN supports about 16 million (24-bit VNI).",
 mnem:"VLAN = 12 bits, VXLAN = 24 bits: twice the bits, four thousand times the segments.",
 ref:{a:"ch. 13, p. 630 to 640",o:"Domain 4"}},

{id:"x4-sansfil",d:4,lvl:2,t:"Wireless and cellular: Li-Fi, Zigbee, satellite, 4G, 5G",
 what:"The 2021 outline goes beyond Wi-Fi to light-based, low-power, satellite and cellular networks. Know what each is good for and its main security point.",
 pts:["Li-Fi transmits data with light (visible or infrared). It supports many users in a small area with low latency, and its coverage stops at walls, which helps security.",
      "Zigbee (based on IEEE 802.15.4) is a low-power mesh network for IoT and automation. Security relies on a coordinator acting as Trust Center to manage keys.",
      "Satellite links reach places nothing else does but add latency, especially geostationary satellites.",
      "Mobile generations: 1G FDMA, 2G TDMA, 3G CDMA, 4G OFDM, 5G OFDM. 5G brings higher speed, lower latency and support for many IoT devices.",
      "WPA2 Enterprise uses 802.1X, EAP and CCMP. 802.1X provides user authentication and key distribution on wired and wireless networks."],
 ex:"Remote plantations connected by Starlink (low earth orbit) get far lower latency than with older geostationary VSAT links, but the traffic must still pass through the site firewall, never around it.",
 terms:[["Li-Fi","Wireless networking using light."],["Zigbee","Low-power IEEE 802.15.4 mesh network for IoT."],["Trust Center","The Zigbee device that manages network keys."],["OFDM","Orthogonal frequency-division multiplexing, used by 4G and 5G."]],
 trap:"High latency is NOT a characteristic of Li-Fi. Its limits are short range and line of sight.",
 mnem:"Generations: F, T, C, O, O (FDMA, TDMA, CDMA, OFDM, OFDM).",
 upd:"WPA3 uses SAE instead of a pre-shared key handshake, offers a 192-bit Enterprise mode and Enhanced Open (OWE) for encrypted open networks. Low earth orbit constellations such as Starlink have cut satellite latency to tens of milliseconds.",
 ref:{a:"ch. 12, p. 559 to 592",o:"Domain 4"}},

{id:"x4-protocoles",d:4,lvl:2,t:"Secure protocols, multilayer protocols and network attacks",
 what:"Many core Internet protocols were designed without security. The exam expects you to know their main attacks and the secure versions that fix them.",
 pts:["DNS cache poisoning inserts false records so users are sent to the attacker's site. DNSSEC signs DNS records, giving integrity and authenticity, but not confidentiality.",
      "ARP poisoning sends fake ARP replies to redirect local traffic through the attacker (man-in-the-middle). Defense: dynamic ARP inspection on switches.",
      "SYN flood: the attacker opens many half-open TCP connections to exhaust the server. Defense: SYN cookies, rate limiting, DDoS protection.",
      "Amplification DDoS sends small spoofed requests that trigger large replies toward the victim (DNS, NTP, the older smurf attack with ICMP broadcasts).",
      "Secure protocols replace cleartext ones: SSH for Telnet, SFTP or FTPS for FTP, HTTPS for HTTP, LDAPS for LDAP, SNMPv3 for older SNMP, IPsec for IP.",
      "Multilayer protocols, such as DNP3 in industrial networks, span several layers and can hide covert channels or bypass filters that do not understand them."],
 ex:"An attacker on the guest Wi-Fi sends forged ARP replies claiming to be the gateway. Every device now sends its traffic through his laptop. Dynamic ARP inspection and client isolation stop this.",
 terms:[["DNSSEC","DNS extensions that digitally sign records."],["ARP poisoning","Faking IP to MAC mappings to intercept local traffic."],["SYN flood","Exhausting a server with half-open TCP connections."],["Amplification attack","Small requests that trigger large replies sent to a victim."]],
 trap:"DNSSEC does not encrypt DNS. For confidentiality, use DNS over HTTPS or DNS over TLS.",
 mnem:"DNSSEC Signs, DoH Hides.",
 ref:{a:"ch. 11 and 13",o:"Domain 4"}},

{id:"x4-composants",d:4,lvl:2,t:"Network components: media, NAC, endpoints, firewall architectures",
 what:"The outline's 'secure network components' covers the physical media, the devices that admit endpoints, and how firewalls are arranged. Hardware operation (power, warranty, support) is also tested.",
 pts:["Coaxial cable resists interference better than twisted pair. Twisted pair comes unshielded (UTP) or shielded (STP), in categories such as Cat 5e, 6 and 6a. Fiber is immune to EMI and hard to tap; single-mode for long distance, multimode for shorter runs.",
      "Cabling problems: noise, attenuation (signal loss over distance) and crosstalk. Plenum-rated cable is required in air-handling spaces because it does not release toxic smoke when burning.",
      "Network access control (NAC) checks devices before and after they join: identity (802.1X) and posture (patches, antivirus). Noncompliant devices go to a quarantine network.",
      "Endpoint security protects the devices themselves: hardening, EDR, host firewalls, encryption.",
      "Firewall architectures: dual-homed host (one firewall with two interfaces), screened host (router plus firewall), screened subnet (a DMZ between two firewalls, the most secure).",
      "Operation of hardware: redundant power supplies, warranty and support contracts must be part of the design."],
 ex:"A visitor plugs his laptop into a meeting room port. NAC sees no company certificate and puts the port in a guest VLAN with Internet access only.",
 terms:[["Attenuation","Loss of signal strength over distance."],["Plenum cable","Cable with fire-resistant, low-smoke jacket for air spaces."],["NAC","Network access control: checks identity and health before admission."],["Screened subnet","A DMZ placed between two firewalls."]],
 trap:"The screened subnet is the most secure of the classic firewall architectures, because an attacker must get through two firewalls.",
 mnem:"Fiber fears no EMI; plenum keeps smoke clean.",
 ref:{a:"ch. 14, p. 643 to 678",o:"Domain 4"}},

{id:"x4-canaux",d:4,lvl:2,t:"Secure communication channels: voice, collaboration, remote and third-party access",
 what:"Domain 4's last objective asks you to secure each channel people use to communicate, including connections opened to partners and suppliers, which the 2021 outline added.",
 pts:["Voice: PBX systems are targets of toll fraud (attackers make expensive calls through your switchboard). Change default passwords and restrict remote maintenance access.",
      "VoIP inherits IP threats: eavesdropping, denial of service, spoofed caller IDs, vishing and spam over IP telephony (SPIT). Use SRTP and secured SIP, and a separate voice VLAN.",
      "Multimedia collaboration (meetings, chat, screen sharing) can leak data: control recording, file sharing and external guests.",
      "Remote access: VPNs with MFA, virtual desktops, jump servers for administration; never expose management interfaces directly to the Internet.",
      "Data communications between systems should use authenticated, encrypted channels. Virtualized networks (virtual switches) need the same segmentation and monitoring as physical ones.",
      "Third-party connectivity: give partners only the access they need, through a dedicated, monitored and documented connection, governed by an interconnection security agreement (ISA) or similar contract."],
 ex:"A software vendor needs to support its application on one of your servers. Instead of a permanent VPN into the network, it gets time-limited access through a jump server, with MFA and session recording.",
 terms:[["Toll fraud","Abusing a phone system to make calls at the victim's expense."],["SPIT","Spam over Internet telephony."],["Jump server","A hardened host used as the single entry point for administration."],["ISA","Interconnection security agreement between connected organizations."]],
 trap:"For third-party access, least privilege and monitoring matter more than convenience. A permanent, broad VPN for a vendor is the wrong answer.",
 mnem:"Partners get a door, not a key to the building.",
 ref:{a:"ch. 15, p. 681 to 712",o:"Domain 4"}},

{id:"x5-cycle",d:5,lvl:2,t:"The identity and access provisioning life cycle",
 what:"Accounts must follow people from their first day to their last, and every change in between. The 2021 outline adds role definition, privilege escalation and just-in-time access to this life cycle.",
 pts:["Provisioning: create the identity and grant access when someone joins, based on an approved request and their role.",
      "Transfers: when someone changes role, grant the new access and remove the old. Role definition keeps roles current as jobs change.",
      "Deprovisioning: disable access immediately when someone leaves, then delete or archive the account according to policy. Offboarding must be prompt, especially for privileged users.",
      "Account access reviews cover user accounts, system accounts and service accounts, checking that every account and right is still needed.",
      "Privilege escalation should be minimized and controlled: use sudo (logged, limited commands) rather than root logins, and managed service accounts whose passwords the system rotates automatically.",
      "Just-in-time (JIT) access grants elevated rights only when needed and for a limited time, instead of standing admin rights."],
 ex:"An engineer needs domain admin rights once a month to apply updates. With just-in-time access he requests the role, a manager approves, and it expires after two hours. The rest of the month, his account is a normal user.",
 terms:[["Provisioning","Creating accounts and granting access."],["Deprovisioning","Removing access and disabling accounts."],["Managed service account","A service account whose password the system manages and rotates."],["Just-in-time access","Elevated rights granted temporarily on demand."]],
 trap:"On departure, disable access first. Deleting the account can wait; leaving it active cannot.",
 mnem:"Joiner, Mover, Leaver: grant, adjust, revoke.",
 upd:"In Microsoft environments, Entra ID Privileged Identity Management (PIM) implements JIT roles, and group managed service accounts (gMSA) rotate service passwords automatically. Linking HR data to account deactivation automates the leaver step.",
 ref:{a:"ch. 17",o:"Domain 5"}},

{id:"x5-autorisation",d:5,lvl:2,t:"Authorization: ABAC and risk-based access control",
 what:"After DAC, MAC, RBAC and rule-based models, the 2021 outline adds two more flexible approaches that decide access using many attributes and real-time risk.",
 pts:["Attribute-based access control (ABAC) evaluates attributes of the subject (department, clearance), the object (classification, owner), the action (read, delete) and the environment (time, location, device).",
      "ABAC policies can express fine rules such as 'HR staff may read HR records of their own country during working hours from a managed device'. XACML is a standard language for such policies.",
      "Risk-based access control calculates a risk score for each request (unusual location, new device, impossible travel, sensitive resource) and allows, challenges with MFA, or blocks accordingly.",
      "Rule-based access control applies the same if/then rules to everyone; it is nondiscretionary.",
      "Access control applies to information, systems, devices, facilities and applications: the 2021 outline lists applications explicitly."],
 ex:"A user signs in from Fribourg on a managed laptop: access granted. The same account signs in an hour later from another continent on an unknown device: the risk score jumps, MFA is required, and access to finance data is blocked.",
 terms:[["ABAC","Attribute-based access control."],["XACML","eXtensible Access Control Markup Language, used for ABAC policies."],["Risk-based access control","Access decisions based on a real-time risk score."],["Environmental attribute","Context such as time, location or device."]],
 trap:"RBAC decides by role only. If the question combines role with location, time and device, the answer is ABAC.",
 mnem:"ABAC asks Who, What, Which action, Where and When.",
 upd:"Microsoft Entra Conditional Access with sign-in risk is a real-world mix of ABAC and risk-based access control.",
 ref:{a:"ch. 17",o:"Domain 5"}},

{id:"x5-oauth",d:5,lvl:2,t:"Federation protocols: SAML, OAuth 2.0, OpenID Connect",
 what:"Three protocols carry identity across organizations and the web. The exam tests what each one is for, and the names of the parties involved.",
 pts:["SAML (Security Assertion Markup Language) is XML-based. The identity provider (IdP) authenticates the user and sends an assertion to the service provider (SP). Common for enterprise web SSO.",
      "OAuth 2.0 is an authorization framework, not an authentication protocol. Roles: resource owner (the user), client (the application), authorization server, resource server.",
      "OAuth flow: the client redirects the user to the authorization server, the user consents, the client receives an authorization code, exchanges it for an access token, and presents the token to the resource server.",
      "OpenID Connect (OIDC) is an authentication layer built on OAuth 2.0. The relying party (the application) lets an OpenID provider (such as Google or Microsoft) authenticate the user and returns information about them.",
      "Identity can be on-premises (Active Directory), in the cloud (IDaaS) or hybrid (directory synchronized to the cloud)."],
 ex:"'Sign in with Microsoft' on a SaaS tool uses OIDC to know who you are. When that tool then asks permission to read your calendar, OAuth gives it an access token limited to that scope, without ever seeing your password.",
 terms:[["Identity provider","The party that authenticates users and issues assertions or tokens."],["Relying party","The application that relies on an identity provider (OIDC term)."],["Access token","A credential that grants limited access to a resource."],["Hybrid identity","On-premises directory synchronized with a cloud identity service."]],
 trap:"OAuth is authorization. OIDC adds authentication on top of OAuth. SAML is XML-based and does both for web SSO.",
 mnem:"OAuth = what you may do (authorization). OIDC = who you are (identity).",
 ref:{a:"ch. 17, p. 779 to 784",o:"Domain 5"}},

{id:"x5-authentification",d:5,lvl:2,t:"Authentication systems: MFA, sessions, credentials and Kerberos weaknesses",
 what:"Identification and authentication must also cover devices and services, sessions must end safely, and credentials must be managed. The All-in-One also details how Kerberos can be attacked.",
 pts:["Multifactor authentication combines different factor types. Devices and services authenticate too, with certificates, keys or managed accounts.",
      "Session management: idle timeouts, maximum session length, re-authentication for sensitive actions, and secure termination to prevent session hijacking.",
      "Accountability requires unique identities and audit logs that tie actions to people.",
      "Credential management systems (password vaults) store and rotate credentials, especially for privileged and shared accounts.",
      "Kerberos weaknesses: the KDC is a single point of failure and a prime target, clocks must be synchronized, and password-derived keys can be guessed.",
      "Kerberos attacks: Kerberoasting (requesting service tickets and cracking them offline), pass-the-ticket (reusing a stolen ticket), silver ticket (forged service ticket), golden ticket (forged TGT using the stolen KRBTGT key, giving access to everything)."],
 ex:"After a domain compromise, the team resets the KRBTGT account password twice. Otherwise, the attacker's golden tickets would remain valid indefinitely.",
 terms:[["Session hijacking","Taking over a valid user session."],["Password vault","A system that stores and rotates credentials securely."],["Kerberoasting","Cracking service tickets offline to recover service account passwords."],["Golden ticket","A forged TGT made with the KRBTGT key."]],
 trap:"Kerberoasting targets service accounts with weak passwords. Long, random service account passwords (or managed service accounts) are the fix.",
 mnem:"Silver opens one service, gold opens the whole kingdom.",
 ref:{a:"ch. 16 and 17",o:"Domain 5"}},

{id:"x6-audits",d:6,lvl:2,t:"Audit strategies and SOC reports",
 what:"Audits are planned, structured checks of controls. The All-in-One distinguishes three kinds by who performs them, and SOC reports are how service providers prove their controls to customers.",
 pts:["Internal audit: performed by the organization's own staff. Knows the environment, but independence and politics can bias results.",
      "External audit (second-party): performed by or for a business partner, scoped to the contract. Typical in supply chain risk management.",
      "Third-party audit: performed by a neutral, independent auditor who certifies compliance with a standard. Required by some laws (compliance audits).",
      "SOC reports follow the AICPA standard SSAE 18. SOC 1: controls relevant to financial reporting. SOC 2: detailed report on trust services criteria (security, availability, processing integrity, confidentiality, privacy), restricted distribution. SOC 3: short public version of SOC 2.",
      "Type I: describes control design at a point in time. Type II: tests operating effectiveness over a period, usually 6 to 12 months, and is much more valuable.",
      "Facilitating audits: know the requirements, pre-audit yourself, schedule in-briefs and out-briefs, organize evidence and keep senior management informed."],
 ex:"Before signing with a cloud backup provider, you ask for its SOC 2 Type II report covering the last 12 months, and you read the exceptions the auditor found, not just the conclusion.",
 terms:[["Second-party audit","An external audit by or for a business partner."],["Third-party audit","An independent audit, often for compliance or certification."],["SOC 2","Report on security, availability, processing integrity, confidentiality, privacy."],["Type II","Report testing operating effectiveness over a period."]],
 trap:"Type I only proves the controls were designed properly on one day. Type II proves they actually worked over time.",
 mnem:"SOC 1 = finance, SOC 2 = security details, SOC 3 = public summary. Type I = a photo, Type II = a film.",
 ref:{a:"ch. 18, p. 840 to 844",o:"Domain 6"}},

{id:"x6-tests",d:6,lvl:2,t:"Vulnerability testing, breach attack simulation and compliance checks",
 what:"Testing technical controls goes beyond a yearly pen test. The 2021 outline adds automated attack simulations and continuous compliance checks.",
 pts:["Vulnerability assessments identify weaknesses using shared references: CVE (a unique identifier per vulnerability) and CVSS (a severity score from 0 to 10).",
      "Credentialed (authenticated) scans log in to systems and see much more, such as missing patches, than uncredentialed scans that only see the network view.",
      "Banner grabbing and fingerprinting identify services and versions; war driving looks for wireless networks.",
      "Breach and attack simulation (BAS) tools automatically and repeatedly run known attack techniques against your defenses to check they detect and block them.",
      "Compliance checks verify continuously that systems match required configurations (benchmarks, policies), often automated.",
      "Red team: emulates real adversaries. Blue team: defends. Purple team: both work together to improve detection."],
 ex:"A BAS platform replays the techniques of a known ransomware group every week. After an EDR policy change, it shows that credential dumping is no longer detected, before a real attacker finds out.",
 terms:[["CVE","Common Vulnerabilities and Exposures: unique vulnerability identifiers."],["CVSS","Common Vulnerability Scoring System: severity from 0 to 10."],["Credentialed scan","A scan that logs in to see internal configuration."],["Breach and attack simulation","Automated, repeated emulation of attack techniques."]],
 trap:"CVE identifies a vulnerability; CVSS rates its severity. Don't swap them.",
 mnem:"CVE = the name, CVSS = the score.",
 ref:{a:"ch. 18",o:"Domain 6"}},

{id:"x6-mesures",d:6,lvl:2,t:"Security process data: metrics, KPIs and KRIs",
 what:"To improve security, you have to measure it, and to report it, you have to tell a story the audience understands. The All-in-One builds metrics step by step and lists the process data to collect.",
 pts:["A factor is something you can measure; a measurement is a raw value at a point in time; a baseline is a reference value; a metric compares measurements (or a measurement with a baseline).",
      "A key performance indicator (KPI) shows how well a process meets its goals. A key risk indicator (KRI) warns that a risk is rising before it materializes.",
      "Measuring the wrong thing harms security: counting tickets closed per shift rewards speed over careful analysis.",
      "Process data to collect: account management (orphan accounts, reviews done), management review and approval, backup verification (restores tested and successful), training and awareness (completion, phishing test results), DR and BC (tests run, objectives met).",
      "Each audience needs different metrics: boards want strategic risk, business managers want their units' protection, operations leaders want team performance."],
 ex:"KPI: 98 % of critical patches installed within 14 days (target 95 %). KRI: number of internet-facing systems past end of support, rising from 2 to 6 this quarter, an early warning for the board.",
 terms:[["Baseline","A reference value to compare measurements against."],["Metric","A comparison of measurements that gives meaning."],["KPI","Key performance indicator: how well a process meets its goals."],["KRI","Key risk indicator: an early warning that risk is increasing."]],
 trap:"KPIs look at performance (are we doing well?). KRIs look at exposure (is risk going up?).",
 mnem:"KPI = Performance, how we're doing. KRI = Risk, what's coming.",
 ref:{a:"ch. 19, p. 851 to 870",o:"Domain 6"}},

{id:"x6-rapports",d:6,lvl:2,t:"Reporting, remediation, exceptions and ethical disclosure",
 what:"A test is only useful if its results lead to action. The 2021 outline adds three topics about what happens after testing: remediation, exception handling and ethical disclosure.",
 pts:["Reports must fit their readers: a technical report with details for the people who fix things, an executive summary in business terms for decision makers.",
      "Remediation fixes findings in priority order, based on risk, and tracks them to closure, then verifies the fix.",
      "Exception handling: when a finding cannot be fixed, document why, have the risk formally accepted by the right owner, add compensating controls and set an expiry date for review.",
      "Ethical disclosure: when you find a vulnerability in someone else's product, notify the vendor privately, give reasonable time to fix, and then disclose responsibly.",
      "Findings and test reports are sensitive: they are a map of your weaknesses."],
 ex:"A scan finds an old application that cannot run on a supported OS. The business owner signs a one-year risk exception, the server is isolated in its own VLAN with extra monitoring, and the exception is reviewed in six months.",
 terms:[["Remediation","Fixing findings and verifying the fix."],["Exception","A formally accepted, documented deviation from a requirement."],["Ethical disclosure","Responsibly notifying a vendor of a vulnerability before going public."],["Executive summary","A short, business-focused overview of results."]],
 trap:"An exception is not 'ignore the risk'. It requires a named owner's acceptance, compensating controls and an expiry date.",
 mnem:"Fix it, or Formally accept it with an end date, never Forget it.",
 ref:{a:"ch. 19, p. 870 to 878",o:"Domain 6"}},

{id:"x7-fondamentaux",d:7,lvl:2,t:"Operations foundations: PAM, resource protection, patching",
 what:"Security operations rest on a few daily disciplines: controlling privileged accounts, protecting key resources such as images and backups, and keeping systems patched.",
 pts:["Privileged account management (PAM): fewer admin accounts, separate admin accounts from daily accounts, vaulted and rotated passwords, session recording, regular review.",
      "Accountability: every action traced to a unique identity through logs.",
      "Resource protection covers system images (golden images must be protected from tampering), source files and code, and backups (protect them like the data they contain).",
      "Configuration management includes provisioning systems from approved baselines and automation, which reduces human error.",
      "Vulnerability management finds and prioritizes weaknesses; patch management tests and deploys fixes. Centralized patching is preferred; unmanaged patching (users patch themselves) leads to gaps.",
      "Patches should be tested before wide deployment, and a rollback plan prepared."],
 ex:"The team keeps a golden Windows image for new laptops. An attacker who altered that image would infect every new machine, so it is stored with restricted write access and its hash is checked before each deployment.",
 terms:[["PAM","Privileged account management."],["Golden image","A reference system image used to deploy machines."],["Centralized patch management","Patches tested and deployed by IT from a central system."],["Rollback plan","How to undo a change or patch if it fails."]],
 trap:"Admins should not use their privileged account for email and browsing. Separate accounts limit the damage of phishing.",
 mnem:"Protect what builds your systems (images), what restores them (backups) and what runs them (admins).",
 ref:{a:"ch. 20, p. 885 to 906",o:"Domain 7"}},

{id:"x7-soc",d:7,lvl:2,t:"The SOC, threat intelligence, sandboxes and honeypots",
 what:"A security operations center turns data into detection and response. The 2021 outline adds threat intelligence, threat hunting and AI-based tools.",
 pts:["A mature SOC combines people, processes and technology, and uses threat intelligence to focus on the threats that matter.",
      "Good threat intelligence is timely, relevant, accurate and actionable. Sources include commercial feeds, open sources (OSINT), information-sharing groups (ISACs) and your own incidents.",
      "Threat hunting proactively searches for attackers already inside who evaded automated detection, starting from a hypothesis.",
      "Sandboxing runs suspicious files in an isolated environment to observe their behavior safely.",
      "Honeypots are decoy systems that attract attackers; honeynets are networks of them. They detect and study attackers, and must be enticement, never entrapment.",
      "Machine learning and AI tools help spot anomalies in huge data volumes, but need good training data and human review. Outsourced services (MSSP, managed SOC) extend limited teams."],
 ex:"A threat intelligence report says a group targeting agribusiness uses a specific remote access tool. A hunter searches all endpoints for that tool's traces and finds one compromised PC that no alert had flagged.",
 terms:[["Threat intelligence","Evaluated information about threats that supports decisions."],["Threat hunting","Proactive search for undetected attackers."],["Sandbox","Isolated environment to run untrusted code safely."],["Honeynet","A network of decoy systems."]],
 trap:"Threat hunting assumes the attacker is already inside and looks for him actively. Waiting for alerts is not hunting.",
 mnem:"Intelligence must be TRAA: Timely, Relevant, Accurate, Actionable.",
 ref:{a:"ch. 21, p. 939 to 978",o:"Domain 7"}},

{id:"x7-logs",d:7,lvl:2,t:"Logging and monitoring: log management, egress, UEBA",
 what:"Detection depends on collecting the right logs, keeping them safe, and watching both what comes in and what goes out. Behavior analytics then finds what rules miss.",
 pts:["Log management: decide what to log, synchronize clocks, centralize logs, protect their integrity (attackers erase logs), and keep them as long as policy and law require.",
      "A SIEM aggregates and correlates logs from many sources; SOAR platforms automate the response playbooks.",
      "Egress monitoring watches outbound traffic for data exfiltration and command-and-control: DLP, unusual destinations, large uploads, steganography.",
      "User and entity behavior analytics (UEBA) learns normal behavior of users and devices and flags deviations, such as a user downloading far more files than usual.",
      "Continuous monitoring keeps an ongoing view of security posture, not just yearly checks (NIST SP 800-137 calls it ISCM)."],
 ex:"An accountant's account suddenly downloads 4 GB from SharePoint at 3 a.m. and uploads it to a personal cloud drive. No signature matches, but UEBA flags the behavior and egress monitoring shows the upload.",
 terms:[["Log management","Collecting, protecting and retaining logs."],["Egress monitoring","Watching outbound traffic for exfiltration."],["UEBA","User and entity behavior analytics."],["Continuous monitoring","Ongoing awareness of security posture."]],
 trap:"Logs are only useful if clocks are synchronized and logs are protected from tampering. Both are common exam answers.",
 mnem:"Watch the doors both ways: ingress for attacks, egress for leaks.",
 ref:{a:"ch. 21, p. 978 to 982",o:"Domain 7"}},

{id:"x7-enquetes",d:7,lvl:2,t:"Investigations: evidence handling and forensic artifacts",
 what:"When an incident may lead to legal action, the way evidence is collected, documented and stored decides whether it can be used. The All-in-One details the process and the artifacts to look for.",
 pts:["Motive, opportunity and means (MOM) help identify suspects.",
      "Evidence must be relevant, reliable and legally permissible to be admissible. Collect it in order of volatility: CPU and memory first, then network state, then disk, then backups.",
      "Work on forensic copies (bit-by-bit images verified by hashes), never on the original. Document everything and maintain the chain of custody.",
      "Investigative techniques include interviews, surveillance, and forensic analysis of media, memory and networks.",
      "Forensic artifacts: on computers (registry, logs, browser history, prefetch, deleted files), on networks (flow records, packet captures, firewall and proxy logs), on mobile devices (call logs, messages, location, app data).",
      "Incident response planning adds roles, incident classification by severity, a notification matrix and runbooks for common incident types."],
 ex:"Before shutting down a compromised server, the responder captures RAM (the attacker's tool runs only in memory), then images the disk, hashes both images and records each step on the chain of custody form.",
 terms:[["Order of volatility","Collecting the most short-lived evidence first."],["Admissible evidence","Relevant, reliable and legally permissible."],["Forensic artifact","A trace left on a system, network or device that reveals activity."],["Runbook","Step-by-step procedure for a specific incident type."]],
 trap:"The most volatile evidence goes first. Pulling the plug before capturing memory destroys evidence.",
 mnem:"Motive, Opportunity, Means: MOM finds the suspect.",
 ref:{a:"ch. 22, p. 989 to 1025",o:"Domain 7"}},

{id:"x7-resilience",d:7,lvl:2,t:"Resilience: high availability, fault tolerance and DR lessons learned",
 what:"Disaster recovery planning is supported by design choices that keep services running in the first place. The 2021 outline also adds lessons learned to the DR process.",
 pts:["High availability (HA) keeps a service available as much as possible, for example 99.99 %, usually through redundancy and failover.",
      "Fault tolerance lets a system keep working when a component fails, with no interruption. Resiliency is the ability to recover quickly and keep essential functions running despite problems.",
      "Quality of service (QoS) protects critical traffic when resources are scarce.",
      "Multiple processing sites spread workloads, so losing one site is not a disaster.",
      "DR processes cover response, personnel (who does what, and their safety), communications (staff, customers, media, regulators), assessment, restoration, and training and awareness.",
      "Lessons learned after every DR test or real event feed improvements back into the plan."],
 ex:"A two-node active-passive firewall cluster gives high availability: if the primary fails, the secondary takes over within seconds. A RAID 6 array gives fault tolerance: a disk can fail without any interruption.",
 terms:[["High availability","Designing for maximum uptime through redundancy and failover."],["Fault tolerance","Continuing to operate despite a component failure."],["Resiliency","Ability to absorb disruption and recover quickly."],["Lessons learned","Review after an event to improve the plan."]],
 trap:"Fault tolerance means no interruption at all; high availability may involve a short failover.",
 mnem:"Fault tolerant never blinks; highly available blinks fast.",
 ref:{a:"ch. 23",o:"Domain 7"}},

{id:"x8-methodes",d:8,lvl:2,t:"DevSecOps and maturity models: CMMI, SAMM, BSIMM",
 what:"Security must be built into the development method itself, and organizations need a way to measure how mature their secure development practices are.",
 pts:["DevSecOps integrates security into DevOps: security tests run automatically in the pipeline, and security is everyone's responsibility, not a gate at the end.",
      "Shifting left means finding security problems as early as possible, when they are cheapest to fix.",
      "CMMI (successor of CMM) rates process maturity in five levels.",
      "OWASP SAMM (Software Assurance Maturity Model) is prescriptive: it helps an organization assess and improve its secure software practices across business functions such as governance, design, implementation, verification and operations.",
      "BSIMM (Building Security In Maturity Model) is descriptive: it reports what real organizations actually do, so you can compare yourself with peers.",
      "Operations and maintenance and change management remain part of the SDLC; the integrated product team (IPT) keeps all stakeholders involved."],
 ex:"A development team adds automatic code scanning and dependency checks to every commit. A vulnerable library is flagged before the code ever reaches testing: DevSecOps shifting security left.",
 terms:[["DevSecOps","DevOps with security integrated and automated throughout."],["Shift left","Moving security activities earlier in development."],["SAMM","OWASP Software Assurance Maturity Model, prescriptive."],["BSIMM","Building Security In Maturity Model, descriptive."]],
 trap:"SAMM tells you what you should do (prescriptive); BSIMM tells you what others do (descriptive).",
 mnem:"SAMM Suggests, BSIMM Benchmarks.",
 ref:{a:"ch. 24",o:"Domain 8"}},

{id:"x8-ecosysteme",d:8,lvl:2,t:"Securing the development ecosystem",
 what:"Software is built with languages, libraries, tools and pipelines, and each of them can introduce weaknesses. The 2021 outline lists these elements one by one.",
 pts:["Programming languages: some are memory-safe (Java, C#, Python, Rust), others let programmers manage memory directly (C, C++) and are prone to buffer overflows.",
      "Libraries: third-party code saves time but brings its vulnerabilities. Track them and update them (software composition analysis).",
      "Tool sets and the integrated development environment (IDE) must be trusted, patched and configured securely; plugins can be malicious.",
      "Runtime environments (Java virtual machine, .NET runtime, containers) isolate and manage code execution.",
      "Continuous integration and continuous delivery (CI/CD) automatically build, test and deploy code. Protect the pipeline itself: it holds secrets and can push to production.",
      "SOAR automates security responses; software configuration management (SCM) and code repositories track every change and must be protected with access control and secret scanning."],
 ex:"An attacker who steals a developer's repository token could insert a backdoor that the CI/CD pipeline then deploys to production automatically. MFA, signed commits and pipeline approvals block this.",
 terms:[["Memory-safe language","A language that prevents direct, unchecked memory access."],["Software composition analysis","Identifying third-party components and their vulnerabilities."],["CI/CD","Continuous integration and continuous delivery."],["IDE","Integrated development environment."]],
 trap:"The CI/CD pipeline is a high-value target: compromise it and you compromise everything it deploys.",
 mnem:"Secure the code, the libraries, the tools and the pipe.",
 ref:{a:"ch. 25",o:"Domain 8"}},

{id:"x8-tests",d:8,lvl:2,t:"Application security testing and secure coding",
 what:"The 2021 outline names the main application security testing methods and asks you to apply secure coding guidelines, including for APIs and 'software-defined security'.",
 pts:["SAST (static application security testing) analyzes source code without running it. It finds flaws early but produces false positives.",
      "DAST (dynamic application security testing) attacks the running application from outside, like a black-box tester.",
      "IAST (interactive) instruments the running application to combine both views; SCA checks third-party components. Fuzzing sends malformed input.",
      "Secure coding basics: validate all input, encode output, use parameterized queries against SQL injection, handle errors without leaking details, never hard-code secrets, apply least privilege.",
      "API security: authenticate and authorize every call, limit rates, validate input and protect tokens.",
      "Software-defined security: security controls (firewall rules, policies) defined and deployed as code, so they are versioned, tested and applied consistently."],
 ex:"A login form builds its SQL query by pasting the username into the text. Replacing it with a parameterized query means anything typed is treated only as data, never as a command.",
 terms:[["SAST","Static application security testing of source code."],["DAST","Dynamic testing of the running application."],["Parameterized query","A query where user input is passed as data, not code."],["Software-defined security","Security controls defined and managed as code."]],
 trap:"SAST needs the source code and works early; DAST needs a running application and no source code.",
 mnem:"SAST reads the recipe, DAST tastes the dish.",
 ref:{a:"ch. 25",o:"Domain 8"}},

{id:"x8-acquisition",d:8,lvl:2,t:"The security impact of acquired software",
 what:"Most software is bought or reused rather than written in-house. The 2021 outline asks you to assess the risk of each source: commercial, open source, third-party and managed services.",
 pts:["COTS (commercial off-the-shelf): you rarely see the code. Rely on vendor reputation, certifications, independent testing and contract terms.",
      "Open source: the code is public and can be reviewed, but check the community's activity, how fast vulnerabilities are fixed, and license obligations.",
      "Third-party custom software: security happens only if the contract requires it. Include secure development requirements, testing rights and source code escrow.",
      "Managed services (SaaS, PaaS, IaaS): understand the shared responsibility model. The less you manage, the more you depend on the provider's controls, verified through audits such as SOC 2.",
      "For every acquisition, assess the impact on your environment: data handled, integration points, privileges required, and what happens if the supplier fails."],
 ex:"Choosing a SaaS fuel management tool: request its SOC 2 Type II report and penetration test summary, check where the data is hosted, require SSO with your identity provider, and plan how to export your data if the contract ends.",
 terms:[["COTS","Commercial off-the-shelf software."],["Open source","Software whose source code is publicly available."],["Shared responsibility model","Division of security duties between cloud provider and customer."],["Source code escrow","A third party holds the code in case the vendor fails."]],
 trap:"In SaaS, the customer still owns its data, identities and access configuration. The provider never takes that responsibility.",
 mnem:"Buy it, borrow it, commission it or rent it: assess it every time.",
 upd:"A software bill of materials (SBOM) is increasingly requested from vendors to see which open source components a product contains.",
 ref:{a:"ch. 25",o:"Domain 8"}},
{id:"y1-risque",d:1,lvl:3,t:"Risk vocabulary: inherent, total, residual and the controls gap",
 what:"The 2024 outline expands risk management with precise vocabulary, cybersecurity insurance, reporting and maturity. The Sybex guide gives simple formulas that help on scenario questions.",
 pts:["Inherent risk (initial or starting risk) is the natural risk before any risk management effort. It is what the risk assessment identifies.",
      "Total risk is the risk the organization would face with no safeguards: threats and vulnerabilities and asset value = total risk.",
      "The controls gap is the amount of risk removed by the safeguards. Total risk − controls gap = residual risk.",
      "Residual risk is what management chooses to accept, usually because further safeguards would not be cost-effective.",
      "Risk response includes buying cybersecurity insurance, a form of risk transfer. Control assessments check that security and privacy controls work; results are reported internally (management, board) and externally (regulators, customers).",
      "The risk maturity model (RMM) has five levels: ad hoc, preliminary, defined, integrated, optimized.",
      "Risk frameworks named in the outline: ISO, NIST, COBIT, SABSA, PCI DSS, plus FedRAMP for US government cloud services."],
 ex:"Before any controls, a ransomware attack on the ERP would be catastrophic (total risk). Backups, EDR and MFA remove most of it (controls gap). What remains, a few hours of data loss, is formally accepted by management (residual risk), and cyber insurance covers part of the financial impact.",
 terms:[["Inherent risk","Risk before any risk management effort."],["Controls gap","The amount of risk reduced by safeguards."],["Residual risk","Risk remaining after safeguards, accepted by management."],["Risk maturity model","Five-level scale of risk management maturity."]],
 trap:"Residual risk = total risk − controls gap. It is never zero, and it must be accepted by management, not by IT.",
 mnem:"RMM levels: Ad hoc, Preliminary, Defined, Integrated, Optimized: 'A Proper Defense Is Organized'.",
 ref:{s:"ch. 2",o:"Domain 1"}},

{id:"y1-vie-privee",d:1,lvl:3,t:"Privacy laws around the world: GDPR, CCPA, PIPL, POPIA",
 what:"The 2024 outline names four privacy laws explicitly. They share common principles, and a multinational group often falls under several at once.",
 pts:["GDPR (EU, enforceable since May 2018): applies to anyone processing personal data of people in the EU. Key ideas: lawful basis, data minimization, data subject rights, breach notification within 72 hours, heavy fines.",
      "CCPA (California Consumer Privacy Act): gives California residents the right to know what data is collected, to delete it and to opt out of its sale.",
      "PIPL (China, 2021): China's first comprehensive privacy law, close to GDPR. Explicit consent, minimum necessary collection, data subject rights, and strict rules for transferring data out of China (security assessment required). Penalties include suspension of business.",
      "POPIA (South Africa, in effect 2020): eight conditions for lawful processing (accountability, processing limitation, purpose specification, further processing limitation, information quality, openness, security safeguards, data subject participation). Special personal information and children's data get extra protection.",
      "All four restrict cross-border transfers unless the destination offers adequate protection.",
      "Contracting and procurement must carry these obligations to suppliers that process personal data."],
 ex:"A group with HR data in Switzerland, Belgium, Nigeria and Cambodia must map where personal data flows. Data on EU employees falls under GDPR wherever it is processed, and transfers to other countries need appropriate safeguards such as standard contractual clauses.",
 terms:[["PIPL","China's Personal Information Protection Law (2021)."],["POPIA","South Africa's Protection of Personal Information Act."],["CCPA","California Consumer Privacy Act."],["Cross-border transfer","Moving personal data to another country."]],
 trap:"GDPR protects people in the EU, not only EU citizens, and applies to non-EU organizations that process their data.",
 mnem:"GDPR Europe, CCPA California, PIPL China, POPIA South Africa: one principle everywhere, protect the person.",
 upd:"Switzerland's revised Federal Act on Data Protection (nFADP) has applied since September 2023 and follows similar principles. Nigeria adopted its Data Protection Act in 2023.",
 ref:{s:"ch. 4",o:"Domain 1"}},

{id:"y1-ingenierie",d:1,lvl:3,t:"Social engineering: the principles behind the attacks",
 what:"Social engineering works because it exploits human nature. The Sybex guide lists the psychological principles attackers use; recognizing them is the first defense.",
 pts:["Authority: people obey someone who appears to be in charge (a spoofed CEO email). Intimidation: authority plus threat of a penalty.",
      "Consensus (social proof): 'everyone else already did it'. Scarcity: 'only two left'. Urgency: 'pay now or the service is cut', often combined with scarcity.",
      "Familiarity (liking): pretending to be someone known, such as your bank or a mutual contact. Trust: building a relationship over time, then exploiting it.",
      "Eliciting information gathers details to build a believable pretext, a false but convincing story.",
      "Prepending adds 'RE:', 'FW:', 'INTERNAL' or 'SAFE' to make a message look like part of a conversation or to fool filters.",
      "Invoice scams send a fake invoice with pressure to pay, often combined with business email compromise (BEC).",
      "Defenses: training, verification procedures (call back on a known number), classification of information and reporting suspicious contacts."],
 ex:"An accountant receives an email from the 'CFO' (authority) asking to pay a new supplier today before the bank closes (urgency), and to keep it quiet because the deal is confidential. A callback to the CFO's known number stops the fraud.",
 terms:[["Pretext","A false, believable story used to manipulate a target."],["Consensus","Pressure from what others supposedly did (social proof)."],["Prepending","Adding RE:, FW: or labels to make a message look legitimate."],["Invoice scam","A fake invoice pushed for urgent payment."]],
 trap:"Urgency and scarcity often appear together. If a message pushes you to act before you can think, that is the attack.",
 mnem:"AICSUFT: Authority, Intimidation, Consensus, Scarcity, Urgency, Familiarity, Trust.",
 ref:{s:"ch. 2",o:"Domain 1"}},

{id:"y1-formation",d:1,lvl:3,t:"Awareness, training and education programs",
 what:"Objective 1.12 asks you to build a program that changes behavior, keeps content current and proves it works. The Sybex guide distinguishes three levels and lists modern techniques.",
 pts:["Awareness makes security visible to everyone and sets a common minimum. Training teaches people to do their job securely (an administrative control). Education goes far beyond the job, for certifications and security careers.",
      "Micro-training delivers short, focused modules, often on mobile.",
      "Techniques: phishing simulations, role-playing, capture-the-flag drills, computer-based training, role-based training, varied formats and topics.",
      "Security champions are non-security staff who lead adoption of good practices in their own team.",
      "Gamification uses points, badges and competition to increase engagement and retention.",
      "Periodic content reviews add emerging technologies and trends: cryptocurrency, blockchain, artificial intelligence. Topics also include insider threat, social media risks and 2FA fatigue (users trying to bypass MFA prompts).",
      "Program effectiveness evaluation: post-training tests, phishing click rates, incident trends."],
 ex:"Each site appoints a security champion who relays the monthly five-minute micro-training. Phishing simulation click rates drop from 18 % to 6 % in a year, which proves the program works.",
 terms:[["Education","Learning well beyond the job, for professional growth."],["Security champion","A non-security employee who promotes security in their team."],["Gamification","Using game elements to drive engagement."],["Micro-training","Short, focused learning units."]],
 trap:"Awareness changes behavior for everyone; training builds a skill for a job; education builds knowledge for a career.",
 mnem:"Awareness = what, Training = how, Education = why.",
 ref:{s:"ch. 2 and 16",o:"Domain 1"}},

{id:"y1-scrm",d:1,lvl:3,t:"Supply chain mitigations: root of trust, PUF, SBOM",
 what:"The 2024 outline adds specific supply chain risks (tampering, counterfeits, implants) and specific hardware and software mitigations. It also adds external dependencies to business continuity.",
 pts:["Risks: product tampering, counterfeit parts and implants (hidden malicious components) introduced anywhere in the supply chain.",
      "Mitigations: third-party assessment and monitoring, minimum security requirements, service level requirements.",
      "A silicon root of trust (hardware root of trust) is a tamper-resistant hardware component that verifies firmware, boot loader and OS at startup (secure boot).",
      "A physically unclonable function (PUF) uses tiny manufacturing variations of a chip to create a unique, unforgeable fingerprint, used for device authentication and keys.",
      "A software bill of materials (SBOM) lists every component and library in a product, so you know quickly if you are affected by a newly disclosed vulnerability.",
      "Business continuity must consider external dependencies: suppliers, utilities, telecom and cloud providers your critical processes rely on."],
 ex:"When a critical flaw is announced in a common logging library, a company with SBOMs for its applications knows within an hour which ones contain it. Without SBOMs, it takes weeks of guessing.",
 terms:[["Silicon root of trust","Tamper-resistant hardware that anchors secure boot."],["PUF","Physically unclonable function: a unique hardware fingerprint."],["SBOM","Software bill of materials: list of all components."],["External dependency","Something outside the organization a critical process relies on."]],
 trap:"An SBOM does not fix vulnerabilities; it tells you where you are exposed.",
 mnem:"Root of trust checks the boot, PUF proves the chip, SBOM lists the parts.",
 ref:{s:"ch. 1 and 3",o:"Domain 1"}},

{id:"y2-anonymisation",d:2,lvl:3,t:"Pseudonymization, tokenization, anonymization and masking",
 what:"When data must be used or shared without exposing who it is about, four techniques reduce the risk. They differ on one key question: can the original data be recovered?",
 pts:["Pseudonymization replaces identifying data with artificial identifiers (Patient 23456). The link to the real identity is kept elsewhere, so the process is reversible. GDPR rewards it with lighter requirements but still treats the data as personal.",
      "Tokenization replaces sensitive data with a random token. The real value sits in a protected tokenization vault. Common for card payments: the shop never sees the card number.",
      "Anonymization removes all data that could identify a person. Done properly, the data is no longer personal under GDPR, but true anonymization is hard: inference can re-identify people.",
      "Randomized masking shuffles values within columns so records no longer match real people, while aggregate values (such as an average age) stay correct.",
      "Choose by need: if you must link back later, pseudonymize or tokenize; if you never need identities, anonymize."],
 ex:"Phone payments use tokenization: the digital wallet sends a token to the shop's terminal, the payment network's vault turns it back into the card number, and the shop never stores or sees the card.",
 terms:[["Pseudonymization","Replacing identifiers with pseudonyms; reversible with separate data."],["Tokenization","Replacing data with tokens resolved by a secure vault."],["Anonymization","Irreversibly removing identifying data."],["Re-identification","Recovering identities from supposedly anonymous data."]],
 trap:"Pseudonymized data is still personal data under GDPR. Only truly anonymized data falls outside it.",
 mnem:"Pseudonym = alias you can unmask. Token = voucher the vault can redeem. Anonymous = nobody can tell.",
 ref:{s:"ch. 5",o:"Domain 2"}},

{id:"y3-sase-cycle",d:3,lvl:3,t:"SASE and the information system life cycle",
 what:"The 2024 outline adds Secure Access Service Edge to the design principles and a full objective on managing the information system life cycle.",
 pts:["SASE combines network security and WAN capabilities in a cloud-native service, instead of separate on-premises boxes.",
      "SASE is identity-centric: access is based on who the user and device are, not on network location, through zero trust network access (ZTNA) with MFA.",
      "SASE uses edge computing and a globally distributed network to bring security close to users, typically combining SD-WAN, secure web gateway, CASB, firewall as a service and ZTNA.",
      "Information system life cycle stages: stakeholders' needs and requirements, requirements analysis (functional and nonfunctional), architectural design, development and implementation, integration, verification and validation, transition and deployment, operations and maintenance (sustainment), retirement and disposal.",
      "Verification checks each component is built correctly; validation checks the whole system fulfills its purpose."],
 ex:"Staff working from plantations, hotels and home connect to a SASE service: their identity and device health are checked, web traffic is filtered in the cloud, and they reach only the applications they are allowed to use, with no full network VPN.",
 terms:[["SASE","Secure Access Service Edge: cloud-delivered networking and security."],["ZTNA","Zero trust network access: per-application, identity-based access."],["Verification","Checking each component is built to specification."],["Validation","Checking the whole system meets its intended purpose."]],
 trap:"Verification: 'did we build it right?' Validation: 'did we build the right thing?'",
 mnem:"Needs, Analyze, Design, Build, Integrate, Verify, Deploy, Operate, Retire.",
 ref:{s:"ch. 8",o:"Domain 3"}},

{id:"y3-crypto",d:3,lvl:3,t:"Quantum, homomorphic encryption and modern crypto uses",
 what:"The 2024 outline adds quantum cryptography and quantum key distribution, and stresses key rotation. The Sybex guide also covers homomorphic encryption, which lets you compute on data without decrypting it.",
 pts:["Quantum computers use qubits. Quantum supremacy could break factoring and discrete logarithm problems, making RSA and Diffie-Hellman insecure.",
      "Quantum key distribution (QKD) uses quantum physics to create a shared secret key between two parties, like Diffie-Hellman; any eavesdropping disturbs the exchange.",
      "Post-quantum thinking today: consider how long your data must stay secret, because attackers can steal encrypted data now and decrypt it later ('harvest now, decrypt later').",
      "Homomorphic encryption allows calculations on encrypted data; decrypting the result gives the same answer as computing on the plaintext. Useful for privacy-preserving processing in the cloud.",
      "Key management practices include regular key rotation, so a compromised key exposes less data.",
      "Blockchain is a distributed, tamper-evident ledger secured by hashing; cryptocurrency is its best-known use."],
 ex:"A research partner needs statistics on salary data without seeing individual salaries. With homomorphic encryption, it computes the average on encrypted values and only the data owner decrypts the result.",
 terms:[["Qubit","A quantum bit, the unit of quantum computing."],["QKD","Quantum key distribution: sharing a key using quantum physics."],["Homomorphic encryption","Encryption that allows computation on ciphertext."],["Key rotation","Replacing keys on a regular schedule."]],
 trap:"QKD distributes keys; it does not encrypt data by itself. Data is still encrypted with a symmetric algorithm using the key.",
 mnem:"Harvest now, decrypt later: protect long-lived secrets today.",
 upd:"NIST published its first post-quantum standards in August 2024 (FIPS 203, 204, 205), after the Sybex guide went to print.",
 ref:{s:"ch. 6 and 7",o:"Domain 3"}},

{id:"y4-architecture",d:4,lvl:3,t:"Network architecture: planes, traffic flows and segmentation",
 what:"The 2024 outline adds several design concepts to Domain 4: how devices are built (planes, switching modes), which way traffic flows, and the different kinds of segmentation.",
 pts:["Transport architecture: the data plane forwards traffic, the control plane builds forwarding tables (routing protocols), the management plane configures and monitors devices.",
      "Cut-through switching forwards a frame as soon as it reads the destination address (low latency). Store-and-forward receives the whole frame first (better error checking).",
      "North-south traffic flows in and out between internal and external systems. East-west traffic flows within a network, data center or cloud. Attackers moving laterally create east-west traffic.",
      "Physical segmentation: in-band (data and control share the same paths), out-of-band (management and control traffic on a separate network), air-gapped (no connection at all, the strictest).",
      "Logical segmentation: VLANs, VPNs, virtual routing and forwarding (VRF, several routing tables in one router) and virtual domains (independent virtual firewalls or switches in one appliance).",
      "Micro-segmentation divides down to a single workload, using overlays, distributed firewalls and IDS/IPS, in line with zero trust."],
 ex:"Switches and firewalls are managed through a dedicated out-of-band management network. Even if the production network is compromised or down, administrators keep control, and attackers cannot reach the management interfaces.",
 terms:[["Management plane","Device administration: configuration and monitoring."],["East-west traffic","Traffic between systems inside the same environment."],["Out-of-band","Management traffic on a separate network."],["VRF","Virtual routing and forwarding: multiple routing tables in one router."]],
 trap:"Perimeter firewalls watch north-south traffic. Lateral movement is east-west, which needs internal segmentation to see and stop.",
 mnem:"North-south crosses the border, east-west stays in town.",
 ref:{s:"ch. 11",o:"Domain 4"}},

{id:"y4-edge",d:4,lvl:3,t:"Edge networks, VPC, NFV and new converged protocols",
 what:"Modern networks extend to the edge and into the cloud. The 2024 outline names several of these building blocks, plus new converged protocols and IP addressing types.",
 pts:["Edge networks bring computing and content closer to users to cut latency. Ingress points bring external data in; egress points send traffic out; peering connects edge networks directly without intermediaries.",
      "A virtual private cloud (VPC) is an isolated, logically segmented network inside a public cloud, where the customer controls addressing, subnets and routing.",
      "SDN separates control from forwarding and is driven through APIs; network functions virtualization (NFV) runs network functions such as firewalls or routers as software on standard hardware.",
      "New converged protocols: InfiniBand over Ethernet (high-speed, low-latency cluster networking) and Compute Express Link (CXL, a fast link between processors, memory and accelerators).",
      "IP traffic types: unicast (one to one), broadcast (one to all on a segment), multicast (one to a group), anycast (one to the nearest of several, used by DNS and CDNs).",
      "Third-party connectivity now explicitly includes telecom providers and hardware support access; data communications include backhaul and satellite links."],
 ex:"A company's Azure subscription has a VPC (called a virtual network in Azure) with separate subnets for web servers and databases, and network security groups between them, exactly like VLANs and firewalls on site.",
 terms:[["Edge peering","Direct interconnection between edge networks."],["VPC","Virtual private cloud: isolated network inside a public cloud."],["NFV","Network functions virtualization."],["Anycast","Delivery to the nearest of several destinations."]],
 trap:"SDN separates the control plane; NFV virtualizes network appliances. They complement each other but are different.",
 mnem:"Uni = one, Broad = all, Multi = some, Any = nearest.",
 ref:{s:"ch. 11",o:"Domain 4"}},

{id:"y4-performance",d:4,lvl:3,t:"Network performance metrics and monitoring",
 what:"Security also depends on a network that performs and is watched. The 2024 outline adds performance metrics and monitoring and management practices.",
 pts:["Bandwidth: the capacity of a medium. Throughput: the data actually delivered.",
      "Latency (propagation delay): time for a signal to travel from sender to receiver. Jitter: the variation in latency between packets, which ruins voice and video.",
      "Signal-to-noise ratio compares the useful signal to background noise. Attenuation, interference (EMI, RFI) and noise degrade quality.",
      "Network observability: collecting metrics, logs and traces to understand the network's internal state.",
      "Traffic flow and shaping prioritize important traffic and control bandwidth. Capacity management plans for current and future demand.",
      "Fault detection and handling find failures fast and limit downtime. Load balancing spreads traffic over several links or servers."],
 ex:"VoIP calls between two sites become choppy although bandwidth is fine. Monitoring shows high jitter on the satellite link; traffic shaping gives voice priority and the calls clear up.",
 terms:[["Throughput","Data actually delivered per unit of time."],["Jitter","Variation in latency between packets."],["Observability","Understanding a network's state from its metrics, logs and traces."],["Traffic shaping","Controlling and prioritizing network traffic."]],
 trap:"Bandwidth is capacity, throughput is what you actually get. A link can have plenty of bandwidth and still poor throughput.",
 mnem:"Latency = how long, jitter = how unsteady.",
 ref:{s:"ch. 11 and 12",o:"Domain 4"}},

{id:"y4-email",d:4,lvl:3,t:"Email security: S/MIME, SPF, DKIM, DMARC, STARTTLS",
 what:"Email was designed without security, and it remains the top entry point for phishing and business email compromise. Several standards add authentication and encryption without replacing SMTP.",
 pts:["S/MIME uses X.509 certificates. A signed message gives integrity, sender authentication and nonrepudiation; an enveloped (encrypted) message gives confidentiality.",
      "PGP is a peer-to-peer alternative based on a web of trust.",
      "SPF (Sender Policy Framework) publishes in DNS which servers may send mail for a domain; receivers check the sending server against it.",
      "DKIM (DomainKeys Identified Mail) signs messages with the domain's key, so receivers can verify they were authorized by the domain and not altered.",
      "DMARC builds on SPF and DKIM: the domain owner publishes in DNS what to do with failing messages (deliver, quarantine, reject) and receives reports. It targets spoofing, phishing and BEC.",
      "STARTTLS upgrades an SMTP connection to TLS if both sides support it (opportunistic encryption, port 587 for submission); implicit SMTPS uses TLS from the start."],
 ex:"Attackers send invoices that appear to come from the company's own domain. Publishing SPF, signing with DKIM and moving DMARC to 'reject' makes receiving servers drop these spoofed messages.",
 terms:[["SPF","DNS list of servers allowed to send mail for a domain."],["DKIM","Domain signature on email messages."],["DMARC","Policy telling receivers how to handle SPF/DKIM failures."],["STARTTLS","SMTP command that upgrades a connection to TLS."]],
 trap:"DMARC does not work alone: it relies on SPF and DKIM results. And STARTTLS is an SMTP command, not a separate protocol.",
 mnem:"SPF = who may send, DKIM = signed by whom, DMARC = what to do if both fail.",
 ref:{s:"ch. 12",o:"Domain 4"}},

{id:"y5-identite",d:5,lvl:3,t:"Identity strategy: proofing, passwordless, groups and service accounts",
 what:"The 2024 outline reorganizes Domain 5 around designing an identification and authentication strategy for people, devices and services. A few items are new or more detailed.",
 pts:["Registration, proofing and establishment of identity: new employees prove who they are with documents (passport, ID) before HR registers them. Online, organizations may use knowledge-based authentication (questions about the person's history) for identity proofing.",
      "Password-less authentication replaces passwords with something stronger, such as FIDO2 security keys, passkeys or Windows Hello combined with a device.",
      "Groups and roles simplify administration: rights are given to groups or roles, never directly to individuals.",
      "Access must be controlled to information, systems, devices, facilities, applications and services (services were added in 2024).",
      "Federated identity with a third-party service can be on-premises, cloud-based or hybrid.",
      "Service accounts management: inventory them, give each the least privilege, rotate their passwords (or use managed service accounts), never use them interactively, and review them regularly."],
 ex:"An audit finds a service account created years ago with domain admin rights and a password that never expires. It is reduced to the rights the application really needs and converted to a managed service account with automatic password rotation.",
 terms:[["Identity proofing","Verifying that a person is who they claim to be before registration."],["Password-less authentication","Authenticating without a password, for example with a security key."],["Knowledge-based authentication","Proving identity by answering questions about one's history."],["Service account","An account used by an application or service, not a person."]],
 trap:"Rights go to groups or roles, not individuals. Assigning permissions directly to users is the wrong answer on the exam.",
 mnem:"Prove, register, group, review.",
 ref:{s:"ch. 13",o:"Domain 5"}},

{id:"y5-zerotrust",d:5,lvl:3,t:"Zero trust access policy enforcement: PDP and PEP",
 what:"The 2024 outline adds access policy enforcement, using the vocabulary of NIST's zero trust architecture. Every request is checked when it happens, and the checking is split into components with precise names.",
 pts:["Zero trust assumes there is no trust boundary and no network edge: each action is validated at request time, continuously.",
      "Subjects (users, services, systems) request access to enterprise resources.",
      "The policy engine decides: it applies rules and inputs such as identity, threat intelligence, SIEM data and device posture through a trust algorithm, then grants, denies or revokes access.",
      "The policy administrator is a component (not a person) that opens or closes the communication path and issues session tokens, following the engine's decision.",
      "Together, the policy engine and the policy administrator form the policy decision point (PDP).",
      "The policy enforcement point (PEP) sits in the path between subject and resource, forwards requests and enforces the decision, often as a local agent plus a gateway."],
 ex:"A user opens the ERP from a laptop. The access proxy (PEP) asks the decision service (PDP), which checks identity, MFA, device compliance and current risk, then tells the proxy to allow the session. If the laptop later fails a health check, the PDP tells the PEP to end it.",
 terms:[["Policy engine","Makes the access decision using a trust algorithm."],["Policy administrator","Opens or closes the path and issues session credentials."],["PDP","Policy decision point: engine plus administrator."],["PEP","Policy enforcement point: applies the decision in the traffic path."]],
 trap:"The PDP decides, the PEP enforces. And the policy administrator is a system component, not a human administrator.",
 mnem:"PDP = Decides, PEP = Enforces at the door.",
 ref:{s:"ch. 14",o:"Domain 5"}},

{id:"y5-attaques",d:5,lvl:3,t:"Access control attacks: spraying, stuffing, Mimikatz and more",
 what:"The Sybex guide reviews the attacks that target authentication and access control. Several of them are everyday threats for any Active Directory environment.",
 pts:["Privilege escalation: horizontal (another user's rights at the same level) or vertical (higher privileges).",
      "Password spraying tries one common password against many accounts, slowly, to avoid account lockout.",
      "Credential stuffing reuses username and password pairs stolen from one site on many other sites, relying on password reuse.",
      "Birthday attack: finding hash collisions, easier than expected (the birthday paradox). Rainbow tables are countered by salts.",
      "Mimikatz reads LM and NTLM hashes and Kerberos tickets from Windows memory, enabling pass-the-hash and Kerberos exploitation.",
      "Sniffer attacks capture credentials sent in cleartext; spoofing attacks impersonate users, IP addresses, emails or phone numbers.",
      "Defenses: MFA, unique passwords, monitoring of failed logins across accounts, credential protection on endpoints, encrypted protocols."],
 ex:"The logs show one failed login for 'Winter2026!' on 900 different accounts in an hour, then the same for 'Welcome1'. No account is locked out: that is password spraying, and MFA plus banned password lists stop it.",
 terms:[["Password spraying","One password tried against many accounts to avoid lockout."],["Credential stuffing","Reusing stolen credentials on other sites."],["Mimikatz","Tool that extracts credentials and tickets from Windows memory."],["Horizontal escalation","Gaining another user's rights at the same level."]],
 trap:"Spraying: many accounts, one password. Stuffing: one stolen pair, many sites. Lockout policies don't stop spraying.",
 mnem:"Spray wide, stuff deep.",
 ref:{s:"ch. 14",o:"Domain 5"}},

{id:"y6-audits",d:6,lvl:3,t:"Audit types: where the books disagree",
 what:"Internal, external and third-party audits are defined differently by the All-in-One and the Sybex guide. The 2024 outline settles the question with one word each: control.",
 pts:["2024 outline wording: internal = within organization control; external = outside organization control; third-party = outside of enterprise control. A new item adds location: on-premises, cloud, hybrid.",
      "Sybex: internal audits are run by the organization's own auditors. External audits are performed by an independent firm hired by the organization (such as the Big Four). Third-party audits are conducted by or on behalf of another organization, such as a regulator or a customer, which picks the auditor and the scope.",
      "All-in-One: an external audit is a second-party audit by or for a business partner; a third-party audit is by a neutral auditor. Read the scenario and ask who controls the audit.",
      "SSAE 18 (US) and ISAE 3402 (international) are the standards behind SOC reports. SOC 2 results are confidential (shared under NDA); SOC 3 is public.",
      "Type I: opinion on the design at a point in time. Type II: operating effectiveness over at least six months.",
      "Test scheduling depends on criticality, sensitivity, likelihood of failure or misconfiguration, attack risk, rate of change, effort and business impact."],
 ex:"A bank's regulator sends its own auditors to check the bank's payment controls: under Sybex and the outline, that is a third-party audit, because the bank does not control it. The bank hiring KPMG for its yearly assessment is an external audit.",
 terms:[["Internal audit","Under the organization's own control."],["External audit","Outside firm, still hired by the organization (Sybex)."],["Third-party audit","Run by or for another organization, outside the enterprise's control."],["ISAE 3402","International standard for service organization control reports."]],
 trap:"On the exam, decide by who controls the audit: you (internal), an independent firm you hired (external), or someone else (third-party).",
 mnem:"Internal = my team, External = my hired firm, Third-party = their choice.",
 ref:{s:"ch. 15",o:"Domain 6"}},

{id:"y6-exercices",d:6,lvl:3,t:"Exercises: red, blue, white and purple teams",
 what:"The 2024 outline explicitly mentions red, blue and purple team exercises under penetration testing. Exercises train people and reveal weaknesses at the same time.",
 pts:["Red team: attackers who try to gain access.",
      "Blue team: defenders who secure and monitor systems, usually with a head start before the attack phase.",
      "White team: observers and referees who enforce the rules, settle disputes, document lessons and make sure the exercise does not disrupt production.",
      "Purple teaming: red and blue share tactics and lessons after (or during) the exercise to improve defenses.",
      "Capture the flag (CTF): the red team has set objectives (steal a file, deface a site) and the score compares objectives achieved with those prevented.",
      "Exercises can run in a separate environment to protect production. Tabletop exercises use no systems at all: participants talk through a scenario.",
      "Synthetic transactions and benchmarks, and interface testing of user interfaces, network interfaces and APIs, are also listed in the 2024 outline."],
 ex:"A one-day exercise: the red team tries to reach the finance share from the guest Wi-Fi, the blue team defends, a white team referees. In the afternoon, both teams sit together (purple) and turn each finding into a detection rule.",
 terms:[["Red team","Attackers in an exercise."],["Blue team","Defenders in an exercise."],["White team","Referees and observers."],["Capture the flag","Exercise scored on objectives achieved or prevented."]],
 trap:"The white team, not the blue team, referees and protects production during the exercise.",
 mnem:"Red attacks, Blue defends, White judges, Purple shares.",
 ref:{s:"ch. 15",o:"Domain 6"}},

{id:"y7-detection",d:7,lvl:3,t:"Detection methods and SOAR: playbooks versus runbooks",
 what:"The Sybex guide explains the two detection approaches behind IDS and anti-malware tools, and how SOAR automates the response.",
 pts:["Knowledge-based detection (signature-based, pattern matching) compares activity with known attack signatures. Few false positives, but blind to new attacks.",
      "Behavior-based detection (statistical, anomaly-based, heuristics-based) builds a baseline of normal activity and flags deviations. Can find new attacks but produces more false positives, and the baseline must be updated when the network changes.",
      "UEBA applies the behavior approach to individual users and entities.",
      "Allow lists (whitelisting) permit only approved items; deny lists (blacklisting) block known bad items.",
      "Third-party security services (managed SOC, MDR) can provide detection the organization cannot staff itself.",
      "A playbook is a document or checklist that defines how to verify an incident and how to respond. A runbook implements the playbook in an automated tool. SOAR platforms run these responses automatically.",
      "Machine learning and AI tools help with anomaly detection and triage at scale."],
 ex:"The IDS flags a possible SYN flood. The SOAR runbook automatically checks the playbook's criteria (connection counts, half-open sessions), confirms the attack, enables SYN protection on the firewall and opens a ticket, within seconds.",
 terms:[["Knowledge-based detection","Matching activity against known signatures."],["Behavior-based detection","Flagging deviations from a normal baseline."],["Playbook","Document defining how to verify and respond to an incident."],["Runbook","Automated implementation of a playbook."]],
 trap:"Within incident response, the playbook defines the actions and the runbook automates them. Other fields sometimes use the words differently.",
 mnem:"Playbook = the recipe, runbook = the robot cook.",
 ref:{s:"ch. 17",o:"Domain 7"}},

{id:"y7-crime",d:7,lvl:3,t:"Computer crime categories and types of evidence",
