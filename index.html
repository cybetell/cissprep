 what:"Knowing why attackers act helps predict what they will do and what evidence they leave. The Sybex guide also gives four categories of evidence and two specific rules for documents.",
 pts:["Crime categories: military and intelligence attacks, business attacks (corporate espionage), financial attacks, terrorist attacks, grudge attacks (often insiders), thrill attacks, hacktivist attacks.",
      "Real evidence (object evidence): physical items such as a seized hard drive.",
      "Documentary evidence: written items such as logs; it must be authenticated, often by a witness who explains how it was produced.",
      "Best evidence rule: the original document must be used, not a copy. Parol evidence rule: a written agreement is assumed to contain all terms, and no verbal agreement can modify it.",
      "Testimonial evidence: what witnesses say, under oath. Demonstrative evidence: items that support testimony, such as charts or diagrams.",
      "To be admissible, evidence must be relevant, material and competent (legally obtained)."],
 ex:"A supplier claims the IT manager verbally agreed to extend support for free, but the signed contract says otherwise. Under the parol evidence rule, the written contract prevails.",
 terms:[["Parol evidence rule","A written agreement cannot be changed by verbal agreements."],["Documentary evidence","Written items, such as logs, used to prove facts."],["Demonstrative evidence","Material that supports testimony, such as charts."],["Grudge attack","Attack motivated by resentment, often from insiders."]],
 trap:"The best evidence rule is about originals versus copies. The parol evidence rule is about written versus verbal agreements.",
 mnem:"Four evidence types: Real, Documentary, Testimonial, Demonstrative: 'Really Detailed Testimony Demonstrates'.",
 ref:{s:"ch. 19",o:"Domain 7"}},

{id:"y7-reprise",d:7,lvl:3,t:"Recovery strategies and DR testing in the 2024 outline",
 what:"The 2024 outline adds cloud backup options, resource capacity agreements and communications during DR tests. It also renames the test types.",
 pts:["Backup storage strategies: onsite (fast restore, same disaster risk), offsite (protected from local disaster), cloud storage (geographic dispersion, but depends on Internet links and the provider).",
      "Organizations using the cloud for DR should sign a resource capacity agreement, guaranteeing the provider will supply the needed resources during a disaster, when every customer wants them at once.",
      "Mutual assistance agreements (reciprocal agreements) are cheap but hard to enforce, and both parties may be hit by the same regional disaster.",
      "Multiple processing sites spread operations so one site's loss is not a disaster.",
      "DR test types in the outline: read-through and tabletop, walkthrough, simulation, parallel, full interruption.",
      "Test communications: keep stakeholders, test status and regulators informed before, during and after the test."],
 ex:"A company plans to restart its servers in a cloud region if its data center fails. Without a resource capacity agreement, a regional disaster could leave the provider without enough capacity for everyone at the worst moment.",
 terms:[["Resource capacity agreement","Provider's commitment to supply resources for DR."],["Mutual assistance agreement","Two organizations agree to help each other in a disaster."],["Full interruption test","Production really shuts down and moves to the recovery site."],["Multiple processing sites","Operations spread over several sites."]],
 trap:"A full interruption test is the most realistic and the most dangerous; it can cause the disaster it tests.",
 mnem:"Read, Walk, Simulate, Parallel, Interrupt: from paper to real.",
 ref:{s:"ch. 18",o:"Domain 7"}},

{id:"y8-methodes",d:8,lvl:3,t:"Scaled Agile, code reviews and ACID databases",
 what:"The 2024 outline adds the Scaled Agile Framework to development methods. The Sybex guide also details formal code reviews and the ACID properties that keep database transactions reliable.",
 pts:["The Scaled Agile Framework (SAFe) applies Agile to large organizations with many teams. Teams work in Agile Release Trains (ARTs), delivering program increments of about 8 to 12 weeks.",
      "SAFe has four configurations: Essential SAFe, Large Solution SAFe, Portfolio SAFe and Full SAFe.",
      "Fagan inspections are the most formal code reviews, with six steps: planning, overview, preparation, inspection, rework, follow-up. Used where code flaws could be catastrophic.",
      "ACID: atomicity (all or nothing; a failed transaction is rolled back entirely), consistency (the database follows its rules before and after), isolation (transactions on the same data run one after another), durability (committed transactions are preserved, using logs and backups).",
      "Knowledge-based systems: expert systems combine a knowledge base with an inference engine; machine learning learns from data; neural networks imitate the brain's structure to recognize patterns."],
 ex:"A bank transfer debits one account and credits another. Atomicity means that if the credit fails, the debit is cancelled too: money never disappears halfway.",
 terms:[["SAFe","Scaled Agile Framework for large organizations."],["Agile Release Train","Group of Agile teams delivering together."],["Fagan inspection","Highly formal six-step code review."],["ACID","Atomicity, consistency, isolation, durability."]],
 trap:"Atomicity is about all or nothing; isolation is about transactions not interfering with each other. They are easily confused.",
 mnem:"Fagan steps: Please Only Prepare Inspections, Rework, Follow up.",
 ref:{s:"ch. 15 and 20",o:"Domain 8"}},

{id:"y8-attaques",d:8,lvl:3,t:"Application attacks and defenses",
 what:"The Sybex guide gives a detailed tour of attacks on applications and the controls that stop them. This builds on the basic list of vulnerabilities from the Eleventh Hour.",
 pts:["SQL injection variants: classic, blind content-based (the page changes with true or false conditions), blind timing-based (the response delay leaks data). Code injection and command injection make the application run attacker code or system commands.",
      "Authorization flaws: insecure direct object references (changing an ID in the URL to see someone else's record), directory traversal, local and remote file inclusion.",
      "Web attacks: cross-site scripting, reflected (in a crafted link) or stored/persistent (saved on the site); cross-site request forgery; server-side request forgery (SSRF), where the server is tricked into making requests to internal systems.",
      "Malware types include viruses, logic bombs, Trojans, worms, spyware and adware, ransomware, malicious scripts and zero-day attacks.",
      "Application security controls: input validation (allow lists are better than deny lists), web application firewalls, parameterized queries, code signing, integrity measurement.",
      "Secure coding: remove sensitive source code comments, handle errors without revealing details, never hard-code credentials, manage memory and resources carefully."],
 ex:"A customer portal shows invoices at /invoice?id=1043. Changing the number to 1044 displays another customer's invoice: an insecure direct object reference. The fix is checking on the server that the invoice belongs to the logged-in user.",
 terms:[["Blind SQL injection","Extracting data without seeing it, from page behavior or delays."],["IDOR","Insecure direct object reference."],["Stored XSS","Malicious script saved on the site and shown to every visitor."],["SSRF","Server-side request forgery: the server is tricked into internal requests."]],
 trap:"CSRF abuses the victim's browser against a site; SSRF abuses the server against internal systems.",
 mnem:"Validate input, encode output, parameterize queries, check every object.",
 ref:{s:"ch. 21",o:"Domain 8"}},
{id:"y2-classif",d:2,lvl:3,t:"Classification labels, marking and handling",
 what:"The Sybex guide compares government and commercial classification schemes and walks through how sensitive assets are marked, handled, stored and destroyed.",
 pts:["Government labels: Top Secret (exceptionally grave damage), Secret (serious damage), Confidential (damage), Unclassified.",
      "Commercial (nonmilitary) labels: Confidential or Proprietary (highest, exceptionally grave damage to the organization), Private (internal personal data), Sensitive (would harm the organization if disclosed), Public.",
      "The label name matters less than the definitions: each organization defines its own levels and what each requires.",
      "Marking (labeling) applies the classification to data and media, physically or electronically, so people and systems know how to protect it. Unclassified media should be marked too, so a missing label is never mistaken for 'public'.",
      "Handling covers transport and use; storage needs protection equal to the classification; backups have the same label as the original data.",
      "Destruction terms: erasing (deleting, data remains), clearing (overwriting for reuse in the same environment), purging (more intense, for reuse in a less secure environment), declassification (reusing media at a lower level, often not recommended), sanitization (removing all sensitive data)."],
 ex:"A board pack is labeled 'Confidential' in the header and footer, and the document management system applies an encryption label automatically. Printed copies are shredded, never thrown in the bin.",
 terms:[["Marking","Applying a classification label to data or media."],["Declassification","Reclassifying media so it can be used at a lower level."],["Purging","Sanitization strong enough for reuse in a less secure environment."],["Proprietary","Commercial label for the most valuable business data."]],
 trap:"Purged media can be reused in a less secure environment; cleared media should stay at the same level. Many organizations forbid declassification and destroy media instead.",
 mnem:"Commercial ladder: Confidential, Private, Sensitive, Public.",
 ref:{s:"ch. 5",o:"Domain 2"}},

{id:"y2-roles",d:2,lvl:3,t:"Data roles in the Sybex guide",
 what:"The 2024 outline lists data owners, controllers, custodians, processors and users or subjects. The Sybex guide adds a few more roles and draws precise lines between them.",
 pts:["Data owner: ultimately responsible for the data (classification, protection rules). Often a senior manager, liable for negligence.",
      "Asset owner (system owner): owns the system that processes the data. Business or mission owner: owns a business process and may weigh security against business needs.",
      "Data controller: decides what data is processed, why and how. Data processor: processes data on behalf of the controller, under a contract (GDPR term).",
      "Custodian: day-to-day protection delegated by the owner (backups, patches, configuration), often IT staff.",
      "Administrator: grants access to users according to the owner's rules, often through roles (RBAC).",
      "User: accesses data to do their job, and must follow security policies. Data subject: the person the personal data is about."],
 ex:"Finance owns the accounting data (data owner); IT runs the ERP servers (custodian); an IT admin creates roles in the ERP following finance's rules (administrator); a payroll firm processes salaries under contract (processor).",
 terms:[["Asset owner","Owns the system that processes the data."],["Business owner","Owns a business process using the system."],["Administrator","Grants access according to the owner's rules."],["Data processor","Processes data on behalf of the controller."]],
 trap:"The custodian performs protection tasks; the owner decides and remains accountable. Delegation never transfers accountability.",
 mnem:"Owner decides, custodian does, administrator grants, user uses.",
 ref:{s:"ch. 5",o:"Domain 2"}},

{id:"y2-baselines",d:2,lvl:3,t:"Security baselines, scoping, tailoring and standards selection",
 what:"Rather than inventing controls from scratch, organizations start from a baseline and adapt it. The Sybex guide shows how NIST baselines, scoping and tailoring fit together.",
 pts:["A security baseline is a minimum set of controls applied to a system type.",
      "NIST SP 800-53B provides control baselines for low-impact, moderate-impact and high-impact systems, matching the system's categorization.",
      "Scoping selects which controls of the baseline apply (for example, wireless controls do not apply to a system without wireless).",
      "Tailoring modifies the baseline to fit the organization's mission, for example adding compensating controls or adjusting parameters such as lockout thresholds.",
      "Standards selection: choose the frameworks and standards that fit your obligations and environment (NIST, ISO 27001/27002, CIS benchmarks, PCI DSS for card data).",
      "Images and configuration templates (such as CIS benchmarks or Microsoft security baselines) turn baselines into concrete settings."],
 ex:"A new file server is categorized moderate. The team starts from the NIST moderate baseline, removes controls for features the server does not have (scoping), raises the log retention period to match a legal requirement (tailoring), and applies the CIS benchmark settings.",
 terms:[["Baseline","Minimum set of controls for a type of system."],["Scoping","Choosing which baseline controls apply."],["Tailoring","Adapting the baseline to the organization."],["Standards selection","Choosing the frameworks and standards to follow."]],
 trap:"Scoping is a part of tailoring in NIST terms. If the question is about removing controls that don't apply, the best answer is scoping.",
 mnem:"Scope = what applies, Tailor = how it fits.",
 ref:{s:"ch. 5",o:"Domain 2"}},

{id:"y2-retention",d:2,lvl:3,t:"Retention of data, hardware and personnel knowledge",
 what:"Asset retention covers how long data, hardware and even people's knowledge are kept. The Sybex guide links retention to end of life, end of support and data location.",
 pts:["Record retention keeps data only as long as needed for business or legal reasons, then destroys it. Keeping data longer increases legal exposure (eDiscovery) and breach impact.",
      "Retention policies must cover backups too; deleted data that remains on backup tapes is still discoverable.",
      "Hardware retention: equipment may be kept until data is sanitized, or replaced when it reaches end of life (no longer sold) or end of support (no more patches).",
      "Personnel retention: knowledge held by employees; NDAs remind them of their obligations after they leave.",
      "Data location: know where data and its backups are stored, including cloud regions, because laws (data sovereignty) and disasters depend on location.",
      "Data maintenance keeps data accurate and its copies consistent; data collection limitation means collecting only what is needed."],
 ex:"A litigation hold requires the company to preserve emails about a contract. Because the retention policy deletes email after five years, only the relevant period must be searched, and older mail no longer exists to be discovered.",
 terms:[["Record retention","Keeping data for a defined period, then destroying it."],["Litigation hold","Suspending deletion to preserve evidence for a legal case."],["Data location","Where data and its copies are physically stored."],["Data collection limitation","Collecting only the data that is needed."]],
 trap:"Retention is not 'keep everything forever'. Data kept beyond its required period is a liability, not an asset.",
 mnem:"Keep what the law and business need, destroy the rest on schedule.",
 ref:{s:"ch. 5",o:"Domain 2"}},

{id:"y3-tcb",d:3,lvl:3,t:"Trusted computing base, security kernel and CIA techniques",
 what:"The Sybex guide describes how a system enforces its security policy from the inside: a small trusted core, a boundary around it, and techniques that keep processes apart.",
 pts:["The trusted computing base (TCB) is the combination of hardware, software and controls that enforces the security policy. It should be as small as possible so it can be verified.",
      "The security perimeter is the imaginary boundary between the TCB and the rest of the system. Communication across it uses trusted paths.",
      "The reference monitor is the concept that validates every access before granting it. The security kernel is the set of TCB components that implements the reference monitor.",
      "Confinement restricts a process to reading from and writing to certain memory locations only (sandboxing). Bounds are the limits of memory a process may use. Isolation keeps processes separate (process isolation, memory protection).",
      "Security attributes can be stored as tokens, capabilities lists (rows of rights for each subject) or security labels (permanent, hardest to tamper with).",
      "Trust is about the security features present; assurance is the degree of confidence that they work as intended."],
 ex:"A browser runs each tab in a sandbox: the tab's process is confined to its own memory (bounds), isolated from other tabs, and must ask the browser's broker process (a small trusted component) for anything outside.",
 terms:[["TCB","Trusted computing base: everything that enforces the security policy."],["Security kernel","TCB components implementing the reference monitor."],["Trusted path","Secure channel between the TCB and the rest of the system."],["Assurance","Confidence that security features work as intended."]],
 trap:"The reference monitor is a concept; the security kernel is its implementation.",
 mnem:"Keep the TCB tiny, guard its border, check every access.",
 ref:{s:"ch. 8",o:"Domain 3"}},

{id:"y3-modeles",d:3,lvl:3,t:"State machine, information flow and Take-Grant models",
 what:"Behind Bell-LaPadula and Biba sit more general models. The Sybex guide presents them as building blocks, and clears up the 'Star Model' mentioned in the 2024 outline.",
 pts:["State machine model: a system is secure if it starts in a secure state and every possible transition leads to another secure state. Many other models build on it.",
      "Information flow model: controls the direction and type of information flows, allowing only authorized flows; by excluding undefined paths, it addresses covert channels. Bell-LaPadula and Biba are information flow models.",
      "Noninterference model: actions of a high-level subject must not affect, or be noticed by, low-level subjects.",
      "Take-Grant model uses a directed graph and four rules: take, grant, create and remove rights. It helps find where rights can leak.",
      "There is no formal 'Star Model': the outline refers to the star (*) properties of Bell-LaPadula and Biba. Do not confuse with the Cloud Security Alliance's STAR program, which audits cloud providers.",
      "Other models exist (Goguen-Meseguer, Sutherland, Lipner and more) but the exam focuses on the classic ones."],
 ex:"File permissions inherited from a parent folder behave like the Take-Grant grant rule: rights are copied along a path. Mapping these paths shows how a contractor ended up with access to the finance share.",
 terms:[["State machine model","Secure in every state and every transition."],["Information flow model","Allows only authorized flows of information."],["Take-Grant","Model of how rights are taken, granted, created and removed."],["CSA STAR","Cloud Security Alliance's provider assurance program, not a security model."]],
 trap:"Take-Grant is about how rights move between subjects and objects, not about confidentiality levels.",
 mnem:"Take, Grant, Create, Remove: the four verbs of rights.",
 ref:{s:"ch. 8",o:"Domain 3"}},

{id:"y3-physique",d:3,lvl:3,t:"Physical security in the Sybex guide: facilities and metrics",
 what:"Chapter 10 of the Sybex guide reviews facility design and adds a useful idea: physical security must be measured like any other control.",
 pts:["Server rooms and data centers: no windows, restricted access, located in the center of the building, not on the top floor or in the basement; hot and cold aisles for cooling.",
      "Wiring closets (intermediate distribution facilities): locked, not used for storage, monitored, with access logged.",
      "Evidence storage: dedicated, secured, access logged, and protecting the chain of custody. Media storage: controlled access, environmental protection, check-in and check-out.",
      "Restricted and work areas: separate sensitivity levels, escort visitors, clean desk policy.",
      "Fire needs heat, oxygen and fuel (the fire triangle); fire develops in four stages: incipient, smoke, flame, heat. Detect early.",
      "Physical security key performance indicators include number of successful and unsuccessful intrusions, number of crimes, number of incidents and disruptions, time to detect, assess and respond, and frequency of evacuation drills."],
 ex:"Quarterly reports for the head office track badge-sharing incidents, tailgating attempts caught on camera and average guard response time. A rising response time leads to a change in patrol routes.",
 terms:[["Hot and cold aisles","Rack arrangement separating cool intake air from hot exhaust."],["Fire triangle","Heat, oxygen and fuel: remove one to stop a fire."],["Incipient stage","First stage of fire, only air ionization, no smoke yet."],["Clean desk policy","No sensitive material left unattended on desks."]],
 trap:"A data center belongs in the core of the building, away from exterior walls, the top floor (roof leaks) and the basement (flooding).",
 mnem:"Fire stages: Incipient, Smoke, Flame, Heat: 'I See Fire Here'.",
 ref:{s:"ch. 10",o:"Domain 3"}},

{id:"y4-attaques",d:4,lvl:3,t:"Network attacks and their countermeasures",
 what:"The Sybex guide ends Domain 4 with the classic network attacks. Each has a known countermeasure, and exam questions often ask for the best one.",
 pts:["Denial of service floods or crashes a target; distributed DoS uses many sources (botnets). Variants: SYN flood, smurf (ICMP to broadcast addresses), fraggle (UDP), ping of death, teardrop (overlapping fragments), land attack (same source and destination).",
      "Eavesdropping (sniffing) captures traffic; defend with encryption and physical security of cabling.",
      "Impersonation or masquerading uses stolen credentials or spoofed addresses; defend with strong authentication.",
      "Replay attacks resend captured traffic; defend with timestamps, nonces and session tokens.",
      "Modification attacks alter data in transit; defend with digital signatures and hashing.",
      "ARP spoofing redirects local traffic; DNS poisoning (rogue DNS server, cache poisoning, hosts file changes, domain hijacking) redirects names. Defenses: dynamic ARP inspection, DNSSEC, monitoring.",
      "Hyperlink spoofing and typosquatting lure users to fake sites; defend with awareness and URL filtering."],
 ex:"An attacker registers 'soc1in.com', copies the company's webmail login page and emails staff a link. That is typosquatting combined with phishing; URL filtering and domain monitoring catch it.",
 terms:[["Smurf attack","ICMP echo to broadcast addresses with a spoofed source."],["Teardrop","Overlapping fragmented packets that crash the receiver."],["Replay attack","Resending captured valid traffic."],["Typosquatting","Registering misspelled domains to trap users."]],
 trap:"Replay attacks are stopped by freshness (timestamps, nonces, one-time tokens), not by encryption alone.",
 mnem:"Smurf = ICMP, Fraggle = UDP: same trick, different protocol.",
 ref:{s:"ch. 12",o:"Domain 4"}},

{id:"y5-aaa",d:5,lvl:3,t:"The AAA model and session management",
 what:"The Sybex guide breaks access control into five elements and adds session management, which the 2024 outline lists explicitly.",
 pts:["Identification: claiming an identity (username). Authentication: proving it. Authorization: what the identity may do. Auditing: recording activity. Accounting: holding users accountable from the audit trail.",
      "Accountability requires unique identities and strong authentication; shared accounts destroy it.",
      "Session management: idle timeouts with screen lock, maximum session duration, re-authentication for sensitive actions, protection of session identifiers from theft.",
      "Single sign-on and federated identity can be implemented on premises, in the cloud or hybrid; just-in-time provisioning creates accounts at first login through federation.",
      "Credential management systems (password vaults) store and manage credentials securely, including for privileged accounts."],
 ex:"A shared 'admin' account on the firewalls means nobody can tell who changed a rule. Personal admin accounts, logged in the SIEM, restore accountability.",
 terms:[["Auditing","Recording user and system activity."],["Accounting","Holding users responsible based on audit records."],["Session timeout","Ending or locking a session after inactivity."],["Just-in-time provisioning","Creating an account automatically at first federated login."]],
 trap:"Accountability depends on identification and authentication: without unique, authenticated identities, logs cannot prove who did what.",
 mnem:"Identify, Authenticate, Authorize, Audit, Account.",
 ref:{s:"ch. 13",o:"Domain 5"}},

{id:"y5-modeles",d:5,lvl:3,t:"Access control models in detail: implicit deny, ACLs and MAC variants",
 what:"The Sybex guide goes deeper into how access control models are built and how mandatory access control can be organized.",
 pts:["Implicit deny: anything not explicitly allowed is denied. Firewalls and most access control lists end with it.",
      "An access control list (ACL) is attached to an object and lists who may do what. A capability table is attached to a subject and lists what it may access.",
      "Constrained interfaces limit what users can see or do in an application (grayed-out menus, restricted views).",
      "Discretionary access control (DAC) lets owners decide. Nondiscretionary models (role-based, rule-based, attribute-based, MAC) are centrally administered.",
      "MAC environments can be hierarchical (levels such as Secret above Confidential), compartmentalized (separate domains with no relation, need to know), or hybrid (levels with compartments).",
      "Rule-based access control applies global rules to all subjects, such as firewall rules."],
 ex:"A Secret-cleared analyst working on project Alpha cannot open Secret documents of project Beta: the hybrid MAC system checks both the level and the compartment.",
 terms:[["Implicit deny","Default denial of anything not explicitly allowed."],["Capability table","Rights listed per subject."],["Constrained interface","Restricting functions available in the user interface."],["Hybrid MAC","Hierarchical levels combined with compartments."]],
 trap:"An ACL is focused on the object; a capability table is focused on the subject.",
 mnem:"ACL = Attached to the object, Capability = Carried by the subject.",
 ref:{s:"ch. 14",o:"Domain 5"}},

{id:"y6-scans",d:6,lvl:3,t:"Vulnerability scans and Nmap",
 what:"The Sybex guide details the four kinds of vulnerability scans and how network discovery tools such as Nmap report what they find.",
 pts:["Network discovery scans find systems and open ports without testing for vulnerabilities. TCP SYN scan (half-open), TCP connect scan (full connection, for users without raw packet rights), TCP ACK scan (maps firewall rules), UDP scan, Xmas scan (FIN, PSH and URG flags).",
      "Nmap port states: open (an application accepts connections), closed (reachable but nothing listening), filtered (a firewall interferes), unfiltered (reachable but status unknown), open|filtered (no response).",
      "Network vulnerability scans probe for known weaknesses; authenticated (credentialed) scans see much more and produce fewer false positives.",
      "Web vulnerability scans test web applications for flaws such as SQL injection and XSS. Database vulnerability scans check databases.",
      "SCAP (Security Content Automation Protocol) standardizes vulnerability data: CVE names flaws, CVSS scores them, CPE names products, CCE names configuration issues, XCCDF and OVAL describe checks.",
      "Vulnerability management workflow: detect, validate (false positive?), remediate, and verify."],
 ex:"Nmap reports port 3389 as 'filtered' from the Internet but 'open' from the internal network: the firewall blocks external RDP, but any compromised internal PC could still reach it.",
 terms:[["SYN scan","Half-open scan using only the first step of the handshake."],["Filtered","Nmap cannot tell open from closed because of a firewall."],["SCAP","Security Content Automation Protocol."],["CPE","Common Platform Enumeration: standard product names."]],
 trap:"Closed means the port is reachable but nothing listens; filtered means a firewall prevents knowing.",
 mnem:"Xmas scan: lit up with FIN, PSH, URG.",
 ref:{s:"ch. 15",o:"Domain 6"}},

{id:"y6-pentest",d:6,lvl:3,t:"Penetration testing process and software testing techniques",
 what:"The Sybex guide follows NIST SP 800-115 for penetration tests and gives several software testing details: fuzzing types, coverage criteria and monitoring.",
 pts:["NIST SP 800-115 pentest phases: planning (scope, rules of engagement, authorization), discovery (information gathering, scanning, vulnerability analysis), attack (exploitation), reporting.",
      "White-box (full knowledge), gray-box (partial) and black-box (zero knowledge) tests. Breach attack simulations automate attacks continuously.",
      "Mutation (dumb) fuzzing alters real input values; generational (intelligent) fuzzing creates input from a model of the expected data.",
      "Test coverage = use cases tested / total use cases. Criteria: branch, condition, function, loop and statement coverage.",
      "Interface testing covers user interfaces, network interfaces and APIs. Misuse case testing models how attackers would abuse the application.",
      "Website monitoring: synthetic (active) monitoring runs scripted transactions; passive monitoring analyzes real traffic, including real user monitoring (RUM)."],
 ex:"Testers take an export file that the application normally imports and randomly flip bytes in it thousands of times to see if the import crashes: mutation fuzzing.",
 terms:[["Rules of engagement","Agreed limits and conditions of a penetration test."],["Mutation fuzzing","Modifying real input to create test data."],["Generational fuzzing","Generating input from a model of valid data."],["Real user monitoring","Passive monitoring of real users' interactions."]],
 trap:"Vulnerability scans stop at detection; the attack phase of a penetration test actually exploits the weaknesses.",
 mnem:"Plan, Discover, Attack, Report.",
 ref:{s:"ch. 15",o:"Domain 6"}},

{id:"y6-processus",d:6,lvl:3,t:"Security management processes and process data",
 what:"Assessment is not only technical. The Sybex guide describes the management processes that feed security data back to leadership.",
 pts:["Log reviews: regular review of logs, often helped by SIEM; NTP keeps timestamps consistent across systems.",
      "Account management reviews check that accounts and privileges are justified, especially privileged and service accounts.",
      "Management review and approval: leadership reviews assessment results and approves actions; it gives oversight and deters insider abuse.",
      "Key performance and risk indicators track the program: number of open vulnerabilities, time to resolve them, compromised accounts, software flaws found pre and post production, repeat audit findings, users visiting malicious sites.",
      "Backup verification data: test restores regularly; a backup never tested is not a backup.",
      "Training and awareness data and DR/BC test results complete the picture for management."],
 ex:"A quarterly security dashboard for management shows the mean time to remediate critical vulnerabilities, the result of the last restore test and the phishing click rate, with a trend for each.",
 terms:[["Management review","Leadership reviews results and approves actions."],["NTP","Network Time Protocol, used to synchronize clocks."],["Backup verification","Testing that backups can actually be restored."],["Repeat audit finding","An issue found again in a later audit."]],
 trap:"An untested backup is not proof of anything. Backup verification data means successful test restores.",
 mnem:"Measure, review, approve, improve.",
 ref:{s:"ch. 15",o:"Domain 6"}},

{id:"y7-ops",d:7,lvl:3,t:"Foundational operations concepts and agreements",
 what:"The Sybex guide gathers the basic operations concepts and the agreements that govern services. Several have close cousins that the exam likes to contrast.",
 pts:["Need to know grants access to specific data needed for the job; least privilege grants only the rights needed. They work together.",
      "Separation (segregation) of duties splits a sensitive task between people. Two-person control requires two people to approve or perform an action together. Split knowledge divides the information needed for a task between people.",
      "Job rotation and mandatory vacations deter and detect fraud and collusion.",
      "Privileged account management monitors and limits privileged actions, often with separate admin accounts and recorded sessions.",
      "Agreements: a service level agreement (SLA) sets measurable service levels with penalties; a memorandum of understanding (MOU) documents an intention to work together without legal force; an interconnection security agreement (ISA) sets security requirements for connecting two organizations' systems.",
      "Media management: protect, label, store and track media through its life, and sanitize it before reuse or disposal."],
 ex:"Opening the vault requires two officers present at the same time (two-person control), and each knows only half of the combination (split knowledge).",
 terms:[["Two-person control","Two people must act together to complete a task."],["Split knowledge","No one person has all the information needed."],["MOU","Memorandum of understanding: intention without legal penalties."],["ISA","Interconnection security agreement for connecting systems."]],
 trap:"An SLA has measurable commitments and penalties; an MOU usually has neither.",
 mnem:"SLA = Service Levels with teeth, MOU = Mutual Understanding.",
 ref:{s:"ch. 16",o:"Domain 7"}},

{id:"y7-cloud",d:7,lvl:3,t:"Managed services in the cloud and shared responsibility",
 what:"The Sybex guide treats cloud services as an operations topic: who patches, who backs up and who secures data depends on the service model.",
 pts:["SaaS: the provider manages everything up to the application; the customer manages its data, users and access configuration.",
      "PaaS: the provider manages the platform (OS, runtime); the customer manages applications and data.",
      "IaaS: the provider manages hardware and virtualization; the customer manages the operating system, patches, applications and data.",
      "Whatever the model, the customer remains responsible for its data and for who can access it.",
      "Deployment models: public, private, community, hybrid.",
      "Before choosing a provider: check its SOC 2 or ISO 27001 evidence, data location, backup and exit options, incident notification commitments, and the SLA."],
 ex:"A company moves a file server to an IaaS virtual machine and assumes the cloud provider will patch Windows. It won't: in IaaS, OS patching stays with the customer.",
 terms:[["Shared responsibility model","Division of security duties between provider and customer."],["IaaS","Customer manages from the OS up."],["PaaS","Customer manages applications and data."],["SaaS","Customer manages data, users and configuration."]],
 trap:"The more the provider manages, the less you do, but data and access always remain yours.",
 mnem:"IaaS: you patch the OS. PaaS: you deploy code. SaaS: you manage users and data.",
 ref:{s:"ch. 16",o:"Domain 7"}},

{id:"y8-sdlc",d:8,lvl:3,t:"The SDLC steps and project tools in the Sybex guide",
 what:"The Sybex guide uses its own list of SDLC steps, with security activities in each. It also mentions classic project management tools.",
 pts:["Conceptual definition: a simple statement of purpose and requirements, agreed by stakeholders.",
      "Functional requirements determination: specific features, inputs and outputs. Control specifications development: security controls such as access control, encryption and audit trails, defined early.",
      "Design review: check the design meets requirements and controls. Coding, then code review walk-through to find flaws.",
      "System test review (user acceptance testing): verify the system works as intended, including security tests.",
      "Maintenance and change management: keep the system secure through controlled changes until it is retired.",
      "Gantt charts show tasks over time; PERT (Program Evaluation Review Technique) estimates task durations and dependencies to calculate schedule."],
 ex:"For a new procurement portal, the control specifications (MFA, role-based access, encryption of bids) are written right after the functional requirements, so they are designed in and not bolted on.",
 terms:[["Control specifications","Security controls defined during requirements."],["Code review walk-through","Peer review of code to find flaws."],["Gantt chart","Bar chart of tasks over time."],["PERT","Technique for estimating task duration and schedule."]],
 trap:"Security controls are specified early, alongside functional requirements, never added after coding.",
 mnem:"Concept, Function, Controls, Design, Code, Review, Test, Maintain.",
 ref:{s:"ch. 20",o:"Domain 8"}},

{id:"y8-bdd",d:8,lvl:3,t:"Database security: multilevel databases, concurrency and NoSQL",
 what:"Databases concentrate valuable data, so they attract specific threats. The Sybex guide covers multilevel security, concurrency, newer database types and storage threats.",
 pts:["Multilevel databases hold data of different classifications; views restrict what each user sees.",
      "Aggregation (combining low-level data into sensitive information) and inference (deducing sensitive facts) are countered by controlling access to combinations, blurring data and polyinstantiation.",
      "Concurrency control (edit control) uses locks so two users cannot update the same data at once, preventing lost updates and dirty reads.",
      "Other controls: semantic integrity checks, time and date stamps, granular (content-dependent and context-dependent) access control, cell suppression, noise and perturbation.",
      "NoSQL databases: key-value stores, graph databases and document stores; they need the same security as relational ones.",
      "Storage threats: unauthorized access to storage, and covert channels (storage or timing) that leak information."],
 ex:"A salary database allows statistics only on groups of at least ten people, and adds small random noise to results, so no one can infer a single colleague's salary from averages.",
 terms:[["Concurrency control","Locking to prevent conflicting simultaneous updates."],["Cell suppression","Hiding individual database fields to prevent inference."],["Noise and perturbation","Adding false data to hinder inference."],["NoSQL","Non-relational databases such as key-value, graph and document stores."]],
 trap:"Aggregation and inference are database threats where each piece of data is harmless on its own; access control on single records does not stop them.",
 mnem:"Lock to stay consistent, blur to stay private.",
 ref:{s:"ch. 20",o:"Domain 8"}},

{id:"y8-malware",d:8,lvl:3,t:"Malware: propagation, technologies and defenses",
 what:"The Sybex guide details how viruses spread and hide, the main malware families and the defenses that work against them.",
 pts:["Virus propagation: master boot record (MBR) viruses, file infectors, macro viruses, service injection (injecting into trusted system processes).",
      "Virus technologies: multipartite (several propagation methods), stealth (hides from the OS), polymorphic (changes its code with each infection), encrypted (encrypts itself to evade signatures), hoaxes.",
      "Logic bombs wait for a condition; Trojans pretend to be useful (remote access Trojans give attackers control); worms spread on their own (Code Red, Stuxnet, which damaged industrial equipment).",
      "Spyware and adware monitor users or show ads; ransomware encrypts data for extortion, often stealing it first; malicious scripts automate attacks; zero-day attacks exploit unknown flaws.",
      "Defenses: anti-malware on all platforms, integrity monitoring (file hashes), advanced threat protection or EDR with behavioral detection, application allow listing, patching and backups.",
      "Ransomware recovery depends on offline or immutable backups and a tested plan, not on paying."],
 ex:"Stuxnet spread through USB drives and network shares, then reprogrammed specific industrial controllers. It showed that malware can cause physical damage, not just data loss.",
 terms:[["Multipartite virus","Uses several propagation techniques."],["Service injection","Hiding malicious code inside trusted system processes."],["Remote access Trojan","Trojan giving an attacker remote control."],["Integrity monitoring","Detecting changes to files by comparing hashes."]],
 trap:"Polymorphic viruses change their code to defeat signatures; behavioral detection is the better countermeasure.",
 mnem:"Viruses hitch rides, worms walk alone, Trojans wear masks, logic bombs wait.",
 ref:{s:"ch. 21",o:"Domain 8"}}
];

/* Recall cards: full questions */
const CARD_SRC = {
"d1-cia":[["What are the three properties of the CIA triad?","Confidentiality, Integrity, Availability."],["What does DAD stand for, and how does it relate to CIA?","Disclosure, Alteration, Destruction: the attacker's view, the opposite of CIA."],["What are the three A's of AAA?","Authentication, Authorization, Accounting (also called auditing)."],["What is non-repudiation?","The author of an action cannot deny having performed it, typically thanks to a digital signature."]],
"d1-ethique":[["List the four ISC2 canons in order.","1. Protect society, the common good, public trust and the infrastructure. 2. Act honorably, honestly, justly, responsibly and legally. 3. Provide diligent and competent service to principals. 4. Advance and protect the profession."],["Which parts of the ISC2 Code are mandatory, and which are advisory?","The canons are mandatory. The guidance is advisory."],["Laws from two countries conflict. Which one should you give priority to, according to the ISC2 Code?","The law of the jurisdiction where the service is provided."],["Who are your 'principals' in the ISC2 Code?","Your employers and clients."]],
"d1-codes":[["Who published RFC 1087, Ethics and the Internet, and when?","The Internet Activities Board (IAB), in 1989."],["Name three behaviors that RFC 1087 considers unethical.","Any three of: seeking unauthorized access, disrupting the intended use of the Internet, wasting resources, destroying the integrity of information, compromising users' privacy."],["Who published the Ten Commandments of Computer Ethics?","The Computer Ethics Institute."]],
"d1-droit":[["What is the burden of proof in a criminal case, and in a civil case?","Criminal: beyond a reasonable doubt. Civil: preponderance of the evidence (more likely than not)."],["What are statutory damages, and what makes them special?","Damages whose amount is fixed by law. They can be awarded even if the victim cannot prove any actual loss."],["What is tort law?","The law of civil wrongs: compensating someone harmed outside a contract, for example through negligence."],["Give two examples of administrative (regulatory) law.","Any two of: HIPAA, FCC regulations, FDA regulations, FAA regulations."],["Which legal system relies mainly on precedent, and which on written codes?","Common law relies on precedent. Civil law (the legal system) relies on written codes."]],
"d1-duecare":[["What is due care?","Doing what a reasonable person would do in the same situation (the prudent man rule): taking the right actions."],["What is due diligence, according to ISC2?","The effort to know: investigating, assessing risks and verifying that protections work."],["What is the opposite of due care?","Gross negligence."]],
"d1-preuves":[["What does the best evidence rule say?","Courts prefer original evidence over copies."],["What is chain of custody?","A record of everyone who handled the evidence, when, where and why, from collection to court."],["Is a honeypot entrapment or enticement? Why?","Enticement: it only tempts someone who already intends to attack."],["What type of evidence are computer logs usually considered?","Secondary evidence."],["How do you prove a forensic image was not altered?","Compare its hash before and after analysis; identical hashes prove integrity."]],
"d1-pi":[["What is the difference between the ™ and ® symbols?","™ marks an unregistered trademark, ® a registered one."],["What does copyright protect, and what does it not protect?","It protects the form of expression, not the underlying idea."],["How long does a patent usually last?","20 years from the filing date."],["How is a trade secret protected?","By keeping it secret: NDAs, non-compete agreements and due care. It is never published."]],
"d1-privacy":[["What replaced the EU Data Protection Directive, and when?","The GDPR, applicable since 2018."],["What is the current legal mechanism for EU to US personal data transfers?","The EU-US Data Privacy Framework (2023), after Safe Harbor and Privacy Shield were invalidated."],["Which agreement controls the export of cryptography today?","The Wassenaar Arrangement (successor of CoCom)."],["What is the Budapest Convention?","The Council of Europe Convention on Cybercrime, for international cooperation on cybercrime."]],
"d1-tiers":[["What is the primary security control when working with a service provider?","The contract."],["What does an SLA mainly address?","Availability."],["What is attestation?","An independent third party audits a provider against a baseline and states its opinion on its security."],["Which is often riskier, an acquisition or a divestiture? Why?","A divestiture: duplicate accounts, shared passwords, badges and keys may remain valid."]],
"d1-docs":[["Which security documents are mandatory, and which is discretionary?","Policies, procedures, standards (and baselines) are mandatory. Guidelines are discretionary."],["Does a security policy name specific technologies such as Windows or Linux? Why?","No. It stays high level, so it does not change when technology changes."],["Give an example of a standard.","'All laptops run Windows 11 Enterprise, 64-bit.'"],["What is a baseline?","A uniform minimum level of security, often based on a benchmark such as CIS. Exceptions need senior management sign-off."]],
"d1-personnel":[["What is the difference between awareness and training?","Awareness changes behavior. Training teaches a skill."],["What must happen first when an employee is terminated?","Revoke all access immediately."],["Why is offshoring data a legal concern?","Laws such as HIPAA, SOX or GLBA do not apply abroad, so protection must come from contracts and legal review."]],
"d1-controles":[["Name the six types of controls.","Preventive, detective, corrective, recovery, deterrent, compensating."],["Name the three categories of controls.","Administrative (directive), technical (logical), physical."],["What is a compensating control?","An additional control that makes up for a weakness or gap in another control."],["Why is antivirus both detective and corrective?","It detects malware by scanning, then corrects by quarantining or deleting it."]],
"d1-risque":[["What is the basic risk formula?","Risk = Threat × Vulnerability (sometimes × Impact)."],["An unpatched server: is it a threat or a vulnerability?","A vulnerability."],["What must happen for a risk rated Extreme in the risk matrix?","Immediate action, a detailed mitigation plan, and senior management notification."],["How does the exam treat risk to human life?","As near-infinite impact: it must always be mitigated."]],
"d1-ale":[["What is the formula for SLE?","SLE = AV × EF."],["What is the formula for ALE?","ALE = SLE × ARO."],["How do you calculate the yearly value of a safeguard?","ALE before − ALE after − annual TCO. Positive means worth it."],["What does TCO include?","Upfront costs plus ongoing costs: support, subscriptions, staff hours, over the life of the safeguard."]],
"d1-choix":[["What are the four legitimate responses to risk?","Accept, mitigate, transfer, avoid."],["Buying cyber insurance is which risk response?","Transfer."],["Which response to risk is never acceptable?","Ignoring (rejecting) a known risk."],["What is the difference between quantitative and qualitative risk analysis?","Quantitative uses hard numbers such as money (ALE). Qualitative uses approximate scales such as a risk matrix."]],
"d1-attaquants":[["What is a script kiddie?","An attacker using tools they do not understand."],["What is a bot herder?","The person controlling a botnet through a command and control network."],["What is the difference between spear phishing and whaling?","Spear phishing targets a specific person. Whaling is spear phishing aimed at executives."],["Who launches most attacks, and who can do the most damage?","Outsiders launch most attacks. Insiders can do the most damage."]],
"d2-classif":[["What do objects have, and what do subjects have?","Objects have labels. Subjects have clearances."],["What damage defines Top Secret, Secret and Confidential?","Top Secret: exceptionally grave damage. Secret: serious damage. Confidential: damage."],["How is need to know different from least privilege?","Need to know is decided object by object; least privilege groups objects together."],["What is formal access approval?","Documented approval from the data owner for a subject to access certain objects."]],
"d2-media":[["How long should sensitive data be retained?","No longer than its useful life or the legal requirement, whichever is longer."],["What should a sensitive media handling policy require?","Trusted, vetted handlers and written logs recording who is responsible for the media."]],
"d2-roles":[["Who sets the sensitivity label and backup frequency of a data set?","The data owner."],["Who performs the daily backups?","The custodian."],["Who funds and prioritizes the security program?","The business or mission owner (senior management)."],["An outsourced payroll company: data controller or data processor?","Data processor."]],
"d2-memoire":[["Which memory uses capacitors and must be refreshed: SRAM or DRAM?","DRAM."],["How is an EPROM erased?","With ultraviolet light."],["How does flash memory differ from EEPROM?","Flash is a type of EEPROM written in larger blocks rather than byte by byte."],["What is data remanence?","Data that persists after non-invasive attempts to delete it."]],
"d2-ssd":[["Does degaussing work on an SSD?","No, never."],["What are the two valid ways to destroy data on an SSD?","ATA Secure Erase (working drive) and physical destruction (damaged drive)."],["Does the TRIM command destroy data?","No, not reliably. It only helps garbage collection."]],
"d2-destruction":[["What does deleting a file actually do?","It removes the file's entry in the file allocation table. The data remains on disk."],["What is the most secure destruction method?","Physical destruction."],["What is object reuse?","Recovering information from previously used or discarded media."]],
"d2-certif":[["What is the difference between certification and accreditation?","Certification checks the system against requirements. Accreditation is the data owner accepting the residual risk before production."],["In Common Criteria, what is a Protection Profile?","An independent set of security requirements for a category of products."],["What does EAL7 mean?","Formally verified, designed and tested: the highest level."],["What is the Target of Evaluation?","The product or system being evaluated."]],
"d2-cadres":[["What is the difference between ISO 27001 and ISO 27002?","27001: ISMS requirements, certifiable. 27002: catalog of security controls."],["What is the difference between scoping and tailoring?","Scoping chooses which parts of a standard apply. Tailoring adapts the whole standard, including scoping and compensating controls."],["Who created COBIT?","ISACA."],["What does PCI DSS protect?","Payment card data."]],
"d2-donnees":[["What is the best protection for data in motion over the Internet?","Standards-based end-to-end encryption, such as an IPsec VPN."],["Where should backup media be stored?","Offsite, with a bonded and insured company, at a site not exposed to the same disaster."],["Why is whole-disk encryption preferred over partial encryption?","Partial encryption can leave sensitive data in temporary files, swap space or unallocated space."]],
"d3-modeles-conf":[["What are the two main rules of Bell-LaPadula?","Simple Security Property: no read up. * Security Property: no write down."],["Which security goal does Bell-LaPadula protect?","Confidentiality only."],["In an access control matrix, what is a row and what is a column?","A row is a capability list (one subject). A column is an ACL (one object)."],["What is the Strong Tranquility Property?","Security labels never change while the system is running."]],
"d3-modeles-integ":[["What are Biba's two rules?","Simple Integrity Axiom: no read down. * Integrity Axiom: no write up."],["What is the Clark-Wilson access control triple?","User, transformation procedure (TP), constrained data item (CDI)."],["What does the Chinese Wall (Brewer-Nash) model prevent?","Conflicts of interest between competing clients."]],
"d3-conception":[["Which component of the kernel mediates all access between subjects and objects?","The reference monitor."],["Which CPU rings do Windows and Linux actually use?","Ring 0 (kernel) and Ring 3 (user)."],["What is the difference between an open system and open source?","An open system uses standard components from many vendors. Open source means the source code is public."]],
"d3-cpu":[["What are the four steps of fetch and execute?","Fetch, decode, execute, write the result."],["What is the difference between SMP and AMP?","SMP: one operating system for all CPUs. AMP: one operating system image per CPU."],["What is a thread?","A lightweight process that shares memory with other threads of the same process."]],
"d3-memprot":[["What does a TPM chip provide?","Hardware cryptography: random numbers, secure key storage, boot integrity, support for full disk encryption."],["What is the difference between DEP and ASLR?","DEP blocks code execution in data areas. ASLR randomizes memory addresses."],["What is WORM storage used for?","Write once, read many: keeping records unaltered for legal or regulatory reasons."]],
"d3-virtu":[["What is the difference between a Type 1 and a Type 2 hypervisor?","Type 1 runs directly on the hardware (bare metal). Type 2 runs as an application on an operating system."],["Linux server hosting where you manage the OS is which cloud level?","IaaS."],["Which three rights should you negotiate with a cloud provider?","Right to audit, right to vulnerability assessment, right to penetration test."],["What is VM escape?","An attacker breaking out of a guest to reach the host or other guests."]],
"d3-malware":[["What distinguishes a virus from a worm?","A virus needs a host and a carrier to spread. A worm spreads by itself."],["What is a polymorphic virus?","A virus that changes its signature with each new infection."],["What is a maintenance hook?","A backdoor left by developers to bypass normal checks."],["What are the two types of covert channels?","Storage channels and timing channels."]],
"d3-web":[["Why do perimeter firewalls often fail against client-side attacks?","The traffic starts from the victim inside, and firewalls mostly restrict inbound traffic."],["How did Java applets and ActiveX controls differ in their security approach?","Java used a sandbox. ActiveX used digital certificates."],["What does OWASP publish that is best known?","The OWASP Top 10 web application security risks."]],
"d3-inference":[["What is the difference between inference and aggregation?","Inference is deduction from clues. Aggregation is collecting all the data and combining it."],["What is polyinstantiation in a database?","Two rows with the same primary key but different data, depending on clearance."],["Which Layer 2 control can check patches and antivirus before letting a device on the network?","802.1X authentication."]],
"d3-crypto-bases":[["What does substitution provide, and what does permutation provide?","Substitution provides confusion. Permutation (transposition) provides diffusion."],["Which security goal does cryptography NOT directly provide?","Availability."],["What is the result of XOR when the two bits are different?","1 (true). Identical bits give 0."],["Why are monoalphabetic ciphers weak?","They fall to frequency analysis."]],
"d3-symetrique":[["What are the block size, key size and number of rounds of DES?","64-bit block, 56-bit key, 16 rounds."],["What key sizes and rounds does AES use?","128-bit key with 10 rounds, 192 with 12, 256 with 14, all on 128-bit blocks."],["What is the main weakness of symmetric encryption?","The key must be shared securely before communicating."],["Which algorithm became AES?","Rijndael."]],
"d3-modes":[["Which block cipher mode has no IV and leaves patterns visible?","ECB."],["Which modes propagate errors?","CBC and CFB."],["Which mode can encrypt blocks in parallel?","CTR (Counter)."]],
"d3-asymetrique":[["What mathematical problem is RSA based on?","Factoring large composite numbers into primes."],["What does Diffie-Hellman do?","Lets two parties agree on a symmetric key over a public channel."],["Why is ECC popular on low-power devices?","It is stronger per bit, so it needs shorter keys and less computation."]],
"d3-hash":[["What is a hash collision?","Two different inputs producing the same hash value."],["What are the digest sizes of MD5 and SHA-1?","MD5: 128 bits. SHA-1: 160 bits."],["What is the main security goal of a hash?","Integrity."]],
"d3-attaques-crypto":[["What is a known plaintext attack?","The attacker has matching plaintext and ciphertext pairs and tries to derive the key."],["What is a side-channel attack?","An attack using physical information such as power consumption or timing."],["In a chosen plaintext attack, what is an encryption oracle?","A device that encrypts chosen data without revealing the key."]],
"d3-signature-pki":[["How is a digital signature created?","Hash the message, then encrypt the hash with the sender's private key."],["What three things does a verified digital signature prove?","Authentication of the sender, integrity of the message, and therefore nonrepudiation."],["What is the difference between key storage and key escrow?","Storage: the issuing organization keeps a copy. Escrow: a third party keeps a copy."],["What replaced CRLs with a scalable client-server query?","OCSP, the Online Certificate Status Protocol."]],
"d3-protocoles":[["Which IPsec protocol provides confidentiality?","ESP (Encapsulating Security Payload)."],["How many SAs do two hosts need for ESP plus AH?","Four: SAs are one-way, two per protocol."],["What does IPsec tunnel mode encrypt?","The entire original packet, including its headers."],["What trust model does PGP use?","A web of trust instead of a central CA."]],
"d3-perimetre":[["Name the four gate classes.","I residential, II commercial, III industrial, IV restricted access."],["What is one lux?","One lumen per square meter."],["What is the main weakness of key and combination locks?","Low accountability, because keys and combinations are shared."]],
"d3-acces-phys":[["How does a mantrap work?","Two doors: the first must close and lock before the second opens, each with its own authentication."],["Is a PIR motion sensor active or passive?","Passive: it detects body heat."],["What is a slab-to-slab wall?","A wall running from the floor slab to the ceiling slab, past raised floors and drop ceilings."]],
"d3-site":[["What is a demarc?","The point where the ISP's responsibility ends and the customer's begins."],["Why is a shared demarc risky?","Anyone with access can attack every circuit entering the building."],["What comes first in site selection, employee safety or asset protection?","Employee safety."]],
"d3-environnement":[["Define brownout, sag, surge and spike.","Brownout: prolonged low voltage. Sag: momentary low voltage. Surge: prolonged high voltage. Spike: momentary high voltage."],["Which security goal does crosstalk mainly affect?","Integrity."],["What happens if humidity is too low, and too high?","Too low: static electricity. Too high: corrosion."]],
"d3-incendie":[["What are the two evacuation roles?","Safety warden and meeting point leader."],["Which agent should be used on a US Class C electrical fire?","A nonconductive agent such as a Halon substitute or CO2, never water or soda acid."],["Why is CO2 used only in unstaffed areas?","It is odorless and colorless and can suffocate people."],["What makes a preaction sprinkler different?","It needs two triggers, a fire alarm and an opened sprinkler head, before water flows."]],
"d4-bases":[["What is the difference between half-duplex and full-duplex?","Half-duplex: both directions but one at a time. Full-duplex: both at the same time."],["What is an extranet?","A connection between private intranets, such as with business partners."],["Why use QoS on a packet-switched network?","To give time-sensitive traffic such as VoIP priority over other traffic."]],
"d4-osi":[["List the OSI layers from bottom to top.","Physical, Data link, Network, Transport, Session, Presentation, Application."],["What are the two sublayers of Layer 2?","MAC (media access control) and LLC (logical link control)."],["At which layer are character sets and image formats?","Layer 6, Presentation."],["At which layers are hubs, switches and routers?","Hub: Layer 1. Switch: Layer 2. Router: Layer 3."]],
"d4-tcpip":[["How do the four TCP/IP layers map to OSI?","Network access = 1 and 2. Internet = 3. Transport = 4. Application = 5 to 7."],["What are the address sizes of IPv4 and IPv6?","IPv4: 32 bits. IPv6: 128 bits."],["What range are reserved TCP ports?","0 to 1023."],["Does ICMP use ports?","No. It uses types and codes."]],
"d4-ports":[["Give the ports of FTP, SSH, Telnet and SMTP.","FTP 20 and 21, SSH 22, Telnet 23, SMTP 25."],["Which ports do POP3 and IMAP use?","POP3: TCP 110. IMAP: TCP 143."],["When does DNS use TCP?","For large responses, including zone transfers."],["Why does passive FTP pass firewalls better than active FTP?","All connections go from client to server; active FTP opens the data connection from the server."]],
"d4-wan":[["What is the speed and channel count of a T1 and an E1?","T1: 1.544 Mbps, 24 channels. E1: 2.048 Mbps, 30 channels."],["What is the difference between a PVC and an SVC?","A PVC is always connected. An SVC is set up for each call and torn down after."],["How does MPLS forward traffic?","Using labels, not IP headers."]],
"d4-convergence":[["What is DNP3 used for?","SCADA and smart grid communication, mainly in the energy sector."],["Which storage protocol uses Ethernet but not TCP/IP?","FCoE."],["What does SDN separate?","The control plane (decisions) from the data plane (forwarding)."],["What secures VoIP traffic?","SRTP: AES for confidentiality, SHA-1 for integrity."]],
"d4-wifi":[["Which algorithms does WPA2 use?","AES for confidentiality and CCMP for integrity."],["Which algorithms does WPA use?","RC4 for confidentiality and TKIP for integrity."],["What does Bluetooth discovery protection rely on?","The secrecy of the 48-bit Bluetooth MAC address."],["What are the three RFID tag types?","Active, semipassive, passive."]],
"d4-equipements":[["What is the difference between a bridge and a switch?","A bridge has two ports; a switch is a bridge with many ports."],["What does a switch do to the collision domain?","It shrinks it to a single port."],["Can a VLAN span several switches?","Yes, and one switch can hold several VLANs."]],
"d4-firewalls":[["What is the main weakness of a packet filter?","It has no state: each packet is judged alone."],["Which firewall type is the most secure?","The application-layer proxy firewall."],["At which OSI layer does a circuit-level proxy work?","Layer 5."]],
"d4-eap":[["What is an 802.1X client called?","The supplicant."],["Which EAP type requires client-side certificates?","EAP-TLS."],["Which EAP type should never be used?","LEAP."]],
"d4-vpn":[["What are the IP protocol numbers of ESP and AH?","ESP: 50. AH: 51."],["At which layer does PPP operate?","Layer 2."],["Why are TLS VPNs often easier than IPsec?","They need no changes to the operating system and pass firewalls more easily."]],
"d4-distance":[["Which ports do VNC and RDP typically use?","VNC: TCP 5900. RDP: TCP 3389."],["What is the difference between ADSL and SDSL?","ADSL: faster download than upload. SDSL: same speed both ways."],["What three controls protect a mobile device's data?","Encryption (or minimal data), PIN lock, remote wipe."]],
"d5-facteurs":[["Name the three main authentication types.","Type 1 something you know, Type 2 something you have, Type 3 something you are."],["What is a credential set?","The combination of identification and authentication."],["Is a password plus a PIN multifactor?","No. Both are Type 1, something you know."]],
"d5-mdp-attaques":[["What is the difference between password guessing and password cracking?","Guessing is online against a live system. Cracking is offline against stolen hashes."],["What makes rainbow tables ineffective?","Salts."],["What is a hybrid attack?","A dictionary attack that modifies words, for example adding digits or swapping letters."]],
"d5-tokens":[["What are the two kinds of synchronous tokens?","Time-based and counter-based."],["What is the most common asynchronous token?","The challenge-response token."],["How can the server predict a time-based token code?","It knows the token's serial number, its owner and the current time."]],
"d5-biometrie":[["What is a Type I error in biometrics?","A false rejection (FRR): an authorized user is refused."],["What is a Type II error?","A false acceptance (FAR): an impostor is accepted."],["What does the CER show?","Overall accuracy: the point where FAR equals FRR. Lower is better."],["What happens to FAR and FRR when sensitivity increases?","FRR rises and FAR falls."]],
"d5-bio-types":[["Why are retina scans rarely used?","They are intrusive, may reveal health information and risk exchange of bodily fluids."],["Which biometric is passive, accurate and works with glasses?","Iris scan."],["How do you protect a voiceprint system against replay?","Ask the user to say random words."]],
"d5-centralise":[["What is SSO's main weakness?","One compromised credential gives access to many systems."],["What is authorization creep?","Users gain new rights with new roles without losing the old ones."],["What is the main risk of decentralized access control?","Inconsistent policies and security levels between sites."]],
"d5-federation":[["What does SAML stand for, and what is it?","Security Assertion Markup Language: an XML framework for exchanging authentication data."],["What port does LDAP use?","389, over TCP or UDP."],["What is IDaaS?","Identity as a service, or cloud identity."]],
"d5-kerberos":[["Does Kerberos use symmetric or asymmetric encryption?","Symmetric."],["What does the KDC send in step 2?","A session key encrypted with the user's key, and a TGT encrypted with the TGS key."],["What does SESAME add to Kerberos?","Public key cryptography, and PACs instead of tickets."],["Name two Kerberos weaknesses.","The KDC is a single point of failure; keys are stored in plaintext on the KDC; clocks must be synchronized."]],
"d5-aaa-protocoles":[["Which ports does RADIUS use?","UDP 1812 (authentication) and 1813 (accounting)."],["Which transport and port does TACACS+ use?","TCP 49."],["How does CHAP protect against replay attacks?","It uses a challenge and a shared secret that is never sent over the network."]],
"d5-modeles":[["Who controls access in DAC?","The owner of the object."],["What does MAC base its decisions on?","Subject clearances and object labels, enforced by the system."],["Why is RBAC called nondiscretionary?","Users cannot decide who else gets access or transfer objects."],["What is context-dependent access control?","Access depends on context such as time of day or location."]],
"d6-pentest":[["What is a zero-knowledge penetration test?","A black-box test where the tester starts with public information only."],["List the penetration testing methodology steps.","Planning, reconnaissance, scanning, vulnerability assessment, exploitation, reporting."],["What two things do black hats do that pen testers don't?","Cover their tracks and install backdoors (and they skip reporting)."]],
"d6-pentest-regles":[["How can a tester prove access to card data without viewing it?","Retrieve a harmless flag file placed next to the data with the same permissions."],["What should a tester do on finding an active compromise?","End the test and escalate immediately to the client."],["Why must the final pen test report be highly protected?","It is a roadmap to attack the organization."]],
"d6-evaluations":[["What is a security audit?","A test against a published standard, such as PCI DSS."],["What is the difference between a security assessment and a pen test?","An assessment is broad and can include pen tests, scans, audits and policy reviews."],["Is log review preventive or detective?","Primarily detective."]],
"d6-code":[["What is static testing?","Testing code without executing it: walkthroughs, syntax checks, code reviews."],["What does a requirements traceability matrix do?","Maps customer requirements to test cases."],["What are synthetic transactions used for?","Simulating user activity to set performance norms, monitor and test updates."]],
"d6-niveaux":[["What is regression testing?","Testing after updates or patches to make sure nothing broke."],["What does it suggest when fuzzing crashes a program?","A bounds-checking problem, possibly a buffer overflow."],["What is combinatorial software testing?","Black-box testing of all unique combinations of inputs, such as pairwise testing."]],
"d7-admin":[["What is collusion?","Two or more people conspiring to defeat separation of duties."],["What two security benefits do job rotation and mandatory leave share?","They reduce personnel single points of failure and help detect fraud."],["How is need to know enforced?","Through compartmentalization."],["Which type of control is an NDA?","Largely a directive control."]],
"d7-forensique":[["What is slack space?","The unused space at the end of a cluster, which may contain old or hidden data."],["What does live forensics capture?","Volatile data: memory image, running processes, network connections."],["What is ESI?","Electronically stored information, sought in eDiscovery."]],
"d7-incident":[["List the eight incident response steps.","Preparation, detection, response, mitigation, reporting, recovery, remediation, lessons learned."],["When does reporting start?","Immediately at detection, and continues throughout."],["Who usually decides when a system returns to production?","The business unit that owns the system."],["Why is root-cause analysis essential?","Otherwise you may restore the same weakness or a compromised backup."]],
"d7-ids":[["What is a false negative?","A real attack that raises no alert: the worst case."],["What is the difference between active response and inline NIPS?","Active response sends resets or unreachables to kill traffic; inline sits in the path and blocks it."],["Why do NIPS use fewer rules than NIDS?","Because a false positive blocks legitimate traffic."]],
"d7-siem-endpoint":[["What is the primary value of a SIEM?","Correlating security data from many sources."],["Why is network DLP limited?","It cannot see inside encrypted traffic."],["What is the weakness of application whitelisting?","An attacker can exploit a trusted, whitelisted program."]],
"d7-config":[["What is the difference between a zero-day vulnerability and a zero-day exploit?","The vulnerability is a flaw with no patch yet. The exploit is working code attacking it."],["Why must changes be auditable?","To investigate outages and let auditors verify the process was followed."],["What is baselining?","Capturing a snapshot of the current security configuration."]],
"d7-raid":[["Which RAID level provides no redundancy?","RAID 0."],["What is RAID 5?","Block-level striping with distributed parity; survives one disk failure."],["What is the difference between active-active and active-passive clusters?","Active-active: all nodes process work. Active-passive: a standby takes over on failure."]],
"d7-bcp":[["Is the DRP strategic or tactical?","Tactical. The BCP is strategic."],["What is the most common source of disruptive events?","Human errors and omissions."],["List the disaster recovery process steps.","Respond, activate team, communicate, assess, reconstitute."]],
"d7-bia":[["What is the primary goal of the BIA?","To determine the MTD for each critical asset."],["What is the formula for MTD?","MTD = RTO + WRT."],["What does the RPO measure?","The maximum acceptable data loss, in time."],["What is MTTR?","Mean time to repair: how long it takes to recover a failed system."]],
"d7-sites":[["What does a warm site lack compared with a hot site?","Current data: it must be restored from backup."],["Which recovery site is cheapest and slowest?","The cold site."],["When is a mobile site a good fit?","When the data center is damaged but the rest of the facility is intact."]],
"d7-plans":[["Which plan restores normal business operations after a disaster?","The business recovery (resumption) plan, BRP."],["What does the OEP focus on?","Safety of people in a facility: evacuation, drills, wardens."],["How long does a COOP sustain essential functions at an alternate site?","Up to 30 days."],["What makes a call tree effective?","Two-way confirmation and alternate contact methods."]],

{f:"d8-devops",type:"explain",title:"Explain it out loud",prompt:"How does DevOps change the traditional separation of duties between developers and production, and what should security do about it?",model:"Traditionally developers were walled off from production and handed code to QA, then to operations. DevOps makes one team responsible from design to production support, which speeds delivery but blurs separation of duties. Security compensates with automated testing in the pipeline, strict change tracking and access controls on production."},

/* ================= SETTINGS ================= */
const TRAINING = "2026-11-22";          // Blueguard training, Lausanne
const SESSION_MIN = 15;
const INTERVALS = {1:1,2:3,3:7,4:14,5:30};

/* Build stable ids */
const CARDS = [];
Object.keys(CARD_SRC).forEach(f=>CARD_SRC[f].forEach((c,i)=>CARDS.push({id:f+"-c"+i,f,q:c[0],a:c[1]})));
const QCM = [];
{const n={};QCM_SRC.forEach(q=>{n[q[0]]=(n[q[0]]||0)+1;QCM.push({id:q[0]+"-q"+n[q[0]],f:q[0],q:q[1],o:q[2],a:q[3],x:q[4],h:!!q[5]})})}
const DRILLS = [];
{const n={};DRILL_SRC.forEach(d=>{n[d.f]=(n[d.f]||0)+1;DRILLS.push({...d,id:d.f+"-d"+n[d.f]})})}

/* ================= STATE ================= */
const KEY="cissprep.v2";
function blank(){return {cards:{},qcm:{},drills:{},read:{},streak:{last:null,count:0},log:[]}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
["cards","qcm","drills","read","log"].forEach(k=>{if(!S[k])S[k]=k==="log"?[]:{}});
if(!S.streak)S.streak={last:null,count:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const pad=n=>String(n).padStart(2,"0");
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function daysUntil(iso){return Math.round((new Date(iso+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lesson=id=>LESSONS.find(l=>l.id===id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Math.round(n).toLocaleString("en-US");

function dueCards(){const t=today();return CARDS.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t).sort((a,b)=>S.cards[a.id].due.localeCompare(S.cards[b.id].due))}
function nextLesson(){return LESSONS.find(l=>!S.read[l.id])||null}
function weakness(fid){
  let w=0;
  CARDS.filter(c=>c.f===fid).forEach(c=>{const s=S.cards[c.id];if(s&&s.miss&&s.box<=2)w+=s.miss});
  QCM.filter(q=>q.f===fid).forEach(q=>{const s=S.qcm[q.id];if(s&&s.last===false)w+=2});
  DRILLS.filter(d=>d.f===fid).forEach(d=>{const s=S.drills[d.id];if(s&&s.last===false)w+=2});
  return w;
}
function mastery(d){
  const cs=CARDS.filter(c=>lesson(c.f).d===d);if(!cs.length)return null;
  return Math.round(cs.reduce((t,c)=>t+((S.cards[c.id]||{box:0}).box/5),0)/cs.length*100);
}
function grade(card,g){
  const s=S.cards[card.id]||{box:0,miss:0,due:today()};
  if(g===0){s.box=1;s.miss=(s.miss||0)+1;s.due=addDays(today(),1)}
  else if(g===1){s.box=Math.max(1,s.box);s.due=addDays(today(),1)}
  else{s.box=Math.min(5,Math.max(1,s.box+1));s.due=addDays(today(),INTERVALS[s.box])}
  S.cards[card.id]=s;save();
}
function recordDrill(d,ok){const s=S.drills[d.id]||{ok:0,miss:0};ok?s.ok++:s.miss++;s.last=ok;S.drills[d.id]=s;save()}
function bumpStreak(){const t=today(),st=S.streak;if(st.last===t)return;st.count=(st.last===addDays(t,-1))?st.count+1:1;st.last=t;save()}

/* ================= LISTEN (text to speech) ================= */
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.9;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>v.lang==="en-US")||vs.find(v=>v.lang&&v.lang.startsWith("en"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function stopSpeak(){if("speechSynthesis" in window)speechSynthesis.cancel()}
if("speechSynthesis" in window)speechSynthesis.getVoices();
function lessonText(l){return [l.t+".",l.what,...l.pts,"Example. "+l.ex,"Exam trap. "+l.trap,"Memory hook. "+l.mnem].join(" ").replace(/×/g," times ").replace(/−/g," minus ")}

/* ================= CALC DRILL GENERATOR ================= */
function makeCalc(){
  const av=[20,40,50,80,100,150,200][Math.floor(Math.random()*7)]*1000;
  const ef=[10,20,25,40,50,75,100][Math.floor(Math.random()*7)];
  const aro=[0.5,1,2,3,4,6][Math.floor(Math.random()*6)];
  const sle=av*ef/100,ale=sle*aro;
  const wrong=[sle,av*aro,ale*2,ale/2,av*ef/100/aro].filter(x=>x!==ale&&x>0);
  const opts=shuffle([ale,...shuffle([...new Set(wrong)]).slice(0,3)]);
  return {q:`An asset is worth ${fmt(av)}. One incident destroys ${ef} % of its value, and incidents happen ${aro===0.5?"once every two years":aro+" time"+(aro>1?"s":"")+" per year"}. What is the ALE?`,
    o:opts.map(fmt),a:opts.indexOf(ale),x:`SLE = ${fmt(av)} × ${ef} % = ${fmt(sle)}. ARO = ${aro}. ALE = ${fmt(sle)} × ${aro} = ${fmt(ale)}.`};
}
