function renderLessons(){
  if(openLesson){
    const l=lesson(openLesson);
    app.innerHTML=`<button class="link" id="back">All lessons</button><div class="block">${lessonHTML(l)}</div>
    <button class="btn solid full" id="study">Start a session on this lesson</button>`;
    bindListen(l);
    document.getElementById("back").onclick=()=>{stopSpeak();openLesson=null;render()};
    document.getElementById("study").onclick=()=>startSession(l.id,false);
    return;
  }
  const avail=[...new Set(LESSONS.map(l=>l.d))];
  app.innerHTML=`<h1>Lessons</h1>
  <div class="tabsdom">${avail.map(d=>`<button data-d="${d}" class="${d===filter?"on":""}">Domain ${d}</button>`).join("")}</div>
  <p class="muted small">${esc(DOMAINS[filter-1].name)}, ${DOMAINS[filter-1].w} % of the exam.</p>
  <div class="list">${LESSONS.filter(l=>l.d===filter).map(l=>`<button class="item" data-f="${l.id}"><span>${esc(l.t)}</span><span class="chk">${S.read[l.id]?"Learned":""}</span></button>`).join("")}</div>`;
  document.querySelectorAll(".tabsdom button").forEach(b=>b.onclick=()=>{filter=+b.dataset.d;render()});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{openLesson=b.dataset.f;render();window.scrollTo(0,0)});
}

/* ---------- Weak spots ---------- */
function renderWeak(){
  const list=LESSONS.map(l=>({l,w:weakness(l.id)})).filter(x=>x.w>0).sort((a,b)=>b.w-a.w);
  app.innerHTML=`<h1>My weak spots</h1>
  <p class="muted">Filled automatically from missed cards, exercises and exam questions. This is your list for the deep-dive stage.</p>
  ${list.length?`<button class="go" id="gow">Weak spots session<span>Only what you missed, no new lesson</span></button>
  <div class="block list">${list.map(x=>`<button class="item" data-l="${x.l.id}"><span>${esc(x.l.t)}</span><span class="small muted">D${x.l.d}</span></button>`).join("")}</div>`
  :`<div class="card">Nothing yet. Do a session: every mistake will land here.</div>`}`;
  const g=document.getElementById("gow");if(g)g.onclick=()=>startSession(null,true);
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{tab="lessons";openLesson=b.dataset.l;render();window.scrollTo(0,0)});
}

/* ---------- Settings ---------- */
function renderSettings(){
  let th="auto";try{th=localStorage.getItem("cissprep.theme")||"auto"}catch(e){}
  app.innerHTML=`<h1>Settings</h1>
  <h2 class="block">Theme</h2>
  <div class="tabsdom">${["auto","light","dark"].map(t=>`<button data-t="${t}" class="${th===t?"on":""}">${{auto:"Auto",light:"Light",dark:"Dark"}[t]}</button>`).join("")}</div>
  <h2 class="block">Backup</h2>
  <p class="muted small">Your progress is stored in this browser only. To move between phone and computer, copy this text and paste it on the other device.</p>
  <textarea id="exp" readonly>${esc(JSON.stringify(S))}</textarea>
  <button class="btn full" id="copy" style="margin-top:8px">Copy</button>
  <textarea id="imp" placeholder="Paste a backup here" style="margin-top:14px"></textarea>
  <button class="btn full" id="doimp" style="margin-top:8px">Restore this backup</button>
  <h2 class="block">Start over</h2>
  <button class="btn full danger" id="reset">Erase all my progress</button>
  <p class="muted small block">Content: ${LESSONS.length} lessons, ${CARDS.length} cards, ${DRILLS.length} exercises, ${QCM.length} exam questions. Domains 1 and 2.</p>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{try{localStorage.setItem("cissprep.theme",b.dataset.t)}catch(e){}applyTheme();render()});
  document.getElementById("copy").onclick=()=>{const t=document.getElementById("exp");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}};
  document.getElementById("doimp").onclick=()=>{try{const d=JSON.parse(document.getElementById("imp").value);if(!d.cards)throw 0;S={...blank(),...d};save();setTab("home")}catch(e){alert("This backup cannot be read. Make sure you copied all of the text.")}};
  document.getElementById("reset").onclick=()=>{if(confirm("Erase all progress?")){S=blank();save();setTab("home")}};
}
function applyTheme(){let t="auto";try{t=localStorage.getItem("cissprep.theme")||"auto"}catch(e){}
  if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
applyTheme();
setInterval(()=>{if(ses&&ses.step<4){const c=document.getElementById("clk");if(c)c.textContent=Math.floor((Date.now()-ses.start)/60000)+" / "+SESSION_MIN+" min"}},20000);
render();

</script>
</body>
</html>
