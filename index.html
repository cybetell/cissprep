      "4. Mitigation (eradication): find the cause, clean or rebuild the system from a known good state. Removing the obvious malware is often not enough.",
      "5. Reporting: starts at detection and runs throughout, technical and nontechnical. Management and business owners must be told about serious incidents immediately.",
      "6. Recovery: carefully return systems to production, usually when the business owner decides, preferably off-peak, with close monitoring.",
      "7. Remediation: fix the vulnerability locally, then more broadly (for example MFA everywhere after a stolen password). 8. Lessons learned: final report to management, feeding back into preparation.",
      "Root-cause analysis finds the underlying weakness. Without it, you may restore the same flaw, or restore from an already compromised backup."],
 ex:"A ransomware alert fires (detection). The team isolates the infected VLAN (response), finds that a stolen VPN password was the entry point (mitigation, root cause), informs management at once (reporting), restores clean servers (recovery), enforces MFA on the VPN (remediation) and writes up what to improve (lessons learned).",
 terms:[["Containment","Limiting the scope and severity of an incident."],["Eradication","Removing the cause and cleaning systems."],["Root-cause analysis","Finding the underlying weakness that allowed the incident."],["Lessons learned","The post-incident review that improves future preparation."]],
 trap:"Reporting is not only at the end: it starts at detection. And the business owner, not IT, decides when a system goes back online.",
 mnem:"Prepare, Detect, Respond, Mitigate, Report, Recover, Remediate, Learn: 'People Don't Really Mind Reporting Right, Really Learning'.",
 upd:"NIST SP 800-61 Revision 3 (April 2025) now aligns incident response with the NIST Cybersecurity Framework 2.0 functions (Govern, Identify, Protect, Detect, Respond, Recover). The exam steps above remain the reference for the CISSP.",
 ref:{c:"ch. 7, Incident Response Management",a:"ch. 22",o:"Domain 7"}},

{id:"d7-ids",d:7,t:"IDS and IPS",
 what:"Intrusion detection systems watch for malicious activity and raise alerts; intrusion prevention systems also block it. The exam tests their types and, above all, the four outcomes of an alert.",
 pts:["An IDS detects malicious actions, including policy violations. An IPS also prevents them. Both come in network-based and host-based versions.",
      "True positive: a real attack, and an alert. True negative: normal traffic, no alert.",
      "False positive: normal traffic, but an alert. It wastes analysts' time.",
      "False negative: a real attack, and no alert. The worst case: the attack is neither prevented nor detected.",
      "A NIDS listens passively in promiscuous mode, usually on a read-only interface, and reports to a management server.",
      "A NIPS changes traffic. Active response NIPS sends TCP resets or ICMP unreachable messages; inline NIPS sits in the traffic path like a Layer 3 to 7 firewall. It complements a firewall, it does not replace it.",
      "A NIPS false positive blocks legitimate traffic, so NIPS use fewer, more trusted rules than NIDS. HIDS and HIPS work on the host, focusing on files and processes."],
 ex:"An inline IPS wrongly flags the payroll application's traffic as an attack and blocks it on pay day. A false positive on an IPS directly hurts availability, which is why IPS rules are kept conservative.",
 terms:[["False positive","An alert on benign activity."],["False negative","No alert on a real attack."],["Promiscuous mode","A network card capturing all traffic, not only its own."],["Inline IPS","An IPS placed directly in the traffic path."]],
 trap:"The false negative is the worst outcome, because the attack goes completely unnoticed.",
 mnem:"True/False = was the IDS right? Positive/Negative = did it alert?",
 ref:{c:"ch. 7, Intrusion Detection Systems and Intrusion Prevention Systems",a:"ch. 21",o:"Domain 7"}},

{id:"d7-siem-endpoint",d:7,t:"SIEM, DLP and endpoint security",
 what:"Detection needs context from many sources, and protection has to reach the endpoints themselves, where attacks land and where encryption ends.",
 pts:["A SIEM (security information and event management) correlates security data from many sources to understand context and risk. Built-in rules are usually extended with custom correlation rules.",
      "Data loss prevention (DLP) tries to detect or, better, prevent data leaving the organization without authorization. Network DLP struggles with encrypted traffic, so endpoint DLP is needed to see data before encryption.",
      "Endpoint security suites protect the device itself, even when traffic is encrypted end to end. The challenge is volume: many devices and a lot of data.",
      "Antivirus is the most deployed endpoint product and is still mainly signature-based.",
      "Application whitelisting allows only known-good binaries to run. Its weakness: an attacker abusing a trusted, whitelisted program.",
      "Removable media controls block infected USB drives and stop large volumes of data walking out in a pocket.",
      "Full disk encryption encrypts the whole disk, which is better than encrypting folders or files that may leave sensitive traces elsewhere."],
 ex:"The SIEM links three events that look harmless alone: an impossible-travel login, a new mailbox forwarding rule, and mass file downloads. Together they reveal a compromised account.",
 terms:[["SIEM","Security information and event management: correlates events."],["DLP","Data loss prevention."],["Application whitelisting","Only approved programs may run."],["Full disk encryption","Encrypting the entire disk, also called whole disk encryption."]],
 trap:"Correlation is the primary value of a SIEM. And network DLP cannot see inside encrypted traffic; endpoint DLP can.",
 mnem:"SIEM connects the dots, DLP guards the exits, whitelisting guards the door.",
 upd:"Endpoint detection and response (EDR) and extended detection and response (XDR) now go well beyond antivirus, recording behavior and allowing remote isolation. Application allow listing is the current name for whitelisting.",
 ref:{c:"ch. 7, Operational Preventive and Detective Controls",a:"ch. 21",o:"Domain 7"}},

{id:"d7-config",d:7,t:"Configuration, vulnerability and change management",
 what:"Systems stay secure only if their configuration is controlled, their weaknesses are tracked and their changes are orderly. These are daily operational disciplines.",
 pts:["Configuration management: disable unnecessary services, remove extra programs, enable firewalls, antivirus and IDS, configure security and audit logs.",
      "Baselining captures a snapshot of the current security configuration, which helps when responding to an incident.",
      "Vulnerability management goes beyond scanning: prioritize fixes by risk to the organization and ease of remediation.",
      "A zero-day vulnerability is known before a patch exists. A zero-day exploit is working attack code for a vulnerability not yet patched.",
      "Change management aims to understand, communicate and document every change, to avoid negative impact.",
      "Typical flow: identify, propose, assess risk, test, schedule, notify, implement, report results.",
      "Every change must be tracked and auditable, so staff can investigate outages and auditors can verify the process was followed."],
 ex:"A Friday evening firewall rule change breaks the ERP connection. Because it was logged in the change record, the on-call engineer finds and reverses it in ten minutes.",
 terms:[["Baseline","A snapshot of a system's approved security configuration."],["Zero-day vulnerability","A flaw known before a patch exists."],["Change management","The process to understand, communicate and document changes."],["Vulnerability management","Scanning plus prioritizing and tracking remediation."]],
 trap:"Testing comes before implementation, and every change needs a record. 'Implement quickly and document later' is never the right answer.",
 mnem:"Change flow: Identify, Propose, Assess, Test, Schedule, Notify, Implement, Report.",
 ref:{c:"ch. 7, Asset Management",a:"ch. 20",o:"Domain 7"}},

{id:"d7-raid",d:7,t:"Continuity of operations: SLAs, RAID and clusters",
 what:"Continuity of operations is about availability. It starts with agreed service levels and fault tolerance, so a single failed disk or server does not stop the business.",
 pts:["A service level agreement (SLA) sets expectations for a service: bandwidth, delivery time, response times.",
      "RAID terms: mirroring writes the same data to several disks; striping spreads data across disks for speed but adds no redundancy; parity rebuilds data with less disk cost than mirroring.",
      "RAID 0: striping only, no redundancy. RAID 1: mirroring. RAID 2: Hamming code, legacy.",
      "RAID 3: byte-level striping with dedicated parity. RAID 4: block-level striping with dedicated parity.",
      "RAID 5: block-level striping with distributed parity, survives one disk failure. RAID 6: double distributed parity, survives two. RAID 10 (1+0): a striped set of mirrors.",
      "Redundant hardware (such as dual power supplies) and redundant systems protect against component and system failure.",
      "High-availability (failover) clusters: active-active means all nodes process work (load balancing); active-passive means a standby takes over on failure. Active-active costs more."],
 ex:"A file server with six disks in RAID 6 loses two disks in the same week and keeps running. With RAID 5 the second failure would have lost the array.",
 terms:[["Striping","Spreading data across disks for performance."],["Mirroring","Writing identical data to several disks."],["Parity","Recovery information that can rebuild a lost disk."],["Active-passive cluster","A standby node takes over when the primary fails."]],
 trap:"RAID 0 provides no reliability at all. It is for performance only.",
 mnem:"RAID 0 = zero protection. RAID 1 = one copy more. RAID 5 = lose one. RAID 6 = lose two.",
 ref:{c:"ch. 7, Continuity of Operations",a:"ch. 23",o:"Domain 7"}},

{id:"d7-bcp",d:7,t:"BCP and DRP: purpose and the recovery process",
 what:"Business continuity and disaster recovery are often mixed up, but they are distinct. The exam expects you to know which is strategic and which is tactical, and the steps of a recovery.",
 pts:["The BCP keeps the business running before, during and after a disaster. It is strategic, long-term and focused on the whole business.",
      "The DRP is a short-term, tactical plan to recover IT systems after a disruption. It is a subset of the BCP, which acts as an umbrella over several plans.",
      "Disaster causes: natural (earthquakes, floods), human (the most common source; intentional or not) and environmental (power problems, equipment failure, software flaws).",
      "Errors and omissions are the most common disruptive events. Others: power problems, temperature and humidity failures, war and terrorism, financially motivated attackers, personnel shortages (strikes, pandemics).",
      "Recovery process: respond (quick initial assessment), activate the team, communicate (often out of band, internally and to the public), assess in detail, reconstitute.",
      "Reconstitution recovers critical operations at the primary or an alternate site; a salvage team works on restoring the primary site."],
 ex:"A flood hits the main data center. The DRP brings the ERP back up at the secondary site within hours. The BCP also covers how the sales team keeps taking orders by phone and how customers are told what is happening.",
 terms:[["BCP","Business continuity plan: keeps the business running; strategic."],["DRP","Disaster recovery plan: recovers IT systems; tactical."],["Out of band","Using a communication channel other than the usual one."],["Salvage team","Team that restores the damaged primary site."]],
 trap:"The DRP is part of the BCP, not the reverse. And human error, not natural disaster, is the most common source of disruptive events.",
 mnem:"BCP = the Business keeps going. DRP = the Data center comes back.",
 ref:{c:"ch. 7, BCP and DRP Overview and Process",a:"ch. 23",o:"Domain 7"}},

{id:"d7-bia",d:7,t:"The BIA and recovery metrics: MTD, RTO, RPO, WRT",
 what:"The business impact analysis tells you how long each system can be down and how much data you can afford to lose. Those numbers drive every recovery decision and budget.",
 pts:["NIST SP 800-34 steps: project initiation, scope, BIA, identify preventive controls, recovery strategy, plan design and development, implementation with training and testing, maintenance.",
      "The BIA identifies and prioritizes critical IT systems, links them to the business services they support and quantifies the impact of losing them. Its primary goal is the MTD.",
      "Maximum tolerable downtime (MTD): total time a system can be down before severe impact. Also called maximum allowable downtime or maximum tolerable outage.",
      "MTD = RTO + WRT. The recovery time objective (RTO) is the time to get the system running; the work recovery time (WRT) is the time to configure it and make it usable.",
      "Recovery point objective (RPO): the maximum acceptable data loss, measured in time. Weekly backups mean an RPO of one week.",
      "Mean time between failures (MTBF): how long a system runs before failing. Mean time to repair (MTTR): how long it takes to fix a failed system. Minimum operating requirements (MOR): power and connectivity needed to run the equipment."],
 ex:"The ERP can be down for 24 hours at most (MTD). Restoring the servers takes 16 hours (RTO) and reconfiguring interfaces takes 6 (WRT): 22 hours, inside the MTD. Backups run every 4 hours, so up to 4 hours of transactions could be lost (RPO).",
 terms:[["MTD","Maximum tolerable downtime."],["RTO","Recovery time objective: time to restore the system."],["WRT","Work recovery time: time to configure the restored system."],["RPO","Recovery point objective: maximum acceptable data loss in time."]],
 trap:"RPO is about data (how far back), RTO is about time (how fast). MTD = RTO + WRT, never RPO.",
 mnem:"RPO looks back (Point in the Past), RTO looks forward (Time to come back).",
 ref:{c:"ch. 7, Developing a BCP/DRP",a:"ch. 23",o:"Domain 7"}},

{id:"d7-sites",d:7,t:"Recovery sites",
 what:"Once the MTD is known, you pick where to recover. The shorter the MTD, the more ready, and the more expensive, the site must be.",
 pts:["Redundant site: an exact duplicate with real-time data; users notice nothing. The most expensive option.",
      "Hot site: fully equipped and configured, with data mirrored in real time; operations resume within hours or even minutes.",
      "Warm site: hardware and connectivity ready, but data must be restored from backups.",
      "Cold site: raised floor, power, utilities and physical security, but no hardware and no data. The cheapest; recovery takes weeks, so the MTD must be long.",
      "Reciprocal agreement (mutual aid): two organizations agree to host each other after a disaster.",
      "Mobile site: a data center in a trailer, towed in when the building is fine but the data center is not (a flood in the server room, for example)."],
 ex:"A company whose MTD for email is 12 hours cannot rely on a cold site: shipping hardware alone could take weeks. It needs at least a hot site or a cloud recovery service.",
 terms:[["Hot site","Fully equipped site with current data, ready very quickly."],["Warm site","Equipped site that needs data restored from backup."],["Cold site","Empty site with power and space only."],["Reciprocal agreement","Two organizations agree to host each other in a disaster."]],
 trap:"Hot versus redundant: a hot site recovers quickly, but a redundant site is so seamless that users never see a difference.",
 mnem:"Redundant = twin, hot = ready, warm = needs data, cold = empty room.",
 upd:"Cloud-based disaster recovery (DRaaS) now often replaces physical warm and hot sites, replicating virtual machines to a provider and starting them on demand.",
 ref:{c:"ch. 7, Recovery Strategy",a:"ch. 23",o:"Domain 7"}},

{id:"d7-plans",d:7,t:"The family of plans under the BCP",
 what:"The BCP is an umbrella over several specialized plans. The exam gives a situation and asks which plan applies, so learn each plan's focus.",
 pts:["Continuity of operations plan (COOP): sustains essential functions at an alternate site for up to 30 days.",
      "Business recovery (resumption) plan (BRP): restores normal business operations after recovery, for example moving back from the alternate site. It starts when the COOP ends.",
      "Continuity of support plan (IT contingency plan): recovers a specific IT system or application.",
      "Cyber incident response plan: handles malicious cyber events such as worms and network attacks.",
      "Occupant emergency plan (OEP): protects the life and safety of people in a facility (fire, medical emergency, attack); covers drills, safety wardens and meeting points.",
      "Crisis management plan (CMP): coordinates managers in an emergency. Its key part is the crisis communications plan, for staff and the public.",
      "Call trees spread news quickly, each person calling a few others, with two-way confirmation and alternate contact methods. The emergency operations center (EOC) is the command post during the event."],
 ex:"A fire alarm sounds in the office: the OEP applies, getting people out safely. Two weeks later, moving staff back from the backup office to the repaired building is the BRP.",
 terms:[["COOP","Continuity of operations plan: sustains essential functions at an alternate site."],["BRP","Business recovery or resumption plan: returns to normal operations."],["OEP","Occupant emergency plan: safety of people in a facility."],["Call tree","A cascade of phone calls to notify staff quickly."]],
 trap:"BRP = back to normal after the disaster. COOP = keep going during it. OEP = people's safety, not IT or business processes.",
 mnem:"COOP copes, BRP brings back, OEP gets people out.",
 ref:{c:"ch. 7, Related Plans",a:"ch. 23",o:"Domain 7"}},

{id:"d7-backups",d:7,t:"Backups and data availability",
 what:"A backup is only useful if it can be restored in time. The exam tests backup types, tape rotation and the options for keeping data almost current offsite.",
 pts:["Full backup: copies everything. Slow and resource-heavy, but complete.",
      "Incremental: copies what changed since the last full or incremental backup. Restore needs the full plus every incremental since.",
      "Differential: copies what changed since the last full backup. Restore needs only the full plus the latest differential.",
      "FIFO (round robin) reuses a fixed set of tapes in order; with 14 tapes you keep only 14 days. Grandfather-Father-Son keeps daily (son), weekly (father) and monthly (grandfather) tapes.",
      "Electronic vaulting sends batches of backup data offsite on a schedule. Remote journaling sends database checkpoints and the transaction journal offsite.",
      "Database shadowing keeps two or more identical databases updated at the same time; it recovers faster than remote journaling.",
      "Preventative restoration (test restores) proves backups actually work. Hardcopy data can keep critical functions going when there is no power."],
 ex:"A full backup runs on Sunday, then daily backups. Data is lost Thursday morning. With incrementals you need Sunday plus Monday, Tuesday and Wednesday (4 tapes). With differentials you need Sunday plus Wednesday (2 tapes).",
 terms:[["Incremental backup","Changes since the last backup of any kind."],["Differential backup","Changes since the last full backup."],["Electronic vaulting","Batch transfer of backup data to an offsite location."],["Database shadowing","Identical databases updated simultaneously."]],
 trap:"Incremental backups are faster to make but slower to restore. Differentials are the opposite.",
 mnem:"Incremental = since the last anything. Differential = since the last full.",
 upd:"Against ransomware, the current rule of thumb is 3-2-1-1-0: three copies, two media, one offsite, one immutable or offline, zero errors on test restores.",
 ref:{c:"ch. 7, Backups and Availability",a:"ch. 23",o:"Domain 7"}},

{id:"d7-tests",d:7,t:"Testing and maintaining the BCP/DRP",
 what:"An untested plan is a hope, not a plan. Tests range from reading the document to actually shutting down the primary site, and the plan must evolve with every change.",
 pts:["DRP review: the team rereads the plan for obvious gaps.",
      "Read-through (checklist, consistency): checks every required component is available (enough tape drives at the recovery site, for example).",
      "Structured walkthrough (tabletop): experts discuss the recovery procedure step by step to find gaps and wrong assumptions.",
      "Simulation test (walkthrough drill): teams actually perform the recovery against a simulated disaster.",
      "Parallel processing: critical systems are recovered at the alternate site and process real transactions in parallel; production is not interrupted.",
      "Partial and complete business interruption: production really stops and moves to the alternate site. The most realistic test, and it can cause a disaster itself.",
      "Maintenance: the BCP team should sit on the change control board. Common failures: no management support, no business unit involvement, narrow scope, poor telecom or supply chain management, no testing or training, plans not kept up to date."],
 ex:"Before trying anything live, the team runs a two-hour tabletop exercise: 'the ERP database is encrypted by ransomware at 3 a.m., what do we do?' They discover nobody knows where the restore procedure is stored.",
 terms:[["Tabletop exercise","A structured walkthrough discussing the plan."],["Simulation test","Teams carry out the recovery on a simulated disaster."],["Parallel processing","Recovered systems process real data while production continues."],["Business interruption test","Production actually moves to the alternate site."]],
 trap:"Parallel processing does not interrupt production; interruption tests do. The riskiest test is the complete business interruption.",
 mnem:"Review, Read, Walk, Simulate, Parallel, Partial, Complete: from paper to real.",
 ref:{c:"ch. 7, DRP Testing, Training, and Awareness",a:"ch. 23",o:"Domain 7"}},

{id:"d7-cadres",d:7,t:"BCP/DRP frameworks",
 what:"Several frameworks describe continuity and recovery planning. The exam may ask which one is certifiable, which one is free, and which one covers what.",
 pts:["NIST SP 800-34 Rev. 1, Contingency Planning Guide for Federal Information Systems: free, public domain, high quality.",
      "ISO/IEC 27031 is part of the ISO 27000 series and focuses on ICT readiness for business continuity (ICT: information and communications technology).",
      "ISO/IEC 24762 gave guidelines for ICT disaster recovery services.",
      "BS 25999 (British Standards Institution) had two parts: Part 1 a code of practice (guidance only), Part 2 the certifiable specification for a business continuity management system (BCMS).",
      "ISO 22301 replaced BS 25999-2: it specifies requirements for a BCMS and is certifiable.",
      "The Business Continuity Institute (BCI) publishes the Good Practice Guidelines (GPG), organized as six professional practices: two management practices (policy and program management, embedding business continuity) and four technical ones (analysis, design, implementation, validation)."],
 ex:"A group that wants an external certificate proving its continuity management is sound will aim for ISO 22301 certification, using NIST SP 800-34 as free practical guidance to write its plans.",
 terms:[["BCMS","Business continuity management system."],["ISO 22301","Certifiable requirements for a BCMS."],["ICT","Information and communications technology."],["GPG","The BCI's Good Practice Guidelines."]],
 trap:"ISO 22301 is the certifiable business continuity standard. ISO 27031 is guidance on ICT readiness.",
 mnem:"22301 = two twos, certify you'll survive too.",
 upd:"ISO 22301 was revised in 2019, and the BCI has published newer editions of the Good Practice Guidelines since 2013.",
 ref:{c:"ch. 7, Specific BCP/DRP Frameworks",a:"ch. 23",o:"Domain 7"}},

{id:"d8-programmation",d:8,t:"How software is made: code, compilers, licenses",
 what:"You do not need to be a developer for Domain 8, but you need the basic vocabulary: how human-readable instructions become something a processor runs, and the different ways software is released.",
 pts:["Machine code is the 1s and 0s the CPU executes directly; it depends on the CPU type. Source code is human-readable text that must be translated first.",
      "Assembly language uses short mnemonics (ADD, SUB, JMP) matching machine instructions. An assembler converts it to machine code; a disassembler tries to go the other way.",
      "A compiler translates source code (C, Basic) into machine code once. An interpreter translates code each time it runs (shell scripts).",
      "Bytecode, such as Java bytecode, is an intermediate form. The Java virtual machine turns it into machine code, which makes it platform-independent.",
      "Computer-aided software engineering (CASE) uses programs to help build programs: tools (one task), workbenches (a few tasks), environments (most of the process).",
      "Closed source releases only executables; open source publishes the source code. Proprietary software is protected by patents or copyright.",
      "Free software means gratis (free of charge) or libre (free to use and modify). Freeware is free of charge. Shareware is free for a trial period. Crippleware has key features disabled until you pay."],
 ex:"A PowerShell script is interpreted: each run reads the text again. A C program is compiled once into an .exe that runs directly on the processor.",
 terms:[["Compiler","Translates source code into machine code before execution."],["Interpreter","Translates code at each run."],["Bytecode","Intermediate code run by a virtual machine, such as the JVM."],["Crippleware","Software with key features disabled until payment."]],
 trap:"Free as in beer (gratis) is about price. Free as in liberty (libre) is about what you may do with the code.",
 mnem:"Shareware = share now, pay later. Crippleware = crippled until you pay.",
 ref:{c:"ch. 8, Programming Concepts",a:"ch. 24",o:"Domain 8"}},

{id:"d8-modeles",d:8,t:"Development models: waterfall to Agile",
 what:"Big software projects need a method. Older models move in strict phases; newer ones work in short cycles with the customer close by. The exam asks which model fits which situation.",
 pts:["Waterfall: rigid, linear phases; no going back. The modified waterfall allows returning to the previous phase for verification.",
      "Sashimi: waterfall with overlapping phases, like overlapping slices of fish.",
      "Agile reacts against rigid models. The Agile Manifesto values individuals and interactions, working software, customer collaboration and responding to change.",
      "Scrum: a small Scrum Team, a Scrum Master who coaches and removes obstacles, and a product owner who is the voice of the business.",
      "Extreme programming (XP): pair programming, user stories, a 40-hour week, total customer involvement, detailed unit tests.",
      "Spiral: repeated rounds, each a mini project with its own risk analysis. Designed to control risk.",
      "Rapid application development (RAD): quick prototypes and dummy interfaces; business needs first, technical concerns second; heavy customer involvement."],
 ex:"A regulated project with fixed, well-known requirements and heavy documentation fits waterfall. A new mobile app whose features will be discovered with users fits Scrum.",
 terms:[["Waterfall","Linear development in rigid, sequential phases."],["Scrum Master","Coaches the Scrum Team."],["Product owner","The voice of the business in Scrum."],["Spiral model","Iterative rounds, each with a risk analysis."]],
 trap:"If the question stresses risk management in each iteration, the answer is spiral. If it stresses overlapping phases, it is sashimi.",
 mnem:"Waterfall falls one way. Sashimi overlaps. Spiral circles around risk. Scrum huddles like rugby.",
 ref:{c:"ch. 8, Application Development Methods",a:"ch. 24",o:"Domain 8"}},

{id:"d8-sdlc",d:8,t:"The secure SDLC, IPTs and software escrow",
 what:"For the exam, the SDLC is always the secure systems development life cycle: security is built into every phase, from the first idea to the final disposal of the system.",
 pts:["Prepare a security plan so security is considered in every phase.",
      "Initiation: state the need and purpose; conduct a sensitivity assessment of the system and its data.",
      "Development or acquisition: determine security requirements, put them in the specifications, and build or buy the system with its security features.",
      "Implementation: turn on and configure security controls, perform security testing (certification), then accreditation, the formal authorization and acceptance of risk by management.",
      "Operation and maintenance: security operations (backups, keys, patching, users), operational assurance, audits and monitoring.",
      "Disposal: move, archive or destroy the information, and sanitize media by overwriting, degaussing (magnetic media only) or destruction.",
      "An integrated product team (IPT) brings all stakeholders, including the customer, together for the whole life cycle. Software escrow has a third party hold the source code in case the vendor disappears."],
 ex:"A plantation company buys a niche weighbridge application from a small vendor. The contract includes software escrow: if the vendor goes bankrupt, the company receives the source code and can keep patching it.",
 terms:[["SDLC","Systems development life cycle, with security built in."],["Sensitivity assessment","Evaluating how sensitive the system and its data are."],["Accreditation","Management's formal authorization and acceptance of risk."],["Software escrow","A third party holds source code to protect the customer."]],
 trap:"Security starts at initiation, not at testing. And certification (technical testing) comes before accreditation (management approval).",
 mnem:"Initiate, Develop, Implement, Operate, Dispose: security rides along the whole way.",
 upd:"NIST SP 800-14 is withdrawn. Today's reference is the NIST Secure Software Development Framework (SSDF, SP 800-218).",
 ref:{c:"ch. 8, SDLC",a:"ch. 24",o:"Domain 8"}},

{id:"d8-devops",d:8,t:"APIs, code repositories, change management and DevOps",
 what:"Modern development connects applications through APIs, stores code in shared repositories and pushes changes fast. Each of these needs its own security thinking.",
 pts:["Private code repositories are protected by the usual controls: defense in depth, strong authentication, firewalls, version control. Public ones such as GitHub add their own security controls.",
      "An API lets one application talk to another, to an operating system or a database.",
      "OWASP's key API controls: authentication, access control, input validation, output encoding, cryptography, error handling and logging, communication security, HTTP security, security configuration.",
      "Configuration management tracks changes to one specific piece of software and its settings. Change management tracks changes across the whole development program. The exam treats them as separate but related.",
      "Traditionally, developers, quality assurance and production were strictly separated, and developers never touched production.",
      "DevOps brings development and operations together for the whole service life cycle, from design to production support."],
 ex:"A developer pushes code to a public GitHub repository with a cloud access key hard-coded in it. Bots scan GitHub constantly and abuse the key within minutes. Secret scanning and a private repository would have prevented it.",
 terms:[["API","Application programming interface."],["Configuration management","Tracking changes to a specific piece of software."],["Change management","Tracking changes across the whole program."],["DevOps","Development and operations working together across the whole life cycle."]],
 trap:"DevOps relaxes the classic separation between developers and production. On the exam, the model where developers directly support operations is DevOps.",
 mnem:"Dev + Ops = one team from design to support.",
 upd:"DevSecOps adds security into every step of the automated CI/CD pipeline (scanning code, dependencies and containers automatically). The OWASP API Security Top 10 is now the standard API reference.",
 ref:{c:"ch. 8, Software Escrow to DevOps",a:"ch. 24 and 25",o:"Domain 8"}},

{id:"d8-bdd",d:8,t:"Relational databases and their integrity",
 what:"Most business data lives in relational databases. The exam uses precise vocabulary for tables and keys, and three kinds of integrity that the database must enforce.",
 pts:["A database management system (DBMS) controls all access to the database and enforces its security. SQL is the usual query language.",
      "A relational table is a relation. A row is a record, called a tuple. A column is an attribute. A single cell is a value.",
      "A candidate key is any attribute with unique values. The primary key is the one chosen to uniquely identify each tuple.",
      "A foreign key in a child table matches the primary key of a parent table, linking them.",
      "Referential integrity: every foreign key matches a primary key in the parent table. Semantic integrity: each value matches its attribute's data type. Entity integrity: every tuple has a unique primary key that is not null.",
      "Normalization removes redundant data and improves integrity. A database view is the result of a query and can restrict what a user sees.",
      "Data definition language (DDL) creates and modifies tables. Data manipulation language (DML) queries and updates the data in them."],
 ex:"An HR table lists sick days for employee ID 467 who does not exist in the employee table: referential integrity is broken. A sick days cell that says 'Nexus 6': semantic integrity. Two rows with the same employee ID: entity integrity.",
 terms:[["Tuple","A row, or record, in a relational table."],["Attribute","A column in a relational table."],["Foreign key","A key that matches the primary key of a parent table."],["Database view","The result of a query, often used to limit what users see."]],
 trap:"An empty (null) or duplicated primary key violates entity integrity. A foreign key with no matching parent violates referential integrity.",
 mnem:"Referential = References exist. Semantic = Sense of the data type. Entity = Each row unique.",
 ref:{c:"ch. 8, Databases",a:"ch. 25",o:"Domain 8"}},

{id:"d8-bdd-avance",d:8,t:"Database types, transactions, replication and data mining",
 what:"Beyond simple tables, the exam covers other database types, how a database keeps data correct when many users write at once, and how data is copied and mined.",
 pts:["Hierarchical databases form a tree; the global DNS is an example. Object-oriented databases combine data with functions (code).",
      "Data integrity is threatened when two threads try to modify the same record at once.",
      "A commit makes pending changes permanent. If it fails, the DBMS can roll back (abort) to a savepoint, a clean snapshot.",
      "A database journal logs every transaction. After corruption, restore a backup and replay the journal.",
      "Database replication mirrors a live database; clients read and write on several copies. A two-phase (or multiphase) commit protects integrity.",
      "A shadow database mirrors every change of the primary, but clients do not use it: it is one way.",
      "A data warehouse is a very large collection of data. Data mining searches it for patterns, such as signs of card fraud."],
 ex:"A credit card company's data warehouse holds billions of transactions. A data mining rule flags a card used in Geneva and in Lagos within one hour.",
 terms:[["Commit","Making pending database changes permanent."],["Rollback","Undoing changes and returning to a savepoint."],["Two-phase commit","A protocol that keeps replicated databases consistent."],["Data warehouse","A very large repository of data used for analysis."]],
 trap:"Replicated databases are used by clients on several copies; a shadow database is not used by clients. Integrity is the main concern with replication.",
 mnem:"Commit = save it. Rollback = undo it. Journal = replay it.",
 ref:{c:"ch. 8, Databases",a:"ch. 25",o:"Domain 8"}},

{id:"d8-poo",d:8,t:"Object-oriented programming",
 what:"Object-oriented programming builds software from objects: little black boxes that hold data and know how to do things. Conrad explains it with 'Addy', an object that adds numbers. The exam tests the vocabulary.",
 pts:["An object contains data and methods (the functions it performs). A specific object is an instance.",
      "Encapsulation (data hiding): from outside, you do not see how the object does its work. This is a security benefit.",
      "Objects communicate by messages: '1 + 2' is an input message, '3' is the output message.",
      "Inheritance: an object inherits capabilities from its parent class (Addy inherits math from the class 'mathematical operators').",
      "Delegation: an object passes a request it cannot handle to another object (Addy hands subtraction to Subby).",
      "Polymorphism: the same operator behaves differently depending on the input (Addy adds numbers but concatenates strings).",
      "Polyinstantiation: several instances with the same name but different data (a Secret Addy and a Top Secret Addy). Object request brokers (ORBs) such as COM, DCOM and CORBA help programs find objects."],
 ex:"'+' applied to 2 and 3 gives 5; applied to 'cis' and 'sp' gives 'cissp'. The same operator doing different things by context is polymorphism.",
 terms:[["Encapsulation","Hiding how an object works internally."],["Inheritance","Receiving capabilities from a parent class."],["Polymorphism","One operator, several behaviors depending on context."],["ORB","Object request broker: middleware that locates objects."]],
 trap:"Polymorphism = same operator, different behavior. Polyinstantiation = same name, different data.",
 mnem:"Poly-MORPH changes shape; poly-INSTANCE makes copies.",
 ref:{c:"ch. 8, Object-Oriented Programming",a:"ch. 24",o:"Domain 8"}},

{id:"d8-vulns",d:8,t:"Software vulnerabilities and disclosure",
 what:"Programmers make mistakes, and some become security holes. Know the classic weaknesses, how each one works in a sentence, and how researchers should disclose what they find.",
 pts:["Hard-coded credentials: usernames and passwords left in production code.",
      "Buffer overflow: no bounds checking, so input spills past its buffer and can run attacker code (shellcode). Fix: bounds checking.",
      "SQL injection: manipulating the back-end database through a front-end web form. Directory path traversal: escaping the web root with '../..'. PHP remote file inclusion: making the application load and run remote code.",
      "TOC/TOU (time of check to time of use): a race condition where the attacker changes something after it was checked but before it is used.",
      "Cross-site scripting (XSS): the attacker's script runs in the security context of a trusted site. Cross-site request forgery (CSRF): the victim's browser is tricked into sending a request, such as a bank transfer, to a trusted site.",
      "Privilege escalation gives a limited user more access. Backdoors bypass authentication.",
      "Full disclosure publishes vulnerability details publicly. Responsible disclosure tells the vendor privately and waits for a patch."],
 ex:"A forum lets users post comments with JavaScript. An attacker posts a script that steals the session cookie of every visitor: XSS. An image tag pointing to 'bank.com/transfer?to=attacker' that fires when you view the page is CSRF.",
 terms:[["Buffer overflow","Writing past the end of a buffer because bounds are not checked."],["TOC/TOU","Time of check to time of use: a race condition."],["XSS","Cross-site scripting: attacker script runs in a trusted site's context."],["CSRF","Cross-site request forgery: forged request sent with the victim's credentials."]],
 trap:"XSS executes a script in the trusted site. CSRF sends a forged request (often static content like an image tag) to the trusted site.",
 mnem:"XSS = eXecutes Script. CSRF = Crafted Request, Silently Fired.",
 upd:"The list is now the CWE Top 25 Most Dangerous Software Weaknesses, updated yearly by MITRE and CISA. 'Coordinated vulnerability disclosure' (ISO/IEC 29147) has replaced the term responsible disclosure.",
 ref:{c:"ch. 8, Software Vulnerabilities and Disclosure",a:"ch. 25",o:"Domain 8"}},

{id:"d8-maturite",d:8,t:"CMM, acceptance testing and buying software",
 what:"Organizations need to measure how mature their development process is, verify that software meets requirements before accepting it, and manage the risks of buying or commissioning software.",
 pts:["The Capability Maturity Model (CMM), from Carnegie Mellon's Software Engineering Institute, measures and improves the development process.",
      "Level 1 Initial: ad hoc, success depends on heroes. Level 2 Repeatable: basic project management repeats past successes. Level 3 Defined: documented, standardized organization-wide process.",
      "Level 4 Managed: the process and quality are measured quantitatively. Level 5 Optimizing: continual improvement from quantitative feedback and innovation.",
      "Acceptance testing checks whether software meets user, contract or compliance requirements. ISTQB levels: user acceptance, operational (production) acceptance, contract acceptance, compliance (regulation) acceptance.",
      "Commercial off-the-shelf (COTS) software: run a bake-off between products that already meet requirements, do not trust roadmaps, check integration with existing security tools, and consider total cost of ownership.",
      "Custom software from a third party: security happens only if the contract and SLA require it. Ask what happens if the vendor fails or a critical feature is missing."],
 ex:"Before accepting a new ERP module, IT runs operational acceptance tests: backup and restore, disaster recovery and a vulnerability scan. Users separately run user acceptance tests on their business processes.",
 terms:[["CMM","Capability Maturity Model for software development."],["Optimizing","CMM level 5: continual process improvement."],["COTS","Commercial off-the-shelf software."],["Operational acceptance","Testing that a system meets operational requirements, such as backup and DR."]],
 trap:"Level 4 is Managed (measured); level 5 is Optimizing (continually improving). Don't swap them.",
 mnem:"I Really Do Mind Optimizing: Initial, Repeatable, Defined, Managed, Optimizing.",
 upd:"CMM evolved into CMMI (Capability Maturity Model Integration), now at version 3.0 and managed by ISACA through the CMMI Institute. CMMI names level 2 Managed and level 4 Quantitatively Managed.",
 ref:{c:"ch. 8, Assessing the Effectiveness of Software Security",a:"ch. 25",o:"Domain 8"}},
{id:"x1-gouvernance",d:1,lvl:2,t:"Security governance: who decides, who answers",
 what:"Governance is how senior management sets the direction for security, communicates it down the organization and checks that it is followed. The All-in-One insists on one idea: security is a business issue driven from the top, not an IT project.",
 pts:["Security governance is a framework: senior management sets security goals, communicates them through all levels, and verifies them with defined reporting channels and performance metrics.",
      "In practice it takes the form of a security program or an information security management system (ISMS): policies, procedures, standards and baselines aligned with business needs.",
      "Senior management always carries the ultimate responsibility for the organization, including security. The board oversees; executives decide; the CISO runs the program.",
      "A governance committee is a standing body that reviews the organization's structures and practices and reports to the board. It can be the security leader's best ally on issues that need board support.",
      "Planning horizons: strategic plans (long term, about five years, aligned with business goals), tactical plans (mid term, about a year), operational plans (short term, detailed, weeks to months).",
      "Mergers, acquisitions and divestitures are key organizational processes: assess the security of what you acquire before connecting it, and protect confidential information when you are being audited or divested.",
      "Top-down approach: security initiatives must be driven by senior management. A bottom-up program started by IT without executive support usually fails."],
 ex:"A group CIO presents a three-year security roadmap to the executive committee (strategic), turns it into a yearly project plan with budget (tactical), and his team schedules the MFA rollout site by site over the next quarter (operational).",
 terms:[["ISMS","Information security management system: the policies, processes and controls that run security."],["Governance committee","A standing body that reviews practices and reports to the board."],["Strategic plan","Long-term plan aligned with business goals."],["Top-down approach","Security driven and funded by senior management."]],
 trap:"When a question asks who is ultimately responsible for security, the answer is senior management, never the CISO or the IT department.",
 mnem:"Strategic = years, Tactical = a year, Operational = weeks.",
 ref:{a:"ch. 1, p. 10 to 27",o:"Domain 1"}},

{id:"x1-rmf",d:1,lvl:2,t:"The NIST Risk Management Framework and risk methods",
 what:"The NIST Risk Management Framework (RMF) gives a repeatable cycle to manage risk for each information system, from understanding the organization to monitoring controls in production. The exam expects the seven steps in order.",
 pts:["The seven RMF steps (SP 800-37): prepare, categorize, select, implement, assess, authorize, monitor.",
      "Prepare: align leaders on roles, priorities and risk tolerance, and run an organizational risk assessment that identifies high-value assets.",
      "Categorize: rate each system's impact on confidentiality, integrity and availability as low, moderate or high (NIST SP 800-60, FIPS 199). The overall category is the highest of the three: the high water mark.",
      "Select and implement controls, mostly from NIST SP 800-53. Controls are common (shared by many systems), system-specific (inside one system's boundary) or hybrid.",
      "Assess: check controls work as intended. Authorize: a senior official accepts the residual risk and authorizes operation. Monitor: keep watching controls, changes and compliance.",
      "Other methods: OCTAVE (Carnegie Mellon) is team-oriented and runs on workshops; FAIR (Factor Analysis of Information Risk) is the internationally recognized quantitative approach; ISO 27005 and ISO 31000 give risk management guidance."],
 ex:"A CRM system would hurt the company badly if its data leaked, but less if it were briefly down or slightly wrong: SC = {(confidentiality, high), (integrity, low), (availability, low)}. With the high water mark, the system is categorized high.",
 terms:[["Categorization","Rating a system's impact level for C, I and A."],["High water mark","The system's category equals its highest individual rating."],["Common control","A control shared by several systems, such as a data center's physical security."],["FAIR","Factor Analysis of Information Risk: a quantitative risk method."]],
 trap:"'Establish the context' is an ISO 27005 step, not one of the seven NIST RMF steps.",
 mnem:"Please Call Security In An Awful Mess: Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor.",
 ref:{a:"ch. 4, p. 172 to 180; ch. 2",o:"Domain 1"}},

{id:"x1-cadres",d:1,lvl:2,t:"Frameworks: programs, controls and architecture",
 what:"The All-in-One sorts frameworks into three families: those that structure a whole security program, those that catalog controls, and those that describe enterprise architecture. The exam asks you to pick the right one for a need.",
 pts:["Program frameworks: ISO/IEC 27001 (requirements for an ISMS, certifiable) and the NIST Cybersecurity Framework, officially the Framework for Improving Critical Infrastructure Cybersecurity, with five functions: identify, protect, detect, respond, recover.",
      "Control frameworks: NIST SP 800-53 (over 1,000 controls in 20 families), the CIS Controls (prioritized controls in implementation groups, from small to enterprise), and COBIT (ISACA, IT governance and control objectives linking stakeholder needs to IT goals).",
      "Enterprise architecture frameworks build views for different stakeholders. Zachman: a matrix of questions (what, how, where, who, when, why) by viewpoints. SABSA: a security architecture framework driven by business requirements. TOGAF: uses the Architecture Development Method (ADM). DoDAF: US military.",
      "Process improvement: ITIL for IT service management, Six Sigma for reducing defects, and CMMI for process maturity.",
      "Blueprints are functional definitions for integrating technology into business processes."],
 ex:"A company wants a certificate to show customers: ISO 27001. It needs a concrete, prioritized list of controls for a small IT team: CIS Controls, implementation group 1. The board wants a simple picture of maturity: the NIST CSF functions.",
 terms:[["NIST CSF","Cybersecurity Framework organizing activities into high-level functions."],["SP 800-53","NIST catalog of security and privacy controls."],["Zachman","Enterprise architecture matrix of questions and viewpoints."],["SABSA","Business-driven security architecture framework."]],
 trap:"Zachman is a general enterprise architecture framework; SABSA is the one designed specifically for security.",
 mnem:"Program = 27001 and CSF. Controls = 800-53, CIS, COBIT. Architecture = Zachman, SABSA, TOGAF, DoDAF.",
 upd:"NIST CSF 2.0 (February 2024) added a sixth function, Govern. The CIS Controls v8 (2021) reduced the list from 20 to 18 controls. ISO 27001 was revised in 2022 with 93 Annex A controls in four themes.",
 ref:{a:"ch. 4",o:"Domain 1"}},

{id:"x1-menaces",d:1,lvl:2,t:"Threat modeling: attack trees, STRIDE, Kill Chain, ATT&CK",
 what:"Threat modeling looks at a system from the attacker's side to find the most likely ways in, before the attacker does. The CISSP outline lists it in Domain 1 and the All-in-One covers four approaches in chapter 9.",
 pts:["Attack trees: the attacker's goal is the root, and each branch is a way to reach it. They help reveal the cheapest or most likely paths.",
      "STRIDE (Microsoft) works for logical and physical systems: Spoofing (breaks authentication), Tampering (integrity), Repudiation (nonrepudiation), Information disclosure (confidentiality), Denial of service (availability), Elevation of privilege (authorization).",
      "The Lockheed Martin Cyber Kill Chain has seven phases: reconnaissance, weaponization, delivery, exploitation, installation, command and control, actions on objectives. Breaking any link stops the attack.",
      "MITRE ATT&CK is a knowledge base of tactics, techniques and procedures (TTPs) actually used by specific threat actors. It is the most detailed of the four.",
      "Why bother: threat modeling directs scarce defensive resources to the threats that matter, and works best early in design."],
 ex:"Applying STRIDE to a new supplier portal: could someone log in as a supplier (spoofing)? Change an invoice amount (tampering)? Deny having submitted a bid (repudiation)? See competitors' bids (information disclosure)? Each answer becomes a requirement.",
 terms:[["Threat modeling","Systematically identifying threats to a system from the attacker's viewpoint."],["STRIDE","Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege."],["Kill chain","The sequence of phases an attack must go through."],["TTPs","Tactics, techniques and procedures used by attackers."]],
 trap:"If the question asks for detailed procedures of specific threat actors, the answer is MITRE ATT&CK, not STRIDE or the Kill Chain.",
 mnem:"STRIDE mirrors the security goals: Authentication, Integrity, Nonrepudiation, Confidentiality, Availability, Authorization.",
 upd:"PASTA (Process for Attack Simulation and Threat Analysis, seven stages, risk-centric) and DREAD (rating Damage, Reproducibility, Exploitability, Affected users, Discoverability) also appear in other study guides.",
 ref:{a:"ch. 9, p. 385 to 390",o:"Domain 1"}},

{id:"x1-scrm",d:1,lvl:2,t:"Supply chain risk management",
 what:"Every piece of hardware, software or service you bring in can carry someone else's weaknesses into your organization. The SolarWinds Orion compromise of 2020 showed how far one poisoned supplier can reach.",
 pts:["Upstream suppliers provide what you use; downstream organizations receive what you produce. You must manage risk in both directions, because customers blame your brand whoever caused the problem.",
      "Hardware risks: hardware Trojans (malicious circuits added at design, fabrication, assembly or by intercepting shipments) and counterfeit components that skip quality controls. The earlier a Trojan is inserted, the harder it is to detect.",
      "Software risks: malicious or vulnerable code in updates or libraries, as with SolarWinds, where attackers compromised the vendor's build process.",
      "Services risks: providers with access to your systems or data, including managed service providers and cloud providers.",
      "Minimum security requirements should be written into contracts, with the right to verify them, and service level agreements should set measurable expectations.",
      "Other third-party risks include outsourced staff, consultants and partners with network connections."],
 ex:"A managed service provider has domain admin rights in all your Active Directory domains. If the provider is compromised, so are you. Minimum requirements (MFA, logging, background checks) and an external audit right belong in the contract.",
 terms:[["Upstream supplier","A provider whose goods or services you use."],["Downstream","Organizations that receive what you produce."],["Hardware Trojan","A malicious circuit added to a device to compromise it."],["Counterfeit component","A fake part that bypasses the original's quality controls."]],
 trap:"Supply chain risk is not only upstream. Your downstream distributors' failures also hurt your reputation.",
 mnem:"Upstream feeds you, downstream eats your output: protect both ends of the pipe.",
 upd:"A software bill of materials (SBOM), listing every component in a product, is now a common supply chain requirement, pushed by US Executive Order 14028 (2021) and the EU Cyber Resilience Act (2024).",
 ref:{a:"ch. 2, p. 96 to 101",o:"Domain 1"}},

{id:"x1-enquetes",d:1,lvl:2,t:"Investigation types and the burden of proof",
 what:"Not every investigation ends in a courtroom. The CISSP distinguishes four types, and each has its own goal, its own standard of proof and its own rules for evidence.",
 pts:["Administrative investigations are internal and look at policy violations or operational problems. They have the lowest standard and usually end in internal discipline.",
      "Criminal investigations involve law enforcement and possible prison. Proof must be beyond a reasonable doubt, and evidence handling must be rigorous from the start.",
      "Civil investigations support a lawsuit between parties, usually for money. The standard is the preponderance of the evidence.",
      "Regulatory investigations are conducted by government agencies, or by the organization at their request, to check compliance with regulations.",
      "Industry standard investigations (such as for PCI DSS) check compliance with an industry's rules.",
      "An administrative investigation can turn criminal. If it might, involve legal counsel early and handle evidence as if it will go to court."],
 ex:"HR asks IT to check whether an employee broke the acceptable use policy: administrative. The logs then show he sold customer data to a competitor: the case may become criminal and civil, so evidence must be preserved with a full chain of custody.",
 terms:[["Administrative investigation","Internal inquiry into policy violations."],["Regulatory investigation","Inquiry by or for a government agency about compliance."],["Preponderance of the evidence","More likely than not: the civil standard."],["Beyond a reasonable doubt","The criminal standard of proof."]],
 trap:"Treat any investigation that might become criminal with criminal-grade evidence handling from the first moment. You cannot fix a broken chain of custody later.",
 mnem:"Admin = rules broken, Criminal = prison, Civil = money, Regulatory = the regulator.",
 ref:{a:"ch. 3, p. 161 to 162",o:"Domain 1"}},

{id:"x2-cycle",d:2,lvl:2,t:"The data life cycle and data roles",
 what:"Data is not like hardware: it is cheap to acquire, can be shared without being lost, and is usually archived rather than thrown away. The All-in-One uses a six-phase life cycle and the 2021 outline adds new data roles.",
 pts:["Six phases: acquisition, storage, use, sharing, archival, destruction.",
      "Acquisition: data is collected (sensors, applications), copied from elsewhere, or created. Collect only what you need (data collection limitation).",
      "Storage and archival must match the data's classification; archived data stays sensitive and stays discoverable in lawsuits.",
      "Sharing is where control is most easily lost: agreements, encryption and rights management follow the data out.",
      "Data roles: owner (accountable, sets classification), controller (decides why and how personal data is processed), custodian (day-to-day protection), processor (processes on behalf of the controller), user, and subject (the person the data is about).",
      "Data location matters: data sovereignty laws may require data to stay in a country. Data maintenance keeps data accurate and current, including copies."],
 ex:"Employee payroll data: HR is the data owner and controller, the payroll provider is the processor, IT is the custodian running backups, and each employee is a data subject with GDPR rights over their own record.",
 terms:[["Data subject","The individual the personal data is about."],["Data controller","Decides the purposes and means of processing personal data."],["Data sovereignty","Data is subject to the laws of the country where it is stored."],["Data maintenance","Keeping data accurate, current and consistent across copies."]],
 trap:"The data subject is the person described by the data, not the user who accesses it.",
 mnem:"Acquire, Store, Use, Share, Archive, Destroy: 'All Staff Use Shared Archives Daily'.",
 ref:{a:"ch. 5, p. 230 to 245",o:"Domain 2"}},

{id:"x2-actifs",d:2,lvl:2,t:"Asset inventory, provisioning and end of life",
 what:"You cannot protect what you do not know you have. Asset management covers the whole life of hardware, software and data, from the inventory to the day the asset is retired.",
 pts:["Assets are tangible (servers, laptops) or intangible (data, software licenses, intellectual property, reputation).",
      "Inventories track hardware and software: what exists, where, who owns it and who uses it. Unauthorized software and shadow IT appear through inventory gaps.",
      "Secure provisioning: new assets are configured to an approved baseline before they go into production.",
      "End of life (EOL): the vendor stops selling or making the product. End of support (EOS): the vendor stops patches and support. After EOS, every new vulnerability stays open.",
      "Decommissioning: confirm the asset is no longer used (hidden users may exist), check data retention needs, securely wipe all storage, and dispose of hazardous parts properly."],
 ex:"An old Windows Server 2012 still runs a weighbridge application at a remote site. It is past end of support, so it gets no more patches: isolate it, plan migration, and record the accepted risk until it is retired.",
 terms:[["Intangible asset","An asset without physical form, such as data or reputation."],["EOL","End of life: no longer sold or manufactured."],["EOS","End of support: no more patches or vendor support."],["Secure provisioning","Deploying assets in a hardened, approved configuration."]],
 trap:"EOL is not the end of patches. EOS is the date that creates the security problem.",
 mnem:"EOL = Ends On the shelf. EOS = Ends Our Safety (no patches).",
 ref:{a:"ch. 5, p. 223 to 230",o:"Domain 2"}},

{id:"x2-remanence",d:2,lvl:2,t:"Sanitization levels: clear, purge, destroy",
 what:"When deleting a file, the file system only removes the pointer; the content stays until overwritten. NIST SP 800-88 defines three levels of sanitization, chosen according to the data's sensitivity and whether the media will be reused.",
 pts:["Data remanence: data left on media after deletion. Deleted files remain in unallocated blocks, and partly overwritten blocks still hold fragments.",
      "Clear: logical techniques (overwriting with standard commands) that protect against simple, non-invasive recovery. The media can be reused internally.",
      "Purge: physical or logical techniques that resist even laboratory recovery, such as degaussing magnetic media, cryptographic erase or firmware block erase. Media can be reused, even outside.",
      "Destroy: the media can no longer be used and lab recovery is infeasible: shredding, disintegration, pulverizing, melting, incineration.",
      "Cryptographic erase: if the media was encrypted, destroying the key makes the data unreadable. Fast and effective for SSDs and self-encrypting drives.",
      "Document every sanitization, and verify the result."],
 ex:"Leased laptops return to the supplier: their SSDs are BitLocker encrypted, so a cryptographic erase plus a vendor secure erase (purge) is appropriate. Failed disks from a server holding HR data go to a certified shredder (destroy).",
 terms:[["Clear","Logical sanitization against simple recovery."],["Purge","Sanitization that resists laboratory recovery."],["Destroy","Physically ruining the media."],["Cryptographic erase","Sanitizing by destroying the encryption key."]],
 trap:"Degaussing is a purge method for magnetic media only. It does nothing to SSDs, and it often makes hard drives unusable.",
 mnem:"Clear = reuse inside. Purge = reuse anywhere. Destroy = no reuse.",
 ref:{a:"ch. 5, p. 240 to 244",o:"Domain 2"}},

{id:"x2-protection",d:2,lvl:2,t:"Data states and protection methods: DLP, DRM, CASB",
 what:"Data must be protected in all three states: at rest, in transit and in use. The 2021 outline names three technologies that protect data wherever it goes.",
 pts:["At rest: stored on media; protect with encryption and access control. In transit: moving on a network; protect with TLS, IPsec or VPNs.",
      "In use: being processed in memory, where it is usually decrypted. Protect with access control, memory protection and trusted execution environments.",
      "Data loss prevention (DLP) detects and blocks unauthorized data leaving the organization. It needs a data inventory and classification, an understanding of data flows, and a mix of network DLP and endpoint DLP (which sees data before encryption).",
      "Digital rights management (DRM) controls what recipients can do with data after it leaves: view, copy, print, forward, expiry dates.",
      "A cloud access security broker (CASB) sits between users and cloud services, inline as a proxy or through the provider's API. It gives visibility of shadow IT and enforces policies such as DLP in the cloud.",
      "Scoping (choosing which controls of a standard apply) and tailoring (adjusting them to the organization) remain the way to select standards."],
 ex:"Confidential board minutes are shared with outside lawyers. A sensitivity label with rights management lets them read but not print or forward, and access expires after 30 days, even if the file is copied elsewhere.",
 terms:[["Data in use","Data being processed in memory."],["DLP","Data loss prevention."],["DRM","Digital rights management: controls use after distribution."],["CASB","Cloud access security broker."]],
 trap:"DLP stops data leaving; DRM controls data after it has left; CASB governs the use of cloud services.",
 mnem:"DLP guards the exit, DRM travels with the file, CASB stands at the cloud's door.",
 upd:"In Microsoft 365, Purview DLP, sensitivity labels with encryption (rights management) and Defender for Cloud Apps (a CASB) implement these three methods.",
 ref:{a:"ch. 6",o:"Domain 2"}},

{id:"x3-principes",d:3,lvl:2,t:"Secure design principles",
 what:"The 2021 outline lists the principles every security architect should apply when designing a system. Each is a rule of thumb, and exam questions often describe a situation and ask which principle is at work.",
 pts:["Threat modeling: understand the attacker before designing defenses.",
      "Defense in depth: several layers of different controls, so one failure does not expose the asset.",
      "Zero trust: never trust by default, whatever the network location; verify every request explicitly and continuously.",
      "Trust but verify: when trust is granted, check it regularly with monitoring and audits. Shared responsibility: cloud provider and customer each secure their part.",
      "Separation of duties and least privilege limit what one person or process can do.",
      "Keep it simple: complexity hides errors. Secure defaults: systems ship locked down, and users must deliberately open them.",
      "Fail securely: on error, the system falls back to its most secure state (a firewall that reboots blocks all traffic until checked).",
      "Privacy by design (part of GDPR): seven principles, including proactive not reactive, privacy as the default setting, privacy embedded into design, end-to-end life cycle protection, visibility and transparency, respect for the user."],
 ex:"A browser refuses to open a bank site whose certificate has expired instead of letting the user click through: fail securely. A new SaaS tenant where external sharing is disabled until an admin enables it: secure defaults.",
 terms:[["Zero trust","No implicit trust based on network location; verify every access."],["Fail securely","Defaulting to the most secure state when a fault occurs."],["Secure defaults","Shipping and deploying systems in their most secure configuration."],["Privacy by design","Building data protection into systems from the start."]],
 trap:"Fail secure protects assets; fail safe protects people. A data center door that unlocks during a fire is fail safe, and people's safety wins.",
 mnem:"Design like a skeptic: trust nothing, layer everything, keep it simple, lock it by default, fail closed.",
 upd:"NIST SP 800-207 (2020) is the reference for zero trust architecture.",
 ref:{a:"ch. 9, p. 390 to 397",o:"Domain 3"}},

{id:"x3-modeles",d:3,lvl:2,t:"More security models: noninterference, Graham-Denning, HRU",
 what:"Besides Bell-LaPadula, Biba, Clark-Wilson and Brewer-Nash, the All-in-One covers three more formal models. You need to recognize what each one is about.",
 pts:["A security model is a formal, verifiable expression of a security policy, usually mathematical, that developers turn into specifications.",
      "Noninterference: actions at a higher security level must not affect, or be visible to, subjects at a lower level. It targets covert channels and inference.",
      "Graham-Denning defines eight basic protection rights: create and delete objects, create and delete subjects, and read, grant, delete and transfer access rights.",
      "Harrison-Ruzzo-Ullman (HRU) deals with how access rights can change, and whether a subject can end up obtaining a right it should not have. In general this question cannot be decided.",
      "Recap: Bell-LaPadula = confidentiality; Biba = integrity; Clark-Wilson = integrity through well-formed transactions; Brewer-Nash = conflicts of interest."],
 ex:"A low-clearance user notices the shared printer is busy every night at 2 a.m. and deduces that a secret project is running. A system built on the noninterference model would hide such effects of high-level activity.",
 terms:[["Noninterference","High-level activity must not affect what low-level subjects see."],["Graham-Denning","Model with eight primitive protection rights."],["HRU","Harrison-Ruzzo-Ullman: how access rights change and propagate."]],
 trap:"If the question is about creating and deleting subjects and objects, or assigning rights, think Graham-Denning. If it is about whether rights can leak over time, think HRU.",
 mnem:"Noninterference = what happens upstairs stays upstairs.",
 ref:{a:"ch. 9, p. 397 to 404",o:"Domain 3"}},

{id:"x3-capacites",d:3,lvl:2,t:"Security capabilities of systems: TPM, HSM, SED, secure processing",
 what:"Modern hardware includes components built specifically for security. The exam asks what each one protects and where the encryption happens.",
 pts:["Trusted platform module (TPM): a chip on the motherboard that stores keys, measures the boot process and binds encryption to the hardware.",
      "Hardware security module (HSM): a dedicated, tamper-resistant device (card or appliance) that generates, stores and uses keys at high speed, used by CAs and banks.",
      "Self-encrypting drive (SED): the drive's own controller encrypts data on the disk, transparently to the operating system.",
      "Bus encryption: data is encrypted while it travels on the computer bus between components, protecting against someone probing the hardware.",
      "Secure processing includes trusted execution environments (a protected area of the processor that even the OS cannot read), processor security extensions, and atomic execution, which completes an operation without interruption to prevent TOC/TOU race conditions.",
      "Memory protection, encryption and decryption capabilities are also part of the outline's 'security capabilities of information systems'."],
 ex:"A company's internal certificate authority keeps its root private key in an HSM. The key never leaves the device, and signing a certificate requires two administrators' smart cards.",
 terms:[["HSM","Hardware security module: tamper-resistant device for keys and crypto operations."],["SED","Self-encrypting drive: encryption done by the drive itself."],["Trusted execution environment","A protected processor area isolated from the operating system."],["Atomic execution","Running an operation as one uninterruptible step."]],
 trap:"In a self-encrypting drive, data is encrypted on the disk drive. In a bus encryption system, data is encrypted on the bus.",
 mnem:"TPM sits on the motherboard, HSM sits in the rack, SED sits in the disk.",
 upd:"Hardware HSMs now also exist as cloud services (such as Azure Key Vault Managed HSM). FIPS 140-3 replaced FIPS 140-2 for validating cryptographic modules.",
 ref:{a:"ch. 9, p. 404 to 411",o:"Domain 3"}},

{id:"x3-architectures",d:3,lvl:2,t:"Modern architectures: ICS, IoT, containers, serverless, edge",
 what:"The 2021 outline asks you to assess the weaknesses of many architectures beyond the classic client and server. Each has its own typical risk.",
 pts:["Industrial control systems (ICS) control physical processes. SCADA covers wide areas (pipelines, grids) using remote terminal units; distributed control systems (DCS) run a single plant; programmable logic controllers (PLCs) drive machines. Availability and safety come first, and legacy systems are hard to patch (guidance: NIST SP 800-82).",
      "Embedded systems are computers inside other devices; the Internet of Things (IoT) connects them. Risks: default passwords, no updates, weak encryption. Segment them on their own network.",
      "Virtual machines each have a full OS. Containers share the host's kernel, so they are lighter but a kernel flaw affects all of them.",
      "Microservices split an application into small services talking through APIs: secure each API and the traffic between services. Serverless (function as a service) runs code on demand with no server to manage; the provider secures the platform.",
      "Cloud deployment models: public, private, community, hybrid. Service models: SaaS, PaaS, IaaS, and 'everything as a service'.",
      "Distributed systems spread work over many nodes; edge computing processes data close to where it is produced to reduce latency. High-performance computing (HPC) clusters many processors for heavy workloads."],
 ex:"An oil mill's boilers are run by PLCs connected to a supervision PC on the office network. If ransomware hits the office, the plant can stop. Separating the OT network behind its own firewall is the first fix.",
 terms:[["SCADA","Supervisory control and data acquisition over wide areas."],["PLC","Programmable logic controller that drives machines."],["Container","Isolated application sharing the host OS kernel."],["Edge computing","Processing data close to its source."]],
 trap:"In ICS, availability and human safety usually rank above confidentiality. Patching and scanning must not disrupt the physical process.",
 mnem:"VMs bring their own OS, containers share the kernel, serverless brings only the code.",
 ref:{a:"ch. 7, p. 283 to 310",o:"Domain 3"}},

{id:"x3-cryptocycle",d:3,lvl:2,t:"Cryptographic life cycle and key management",
 what:"Algorithms and keys do not stay strong forever. The cryptographic life cycle manages algorithm choice over time, and key management protects keys from creation to destruction.",
 pts:["Algorithms weaken as computing power grows and attacks improve: choose them according to how long data must stay secret, and plan replacements (NIST labels such as acceptable, deprecated, legacy use, disallowed).",
      "Key management rules: keys long enough, random, using the whole key space; stored and transmitted securely; lifetime matched to the data's sensitivity; the more a key is used, the shorter its life; backed up or escrowed; destroyed at end of life.",
      "The cryptoperiod is the time a key is authorized for use. Key rotation replaces keys regularly.",
      "Key escrow recovers lost or corrupted keys. Multiparty key recovery requires several people, which implements dual control.",
      "Split knowledge: no single person knows the whole key. Dual control: two people must act together. Both make abuse require collusion.",
      "Quantum computing threatens asymmetric algorithms (RSA, ECC) and halves the effective strength of symmetric keys, so AES-256 remains safe."],
 ex:"The backup encryption key is split into two halves held by the CIO and the security officer (split knowledge), and restoring it requires both to be present (dual control).",
 terms:[["Cryptoperiod","The time a key is authorized for use."],["Split knowledge","No single person holds the complete key."],["Dual control","Two people must act together to complete a task."],["Multiparty key recovery","Several people needed to recover a key."]],
 trap:"Split knowledge is about what people know; dual control is about what people must do together. They are often used together.",
 mnem:"The more you use a key, the sooner you retire it.",
 upd:"NIST's post-quantum standards (FIPS 203, 204, 205, 2024) start a migration that organizations should plan now, beginning with an inventory of where they use cryptography.",
 ref:{a:"ch. 8, p. 364 to 367",o:"Domain 3"}},

{id:"x3-attaques",d:3,lvl:2,t:"Cryptanalytic attacks added in 2021",
 what:"The 2021 outline expanded cryptanalytic attacks well beyond pure mathematics. Most attacks you will meet in real life target the implementation or the people, not the algorithm.",
 pts:["Ciphertext-only: the attacker has only ciphertext; the hardest case. Frequency analysis counts letter patterns and breaks simple substitution ciphers.",
      "Implementation attacks exploit how an algorithm is coded or used, not the math itself.",
      "Side-channel attacks watch timing, power or emissions. Timing attacks measure how long operations take; Meltdown and Spectre (2017) are well-known timing attacks that can steal keys.",
      "Fault injection deliberately causes errors (voltage glitches, heat) to make a cryptosystem leak its key.",
      "Man-in-the-middle: the attacker sits between two parties, relays and possibly alters traffic. Defense: mutual authentication and certificate validation.",
      "Pass the hash is a replay attack on Windows SSO: the attacker steals a password hash and reuses it to authenticate without knowing the password.",
      "Kerberos exploitation (golden ticket, silver ticket, Kerberoasting, pass-the-ticket) and ransomware, which uses cryptography against its victims, are also listed."],
 ex:"An attacker compromises a help desk PC where a domain admin had logged in, dumps the admin's NTLM hash from memory and uses it to connect to a domain controller. He never cracked the password: pass the hash.",
 terms:[["Ciphertext-only attack","Only ciphertext is available to the attacker."],["Fault injection","Inducing errors to make a cryptosystem leak secrets."],["Pass the hash","Reusing a stolen password hash to authenticate."],["Man-in-the-middle","Intercepting and relaying traffic between two parties."]],
 trap:"Pass the hash is classified as a replay attack: the hash itself is replayed. Cracking it is not needed.",
 mnem:"Math attacks are rare, implementation and people attacks are everyday.",
 upd:"Defenses against pass the hash in Windows include Credential Guard, the Protected Users group, tiered admin accounts and LAPS for local administrator passwords.",
 ref:{a:"ch. 8, p. 367 to 375; ch. 17",o:"Domain 3"}},

{id:"x3-site",d:3,lvl:2,t:"Site design: CPTED and facility controls",
 what:"Physical security starts with the design of the site itself. The All-in-One adds a structured approach to reducing crime through design, and detailed rules for specific rooms.",
 pts:["Crime Prevention Through Environmental Design (CPTED) combines physical design and sociology to reduce crime and the fear of crime. Four strategies: natural access control, natural surveillance, territorial reinforcement, maintenance.",
      "Natural access control guides people with the placement of doors, fences, lighting and landscaping. Natural surveillance makes intruders feel watched and staff feel safe. Territorial reinforcement gives legitimate users a sense of ownership. Maintenance makes the site look cared for and alert.",
      "Target hardening denies access with physical and artificial barriers: locks, alarms, fences. It complements CPTED.",
      "Site planning: consider crime, natural disaster risks and distance to hospitals, police, fire stations, airports and railroads.",
      "Specific areas: wiring closets and intermediate distribution facilities must be locked and not shared with other uses; data centers; media storage; evidence storage with logged access and chain of custody; restricted work areas.",
      "Smoke detectors go on and above suspended ceilings, below raised floors and in air ducts. Portable extinguishers within about 15 m (50 ft) of electrical equipment, inspected quarterly."],
