      "OFB (Output Feedback): stream mode with an IV, but the feedback is the keystream before it is XORed with plaintext, so errors do not propagate.",
      "CTR (Counter): stream mode using a counter, patterns destroyed, errors do not propagate, and blocks can be encrypted in parallel. The newest of the five (NIST SP 800-38A)."],
 ex:"Encrypt a bitmap image in ECB mode and the outline of the picture is still visible in the ciphertext. Encrypt it in CBC or CTR and it looks like random noise.",
 terms:[["Mode of operation","The method for applying a block cipher to data longer than one block."],["Chaining","Feeding the previous encrypted block into the next."],["Error propagation","An error in one block corrupting the following blocks."],["Parallel encryption","Encrypting several blocks at once, possible in CTR mode."]],
 trap:"Only ECB has no IV. Only CBC and CFB propagate errors. Only CTR can run in parallel.",
 mnem:"ECB = Every Clone Betrays (patterns show). CTR = CounTeR runs in parallel lanes.",
 upd:"Modern protocols such as TLS 1.3 use authenticated modes like GCM (Galois/Counter Mode), which builds on CTR and adds integrity.",
 ref:{c:"ch. 3, Modes of DES",a:"ch. 8",o:"Domain 3"}},

{id:"d3-asymetrique",d:3,t:"Asymmetric encryption: RSA, Diffie-Hellman, ECC",
 what:"Asymmetric encryption solved the key sharing problem: two people who have never met can communicate securely. Each person has a public key anyone may use and a private key only they hold.",
 pts:["What one key encrypts, only the other key of the pair decrypts. Encrypt with the recipient's public key for confidentiality; encrypt with your own private key to sign.",
      "Asymmetric algorithms rely on one-way functions: easy to compute one way, very hard to reverse.",
      "Factoring large composite numbers into primes is the basis of RSA.",
      "The discrete logarithm problem is the basis of Diffie-Hellman and ElGamal.",
      "Diffie-Hellman (1976) is a key agreement protocol: two parties agree on a symmetric key over a public channel; an eavesdropper who sees everything still cannot derive the key.",
      "Elliptic curve cryptography (ECC) applies discrete logarithms to elliptic curves. It is stronger per bit, so it uses shorter keys and suits low-power devices.",
      "Asymmetric encryption is far slower and weaker per bit than symmetric. In practice it is used to exchange a symmetric session key, which then encrypts the data."],
 ex:"When you open an HTTPS site, asymmetric cryptography (RSA or elliptic curve Diffie-Hellman) is used to agree on a session key, and AES then encrypts the rest of the conversation.",
 terms:[["One-way function","Easy to compute, very hard to reverse."],["Key agreement","Two parties derive a shared key without sending it."],["ECC","Elliptic curve cryptography: strong per bit, short keys."],["Session key","A temporary symmetric key used for one session."]],
 trap:"RSA relies on factoring. Diffie-Hellman and ElGamal rely on discrete logarithms. Diffie-Hellman agrees on keys; it does not encrypt messages or sign them.",
 mnem:"RSA = Really Scary Arithmetic (factoring primes). DH = Discrete logs, Handshake for keys.",
 upd:"Quantum computers threaten RSA and ECC. In August 2024 NIST published the first post-quantum standards: ML-KEM (FIPS 203) for key exchange, ML-DSA (FIPS 204) and SLH-DSA (FIPS 205) for signatures.",
 ref:{c:"ch. 3, Asymmetric Encryption",a:"ch. 8",o:"Domain 3"}},

{id:"d3-hash",d:3,t:"Hash functions and collisions",
 what:"A hash function turns any amount of data into a short fixed-length fingerprint, with no key and no way back. If even one bit of the data changes, the fingerprint changes. That makes hashes the main tool for integrity.",
 pts:["A hash, also called a message digest, is a one-way transformation using an algorithm and no key.",
      "Its main use is integrity: compare the hash before and after, and any change shows up.",
      "A collision happens when two different inputs produce the same hash. Collisions must exist, since there are far more possible inputs than possible hashes; a good hash makes them impractical to find.",
      "MD5 produces a 128-bit hash and SHA-1 a 160-bit hash. Both have practical weaknesses.",
      "SHA-2 includes SHA-224, SHA-256, SHA-384 and SHA-512, named after their digest length. SHA-2 is the recommended replacement."],
 ex:"You download an ISO image and the vendor publishes its SHA-256 hash. You compute the hash of your file: if it matches, the file was not altered in transit.",
 terms:[["Message digest","The fixed-length output of a hash function."],["Collision","Two different inputs producing the same hash."],["SHA-2","Family of hash algorithms: SHA-224, 256, 384, 512."]],
 trap:"A hash alone gives integrity, not confidentiality and not authentication. Anyone can compute a hash; you need a key (HMAC) or a signature to prove who produced it.",
 mnem:"Hash = fingerprint: same data, same print; one change, new print; you can't rebuild the finger from the print.",
 upd:"SHA-1 collisions were demonstrated in practice in 2017, and NIST plans to retire SHA-1 completely by 2030. SHA-3 (FIPS 202, 2015) is an alternative family with a different design.",
 ref:{c:"ch. 3, Hash Functions",a:"ch. 8",o:"Domain 3"}},

{id:"d3-attaques-crypto",d:3,t:"Cryptographic attacks",
 what:"Cryptanalysts try to recover the plaintext or the key without being given the key. In the real world, stealing the key is usually far easier than breaking the math, which is what police do with a search warrant.",
 pts:["Brute force tries every possible key. Given enough time, it always works; key length decides how much time.",
      "Social engineering tricks a person into revealing the key, for example by impersonating a user at the help desk.",
      "Known plaintext: the attacker has matching plaintext and ciphertext pairs and tries to derive the key, to decrypt other messages.",
      "Chosen plaintext: the attacker chooses what gets encrypted, using an encryption oracle. Adaptive chosen plaintext adjusts each round based on the previous one. Chosen ciphertext and adaptive chosen ciphertext are the mirror images, usually against asymmetric systems.",
      "Known key: the attacker knows something about the key (only uppercase letters and digits) and shrinks the search.",
      "Differential cryptanalysis compares how small differences in related plaintexts change the ciphertext. Linear cryptanalysis studies large numbers of known plaintext pairs. They can be combined.",
      "Side-channel attacks use physical clues such as power consumption, timing or CPU cycles."],
 ex:"An attacker measures the tiny power variations of a smart card while it signs data and recovers the private key. The algorithm was never broken: that is a side-channel attack.",
 terms:[["Encryption oracle","A device that encrypts on request without revealing the key."],["Differential cryptanalysis","Studying how differences in inputs affect outputs."],["Linear cryptanalysis","A known plaintext attack using many plaintext/ciphertext pairs."],["Side-channel attack","Exploiting physical leakage such as power or timing."]],
 trap:"A 'known key' attack does not mean the attacker has the key. It means they know something about it.",
 mnem:"Known = they have pairs. Chosen = they pick the input. Adaptive = they learn and adjust.",
 ref:{c:"ch. 3, Cryptographic Attacks",a:"ch. 8",o:"Domain 3"}},

{id:"d3-signature-pki",d:3,t:"Digital signatures and PKI",
 what:"A digital signature proves who sent a message and that it has not changed, so the sender cannot deny it. A public key infrastructure (PKI) makes this work at scale by vouching for whose public key is whose.",
 pts:["To sign: hash the message, then encrypt the hash with the sender's private key. Attach the signature to the message.",
      "To verify: hash the received message, decrypt the signature with the sender's public key, compare the two hashes. A match proves authentication, integrity and therefore nonrepudiation.",
      "A digital signature does not provide confidentiality: the message itself is not encrypted.",
      "A digital certificate is a public key signed by a certificate authority (CA). The standard format is X.509. An organizational registration authority (ORA) verifies identities before certificates are issued.",
      "Revoked certificates (stolen key, employee leaving) go on a certificate revocation list (CRL). The Online Certificate Status Protocol (OCSP) replaces CRLs with a query that scales better.",
      "Key storage: the issuing organization keeps a copy of key pairs. Key escrow: a third party keeps a copy, often for law enforcement, sometimes split between several parties.",
      "A retired key cannot be used for new work but can still decrypt old data. A destroyed key cannot be used at all."],
 ex:"Roy signs an email: he hashes it with SHA-256 and encrypts the hash with his private key. Rick decrypts the signature with Roy's public key and compares it with his own hash of the email. They match, so Roy sent it and nothing changed.",
 terms:[["Digital certificate","A public key signed by a certificate authority."],["X.509","The standard format for digital certificates."],["CRL","Certificate revocation list."],["OCSP","Online Certificate Status Protocol: real-time certificate status checks."]],
 trap:"The sender encrypts the hash with their PRIVATE key. Not the public key, and not the whole message.",
 mnem:"Sign with what only you have (private). Verify with what everyone has (public).",
 ref:{c:"ch. 3, Implementing Cryptography",a:"ch. 8",o:"Domain 3"}},

{id:"d3-protocoles",d:3,t:"Crypto in practice: TLS, IPsec, PGP, S/MIME",
 what:"Real protocols combine symmetric, asymmetric and hashing to protect data in motion. The exam focuses on IPsec's building blocks and on what each protocol protects.",
 pts:["SSL, then TLS (its successor), authenticate and encrypt web traffic in HTTPS, and can protect email, chat and VPNs.",
      "IPsec adds cryptography to IP (v4 and v6). Authentication Header (AH) gives authentication, integrity and replay protection but no confidentiality. Encapsulating Security Payload (ESP) gives confidentiality and optionally authentication and integrity.",
      "A security association (SA) is one-way: two systems using ESP need two SAs; adding AH makes four. Each SA is identified by a 32-bit security parameter index (SPI). ISAKMP manages SA creation.",
      "Tunnel mode (gateways) encrypts the whole original packet, headers included. Transport mode encrypts only the data, for hosts that speak IPsec natively.",
      "IKE (Internet Key Exchange) negotiates the algorithms, picking the strongest both sides support.",
      "PGP (Phil Zimmermann, 1991) provides confidentiality, integrity, authentication and nonrepudiation, and uses a web of trust instead of a central CA. S/MIME uses PKI to encrypt and sign email.",
      "Escrowed encryption splits a private key between several trusted third parties, released only with authorization such as a court order."],
 ex:"Two sites build a site-to-site VPN between their firewalls: IPsec ESP in tunnel mode, with IKE negotiating AES for confidentiality and SHA-2 for integrity.",
 terms:[["AH","Authentication Header: integrity and authentication, no confidentiality."],["ESP","Encapsulating Security Payload: provides confidentiality."],["Security association","A one-way IPsec connection with agreed parameters."],["Web of trust","PGP's model: users vouch for each other's keys instead of a CA."]],
 trap:"AH never encrypts. If the question needs confidentiality in IPsec, the answer is ESP.",
 mnem:"AH = Authentication Header, ESP = Encryption Secures Payload. Tunnel hides everything, transport hides the cargo.",
 upd:"All SSL versions and TLS 1.0 and 1.1 are deprecated (RFC 8996, 2021). TLS 1.3 (2018) is current, with TLS 1.2 still acceptable when well configured. ISAKMP and IKEv1 have largely given way to IKEv2.",
 ref:{c:"ch. 3, SSL and TLS, IPsec, PGP, S/MIME",a:"ch. 8",o:"Domain 3"}},

{id:"d3-perimetre",d:3,t:"Physical perimeter: fences, gates, lights, cameras, locks",
 what:"Physical security applies defense in depth to buildings. Any single barrier can fail, so critical assets sit behind several: fences, gates, lights, cameras, locks. The exam tests the classes and terms.",
 pts:["Fences: about 1 m (3 ft) deters casual visitors; 2.4 m (8 ft) with barbed wire prevents entry. Fences steer people to controlled entry points.",
      "Gates: Class I residential, Class II commercial (parking garage), Class III industrial (loading dock), Class IV restricted access (airport, prison).",
      "Lights are detective and deterrent. A lumen is the light of one candle; one lux is one lumen per square meter; a foot-candle is one lumen per square foot.",
      "CCTV is a detective control that helps guards. Infrared cameras see heat in the dark. Depth of field is the area in focus; field of view is the whole area seen.",
      "Locks are preventive. Key locks (pin tumbler, warded) and combination locks both suffer from low accountability because keys and codes are shared.",
      "Smart cards contain an integrated circuit (ICC), contact or contactless (RFID). Magnetic stripe cards are passive and have no circuit."],
 ex:"A data center fence is 2.4 m high with barbed wire, the vehicle entrance has a Class IV gate, the perimeter is lit, and cameras cover every door. Each layer backs up the others.",
 terms:[["Lux","One lumen per square meter."],["Depth of field","The part of the camera image that is in focus."],["Warded lock","A lock whose key must pass through channels called wards."],["ICC","Integrated circuit card: another name for a smart card."]],
 trap:"Shared keys and shared combinations destroy accountability: you cannot prove who opened the door. Badges tied to individuals solve this.",
 mnem:"Gate classes climb with the stakes: Home, Garage, Dock, Prison (I to IV).",
 ref:{c:"ch. 3, Perimeter Defenses",a:"ch. 10",o:"Domain 3"}},

{id:"d3-acces-phys",d:3,t:"Controlling entry: mantraps, detectors, walls and guards",
 what:"Once someone reaches the building, the next layers must stop unauthorized people from walking in behind others, detect intruders, and make every wall, door and ceiling equally hard to cross.",
 pts:["Tailgating (piggybacking): an unauthorized person follows an authorized one through a door. Counter it with policy and awareness.",
      "A mantrap has two doors: the first must close and lock before the second opens, and each needs authentication. Turnstiles enforce one person per authentication.",
      "Contraband checks look for weapons, metal or explosives: detective by nature, but also a strong deterrent.",
      "Motion detectors: ultrasonic, microwave and photoelectric sensors are active (they send energy). Passive infrared (PIR) sensors detect body heat.",
      "Doors, windows, walls, floors and ceilings should be equally strong, because attackers go for the weakest. Emergency exits need panic bars and must never block egress.",
      "Slab-to-slab walls run from the floor slab to the ceiling slab, so nobody crawls under a raised floor or over a drop ceiling.",
      "Guards are a dynamic control that can think and respond. Dogs protect perimeters but bring legal liability."],
 ex:"An office uses a badge reader and a single door. A visitor keeps walking in behind employees. Replacing the door with a turnstile enforces one entry per badge.",
 terms:[["Tailgating","Following an authorized person through a secured door."],["Mantrap","Two-door vestibule; the first door locks before the second opens."],["PIR sensor","Passive infrared sensor that detects body heat."],["Slab-to-slab wall","A wall running from the true floor to the true ceiling."]],
 trap:"Safety always wins over security: emergency exits must allow people out, even if it weakens the perimeter.",
 mnem:"Mantrap = airlock for people.",
 ref:{c:"ch. 3, Perimeter Defenses",a:"ch. 10",o:"Domain 3"}},

{id:"d3-site",d:3,t:"Site selection, design and system defenses",
 what:"Security starts before the building exists. Where you build, who shares the building, and how you track equipment all affect the confidentiality, integrity and availability of what is inside.",
 pts:["A greenfield is an undeveloped site. Check utility reliability: power outages are among the most common disasters. A UPS covers a short outage; generators cover longer ones but need fuel.",
      "Local crime rates matter first for employee safety, then for theft.",
      "Many data centers are not marked on the outside, to avoid attracting attention.",
      "Shared tenancy and adjacent buildings are risks: other tenants are already inside your perimeter, and attackers can use a neighbor's weaker building.",
      "The demarc is where the ISP's responsibility ends and the customer's begins. A shared demarc lets anyone with access attack every circuit in the building.",
      "Offsite media storage must be far enough away not to suffer the same disaster, with licensed and bonded couriers.",
      "Asset tracking databases show what you have and where, support compliance and terminations. Port controls disable USB and other ports, because small devices slip past contraband checks."],
 ex:"Before renting a floor in a multi-tenant building, you inspect the telecom room on the ground floor and find it unlocked and shared by every tenant. That shared demarc is a serious risk to all your circuits.",
 terms:[["Greenfield","Undeveloped land where a new facility can be designed from scratch."],["Demarc","Demarcation point between the provider's and the customer's responsibility."],["Port controls","Disabling or blocking physical ports on computers."]],
 trap:"On site selection questions, employee safety comes before asset protection.",
 mnem:"Know your neighbors, know your demarc, know your assets.",
 ref:{c:"ch. 3, Site Selection, Design, and Configuration",a:"ch. 10",o:"Domain 3"}},

{id:"d3-environnement",d:3,t:"Power, HVAC and fire detection",
 what:"Computers need clean power, the right temperature and humidity, and early warning of fire. The exam uses precise names for each kind of electrical problem.",
 pts:["Electrical faults: blackout (prolonged loss of power), fault (short loss), brownout (prolonged low voltage), sag (momentary low voltage), surge (prolonged high voltage), spike (momentary high voltage).",
      "Surge protectors absorb spikes and surges. A UPS gives temporary power and cleans it. Generators run as long as they have fuel.",
      "Electromagnetic interference (EMI) causes crosstalk between cables, which mostly harms integrity. Never run power cables beside network cables; UTP is more exposed than STP or coax; fiber is immune.",
      "HVAC should use a closed loop, positive pressure and drainage. Conrad recommends 40 to 55 % humidity and 20 to 25 °C (68 to 77 °F).",
      "Too dry means static electricity; too humid means condensation and corrosion.",
      "Heat detectors trigger on a temperature or a rate of rise. Smoke detectors use ionization or photoelectric sensing. Flame detectors see infrared or ultraviolet light but need line of sight."],
 ex:"The lights flicker for a second during a storm: that is a fault. The voltage stays low for an hour because the grid is overloaded: that is a brownout.",
 terms:[["Brownout","Prolonged low voltage."],["Spike","Momentary high voltage."],["Crosstalk","Magnetism from one cable interfering with another."],["Positive pressure","Air flows out of the room when doors open, keeping contaminants out."]],
 trap:"Prolonged versus momentary is the whole game: surge and brownout last, spike and sag are brief.",
 mnem:"High: Spike is Short, Surge is Sustained. Low: Sag is Short, Brownout is Burdensome. No power: Fault is Fleeting, Blackout is Big.",
 upd:"Other books quote slightly different ranges (for example 40 to 60 % humidity). ASHRAE's current data center guidance allows 18 to 27 °C. On the exam, reason from the risk: too dry causes static, too humid causes corrosion.",
 ref:{c:"ch. 3, Environmental Controls",a:"ch. 10",o:"Domain 3"}},

{id:"d3-incendie",d:3,t:"Personnel safety and fire suppression",
 what:"The first goal of physical security is keeping people alive. In a fire, safe evacuation comes before saving equipment, and suppression systems are designed with people in mind.",
 pts:["Safety training teaches a skill; safety awareness changes behavior. Post evacuation routes and set a meeting point.",
      "The safety warden makes sure everyone leaves; the meeting point leader makes sure everyone is accounted for. Duress systems alert people fast; travel safety covers remote work and business trips.",
      "Fire classes (US / Europe): A = ordinary combustibles, water or soda acid. B = flammable liquids (and gases, class C in Europe), Halon substitutes, CO2 or soda acid, never water. C (E in Europe) = electrical, nonconductive gas only. D = metals, dry powder. K (F in Europe) = kitchen oil, wet chemicals.",
      "Suppression works by cooling, removing oxygen, removing fuel or breaking the chemical reaction. Water is the safest agent; cut the power first.",
      "CO2 suffocates people as well as fires: only in unstaffed areas. Halon production was banned from 1994 under the Montreal Protocol; replacements include Argon, FE-13 (safest, breathable up to 30 %), FM-200 and Inergen.",
      "Wet pipe: water up to the heads. Dry pipe: compressed air holds the water back. Deluge: open heads, lots of water at once. Preaction: needs two triggers (alarm and head), best for data centers."],
 ex:"A server room with staff working inside needs a system that will not suffocate them and will not flood servers by accident: a preaction sprinkler system or a people-safe gas such as FM-200, not CO2.",
 terms:[["Safety warden","Ensures everyone evacuates the building."],["Meeting point leader","Ensures everyone is accounted for at the meeting point."],["Preaction system","Sprinklers that need both an alarm and an opened head before water flows."],["Montreal Protocol","1989 treaty that banned new Halon production from 1994."]],
 trap:"Soda acid conducts electricity, so it is wrong for electrical fires even though some sources list it. Class C (US) needs a nonconductive agent.",
 mnem:"A = Ash, B = Boils, C = Current, D = Dense metals, K = Kitchen.",
 ref:{c:"ch. 3, Personnel Safety and ABCDK Fires and Suppression",a:"ch. 10",o:"Domain 3"}},

{id:"d4-bases",d:4,t:"Network fundamentals: duplex, network sizes, switching",
 what:"Domain 4 is about protecting data in motion. It starts with precise vocabulary for how communication flows, how big a network is, and how data travels across it. The exam wants exact terms, not everyday approximations.",
 pts:["Simplex: one way only, like a car radio. Half-duplex: both ways but one at a time, like a walkie-talkie. Full-duplex: both ways at once, like a phone call.",
      "PAN (personal, about 100 m or less, Bluetooth), LAN (a building), MAN (a city or campus), WAN (cities to countries), GAN (a global collection of WANs).",
      "Internet: global peered networks running TCP/IP, best effort. Intranet: a private TCP/IP network. Extranet: a connection between private intranets, such as business partners.",
      "Circuit-switched networks dedicate a circuit between two points, even when idle (old phone networks, a T1).",
      "Packet-switched networks split data into packets that can take any route and are reassembled at the end. They share bandwidth, cost less and survive link failures better.",
      "Quality of service (QoS) gives priority to time-sensitive traffic, such as VoIP, over traffic that tolerates delay, such as SMTP email."],
 ex:"The link between a headquarters and a plantation office over an MPLS or Internet VPN is a WAN. Giving the IP phones QoS priority over email keeps calls clear when the link is saturated.",
 terms:[["Full-duplex","Sending and receiving at the same time."],["Extranet","A network connecting an organization's intranet with partners."],["Packet switching","Data split into packets routed independently."],["QoS","Quality of service: prioritizing specific traffic."]],
 trap:"Circuit switching guarantees bandwidth; packet switching shares it. When bandwidth is scarce on a packet network, the answer is QoS.",
 mnem:"Simplex = speaks only, half = takes turns, full = talks over each other.",
 ref:{c:"ch. 4, Fundamental Network Concepts",a:"ch. 11",o:"Domain 4"}},

{id:"d4-osi",d:4,t:"The OSI model, layer by layer",
 what:"The OSI model is a seven-layer reference model. Nobody runs it directly, but everyone uses it as a common language: 'a Layer 2 problem' means the same thing whatever the technology. Expect many questions that ask which layer something belongs to.",
 pts:["Layer 1, Physical: bits as energy (electricity, light, radio) and the medium. Cables, hubs, repeaters.",
      "Layer 2, Data link: LAN communication, MAC addresses, Ethernet cards, switches, bridges. Two sublayers: MAC (touches Layer 1) and LLC (touches Layer 3).",
      "Layer 3, Network: routing between LANs. IP addresses, routers, IPv4, IPv6.",
      "Layer 4, Transport: sequencing, flow control, error detection. TCP and UDP.",
      "Layer 5, Session: maintains connections between applications, such as remote procedure calls (RPC) and remounting a network share.",
      "Layer 6, Presentation: presents data in a usable form. Data conversion, character sets (ASCII), image formats (GIF, JPEG, TIFF).",
      "Layer 7, Application: where the user interfaces with the application. Browsers, Telnet, FTP."],
 ex:"You browse an HTTPS site: the browser works at Layer 7, JPEG images are Layer 6, TCP port 443 is Layer 4, the IP address is Layer 3, the Ethernet frame and MAC address are Layer 2, and the copper cable is Layer 1.",
 terms:[["LLC","Logical link control: the upper sublayer of Layer 2."],["MAC sublayer","Media access control: the lower sublayer of Layer 2, touching the physical layer."],["RPC","Remote procedure call: a session layer mechanism."]],
 trap:"'Maintenance of connections' points to Layer 5 (session), not Layer 4. Packet sequencing and retransmission are Layer 4; heavier work like remounting a share is Layer 5.",
 mnem:"Bottom to top: Please Do Not Throw Sausage Pizza Away (Physical, Data link, Network, Transport, Session, Presentation, Application).",
 ref:{c:"ch. 4, The OSI Model",a:"ch. 11",o:"Domain 4"}},

{id:"d4-tcpip",d:4,t:"The TCP/IP model: addresses, TCP, UDP, ICMP",
 what:"TCP/IP is the model networks actually run. It has four layers instead of seven, and a handful of protocols do most of the work. Know how its layers map to OSI and what each core protocol does.",
 pts:["Network access (OSI 1 and 2), Internet (OSI 3), Host-to-host transport (OSI 4), Application (OSI 5 to 7).",
      "A MAC address is 48 bits: 24-bit Organizationally Unique Identifier (OUI) plus 24-bit serial number. EUI-64 addresses are 64 bits (24-bit OUI, 40-bit serial).",
      "IPv4 uses 32-bit addresses (about 4.3 billion). IPv6 uses 128-bit addresses, with simpler routing and address assignment. Most systems are dual stack; reaching IPv6 through IPv4 is tunneling.",
      "IP is connectionless and unreliable: best effort. Reliability comes from TCP.",
      "TCP is reliable: three-way handshake, reordering and retransmission. Ports are 16 bits (0 to 65,535): reserved ports are 1023 and below, ephemeral ports 1024 and above.",
      "UDP is faster and simpler, used for loss-tolerant traffic (streaming) and quick query-response (DNS).",
      "ICMP helps IP report errors and troubleshoot. It has no ports; it uses types and codes."],
 ex:"A ping sends an ICMP echo request (a type, not a port). A DNS lookup uses UDP port 53. Downloading a file over HTTPS uses a TCP handshake to port 443.",
 terms:[["OUI","Organizationally Unique Identifier: the first 24 bits of a MAC address."],["Dual stack","Running IPv4 and IPv6 at the same time."],["Three-way handshake","SYN, SYN/ACK, ACK: how TCP opens a connection."],["Ephemeral port","A temporary port 1024 or higher, usable by any user."]],
 trap:"TCP/IP's Application layer covers OSI Layers 5, 6 and 7 together, and its Network access layer covers Layers 1 and 2.",
 mnem:"TCP is a registered letter (tracked, confirmed). UDP is a postcard (fast, no guarantee).",
 upd:"IANA formally splits ports into well-known (0 to 1023), registered (1024 to 49151) and dynamic or private (49152 to 65535).",
 ref:{c:"ch. 4, The TCP/IP Model",a:"ch. 11",o:"Domain 4"}},

{id:"d4-ports",d:4,t:"Application protocols and their ports",
 what:"The exam expects you to recognize common protocols, their ports and whether they protect anything. The pattern is simple: old protocols send everything in cleartext, and each has a secure replacement.",
 pts:["Telnet, TCP 23: remote terminal, everything including the password in plaintext.",
      "FTP: control on TCP 21, data from TCP 20 in active mode. Active FTP opens the data connection from server to client, which firewalls often block; passive FTP keeps all connections client to server.",
      "SSH, TCP 22: secure replacement for Telnet, FTP and the UNIX 'r' commands. Includes SFTP and SCP, and can tunnel other protocols.",
      "SMTP, TCP 25: email between servers. POP3, TCP 110, and IMAP, TCP 143: client access to mailboxes.",
      "DNS, port 53: UDP for small answers, TCP for large ones such as zone transfers.",
      "HTTP, TCP 80: cleartext web. HTTPS, TCP 443: web over SSL or TLS."],
 ex:"An auditor finds a switch still managed over Telnet. Anyone sniffing the management VLAN can read the admin password. Moving to SSH on port 22 fixes it.",
 terms:[["Passive FTP","FTP mode where the client opens both connections, friendlier to firewalls."],["SFTP","File transfer over SSH."],["Zone transfer","Copying a whole DNS zone between servers, over TCP 53."]],
 trap:"DNS uses both UDP and TCP on port 53. 'DNS is UDP only' is a wrong answer.",
 mnem:"20/21 FTP, 22 SSH, 23 Telnet, 25 SMTP: the early twenties are the old-school protocols.",
 upd:"Secure versions are the norm today: SMTP with STARTTLS or submission on 587, IMAPS on 993, POP3S on 995, and DNS over HTTPS or TLS for privacy.",
 ref:{c:"ch. 4, Application-Layer TCP/IP Protocols and Concepts",a:"ch. 11",o:"Domain 4"}},

{id:"d4-wan",d:4,t:"LAN and WAN technologies: Ethernet, T1/E1, Frame Relay, MPLS",
 what:"LAN technologies connect devices in a building; WAN technologies carry data between cities and countries, usually over a provider's network. The exam still asks about the classic circuits.",
 pts:["Ethernet works at Layer 2 and sends frames. It is baseband (one channel), so it must handle collisions when two nodes transmit at once.",
      "T1: dedicated 1.544 Mbps circuit, 24 channels of 64 kbps (DS0). T3: 28 T1s, 44.736 Mbps. These are US standards.",
      "E1: dedicated 2.048 Mbps circuit, 30 channels. E3: 16 E1s, 34.368 Mbps. These are European standards.",
      "Frame Relay is a packet-switched Layer 2 WAN protocol focused on speed, with no error recovery. It multiplexes virtual circuits over one link: a PVC is always up, an SVC is set up per call.",
      "MPLS forwards traffic using labels instead of IP headers, across a shared provider cloud. It carries voice and data and simplifies WAN routing."],
 ex:"A European subsidiary leases an E1 for its phone system: 2.048 Mbps and 30 voice channels. The same company links its sites through the provider's MPLS network.",
 terms:[["Baseband","One channel on the medium, so devices must share it."],["PVC","Permanent virtual circuit: always connected."],["SVC","Switched virtual circuit: set up for each call."],["MPLS","Multiprotocol label switching."]],
 trap:"T1 is the US standard at 1.544 Mbps, E1 the European one at 2.048 Mbps. Don't swap them.",
 mnem:"T for 'Twenty-four' channels, E for 'Europe' and 30.",
 upd:"T1, E1 and Frame Relay are legacy today. Most organizations now use fiber Internet, MPLS or SD-WAN over broadband, 4G/5G and satellite links such as Starlink.",
 ref:{c:"ch. 4, LAN and WAN Technologies and Protocols",a:"ch. 11",o:"Domain 4"}},

{id:"d4-convergence",d:4,t:"Converged protocols, VoIP, SDN and CDNs",
 what:"Convergence means carrying over Ethernet and IP what used to need its own network: industrial control, storage and voice. It saves money, and it exposes these services to IP attacks.",
 pts:["DNP3 is an open multilayer protocol for SCADA and smart grids in the energy sector. IEEE 1815-2012 added Secure Authentication with PKI support.",
      "Storage over the network (SAN): FCoE carries Fibre Channel over Ethernet, without TCP/IP, so it stays local. FCIP carries Fibre Channel over TCP/IP.",
      "iSCSI uses TCP/IP, so it can be routed beyond the LAN. It addresses storage with logical unit numbers (LUNs), which also serve for basic access control.",
      "VoIP carries voice over data networks. RTP carries the audio; SIP and H.323 handle signaling. SRTP secures VoIP with AES for confidentiality and SHA-1 for integrity. Many VoIP protocols have no security by default.",
      "Software-defined networking (SDN) separates the control plane (routing decisions, made centrally) from the data plane (forwarding packets). OpenFlow is the best-known protocol and uses TLS.",
      "Content distribution networks (CDNs) cache content on servers close to users to cut latency: Akamai, CloudFront, Cloudflare, Azure."],
 ex:"A site whose DNS and web traffic go through Cloudflare benefits from a CDN: visitors download pages from the nearest edge server, not from the origin.",
 terms:[["Convergence","Carrying voice, storage or industrial traffic over Ethernet and IP."],["LUN","Logical unit number: addresses storage in iSCSI."],["Control plane","The part of a router that decides where traffic goes."],["SRTP","Secure Real-time Transport Protocol for VoIP."]],
 trap:"FCoE does not use TCP/IP and cannot be routed; iSCSI and FCIP use TCP/IP and can.",
 mnem:"SDN: the brain (control plane) moves to a central controller, the muscles (data plane) stay in the switches.",
 ref:{c:"ch. 4, Converged Protocols and Software-Defined Networks",a:"ch. 13 and 14",o:"Domain 4"}},

{id:"d4-wifi",d:4,t:"Wireless: 802.11, WEP, WPA, WPA2, Bluetooth, RFID",
 what:"Wireless sends data through the air, where anyone nearby can listen. The exam tests the 802.11 standards and, above all, which security protocols are broken and which are acceptable.",
 pts:["FHSS hops between small channels in a pseudorandom order. DSSS spreads the signal across the whole band. OFDM uses several non-interfering frequencies at once.",
      "802.11b: 11 Mbps, 2.4 GHz. 802.11a: 54 Mbps, 5 GHz. 802.11g: 54 Mbps, 2.4 GHz. 802.11n: up to 600 Mbps, both bands, MIMO antennas. 802.11ac: up to 1.3 Gbps, 5 GHz.",
      "WEP (1999) is broken: any key can be cracked in minutes. Never use it.",
      "802.11i defines a robust security network (RSN). WPA2 is its full implementation: AES for confidentiality and CCMP for integrity.",
      "WPA was a stopgap for weaker hardware: RC4 with TKIP. Better than WEP, weaker than WPA2.",
      "Bluetooth (IEEE 802.15) is a PAN technology at 2.4 GHz. Hiding a device from discovery relies only on the secrecy of its 48-bit MAC address, which is easy to guess.",
      "RFID tags: active (battery, broadcasts on its own), semipassive (battery, answers the reader), passive (no battery, powered by the reader's signal)."],
 ex:"A plantation office still has an old access point running WEP. An attacker parked outside cracks the key in minutes. Replacing it with WPA2-Enterprise (802.1X) or WPA3 fixes the problem.",
 terms:[["RSN","Robust security network, defined by 802.11i."],["CCMP","Counter mode CBC-MAC protocol: provides integrity in WPA2."],["TKIP","Temporal Key Integrity Protocol: integrity in WPA."],["MIMO","Multiple-input multiple-output antennas, used by 802.11n."]],
 trap:"WPA2 = AES + CCMP. WPA = RC4 + TKIP. WEP = broken. The first 802.11 standard with reasonable security is 802.11i.",
 mnem:"WEP is Weak, WPA is a Patch, WPA2 is AES.",
 upd:"WPA3 (2018) replaces the WPA2 pre-shared key with SAE, which resists offline password guessing. Wi-Fi 6/6E (802.11ax) and Wi-Fi 7 (802.11be, 2024) are current. TKIP and WEP are deprecated.",
 ref:{c:"ch. 4, Wireless Local-Area Networks",a:"ch. 12",o:"Domain 4"}},

{id:"d4-equipements",d:4,t:"Network devices: hubs, bridges, switches, VLANs, routers",
 what:"Each network device works at a specific OSI layer, and that layer decides what it can see and filter. Place each device on its layer and most questions answer themselves.",
 pts:["Repeaters and hubs are Layer 1: they repeat bits without understanding them. A hub is a repeater with more than two ports and sends everything to every port.",
      "Bridges are Layer 2: two ports, two collision domains. They learn MAC addresses and forward only traffic that needs to cross.",
      "A switch is a bridge with many ports. With one device per port, each port is its own collision domain, so there are normally no collisions. Trunks connect switches.",
      "A VLAN is a virtual switch inside a physical switch. One switch can host many VLANs and one VLAN can span many switches. VLANs add defense in depth, for example separating management traffic.",
      "Routers are Layer 3: they route between LANs using IP addresses.",
      "A modem turns digital data into analog sound for phone lines and back (modulator/demodulator)."],
 ex:"A site puts servers, workstations, guest WiFi and management interfaces in four VLANs on the same switches. Traffic between them has to pass through the firewall, where rules control it.",
 terms:[["Collision domain","A segment where two devices transmitting at once collide."],["VLAN","Virtual LAN: logical segmentation of a switched network."],["Trunk","A link carrying several VLANs between switches."]],
 trap:"A hub is Layer 1, a switch is Layer 2, a router is Layer 3. Hubs send everything everywhere, which also makes sniffing trivial.",
 mnem:"Hub = shouts to everyone, switch = whispers to the right MAC, router = forwards between neighborhoods.",
 ref:{c:"ch. 4, Secure Network Devices and Protocols",a:"ch. 14",o:"Domain 4"}},

{id:"d4-firewalls",d:4,t:"Firewalls: packet filter, stateful, proxy",
 what:"Firewalls filter traffic between networks, and they differ in how much they understand. The more a firewall understands, the more secure it is, and usually the slower.",
 pts:["Firewalls are multihomed: several network interfaces on several networks.",
      "A packet filter judges each packet alone, on Layer 3 and 4 information (IP addresses and ports). Simple and fast, but no memory of state.",
      "A stateful firewall keeps a state table and compares each packet with earlier ones. It knows whether a reply matches a request. Slower than a packet filter but far more secure.",
      "Proxy firewalls terminate connections and act as intermediaries; the other two just pass or drop traffic.",
      "A circuit-level proxy works at Layer 5.",
      "An application-layer proxy works up to Layer 7 and can filter on application data such as HTTP content. It is the most secure of these types."],
 ex:"An attacker sends an unsolicited ICMP echo reply to an internal host. A packet filter that allows inbound echo replies lets it through. A stateful firewall checks its state table, finds no matching request and drops it.",
 terms:[["Multihomed","Having several network interfaces connected to different networks."],["State table","The firewall's memory of active connections."],["Application-layer proxy","A firewall that inspects traffic up to Layer 7."]],
 trap:"Ranking from least to most secure: packet filter, stateful, circuit-level proxy, application-layer proxy.",
 mnem:"Packet filter = goldfish (no memory). Stateful = remembers the conversation. Proxy = speaks on your behalf.",
 upd:"Next-generation firewalls (such as FortiGate or Palo Alto) combine stateful inspection, application awareness, IPS and TLS inspection in one device.",
 ref:{c:"ch. 4, Firewalls",a:"ch. 14",o:"Domain 4"}},

{id:"d4-eap",d:4,t:"Network authentication: 802.1X and EAP",
 what:"Before a device gets an IP address, the network can demand that it authenticate. 802.1X does this at the switch port or the access point, using EAP. The exam wants you to rank the EAP types by security.",
 pts:["802.1X is port-based network access control (PNAC). It authenticates at Layer 2, before the device receives an IP address. Used on wired and wireless networks.",
      "EAP (Extensible Authentication Protocol) is a framework describing many authentication methods. The client is the supplicant; it talks to an authentication server.",
      "LEAP: Cisco proprietary, released before 802.1X was final, seriously flawed. Do not use.",
      "EAP-TLS: requires certificates on both the server and the client. The most secure, and the most complex and costly because of the PKI.",
      "EAP-TTLS: drops the client certificate and allows passwords inside a TLS tunnel. Easier, less secure.",
      "PEAP (Cisco, Microsoft, RSA): similar to EAP-TTLS, also no client certificate needed."],
 ex:"A company WiFi uses 802.1X with EAP-TLS: each laptop has a machine certificate issued by the internal CA. A stolen password alone is useless, because the attacker also needs a valid certificate.",
 terms:[["Supplicant","The client requesting 802.1X authentication."],["PNAC","Port-based network access control: 802.1X."],["EAP-TLS","EAP with certificates on both server and client."]],
 trap:"Only EAP-TLS requires a client-side certificate. That is why it is the most secure answer.",
 mnem:"EAP-TLS = Two certificates, Two-way trust. TTLS and PEAP = one certificate, password for the client.",
 ref:{c:"ch. 4, Authentication Protocols and Frameworks",a:"ch. 15",o:"Domain 4"}},

{id:"d4-vpn",d:4,t:"VPNs: PPP, IPsec and TLS",
 what:"A virtual private network gives the privacy of a dedicated circuit over an untrusted network such as the Internet. It combines authentication, hashing for integrity and encryption for confidentiality.",
 pts:["PPP (point-to-point protocol) is Layer 2 and provides confidentiality, integrity and authentication over point-to-point links, synchronous (T1) or asynchronous (modem).",
      "IPsec was designed for IPv6 and ported to IPv4, which has no built-in confidentiality. ESP is IP protocol 50 and AH is IP protocol 51.",
      "TLS is the successor of SSL. HTTPS uses TCP 443.",
      "SSL/TLS VPNs are often simpler than IPsec: IPsec changes the operating system's networking and needs admin rights to install; TLS clients do not. IPsec is also harder to pass through firewalls."],
 ex:"Road warriors connect with a TLS VPN client that runs through the hotel firewall on port 443, while the two main offices are linked by a permanent IPsec tunnel between their firewalls.",
 terms:[["VPN","A secure tunnel over an untrusted network."],["IP protocol number","The field in the IP header identifying the carried protocol, such as 50 for ESP."],["SSL VPN","A VPN built on SSL/TLS, usually firewall-friendly."]],
 trap:"ESP is protocol 50 and AH is protocol 51. These are IP protocol numbers, not TCP or UDP ports.",
 mnem:"ESP at 50 encrypts, AH at 51 only authenticates.",
 upd:"Conrad calls TLS 1.2 current; TLS 1.3 (2018) is now the standard. Many organizations are moving from VPNs to zero trust network access (ZTNA), which grants access per application rather than to the whole network.",
 ref:{c:"ch. 4, VPN",a:"ch. 15",o:"Domain 4"}},

{id:"d4-distance",d:4,t:"Remote access and mobile workers",
 what:"Telework and mobile devices move users outside the perimeter. The exam covers the connection technologies, remote desktop methods, and the risks of chat, meetings and mobile devices.",
 pts:["DSL uses existing copper phone lines. ADSL: faster download than upload. SDSL: symmetric. HDSL: symmetric over two pairs, a cheap T1. VDSL: much faster, very short distance. The closer to the central office, the faster.",
      "Cable modems use the TV cable network; bandwidth is shared with neighbors on the same segment.",
      "VNC (TCP 5900) and RDP (TCP 3389, Microsoft proprietary) give graphical remote access. VNC is a screen scraper; RDP is not.",
      "Desktop virtualization (VDI) hosts desktops centrally. Application virtualization serves individual applications centrally, which eases patching and can run legacy software.",
      "Instant messaging (IRC, XMPP) and remote meeting tools can leak documents through file sharing and tunnel out through TLS. They must be patched and governed by policy.",
      "Mobile devices (PDAs, now smartphones): encrypt data or store little, lock with a PIN, enable remote wipe."],
 ex:"An RDP server exposed directly to the Internet on port 3389 is one of the most common ransomware entry points. Put it behind a VPN or gateway with MFA instead.",
 terms:[["ADSL","Asymmetric DSL: download faster than upload."],["VDI","Virtual desktop infrastructure."],["Screen scraping","Sending the drawing of the remote screen to the local display."]],
 trap:"VNC is a screen scraper, RDP is not. And cable modem bandwidth is shared, DSL is not.",
 mnem:"RDP 3389, VNC 5900: remote desktops live in the thousands.",
 upd:"Smartphones replaced PDAs and are now managed with MDM or UEM tools (such as Intune). Chat and meetings mostly run on SaaS platforms like Teams, Slack and Zoom.",
 ref:{c:"ch. 4, Remote Access",a:"ch. 15",o:"Domain 4"}},

{id:"d5-facteurs",d:5,t:"Identification, authentication and the factors",
 what:"Access control starts with a claim and a proof. You say who you are (identification), then you prove it (authentication). The exam classifies proofs into types, and expects you to know them by number.",
 pts:["Identification is claiming an identity, such as typing a username. It cannot be trusted alone.",
      "Authentication proves the claim. The combination of identification and authentication is a credential set.",
      "Type 1: something you know (password, PIN). The easiest, and often the weakest.",
      "Type 2: something you have (token, smart card). Type 3: something you are (biometrics). A fourth factor is somewhere you are (location).",
      "Static passwords are reusable. Passphrases are long static passwords made of words. One-time passwords are valid once. Dynamic passwords change at intervals, such as a PIN plus a token code.",
      "Multifactor authentication combines different types. Two passwords are still one factor."],
 ex:"Logging in with a password and then a code from an authenticator app combines Type 1 and Type 2. A password plus a security question is still only Type 1.",
 terms:[["Credential set","The combination of identification and authentication."],["Passphrase","A long password made of words in a phrase."],["One-time password","A password valid for a single use."],["Somewhere you are","Location-based authentication, such as GPS or IP geolocation."]],
 trap:"A PIN is Type 1 (something you know), even when it unlocks a Type 2 smart card.",
 mnem:"Know, Have, Are: 1, 2, 3.",
 upd:"NIST SP 800-63B now favors length over complexity, dropping forced periodic changes and checking passwords against breached lists. Passkeys (FIDO2) replace passwords with phishing-resistant keys.",
 ref:{c:"ch. 5, Authentication Methods",a:"ch. 16",o:"Domain 5"}},

{id:"d5-mdp-attaques",d:5,t:"Password attacks and salts",
 what:"Systems store password hashes, not passwords. Attackers either guess online against the login page or steal the hashes and crack them offline. Know each technique and the defense that beats it.",
 pts:["Password guessing is online: the attacker tries passwords against a live login. Defense: account lockout.",
      "Password cracking is offline: the attacker has the hashes and runs candidate passwords through the hash algorithm until one matches.",
      "Dictionary attack: hashes every word in a word list.",
      "Hybrid attack: modifies dictionary words (appending digits, replacing 'o' with '0').",
      "Brute force: tries every possible password. Slowest but always works eventually; faster CPUs and parallel computing keep shortening it.",
      "Rainbow tables: precomputed hashes for many passwords, trading memory for time.",
      "A salt is a random value combined with the password before hashing, so the same password hashes differently for each user. Salts make rainbow tables practically useless."],
 ex:"An attacker dumps an old database where passwords were hashed without salts. 'Summer2024!' appears 300 times with the same hash, and one rainbow table lookup cracks all 300 accounts. With salts, each would need separate work.",
 terms:[["Password cracking","Offline recovery of passwords from their hashes."],["Hybrid attack","Dictionary words with variations such as added digits."],["Rainbow table","A precomputed table of hashes for a time/memory trade-off."],["Salt","A random value added before hashing so identical passwords hash differently."]],
 trap:"Account lockout stops online guessing but does nothing against offline cracking. Salts fight rainbow tables.",
 mnem:"Guess at the door, crack at home.",
 upd:"Modern systems use deliberately slow password hashing such as bcrypt, scrypt or Argon2 on top of salts. Windows NTLM hashes are still unsalted, which is why pass-the-hash and cracking remain so effective in Active Directory.",
 ref:{c:"ch. 5, Type 1 Authentication",a:"ch. 16",o:"Domain 5"}},

{id:"d5-tokens",d:5,t:"Something you have: tokens",
 what:"A token is an object that proves you hold something unique. Tokens either stay in step with the server (synchronous) or answer a challenge (asynchronous).",
 pts:["Synchronous dynamic tokens stay in step with the authentication server.",
      "Time-based tokens show a code that changes every 60 seconds or so. The server knows the token's serial number, its owner and the time, so it can predict the code.",
      "Counter-based tokens advance one step per use; the server expects the next number in the sequence.",
      "Asynchronous dynamic tokens are not synchronized. The usual type is challenge-response: the server sends a challenge, the user enters it with a PIN, the token computes the response.",
      "RSA SecurID is the classic time-based token: static PIN plus a token code that changes every 60 seconds. The main drawback is cost."],
 ex:"The six-digit code in Microsoft Authenticator that changes every 30 seconds is a time-based synchronous token, running as an app instead of a keyring.",
 terms:[["Synchronous token","Stays in step with the server by time or counter."],["Challenge-response","The token computes an answer to a challenge sent by the server."],["Dynamic password","A password that changes regularly, such as PIN plus token code."]],
 trap:"Challenge-response tokens are asynchronous. Time and counter tokens are synchronous.",
 mnem:"Synchronous = in sync by the clock or the count. Asynchronous = answers when asked.",
 upd:"Time-based codes are standardized as TOTP (RFC 6238) and counter-based ones as HOTP (RFC 4226). Hardware security keys (FIDO2) use challenge-response with public keys and resist phishing.",
 ref:{c:"ch. 5, Type 2 Authentication",a:"ch. 16",o:"Domain 5"}},

{id:"d5-biometrie",d:5,t:"Biometrics: enrollment, FAR, FRR and CER",
 what:"Biometrics identify people by physical or behavioral traits. They are never perfect: the system either rejects the right person or accepts the wrong one. The exam loves these error rates.",
 pts:["Enrollment is registering for the first time; it should take 2 minutes or less. Throughput is the time to authenticate afterwards; typically 6 to 10 seconds.",
      "False rejection: an authorized person is refused. This is a Type I error, measured as the false reject rate (FRR).",
      "False acceptance: an unauthorized person is let in. This is a Type II error, measured as the false accept rate (FAR). It is the worse of the two.",
      "Raising sensitivity raises FRR and lowers FAR. Lowering sensitivity does the opposite.",
      "The crossover error rate (CER), also called equal error rate (EER), is where FAR and FRR are equal. A lower CER means a more accurate system; use it to compare products."],
 ex:"Staff complain that the fingerprint reader keeps refusing them, so an admin lowers the number of minutiae checked. False rejections drop, but false acceptances rise: impostors are now more likely to get in.",
 terms:[["FRR","False reject rate: Type I error, authorized users rejected."],["FAR","False accept rate: Type II error, impostors accepted."],["CER","Crossover error rate: where FAR equals FRR."],["Throughput","The time a biometric system takes to authenticate someone."]],
 trap:"When comparing biometric systems, choose the lowest CER. And a Type II error (false accept) is worse than a Type I.",
 mnem:"Two is worse than one: Type II (FAR) is worse than Type I (FRR). Accept the wrong person = Awful.",
 ref:{c:"ch. 5, Type 3 Authentication",a:"ch. 16",o:"Domain 5"}},

{id:"d5-bio-types",d:5,t:"Types of biometrics",
 what:"Each biometric method has its own balance of accuracy, cost, intrusiveness and privacy. The exam asks which to choose, and which to avoid.",
 pts:["Fingerprints: the most widely used. The system stores minutiae (ridge endings, bifurcations, whorls, core, delta), not the full image.",
      "Retina scan: laser scan of blood vessels at the back of the eye. Intrusive, can reveal health conditions (pregnancy, diabetes) and risks exchange of bodily fluids. Rarely used.",
      "Iris scan: a photo of the colored part of the eye. Passive, highly accurate, works with glasses, unique even between twins, no fluid exchange.",
      "Hand geometry: measures length, width, thickness and surface of the hand. Simple, can store data in as little as 9 bytes.",
      "Behavioral traits: keyboard dynamics (rhythm and pressure), dynamic signature (how you sign), voiceprint (vulnerable to replay; ask random words; illness can cause false rejects).",
      "Facial scan: passive, used mainly for identification by law enforcement.",
      "Somewhere you are: GPS, IP geolocation or the location of a card purchase can deny access from the wrong place."],
 ex:"A data center wants a highly accurate biometric that staff will accept and that raises no privacy issues. An iris scan beats a retina scan: similar accuracy, no contact, no health data.",
 terms:[["Minutiae","Specific fingerprint details such as ridge endings and bifurcations."],["Keyboard dynamics","Authenticating by typing rhythm and pressure."],["Replay attack","Playing back a recording, such as a recorded voice."]],
 trap:"Retina scans raise health and privacy issues. If the question mentions privacy or bodily fluids, avoid the retina answer.",
 mnem:"Retina = inside the eye, invasive. Iris = outside color, easy.",
 ref:{c:"ch. 5, Types of Biometric Controls",a:"ch. 16",o:"Domain 5"}},

{id:"d5-centralise",d:5,t:"Centralized access control, SSO and access reviews",
 what:"Organizations decide where access control lives: in one central place or spread across sites. Single sign-on builds on centralization, and every model needs regular reviews to stop privileges piling up.",
 pts:["Centralized access control uses one logical point, a third-party authentication server, and can provide SSO and all three As: authentication, authorization, accountability.",
      "Decentralized (distributed) access control lets each site run its own systems. More local power, but inconsistent policies and weakest links.",
      "Single sign-on (SSO): authenticate once, access many systems. Admins can add or revoke rights in one place.",
      "SSO's weakness: one stolen credential opens everything. Always pair SSO with multifactor authentication.",
      "Access aggregation: users gather more access over time. Authorization creep: new rights are added when roles change but old ones are never removed.",
      "User entitlements must be reviewed and audited regularly, and old rights removed when new ones are granted, to keep least privilege and separation of duties."],
 ex:"An employee moves from accounting to purchasing and keeps her accounting rights. She can now create a supplier and approve its payment: authorization creep has broken separation of duties. A quarterly access review catches it.",
 terms:[["SSO","Single sign-on: one authentication for many systems."],["Authorization creep","Gaining new rights without losing old ones."],["Entitlement","An access right granted to a user."],["Decentralized access control","Each site manages its own access control."]],
 trap:"SSO improves convenience and administration, but it raises the impact of a stolen credential. The fix is MFA, not abandoning SSO.",
 mnem:"Rights should follow the job, not follow the person forever.",
 ref:{c:"ch. 5, Access Control Technologies",a:"ch. 17",o:"Domain 5"}},

{id:"d5-federation",d:5,t:"Federation, SAML, IDaaS and LDAP",
 what:"Identity no longer stops at the company's walls. Federation lets one organization trust another's authentication, cloud identity services manage it for you, and directories store it.",
 pts:["Federated identity management (FIdM) applies SSO across organizations, up to Internet scale.",
      "SAML is an XML-based framework for exchanging security information, including authentication data. Its main goal is web SSO at Internet scale.",
      "OpenID is another framework for exchanging authentication data, but it is not XML-based.",
      "Identity as a service (IDaaS), or cloud identity, uses a cloud service to manage identities and SSO to cloud applications. It can raise or lower risk.",
      "LDAP (Lightweight Directory Access Protocol) queries directory services such as Active Directory. TCP or UDP 389. Queries can be cleartext and sometimes anonymous; use authentication and TLS."],
 ex:"Staff sign in to a SaaS application with their company account: the company's identity provider authenticates them and sends a SAML assertion that the application trusts. No separate password is created.",
 terms:[["FIdM","Federated identity management: SSO across organizations."],["SAML","Security Assertion Markup Language: XML exchange of authentication data."],["IDaaS","Identity as a service, also called cloud identity."],["LDAP","Protocol to query directory services, port 389."]],
 trap:"SAML is XML-based; OpenID is not. And IDaaS is cloud identity, not IaaS.",
 mnem:"SAML speaks XML. LDAP lives at 389 (636 with TLS).",
 upd:"Conrad expands SAML as 'security association markup language'; the correct name is Security Assertion Markup Language. Today OAuth 2.0 (authorization) and OpenID Connect (authentication built on OAuth) dominate. Azure AD is now Microsoft Entra ID.",
 ref:{c:"ch. 5, Federated Identity Management and LDAP",a:"ch. 17",o:"Domain 5"}},

{id:"d5-kerberos",d:5,t:"Kerberos and SESAME",
 what:"Kerberos is the third-party authentication protocol behind Active Directory logons. It uses tickets so that passwords never cross the network, and it authenticates both the client and the server.",
 pts:["Kerberos uses symmetric encryption, provides mutual authentication, and protects against sniffing and replay. Current version: 5 (RFC 4120).",
      "Components: principal (user or service), realm (a Kerberos network), ticket, credentials, KDC (Key Distribution Center), TGS (Ticket Granting Service), TGT (Ticket Granting Ticket).",
      "Step 1: the user asks the KDC to authenticate. Step 2: the KDC returns a session key encrypted with the user's key, and a TGT encrypted with the TGS key (the user cannot read it).",
      "Step 3: the user decrypts the session key and sends the TGT to the TGS to request a service. Step 4: the TGS returns a service session key and a service ticket encrypted with the service's key.",
      "Step 5: the user presents the ticket to the service, which trusts it and knows the user is authentic.",
      "Weaknesses: the KDC is a single point of failure, clocks must be synchronized (tickets expire), and symmetric keys are stored in plaintext on the KDC.",
      "SESAME extends Kerberos with public key cryptography, fixing plaintext key storage, and uses privilege attribute certificates (PACs) instead of tickets."],
 ex:"When a user logs in to a Windows domain, the domain controller acts as the KDC and issues a TGT. Opening a file share later triggers a request for a service ticket to that server, with no new password prompt.",
 terms:[["KDC","Key Distribution Center: authenticates principals."],["TGT","Ticket Granting Ticket: proof of authentication used to obtain service tickets."],["Principal","A user or service in Kerberos."],["Realm","A logical Kerberos network."]],
 trap:"Kerberos uses symmetric encryption, not asymmetric. SESAME is the one that adds public keys.",
 mnem:"Kerberos has three heads: client, KDC, service.",
 upd:"In Active Directory, Kerberos attacks such as Kerberoasting, pass-the-ticket and golden tickets are common. A stolen KRBTGT key lets an attacker forge any TGT.",
 ref:{c:"ch. 5, Kerberos and SESAME",a:"ch. 17",o:"Domain 5"}},

{id:"d5-aaa-protocoles",d:5,t:"AAA protocols: RADIUS, Diameter, TACACS+, PAP, CHAP",
 what:"When remote users or network devices need authentication against a central server, AAA protocols carry the request. The exam tests their ports, transports and weaknesses.",
 pts:["RADIUS: third-party AAA protocol (authentication, authorization, accounting). UDP 1812 for authentication and 1813 for accounting (formerly 1645 and 1646).",
      "Diameter is RADIUS's successor: more flexible, scalable, reliable and secure.",
      "TACACS: centralized, ID and static password, UDP 49. TACACS+ allows two-factor authentication, uses TCP 49, and is not backward compatible with TACACS.",
      "The All-in-One adds that RADIUS encrypts only the password, while TACACS+ encrypts the whole payload.",
      "PAP sends the password in cleartext. Insecure.",
      "CHAP uses a challenge and a shared secret that never crosses the network, which protects against replay (playback) attacks."],
 ex:"Network engineers log in to switches with their own accounts checked against a TACACS+ server, so every command is authorized and logged. WiFi users authenticate through RADIUS to the directory.",
 terms:[["RADIUS","Remote Authentication Dial In User Service."],["Diameter","The successor to RADIUS."],["TACACS+","Terminal Access Controller Access Control System Plus, TCP 49."],["CHAP","Challenge-Handshake Authentication Protocol."]],
 trap:"RADIUS uses UDP, TACACS+ uses TCP. PAP sends cleartext; CHAP never sends the secret.",
 mnem:"Diameter is twice the RADIUS. TACACS+ = TCP.",
 ref:{c:"ch. 5, Access Control Protocols and Frameworks",a:"ch. 17",o:"Domain 5"}},

{id:"d5-modeles",d:5,t:"Access control models: DAC, MAC, RBAC and more",
 what:"An access control model decides who controls permissions: the owner, the system, or the organization through roles. This is one of the most tested topics in the domain.",
 pts:["Discretionary access control (DAC): the owner of an object decides who may access it and can share it. Standard Windows and UNIX file systems.",
      "Mandatory access control (MAC): the system enforces access based on subjects' clearances and objects' labels. Users cannot share with someone lacking clearance. Focused on confidentiality.",
      "Role-based access control (RBAC): permissions attach to roles (nurse, backup operator), and users get roles. It is nondiscretionary: users cannot pass objects to others.",
      "Task-based access control: like RBAC but built around tasks (write a prescription, restore a backup).",
      "Rule-based access control: if/then rules applied to everyone, such as a proxy allowing only approved sites.",
      "Content-dependent: the decision depends on the data itself (you may see your own HR record, not the CIO's).",
      "Context-dependent: the decision depends on context such as time or location (help desk access only on weekdays 9:00 to 17:00)."],
 ex:"A share where the project lead can add colleagues herself is DAC. An AD group 'Finance-Approvers' that receives the permissions, with users added by IT according to their job, is RBAC.",
 terms:[["DAC","Discretionary: the owner controls access."],["MAC","Mandatory: the system enforces labels and clearances."],["RBAC","Role-based: permissions attached to roles."],["Context-dependent","Access depends on conditions such as time."]],
 trap:"Content-dependent looks at the data; context-dependent looks at the circumstances (time, place). Rule-based applies the same rules to all users; role-based depends on each user's role.",
 mnem:"DAC = the owner Decides. MAC = the system Mandates. RBAC = your Role decides.",
 upd:"The 2024 exam outline adds attribute-based access control (ABAC), where decisions combine attributes of the user, resource and environment, and risk-based access control. Conditional Access in Microsoft Entra ID is a real example.",
 ref:{c:"ch. 5, Access Control Models",a:"ch. 17",o:"Domain 5"}},

{id:"d6-pentest",d:6,t:"Penetration testing: types and methodology",
 what:"A penetration test is an authorized attempt to break in, to find out whether a real attacker could. It is narrow but convincing: a successful test proves the risk is real.",
 pts:["A penetration tester is a white hat with written authorization. Tests may target the Internet perimeter, the internal network or DMZ, wireless, phone lines (war dialing) or the physical site.",
      "Network attacks can be server-side, client-side or web application attacks. Social engineering uses the human mind to bypass controls and is often combined with other attacks.",
      "War dialing (from the movie WarGames) dials ranges of numbers looking for answering modems.",
      "Zero-knowledge (black-box) test: the tester starts with public information only. Full-knowledge (crystal-box) test: the tester gets diagrams, policies and past reports. Partial knowledge is in between.",
      "Methodology: planning, reconnaissance, scanning (enumeration), vulnerability assessment, exploitation, reporting.",
      "Black hats follow similar steps but skip planning and reporting, cover their tracks and install backdoors. Tools include Metasploit, Core Impact and Immunity Canvas."],
 ex:"A company hires testers with only its name and public website (zero knowledge) to see what an outsider could achieve. A second test gives them network diagrams (full knowledge) to check internal controls in depth.",
 terms:[["Zero-knowledge test","Black-box test: the tester starts with public information only."],["Full-knowledge test","Crystal-box test: the tester receives internal information."],["War dialing","Dialing phone numbers to find answering modems."],["Enumeration","Scanning to list hosts, ports and services."]],
 trap:"A penetration test always needs written authorization and an agreed scope and rules of engagement. Without them it is an attack.",
 mnem:"Plan, Recon, Scan, Assess, Exploit, Report: 'Please Read Scope And Explain Results'.",
 upd:"Common methodologies today are NIST SP 800-115, PTES and OSSTMM. Red teams (attack), blue teams (defense) and purple teams (both together) are standard vocabulary.",
 ref:{c:"ch. 6, Penetration Testing",a:"ch. 18",o:"Domain 6"}},

{id:"d6-pentest-regles",d:6,t:"Running a penetration test safely",
 what:"Testers can do real damage: read regulated data, crash systems, or stumble on a real intruder. The exam tests the professional response to each of these situations.",
 pts:["Confidentiality: testers may have no legal right to view real sensitive data such as card numbers. Place a harmless flag file next to the data, with the same permissions; reading it proves the data was reachable.",
      "Integrity: any active attack can damage systems, even with experienced testers. All parties must accept this risk, and tests often run during change maintenance windows.",
      "If testers find signs of a real, current compromise, they end the test quietly and escalate immediately to the client contact. Incident handling is not their job.",
      "Attackers who feel discovered may become more destructive, which is why testers stop rather than investigate.",
      "The final report is a roadmap for attacking the organization and must be protected at a very high level."],
 ex:"During a test the team spots an unknown web shell on the bank's application server that they did not install. They stop, call the 24/7 contact and hand over what they saw. They do not try to clean it up.",
 terms:[["Flag file","A harmless dummy file placed next to sensitive data to prove access."],["Rules of engagement","The agreed limits of what testers may and may not do."],["Maintenance window","A scheduled period when changes and risky activities are allowed."]],
 trap:"If an active compromise is found, the answer is 'end the test and escalate', not 'contain it', 'continue' or 'shut the server down'.",
 mnem:"Find a flag, not the data. Find an intruder, call, don't chase.",
 ref:{c:"ch. 6, Assuring Confidentiality, Data Integrity, and System Integrity",a:"ch. 18",o:"Domain 6"}},

{id:"d6-evaluations",d:6,t:"Vulnerability scans, audits, assessments and log reviews",
 what:"Penetration tests are only one way to check security. Scans find weaknesses, audits check compliance with a standard, assessments look at the whole picture, and log reviews check that controls actually work day to day.",
 pts:["Vulnerability scanning looks for a list of known weaknesses: misconfigurations, outdated software, missing patches. Tools: Nessus, OpenVAS.",
      "A vulnerability scan measures one half of Risk = Threat × Vulnerability. A penetration test matches vulnerabilities with threats to show real risk.",
      "A security audit tests against a published standard, such as PCI DSS. The auditor checks that required controls are present.",
      "A security assessment is holistic: it can include policies, the real effectiveness of administrative controls, change management, architecture review, penetration tests, scans and audits.",
      "Log review is one of the easiest ways to verify access control, and is mainly a detective control. Correlating logs (antivirus alerts plus failed logins plus firewall denials) can reveal a spreading worm."],
 ex:"Nessus flags 40 missing patches (vulnerability scan). A QSA checks the card environment against PCI DSS requirements (audit). A consultant reviews policies, architecture, scans and a pen test to give an overall view (assessment).",
 terms:[["Vulnerability scan","Automated search for known weaknesses."],["Security audit","A test against a published standard."],["Security assessment","A broad review of many controls across domains."],["Log review","Examining audit logs to verify controls; mainly detective."]],
 trap:"Audit = against a published standard. Assessment = broad and holistic. Scan = known vulnerabilities only, no exploitation.",
 mnem:"Scan finds holes, pen test walks through them, audit checks the rulebook, assessment sees the whole house.",
 ref:{c:"ch. 6, Assessing Access Control",a:"ch. 18",o:"Domain 6"}},

{id:"d6-code",d:6,t:"Testing software: static, dynamic, white-box, black-box",
 what:"Software has to be tested for security flaws, not just for features. Two big families exist: reading the code without running it, and running it to see how it behaves.",
 pts:["Static testing examines code that is not running: walkthroughs, syntax checking, code reviews, static analysis tools (such as lint for C).",
      "Dynamic testing examines code while it runs.",
      "Both complement each other: static analysis can find flaws in code not yet reachable at runtime; dynamic testing finds flaws that appear only when components interact.",
      "White-box testing gives the tester the source code and internals. Black-box testing gives no internal details; the program is only fed inputs.",
      "A requirements traceability matrix (RTM) maps customer requirements to test cases, to prove every requirement is tested.",
      "Synthetic transactions (synthetic monitoring) are scripts that simulate normal user actions to set performance baselines, watch production and test updates before deployment."],
 ex:"A monitoring script logs in to the web shop every five minutes, adds an item to the cart and checks the response time. If it slows down after an update, the team knows at once: synthetic transactions.",
 terms:[["Static testing","Testing code without executing it."],["Dynamic testing","Testing code while it runs."],["Traceability matrix","Maps requirements to test cases."],["Synthetic transaction","A scripted, simulated user action used for monitoring."]],
 trap:"If you do not have the source code, only dynamic, black-box methods are possible. Static analysis needs the code.",
 mnem:"Static = still (not running). Dynamic = doing (running).",
 upd:"Today's terms are SAST (static application security testing), DAST (dynamic), IAST (interactive) and SCA (software composition analysis, which checks third-party libraries).",
 ref:{c:"ch. 6, Software Testing Methods",a:"ch. 18",o:"Domain 6"}},

{id:"d6-niveaux",d:6,t:"Test levels, fuzzing and other techniques",
 what:"Software is tested at several levels, from single functions to the finished system accepted by the customer. Special techniques then hunt for the bugs normal testing misses.",
 pts:["Unit testing: low-level tests of functions, procedures or objects.",
      "Installation testing: testing software as it is installed and first run.",
      "Integration testing: testing components combined into a working system (subsets, or all at once in Big Bang integration).",
      "Regression testing: testing after updates, changes or patches, to make sure nothing that worked is now broken.",
      "Acceptance testing: checking that software meets the customer's operational requirements; done by the customer, it is user acceptance testing.",
      "Fuzzing is black-box testing with random, malformed input. A crash suggests a bounds-checking problem and a possible buffer overflow.",
      "Combinatorial testing tests all unique combinations of inputs (pairwise or all-pairs is an example). Misuse case testing models how an attacker would abuse the application. Test coverage analysis measures how much code was tested. Interface testing checks security is uniform across all interfaces."],
 ex:"A bank's app is available through a browser, an iOS app and an Android app. Interface testing checks that each one enforces the same authentication and transfer limits.",
 terms:[["Regression testing","Retesting after a change to catch new breakage."],["Fuzzing","Sending random malformed input to find crashes."],["Misuse case","A use case written from the attacker's point of view."],["Test coverage","How much of the code the tests actually exercise."]],
 trap:"Acceptance testing = meets the customer's operational requirements. Integration testing = components working together.",
 mnem:"Unit, Install, Integrate, Regress, Accept: small to big, then check again after every change.",
 ref:{c:"ch. 6, Software Testing Levels and Fuzzing",a:"ch. 18",o:"Domain 6"}},

{id:"d7-admin",d:7,t:"Administrative security: controlling people's access",
 what:"Security operations protect people, data, media and hardware in the production environment. The first set of controls limits what any single person can do, whether by mistake or on purpose.",
 pts:["Least privilege (minimum necessary access): people get only the access strictly required for their duties. It is the starting point for all administrative controls.",
      "Need to know goes beyond clearance: even cleared people only access what their task requires. Compartmentalization is how need to know is enforced.",
      "Separation of duties: several people are needed to complete a sensitive transaction. Abusing it then requires collusion between two or more people.",
      "Rotation of duties (job rotation): nobody performs a critical function for too long. It reduces single points of failure (the 'hit by a bus' scenario) and exposes fraud.",
      "Mandatory leave (forced vacation): while the person is away, someone else does the job, and hidden fraud tends to surface.",
      "A nondisclosure agreement (NDA) is signed before access to sensitive information; it is largely a directive control. Background checks screen people before hiring."],
 ex:"In a treasury team, one person enters a supplier payment and a second person approves it (separation of duties). Every treasurer must take two consecutive weeks off each year, while a colleague covers (mandatory leave).",
 terms:[["Least privilege","Only the minimum access needed for the job."],["Collusion","Two or more people conspiring to defeat separation of duties."],["Job rotation","Moving people between duties to reduce fraud and single points of failure."],["Mandatory leave","Forced vacation that lets hidden fraud surface."]],
 trap:"Separation of duties prevents one person acting alone; its known weakness is collusion. Job rotation and mandatory leave are mainly detective against fraud.",
 mnem:"Least privilege limits how much, need to know limits what, separation of duties limits who alone.",
 ref:{c:"ch. 7, Administrative Security",a:"ch. 20",o:"Domain 7"}},

{id:"d7-forensique",d:7,t:"Digital forensics and eDiscovery",
 what:"Digital forensics investigates incidents in a way that can stand up in court. The first rule is to change nothing: preserve the evidence and its environment.",
 pts:["Live forensics captures volatile data before power-off: a bit-by-bit image of memory, running processes and network connections.",
      "Forensic media analysis works on binary images of disks and portable media.",
      "Allocated space holds active data. Unallocated space holds no active data, but may still contain deleted files.",
      "Slack space is the unused end of a cluster; it may contain old data or data hidden on purpose. Attackers can also mark good sectors as 'bad' to hide data.",
      "Network forensics studies data in motion with legal admissibility in mind. Network intrusion detection is its operational cousin.",
      "Embedded devices and SSDs are hard to analyze: tools and techniques lag behind.",
      "eDiscovery is the pretrial phase of civil cases where lawyers obtain electronically stored information (ESI). Good retention policies reduce its cost; old backups are discoverable too."],
 ex:"A lawsuit requires all emails about a contract from the last five years. Because the company kept every backup forever, it must search terabytes of tapes: a costly eDiscovery. A clear retention policy would have limited it.",
 terms:[["Live forensics","Capturing volatile data such as memory before shutting a system down."],["Slack space","Unused space at the end of a cluster that may hold old or hidden data."],["ESI","Electronically stored information."],["eDiscovery","Obtaining electronic evidence during pretrial discovery."]],
 trap:"Capture volatile data (memory, connections) before pulling the plug. Powering off first destroys it.",
 mnem:"Volatile first: memory fades, the disk waits.",
 ref:{c:"ch. 7, Forensics",a:"ch. 22",o:"Domain 7"}},

{id:"d7-incident",d:7,t:"Incident response: the eight steps",
 what:"Every organization will suffer incidents. What matters is a tested, repeatable method. The exam uses a specific list of steps, and Conrad adds preparation in front of it.",
 pts:["1. Preparation: policies, procedures, training, tools and checklists, before anything happens.",
      "2. Detection (identification): analyzing events to decide whether they are an incident. Without good detection, nothing else works.",
      "3. Response (containment): limit the damage, for example isolating a system. Capture volatile data and a bit-by-bit image here.",
