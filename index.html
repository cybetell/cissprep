<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>cissprep.ch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --surface:#FFFFFF; --ink:#15203A; --muted:#566079; --line:#D8DEE8;
  --board:#15203A; --flap:#F2B233; --ok:#1C7C4E; --ko:#B42318; --mid:#A86A00; --focus:#2F6FDB;
  --okbg:#E6F4EC; --kobg:#FCEBEA; --midbg:#FFF4DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1522; --surface:#172033; --ink:#E9EDF4; --muted:#9BA6BB; --line:#2A3550;
    --board:#0A0F1A; --okbg:#12301F; --kobg:#3A1714; --midbg:#33270C; --ok:#4CC38A; --ko:#F2776B; --mid:#F2B233;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1522; --surface:#172033; --ink:#E9EDF4; --muted:#9BA6BB; --line:#2A3550;
  --board:#0A0F1A; --okbg:#12301F; --kobg:#3A1714; --midbg:#33270C; --ok:#4CC38A; --ko:#F2776B; --mid:#F2B233;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:19px;line-height:1.55;-webkit-text-size-adjust:100%;
}
main{max-width:640px;margin:0 auto;padding:20px 18px 120px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.6rem}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* Tableau des départs */
.board{background:var(--board);color:#fff;border-radius:14px;padding:18px 18px 16px;margin-bottom:22px}
.board .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.board .dest{font-size:1rem;color:#C9D2E3}
.flaps{display:flex;gap:4px}
.flap{background:#222E4A;color:var(--flap);font-weight:700;font-size:2.1rem;line-height:1;
  padding:8px 8px 6px;border-radius:5px;min-width:1.2em;text-align:center;position:relative;font-variant-numeric:tabular-nums}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#0A0F1A}
.board .sub{margin-top:10px;font-size:.9rem;color:#C9D2E3}

.go{display:block;width:100%;border:0;border-radius:14px;background:var(--flap);color:#15203A;
  font-weight:700;font-size:1.25rem;padding:20px 18px;text-align:left}
.go span{display:block;font-weight:400;font-size:.92rem;margin-top:4px}
.btn{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:12px 16px;font-weight:700}
.btn.full{display:block;width:100%}
.btn.solid{background:var(--ink);color:var(--paper)}
.link{background:none;border:0;color:var(--focus);padding:0;text-decoration:underline;font-weight:700}

.block{margin-top:26px}
.stat{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.stat div{flex:1;min-width:120px}
.stat b{display:block;font-size:1.5rem}

.dom{padding:12px 0;border-bottom:1px solid var(--line)}
.dom .top{display:flex;justify-content:space-between;gap:10px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.dom.soon{opacity:.55}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
.fiche ul{padding-left:1.2em;margin:.3em 0 .8em}
.fiche li{margin-bottom:.4em}
.terms dt{font-weight:700;margin-top:.6em}
.terms dd{margin:0}
.note{border-left:5px solid var(--mid);background:var(--midbg);padding:12px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.note.trap{border-color:var(--ko);background:var(--kobg)}
.refs{font-size:.9rem;color:var(--muted)}

/* Séance */
.sessionbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:10px 0 8px;z-index:5}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--ink)}
.steps span.done{background:var(--ok)}
.clock{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);margin-top:6px}

.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center}
.flash .q{font-size:1.2rem;font-weight:700}
.flash .a{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.grades button{border:0;border-radius:10px;padding:14px 6px;font-weight:700;color:#fff}
.g-ko{background:var(--ko)} .g-mid{background:var(--mid)} .g-ok{background:var(--ok)}

.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:14px;margin:10px 0}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default}
.qen{font-size:1.1rem;font-weight:700}
.expl{margin-top:12px}

.list button.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;color:var(--ink)}
.chk{font-weight:700;color:var(--ok);white-space:nowrap}
.tabsdom{display:flex;gap:8px;margin:10px 0 4px}
.tabsdom button{border:2px solid var(--line);background:none;color:var(--ink);border-radius:20px;padding:6px 14px}
.tabsdom button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

textarea{width:100%;min-height:120px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;color:var(--muted);padding:12px 4px 14px;font-size:.88rem;font-weight:700}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--flap)}
@media (prefers-reduced-motion:no-preference){
  .flap{animation:drop .5s ease-out both}
  .flap:nth-child(2){animation-delay:.08s}
  .flap:nth-child(3){animation-delay:.16s}
  @keyframes drop{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<main id="app"></main>
<nav><div>
  <button data-tab="home">Accueil</button>
  <button data-tab="fiches">Fiches</button>
  <button data-tab="weak">Faiblesses</button>
  <button data-tab="settings">Réglages</button>
</div></nav>

<script>
/* ============ PARAMÈTRES ============ */
const FORMATION = "2026-11-22";      // Formation Blueguard, Lausanne
const SESSION_MIN = 15;
const INTERVALS = {1:1,2:3,3:7,4:14,5:30}; // jours avant la prochaine révision, par boîte

/* ============ DOMAINES (référentiel ISC2, avril 2024) ============ */
const DOMAINS = [
 {id:1,en:"Security and Risk Management",fr:"Sécurité et gestion des risques",w:16},
 {id:2,en:"Asset Security",fr:"Sécurité des actifs",w:10},
 {id:3,en:"Security Architecture and Engineering",fr:"Architecture et ingénierie",w:13},
 {id:4,en:"Communication and Network Security",fr:"Réseaux et communications",w:13},
 {id:5,en:"Identity and Access Management",fr:"Identités et accès",w:13},
 {id:6,en:"Security Assessment and Testing",fr:"Évaluation et tests",w:12},
 {id:7,en:"Security Operations",fr:"Opérations de sécurité",w:13},
 {id:8,en:"Software Development Security",fr:"Sécurité du développement logiciel",w:10}
];

/* ============ FICHES ============
   Reformulées à partir du Conrad (3e éd.), avec les mises à jour connues.
   ref: c = Conrad, a = All-in-One 9e éd., o = Official Textbook 7e éd. */
const FICHES = [
{id:"d1-cia",d:1,t:"Les piliers de la sécurité",
 pts:["La triade CIA : confidentialité, intégrité, disponibilité. C'est la grille de lecture de tout le CISSP.",
      "Son opposé, DAD : divulgation (disclosure), altération, destruction.",
      "Le cours ISC2 ajoute l'authenticité et la non-répudiation, et parle aussi de vie privée (privacy) et de sûreté (safety).",
      "AAA : authentification, autorisation, et traçabilité (accounting, aussi appelé auditing)."],
 en:[["Non-repudiation","l'auteur ne peut pas nier son action (ex. signature numérique)"],["Accounting / auditing","garder la trace de qui a fait quoi"]],
 trap:"Le troisième A de AAA n'est pas le contrôle d'accès : c'est la traçabilité (accounting/auditing).",
 ref:{c:"début du chap. 1",a:"chap. 1",o:"Domaine 1"}},

{id:"d1-ethique",d:1,t:"Le code d'éthique ISC2",
 pts:["Trois parties : le préambule, les canons (obligatoires), les directives (indicatives).",
      "Les 4 canons s'appliquent dans l'ordre. En cas de conflit, le plus haut l'emporte.",
      "1. Protéger la société, le bien commun, la confiance du public et l'infrastructure.",
      "2. Agir de façon honorable, honnête, juste, responsable et légale.",
      "3. Fournir un service diligent et compétent aux mandants (principals).",
      "4. Faire progresser et protéger la profession.",
      "Canon 2 : si des lois de pays différents se contredisent, priorité à la juridiction où le service est fourni. Pas de discours alarmiste (FUD)."],
 en:[["Principals","employeurs et clients à qui tu dois un service"],["Commonwealth / common good","le bien commun"]],
 trap:"Si toutes les réponses sont éthiques, choisis celle qui correspond au canon le plus haut. La réponse la plus éthique est en général la bonne.",
 maj:"Le Conrad cite la formulation ancienne du canon 1 (society, commonwealth, infrastructure). La version actuelle ajoute le bien commun et la confiance du public : vérifie sur isc2.org/ethics.",
 ref:{c:"p. 15 à 16",a:"chap. 1",o:"Domaine 1"}},

{id:"d1-codes",d:1,t:"Les autres codes d'éthique",
 pts:["Computer Ethics Institute : les « Dix commandements de l'éthique informatique » (ne pas nuire, ne pas espionner les fichiers d'autrui, ne pas voler, ne pas copier de logiciel non payé...).",
      "IAB, RFC 1087 « Ethics and the Internet » (1989) : est contraire à l'éthique le fait, volontairement, de chercher un accès non autorisé, perturber l'usage d'Internet, gaspiller des ressources, détruire l'intégrité de l'information, compromettre la vie privée."],
 en:[["IAB","Internet Activities Board (aujourd'hui Internet Architecture Board)"]],
 trap:"À l'examen, le code ISC2 prime toujours. Les deux autres servent surtout à des questions d'identification.",
 ref:{c:"p. 16 à 17",a:"chap. 1",o:"Domaine 1"}},

{id:"d1-droit",d:1,t:"Systèmes juridiques et branches du droit",
 pts:["Trois grands systèmes : civil law (lois codifiées, le plus répandu, les précédents pèsent peu), common law (États-Unis, Royaume-Uni, Canada : les précédents judiciaires comptent), religious law (ex. charia). Le customary law repose sur les coutumes.",
      "Dans la common law : droit pénal (criminal), civil (tort) et administratif (regulatory).",
      "Pénal : la victime est la société, preuve au-delà du doute raisonnable, prison possible.",
      "Civil : préjudice, preuve par prépondérance (plus probable que non), dommages financiers.",
      "Administratif : règles des agences gouvernementales (HIPAA, FCC, FDA, FAA).",
      "Dommages : statutory (fixés par la loi, même sans perte réelle), compensatory (réparer la perte), punitive (punir et dissuader)."],
 en:[["Beyond a reasonable doubt","au-delà du doute raisonnable (pénal)"],["Preponderance of the evidence","prépondérance de la preuve (civil)"],["Tort law","responsabilité civile pour préjudice"]],
 trap:"« Civil law » a deux sens : un système juridique mondial, et une branche du droit au sein de la common law. Lis bien le contexte.",
 ref:{c:"p. 6 à 8",a:"chap. 3",o:"Domaine 1"}},

{id:"d1-duecare",d:1,t:"Due care, due diligence, négligence",
 pts:["Due care : faire ce que ferait une personne raisonnable (règle du « prudent man »). Vient de « duty of care ».",
      "Due diligence (selon Conrad) : la gestion de la due care, avec un processus. Exemple : demander aux équipes de patcher, c'est la due care ; vérifier qu'elles l'ont fait, c'est la due diligence.",
      "Gross negligence : le contraire de la due care. Juridiquement, c'est la pire position.",
      "Pouvoir démontrer la due care après une fuite de données te place en bien meilleure position devant un tribunal."],
 en:[["Prudent man rule","la règle de la personne prudente et raisonnable"],["Gross negligence","négligence grave"]],
 trap:"Les sources formulent différemment. Moyen mnémotechnique ISC2 : due diligence = savoir (rechercher, évaluer, vérifier) ; due care = agir (mettre en place les contrôles).",
 maj:"Le manuel officiel ISC2 définit la due diligence comme l'effort pour connaître et évaluer (avant et pendant), et la due care comme la mise en œuvre. En cas de doute à l'examen, suis l'ISC2.",
 ref:{c:"p. 8",a:"chap. 3",o:"Domaine 1"}},

{id:"d1-preuves",d:1,t:"Enquêtes et preuves",
 pts:["Types de preuves : real (objet physique), direct (témoignage des 5 sens), circumstantial (établit des circonstances), corroborative (renforce un fait), hearsay (de seconde main), secondary (copies, descriptions orales).",
      "Les journaux générés par ordinateur sont souvent classés en preuve secondaire.",
      "Best evidence rule : le tribunal préfère l'original à la copie.",
      "Intégrité : empreinte (hash) avant et après analyse. Chaîne de possession (chain of custody) : qui a manipulé la preuve, quand et où.",
      "Entrapment : la police pousse quelqu'un qui n'avait pas l'intention de commettre un crime (illégal). Enticement : on crée des conditions favorables pour quelqu'un déjà décidé (ex. honeypot).",
      "Crime informatique : l'ordinateur est soit la cible, soit l'outil."],
 en:[["Chain of custody","traçabilité complète de la manipulation d'une preuve"],["Hearsay","preuve par ouï-dire"]],
 trap:"Honeypot = enticement, pas entrapment.",
 maj:"Le Conrad cite MD5 et SHA-1 pour les empreintes. Les deux sont considérés comme faibles aujourd'hui : on utilise SHA-256.",
 ref:{c:"p. 9 à 10",a:"chap. 3",o:"Domaine 1"}},

{id:"d1-pi",d:1,t:"Propriété intellectuelle",
 pts:["Trademark : protège une marque (nom, logo). ™ pour une marque non enregistrée, ® pour une marque enregistrée.",
      "Patent (brevet) : monopole sur une invention nouvelle, en échange de sa publication. En général 20 ans depuis le dépôt.",
      "Copyright : protège la forme de l'expression (texte, musique, code), pas l'idée.",
      "Licences (EULA) : contrat entre éditeur et utilisateur, accepté par l'usage.",
      "Trade secret : information confidentielle qui donne un avantage concurrentiel. Protégée par NDA et clauses de non-concurrence, et par la due care de l'entreprise."],
 en:[["Trade secret","secret d'affaires"],["NDA","accord de confidentialité"]],
 trap:"Un secret d'affaires n'est jamais publié. Un brevet, si. Si la question parle de garder une recette secrète, c'est un trade secret.",
 ref:{c:"p. 10 à 11",a:"chap. 3",o:"Domaine 1"}},

{id:"d1-privacy",d:1,t:"Vie privée et transferts internationaux",
 pts:["Privacy : protéger la confidentialité des données personnelles (PII).",
      "Principes européens : informer, permettre de refuser le partage, consentement explicite pour les données sensibles, protection raisonnable.",
      "OCDE : lignes directrices sur la vie privée, dont la limitation de la collecte.",
      "Transferts UE vers pays tiers : seulement si le pays protège correctement les données.",
      "Convention de Budapest (Conseil de l'Europe) : coopération internationale contre la cybercriminalité.",
      "Export de cryptographie : CoCom pendant la guerre froide, puis l'arrangement de Wassenaar."],
 en:[["PII","données permettant d'identifier une personne"],["Data subject","la personne concernée par les données"]],
 trap:"Le Conrad parle de la directive de 1995 et du Safe Harbor : ces deux textes ne sont plus en vigueur.",
 maj:"Directive 95/46 remplacée par le RGPD (GDPR) en 2018. Safe Harbor invalidé en 2015, Privacy Shield invalidé en 2020, remplacé en 2023 par le EU-US Data Privacy Framework. L'OCDE compte aujourd'hui 38 membres. En Suisse : nouvelle LPD en vigueur depuis septembre 2023.",
 ref:{c:"p. 11 à 13",a:"chap. 3",o:"Domaine 1"}},

{id:"d1-tiers",d:1,t:"Sécurité et tiers",
 pts:["Le contrat est le principal contrôle de sécurité face à un prestataire.",
      "SLA : engagements mesurables, surtout sur la disponibilité.",
      "Attestation : un tiers audite le prestataire contre une référence et se prononce sur sa sécurité.",
      "Droit d'audit ou de test d'intrusion, ou à défaut un rapport d'audit tiers fourni par le prestataire.",
      "Achats (procurement) : impliquer la sécurité tôt est un contrôle préventif.",
      "Acquisition : évaluer les risques et tester la société rachetée avant de fusionner les réseaux.",
      "Scission (divestiture) : souvent plus risquée. Comptes et mots de passe dupliqués, badges, clés : tout révoquer."],
 en:[["SLA","accord de niveau de service"],["Divestiture","cession ou scission d'une activité"]],
 trap:"Face à un prestataire, la réponse « contrat » bat en général la réponse technique.",
 ref:{c:"p. 13 à 14",a:"chap. 2",o:"Domaine 1"}},

{id:"d1-docs",d:1,t:"Politique, procédure, standard, guideline, baseline",
 pts:["Policy : directive de haut niveau de la direction, obligatoire, sans nommer de technologie.",
      "Procedure : pas à pas pour une tâche, obligatoire.",
      "Standard : usage précis d'une technologie (ex. tel modèle de portable, tel OS), obligatoire.",
      "Guideline : recommandation, facultative.",
      "Baseline : façon uniforme d'appliquer un standard (ex. benchmarks CIS). Toute exception demande la signature de la direction.",
      "Passer de Windows à Linux ne change pas la politique, mais change les procédures et standards."],
 en:[["Mandatory / discretionary","obligatoire / facultatif"],["Hardening","durcissement d'un système"]],
 trap:"Le Conrad classe la baseline comme facultative (la méthode peut varier si le résultat est aussi sûr). La plupart des sources la voient comme le niveau minimum obligatoire. Retiens : le niveau fixé par la baseline est obligatoire.",
 ref:{c:"p. 17 à 19",a:"chap. 1",o:"Domaine 1"}},

{id:"d1-personnel",d:1,t:"Sécurité du personnel",
 pts:["Les utilisateurs sont le plus grand risque.",
      "Awareness (sensibilisation) : change le comportement. Training (formation) : donne une compétence.",
      "Vérification d'antécédents avant embauche : casier, expérience, diplômes, certifications. Mentir sur ses diplômes est très courant.",
      "Départ : révocation immédiate de tous les accès, et processus équitable (un ex-employé mécontent connaît les points faibles).",
      "Prestataires et consultants : mêmes formations, contrôles et règles que les employés.",
      "Outsourcing et offshoring : attention aux lois (HIPAA, SOX, GLBA ne s'appliquent pas à l'étranger). Consulter le juridique, protéger par contrat."],
 en:[["Awareness","sensibilisation"],["Offshoring","externalisation vers un autre pays"]],
 trap:"« Rappeler aux utilisateurs de ne pas partager leur mot de passe » = awareness, pas training.",
 ref:{c:"p. 19 à 20",a:"chap. 1",o:"Domaine 1"}},

{id:"d1-controles",d:1,t:"Types et catégories de contrôles",
 pts:["6 types : preventive (empêche), detective (alerte pendant ou après), corrective (répare), recovery (restaure), deterrent (dissuade), compensating (compense la faiblesse d'un autre contrôle).",
      "3 catégories : administrative (aussi appelée directive : politiques, formations), technical (logiciel, matériel : pare-feu, chiffrement), physical (serrures, clôtures, gardes).",
      "L'antivirus est à la fois détectif (scan) et correctif (quarantaine).",
      "Un contrôle se décrit par un type ET une catégorie : un dépistage avant embauche est administratif et préventif."],
 en:[["Deterrent","dissuasif"],["Compensating","compensatoire"]],
 trap:"Panneau « Attention au chien » = deterrent. Le chien lui-même serait plutôt préventif.",
 ref:{c:"p. 20 à 22",a:"chap. 2",o:"Domaine 1"}},

{id:"d1-risque",d:1,t:"Menace, vulnérabilité, matrice de risque",
 pts:["Asset : ce qui a de la valeur (données, systèmes, personnes, bâtiments).",
      "Threat : événement potentiellement nuisible (séisme, panne, ver). Vulnerability : faiblesse qui permet à la menace de nuire (système non patché).",
      "Risk = Threat × Vulnerability, parfois × Impact (ou × Cost).",
      "Vie humaine : impact quasi infini à l'examen. Le risque doit toujours être traité.",
      "Matrice qualitative : probabilité (rare à presque certain) × conséquences (insignifiant à catastrophique) donne L, M, H, E.",
      "Faible : processus normal. Moyen : informer le management. Élevé : informer la direction générale. Extrême : action immédiate, plan détaillé, direction informée."],
 en:[["Likelihood","probabilité"],["Consequences / impact","gravité"]],
 trap:"Dès qu'une réponse protège la vie humaine, elle passe avant tout le reste.",
 ref:{c:"p. 22 à 23",a:"chap. 2",o:"Domaine 1"}},

{id:"d1-ale",d:1,t:"ALE, TCO et ROI",
 pts:["AV : valeur de l'actif. EF : pourcentage de valeur perdu par incident.",
      "SLE = AV × EF (coût d'un incident).",
      "ARO : nombre d'incidents par an. ALE = SLE × ARO (coût annuel du risque).",
      "TCO : coût total d'une mesure (achat initial + maintenance, heures, abonnements), ramené par an.",
      "Valeur annuelle d'une mesure = ALE avant − ALE après − TCO annuel. Positive : bon investissement.",
      "Exemple Conrad : 1000 portables, AV 25 000, EF 100 %, ARO 11, ALE 275 000. Le chiffrement ramène l'EF à 10 % et l'ALE à 27 500, pour un TCO de 136 667 par an."],
 en:[["Exposure factor","facteur d'exposition"],["Annualized rate of occurrence","fréquence annuelle"]],
 trap:"Toujours comparer des montants annuels : un coût mensuel doit être multiplié par 12 avant de le comparer à l'ALE.",
 ref:{c:"p. 24 à 26",a:"chap. 2",o:"Domaine 1"}},

{id:"d1-choix",d:1,t:"Traiter le risque",
 pts:["Accepter : possible pour un risque faible, après avoir étudié toutes les options. Jamais pour un risque élevé, légal ou touchant la vie humaine.",
      "Réduire (mitigate) : ramener à un niveau acceptable. L'éliminer quand c'est possible.",
      "Transférer : typiquement l'assurance.",
      "Éviter : renoncer à l'activité ou au projet.",
      "Quantitatif : chiffres (ALE). Qualitatif : échelles approximatives (matrice). Hybride : les deux."],
 en:[["Risk transference","transfert du risque"],["Risk avoidance","évitement du risque"]],
 trap:"Ignorer un risque (rejet) n'est jamais une bonne réponse. Et transférer le risque ne transfère pas la responsabilité.",
 ref:{c:"p. 26 à 27",a:"chap. 2",o:"Domaine 1"}},

{id:"d1-attaquants",d:1,t:"Processus de risque NIST et types d'attaquants",
 pts:["NIST SP 800-30 (version 2002) : 9 étapes, de la caractérisation du système à la documentation des résultats.",
      "Black hat : malveillant. White hat : autorisé (pentesteurs). Hacktivist : motivation politique. Script kiddie : utilise des outils qu'il ne comprend pas.",
      "Outsiders : sans accès autorisé, la majorité des attaques, freinés par la défense en profondeur.",
      "Insiders : ont des accès, intention ou erreur, impact potentiel fort.",
      "Bot et botnet : machines infectées pilotées par un serveur de commande (C&C) géré par un bot herder. Zombie = bot.",
      "Phishing : tromper pour obtenir des identifiants. Spear phishing : vise une personne précise."],
 en:[["Bot herder","celui qui pilote le botnet"],["Spear phishing","hameçonnage ciblé"]],
 maj:"NIST SP 800-30 rev. 1 (2012) remplace les 9 étapes par 4 : préparer, conduire, communiquer, maintenir. Le cadre global est le RMF (SP 800-37). On parle aussi de whaling pour le phishing visant les dirigeants.",
 ref:{c:"p. 28 à 29",a:"chap. 2",o:"Domaine 1"}},

{id:"d2-classif",d:2,t:"Classifier les données",
 pts:["Les objets ont des labels, les sujets ont des clearances.",
      "Gouvernement US : Top Secret (dommage exceptionnellement grave), Secret (dommage grave), Confidential (dommage).",
      "Privé : « Internal use only », « Company proprietary »...",
      "Clearance : peut-on faire confiance à cette personne, aujourd'hui et à l'avenir ?",
      "Formal access approval : accord documenté du data owner, la personne comprend les règles et les conséquences.",
      "Need to know : plus fin que le moindre privilège, décision objet par objet. La compartimentation l'applique techniquement."],
 en:[["Clearance","habilitation"],["Need to know","besoin d'en connaître"],["Compartmentalization","cloisonnement"]],
 trap:"Need to know ≠ least privilege : le moindre privilège regroupe des objets, le besoin d'en connaître décide pour chaque objet.",
 maj:"Le Conrad cite l'Executive Order 12356, remplacé depuis 2009 par l'EO 13526. Les trois niveaux restent les mêmes.",
 ref:{c:"p. 34 à 35",a:"chap. 5",o:"Domaine 2"}},

{id:"d2-media",d:2,t:"Supports sensibles, manipulation, conservation",
 pts:["Les données sensibles sont sur un support : penser aussi aux sauvegardes.",
      "Manipulation : personnes vérifiées, formées, et journal écrit indiquant qui est responsable du support.",
      "Conservation (retention) : pas au delà de la durée d'utilité ou de l'obligation légale, la plus longue des deux.",
      "Garder trop longtemps expose inutilement les données."],
 en:[["Retention","durée de conservation"],["Handling","manipulation"]],
 trap:"La loi peut obliger à garder des données bien au delà de leur utilité : l'obligation légale gagne.",
 ref:{c:"p. 35",a:"chap. 5",o:"Domaine 2"}},

{id:"d2-roles",d:2,t:"Les rôles autour des données",
 pts:["Business ou mission owner (direction générale) : crée le programme de sécurité, le finance, lui donne sa priorité.",
      "Data owner : un manager responsable d'une donnée. Fixe le label de sensibilité et la fréquence de sauvegarde.",
      "System owner : un manager responsable des machines qui hébergent les données (patchs, durcissement, sécurité physique).",
      "Custodian : protection concrète au quotidien (sauvegardes, restaurations, patchs, antivirus). Exécute, ne décide pas.",
      "Users : respectent les règles et connaissent les sanctions.",
      "Data controller : crée et gère la donnée (ex. RH). Data processor : la traite pour son compte (ex. prestataire de paie).",
      "Limitation de la collecte : ne collecter que le minimum, de façon légale et loyale."],
 en:[["Custodian","gardien, exécutant"],["Data processor","sous-traitant du traitement"]],
 trap:"Le data owner décide, le custodian exécute. Une société de paie externe est un data processor.",
 maj:"Au sens du RGPD, le controller est celui qui détermine les finalités et les moyens du traitement.",
 ref:{c:"p. 36 à 37",a:"chap. 5",o:"Domaine 2"}},

{id:"d2-memoire",d:2,t:"Mémoire et rémanence",
 pts:["Rémanence : données qui persistent malgré une suppression non invasive.",
      "RAM : volatile, perd tout sans courant. ROM, disque, bande : non volatiles.",
      "Cache : la plus rapide. Registres dans le CPU, cache L1 sur le CPU, L2 juste à côté. Le cache utilise de la SRAM.",
      "SRAM : bascules (flip-flops), rapide et chère, pas de rafraîchissement. DRAM : condensateurs, moins chère, doit être rafraîchie en permanence.",
      "PROM : écrite une seule fois. EPROM : effacée aux ultraviolets. EEPROM : effacée électriquement, octet par octet.",
      "Flash (clé USB) : EEPROM écrite par blocs."],
 en:[["Data remanence","rémanence des données"],["Flip-flop","bascule électronique"]],
 trap:"SRAM = rapide, chère, bascules, cache. DRAM = condensateurs, rafraîchissement.",
 ref:{c:"p. 37 à 38",a:"chap. 6",o:"Domaine 2"}},

{id:"d2-ssd",d:2,t:"Le cas des SSD",
 pts:["Un SSD combine de la mémoire flash et de la DRAM.",
      "Le dégaussage n'a aucun effet sur un SSD.",
      "Les blocs sont logiques : le SSD n'écrase pas un bloc, il écrit ailleurs. L'écrasement secteur par secteur n'est donc pas fiable.",
      "TRIM améliore les performances mais ne détruit pas les données de façon fiable.",
      "Méthodes valables : ATA Secure Erase (SSD en état de marche) et destruction (SSD endommagé)."],
 en:[["Garbage collection","nettoyage des blocs en arrière-plan"],["Secure erase","effacement sécurisé intégré au disque"]],
 trap:"SSD + dégaussage = toujours faux.",
 maj:"NIST SP 800-88 ajoute l'effacement cryptographique (crypto erase) : on détruit la clé d'un disque chiffré.",
 ref:{c:"p. 39",a:"chap. 6",o:"Domaine 2"}},

{id:"d2-destruction",d:2,t:"Détruire les données",
 pts:["Object reuse : récupérer des informations sur un support réutilisé (de la fouille de poubelles à l'analyse des blocs non alloués).",
      "Supprimer un fichier retire seulement son entrée dans la table (FAT). Formater remplace la table. Les données restent.",
      "Overwriting (wiping) : écrire des zéros ou des caractères aléatoires sur tout le disque.",
      "Degaussing : champ magnétique puissant, uniquement pour les supports magnétiques (bandes, disques durs).",
      "Destruction : incinération, broyage, acide. La méthode la plus sûre.",
      "Shredding : destruction physique du papier ou de petits supports."],
 en:[["Dumpster diving","fouille de poubelles"],["Degaussing","démagnétisation"]],
 trap:"La destruction physique est toujours la réponse la plus sûre. Pour un support endommagé, écraser n'est pas possible.",
 maj:"NIST SP 800-88 classe les méthodes en trois niveaux : clear, purge, destroy.",
 ref:{c:"p. 39 à 40",a:"chap. 6",o:"Domaine 2"}},

{id:"d2-certif",d:2,t:"Certification, accréditation, Common Criteria",
 pts:["Certification : le système répond aux exigences de sécurité du data owner.",
      "Accreditation : le data owner accepte la certification et le risque résiduel, avant la mise en production.",
      "Common Criteria (ISO 15408) : standard international pour évaluer la sécurité des produits IT.",
      "Target of Evaluation (ToE) : le produit évalué. Security Target : sa documentation de sécurité. Protection Profile : exigences indépendantes pour une catégorie de produits (ex. pare-feu).",
      "EAL1 à EAL7 : de fonctionnellement testé à formellement vérifié, conçu et testé."],
 en:[["Residual risk","risque résiduel"],["EAL","niveau d'assurance de l'évaluation"]],
 trap:"Certification = technique. Accréditation = décision de la direction qui accepte le risque.",
 maj:"Dans le vocabulaire NIST actuel (RMF), l'accréditation s'appelle « authorization » (ATO).",
 ref:{c:"p. 40 à 42",a:"chap. 6",o:"Domaine 2"}},

{id:"d2-cadres",d:2,t:"Standards et cadres de contrôle",
 pts:["PCI DSS : protège les données de cartes bancaires, imposé aux commerçants.",
      "OCTAVE (Carnegie Mellon) : gestion des risques en 3 phases.",
      "ISO 27002 (ex 17799) : code de bonnes pratiques, catalogue de contrôles. ISO 27001 : exigences d'un système de management (ISMS), certifiable.",
      "COBIT (ISACA) : gouvernance et contrôle de l'IT.",
      "ITIL : gestion des services IT.",
      "Scoping : décider quelles parties d'un standard s'appliquent (pas de WiFi, pas de contrôles WiFi). Tailoring : adapter le standard à l'organisation (sélection, scoping, contrôles compensatoires)."],
 en:[["ISMS","système de management de la sécurité de l'information"],["Tailoring","personnalisation d'un référentiel"]],
 trap:"27001 = exigences, certifiable. 27002 = catalogue de contrôles, pas de certification.",
 maj:"Versions actuelles : PCI DSS v4.0 (2022), ISO 27001 et 27002 édition 2022 (93 contrôles en 4 thèmes : organisationnel, humain, physique, technologique), COBIT 2019, ITIL 4.",
 ref:{c:"p. 40 à 43",a:"chap. 4",o:"Domaine 2"}},

{id:"d2-donnees",d:2,t:"Données au repos et en transit",
 pts:["Data at rest : sur un disque ou dans un fichier. Data in motion : en transit sur un réseau.",
      "Chiffrement des disques et bandes : protège même après une brèche physique. Le chiffrement complet du disque est préférable au chiffrement partiel (fichiers temporaires, swap).",
      "Sauvegardes hors site, via un prestataire cautionné et assuré, sur un site non exposé au même sinistre. Jamais chez les employés.",
      "En transit : chiffrement de bout en bout (ex. VPN IPsec), aussi en interne par défense en profondeur."],
 en:[["Whole disk encryption","chiffrement complet du disque"],["Bonded","cautionné (garantie financière)"]],
 trap:"Emporter les bandes chez soi est toujours une mauvaise réponse.",
 ref:{c:"p. 43 à 44",a:"chap. 6",o:"Domaine 2"}}
];

/* ============ ÉTAT ============ */
const KEY="cissprep.v1";
function blank(){return {cards:{},qcm:{},read:{},streak:{last:null,count:0},log:[]}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const pad=n=>String(n).padStart(2,"0");
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function daysUntil(iso){return Math.round((new Date(iso+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fiche=id=>FICHES.find(f=>f.id===id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function dueCards(){const t=today();return CARDS.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t).sort((a,b)=>S.cards[a.id].due.localeCompare(S.cards[b.id].due))}
function nextFiche(){return FICHES.find(f=>!S.read[f.id])||null}
function weakness(fid){
  let w=0;
  CARDS.filter(c=>c.f===fid).forEach(c=>{const s=S.cards[c.id];if(s&&s.miss&&s.box<=2)w+=s.miss});
  QCM.filter(q=>q.f===fid).forEach(q=>{const s=S.qcm[q.id];if(s&&s.last===false)w+=2});
  return w;
}
function mastery(d){
  const cs=CARDS.filter(c=>fiche(c.f).d===d);if(!cs.length)return null;
  return Math.round(cs.reduce((t,c)=>t+((S.cards[c.id]||{box:0}).box/5),0)/cs.length*100);
}
function grade(card,g){
  const s=S.cards[card.id]||{box:0,miss:0,due:today()};
  if(g===0){s.box=1;s.miss=(s.miss||0)+1;s.due=addDays(today(),1)}
  else if(g===1){s.box=Math.max(1,s.box);s.due=addDays(today(),1)}
  else{s.box=Math.min(5,Math.max(1,s.box+1));s.due=addDays(today(),INTERVALS[s.box])}
  S.cards[card.id]=s;save();
}
function bumpStreak(){
  const t=today(),st=S.streak;
  if(st.last===t)return;
  st.count=(st.last===addDays(t,-1))?st.count+1:1;st.last=t;save();
}

/* ---- Séance ---- */
function startSession(fid,weakMode){
  let cards,qcm,f=fid?fiche(fid):null;
  if(weakMode){
    const weakF=FICHES.filter(x=>weakness(x.id)>0).map(x=>x.id);
    cards=CARDS.filter(c=>weakF.includes(c.f)&&S.cards[c.id]&&S.cards[c.id].box<=2).slice(0,15);
    qcm=shuffle(QCM.filter(q=>S.qcm[q.id]&&S.qcm[q.id].last===false)).slice(0,5);
    if(qcm.length<5)qcm=qcm.concat(shuffle(QCM.filter(q=>weakF.includes(q.f)&&!qcm.includes(q))).slice(0,5-qcm.length));
  }else{
    cards=dueCards().slice(0,12);
    if(f)cards=cards.concat(CARDS.filter(c=>c.f===f.id&&!S.cards[c.id]&&!cards.includes(c)));
    const mine=f?shuffle(QCM.filter(q=>q.f===f.id)).slice(0,3):[];
    const readIds=Object.keys(S.read);
    const missed=shuffle(QCM.filter(q=>readIds.includes(q.f)&&S.qcm[q.id]&&S.qcm[q.id].last===false&&!mine.includes(q)));
    const other=shuffle(QCM.filter(q=>readIds.includes(q.f)&&!mine.includes(q)&&!missed.includes(q)));
    qcm=mine.concat(missed,other).slice(0,5);
    if(qcm.length<5&&f)qcm=qcm.concat(shuffle(QCM.filter(q=>q.f===f.id&&!qcm.includes(q)))).slice(0,5);
  }
  qcm=qcm.map(q=>{const order=shuffle(q.o.map((_,i)=>i));return {...q,order}});
  ses={f,weakMode,step:f&&!weakMode?0:1,cards,ci:0,reveal:false,qcm,qi:0,picked:null,score:0,graded:{ok:0,mid:0,ko:0},start:Date.now(),missedQ:[]};
  if(ses.step===1&&!cards.length)ses.step=2;
  render();window.scrollTo(0,0);
}

function sessionHeader(){
  const names=["Notion","Rappel","QCM","Bilan"];
  const min=Math.floor((Date.now()-ses.start)/60000);
  return `<div class="sessionbar"><div class="steps">${names.map((n,i)=>`<span class="${i<ses.step?"done":i===ses.step?"on":""}" title="${n}"></span>`).join("")}</div>
  <div class="clock"><span>${names[ses.step]}</span><span>${min} / ${SESSION_MIN} min</span></div></div>`;
}

function ficheHTML(f){
  return `<div class="fiche">
  <p class="muted small">Domaine ${f.d} · ${esc(DOMAINS[f.d-1].en)}</p>
  <h1>${esc(f.t)}</h1>
  <ul>${f.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
  <h3>Termes de l'examen</h3>
  <dl class="terms">${f.en.map(e=>`<dt lang="en">${esc(e[0])}</dt><dd>${esc(e[1])}</dd>`).join("")}</dl>
  ${f.trap?`<div class="note trap"><b>Piège d'examen.</b> ${esc(f.trap)}</div>`:""}
  ${f.maj?`<div class="note"><b>Mis à jour depuis le livre.</b> ${esc(f.maj)}</div>`:""}
  <p class="refs">Conrad ${esc(f.ref.c)}. Pour approfondir : All-in-One ${esc(f.ref.a)}, Official Textbook ${esc(f.ref.o)}.</p>
  </div>`;
}

function renderSession(){
  const s=ses;let body="";
  if(s.step===0){
    body=`${ficheHTML(s.f)}<button class="btn solid full" id="next">J'ai lu, passer au rappel</button>`;
  }else if(s.step===1){
    const c=s.cards[s.ci];
    body=`<p class="muted small">Carte ${s.ci+1} sur ${s.cards.length}. Réponds de tête avant de retourner.</p>
    <div class="card flash"><div class="q">${esc(c.q)}</div>
    ${s.reveal?`<div class="a">${esc(c.a)}</div>`:""}</div>
    ${s.reveal?`<div class="grades"><button class="g-ko" data-g="0">Raté</button><button class="g-mid" data-g="1">Hésité</button><button class="g-ok" data-g="2">Su</button></div>`
      :`<button class="btn solid full" id="reveal">Voir la réponse</button>`}
    <p class="muted small" style="margin-top:10px">${esc(fiche(c.f).t)}</p>`;
  }else if(s.step===2){
    const q=s.qcm[s.qi];
    body=`<p class="muted small">Question ${s.qi+1} sur ${s.qcm.length}. Pense comme un manager : la réponse qui protège l'organisation.</p>
    <div class="qen" lang="en">${esc(q.q)}</div>
    ${q.order.map(i=>{
      let cls="";if(s.picked!==null){if(i===q.a)cls="right";else if(i===s.picked)cls="wrong"}
      return `<button class="opt ${cls}" data-i="${i}" lang="en" ${s.picked!==null?"disabled":""}>${esc(q.o[i])}</button>`}).join("")}
    ${s.picked!==null?`<div class="note ${s.picked===q.a?"":"trap"} expl"><b>${s.picked===q.a?"Juste.":"Pas tout à fait."}</b> ${esc(q.x)}</div>
      <button class="btn solid full" id="nextq">${s.qi+1<s.qcm.length?"Question suivante":"Voir le bilan"}</button>`:""}`;
  }else{
    const weakList=[...new Set(s.missedQ.map(q=>q.f))].map(fiche);
    body=`<h1>Séance terminée</h1>
    <div class="stat">
      <div><b>${s.score}/${s.qcm.length}</b><span class="muted small">QCM justes</span></div>
      <div><b>${s.graded.ok}/${s.cards.length}</b><span class="muted small">cartes sues</span></div>
      <div><b>${Math.max(1,Math.round((Date.now()-s.start)/60000))} min</b><span class="muted small">durée</span></div>
    </div>
    ${weakList.length?`<div class="block"><h2>À approfondir</h2>${weakList.map(f=>`<div class="dom"><b>${esc(f.t)}</b><div class="small muted">All-in-One ${esc(f.ref.a)}, Official Textbook ${esc(f.ref.o)}</div></div>`).join("")}</div>`
      :`<p class="block">Aucune erreur au QCM. Les cartes ratées reviendront demain.</p>`}
    <button class="btn solid full block" id="done">Retour à l'accueil</button>`;
  }
  app.innerHTML=sessionHeader()+body;

  const $=id=>document.getElementById(id);
  if($("next"))$("next").onclick=()=>{S.read[s.f.id]=today();save();s.step=s.cards.length?1:2;render();window.scrollTo(0,0)};
  if($("reveal"))$("reveal").onclick=()=>{s.reveal=true;render()};
  document.querySelectorAll(".grades button").forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g;grade(s.cards[s.ci],g);s.graded[["ko","mid","ok"][g]]++;
    s.ci++;s.reveal=false;if(s.ci>=s.cards.length)s.step=s.qcm.length?2:3;render();window.scrollTo(0,0)});
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const q=s.qcm[s.qi];s.picked=+b.dataset.i;const ok=s.picked===q.a;
    const st=S.qcm[q.id]||{ok:0,miss:0};ok?st.ok++:st.miss++;st.last=ok;S.qcm[q.id]=st;save();
    if(ok)s.score++;else s.missedQ.push(q);render()});
  if($("nextq"))$("nextq").onclick=()=>{s.qi++;s.picked=null;if(s.qi>=s.qcm.length){s.step=3;bumpStreak();
    S.log.push({d:today(),q:s.score+"/"+s.qcm.length,f:s.f?s.f.id:"faiblesses"});save()}render();window.scrollTo(0,0)};
  if($("done"))$("done").onclick=()=>setTab("home");
}

  <textarea id="exp" readonly>${esc(JSON.stringify(S))}</textarea>
  <button class="btn full" id="copy" style="margin-top:8px">Copier</button>
  <textarea id="imp" placeholder="Colle ici une sauvegarde" style="margin-top:14px"></textarea>
  <button class="btn full" id="doimp" style="margin-top:8px">Restaurer cette sauvegarde</button>
  <h2 class="block">Recommencer</h2>
  <button class="btn full" id="reset" style="border-color:var(--ko);color:var(--ko)">Effacer toute ma progression</button>
  <p class="muted small block">Contenu : ${FICHES.length} fiches, ${CARDS.length} cartes, ${QCM.length} QCM. Domaines 1 et 2.</p>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{try{localStorage.setItem("cissprep.theme",b.dataset.t)}catch(e){}applyTheme();render()});
  document.getElementById("copy").onclick=()=>{const t=document.getElementById("exp");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}};
  document.getElementById("doimp").onclick=()=>{try{const d=JSON.parse(document.getElementById("imp").value);if(!d.cards)throw 0;S=d;save();setTab("home")}catch(e){alert("Sauvegarde illisible : vérifie que tu as copié tout le texte.")}};
  document.getElementById("reset").onclick=()=>{if(confirm("Effacer toute la progression ?")){S=blank();save();setTab("home")}};
}

function applyTheme(){let t="auto";try{t=localStorage.getItem("cissprep.theme")||"auto"}catch(e){}
  if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
applyTheme();
setInterval(()=>{if(ses&&ses.step<3){const c=document.querySelector(".clock span:last-child");if(c)c.textContent=Math.floor((Date.now()-ses.start)/60000)+" / "+SESSION_MIN+" min"}},20000);
render();
</script>
</body>
</html>
