  const streak=(S.streak.last===today()||S.streak.last===addDays(today(),-1))?S.streak.count:0;
  app.innerHTML=`
  <div class="board" role="region" aria-label="Countdown">
    <div class="row"><div><div class="dest">Blueguard training, Lausanne</div><div class="dest">22 November 2026</div></div>

    <div><b>${Object.keys(S.read).length}/${LESSONS.length}</b><span class="muted small">lessons learned</span></div>
    <div><b>${S.log.length}</b><span class="muted small">sessions done</span></div>
  </div>
  <div class="block"><h2>Your progress</h2>
  <p class="muted small">${!baseDone?"Stage 1: a first pass through all eight domains with the Eleventh Hour. The deep dives (All-in-One, then Sybex) follow in your daily sessions once this pass is done.":!aioDone?"Stage 2: first deep dive, from the All-in-One, domain by domain. The Sybex deep dive comes next.":"Stage 3: second deep dive, from the Sybex Official Study Guide and the 2024 exam outline."} Mastery measures your recall cards; the weight is the domain's share of the exam.</p>
  ${DOMAINS.map(d=>{const m=mastery(d.id),ls=LESSONS.filter(l=>l.d===d.id);
    if(m===null)return `<div class="dom soon"><div class="top"><span>D${d.id}: ${esc(d.name)}</span><span>${d.w} %</span></div><div class="small muted">Coming soon</div></div>`;
    const lb=ls.filter(l=>!l.lvl),lx=ls.filter(l=>l.lvl===2),ly=ls.filter(l=>l.lvl===3),r=lb.filter(l=>S.read[l.id]).length,rx=lx.filter(l=>S.read[l.id]).length,ry=ly.filter(l=>S.read[l.id]).length;
    return `<div class="dom"><div class="top"><span>D${d.id}: ${esc(d.name)}</span><span>${d.w} %</span></div><div class="small muted">${r}/${lb.length} lessons, deep dives ${rx}/${lx.length} AIO and ${ry}/${ly.length} Sybex, mastery ${m} %</div><div class="bar"><i style="width:${m}%"></i></div></div>`}).join("")}
  </div>`;
  document.getElementById("go").onclick=()=>startSession(nl?nl.id:null,false);
}

/* ---------- Session ---------- */
function pickDrills(l,weakMode){
  const learned=Object.keys(S.read);
  if(weakMode){
    const missed=shuffle(DRILLS.filter(d=>S.drills[d.id]&&S.drills[d.id].last===false));
    return missed.slice(0,2);
  }
  const out=[];
  if(l){const mine=shuffle(DRILLS.filter(d=>d.f===l.id));if(mine.length)out.push(mine[0])}
  const pool=DRILLS.filter(d=>learned.includes(d.f)&&!out.includes(d)&&(!l||d.f!==l.id));
  const missed=shuffle(pool.filter(d=>S.drills[d.id]&&S.drills[d.id].last===false));
  const fresh=shuffle(pool.filter(d=>!out.some(o=>o.type===d.type)));
  const second=missed[0]||fresh[0]||shuffle(pool)[0];
  if(second)out.push(second);
  return out;
}
function prepDrill(d){
  const st={d,err:0,done:false};
  if(d.type==="match"){st.queue=shuffle(d.pairs);st.i=0;st.opts=shuffle(d.pairs.map(p=>p[1]));st.fb=null}
  if(d.type==="sort"){st.queue=shuffle(d.items);st.i=0;st.fb=null}
  if(d.type==="order"){st.pool=shuffle(d.items);st.built=[];st.fb=null}
  if(d.type==="explain"){st.shown=false}
  if(d.type==="calc"){st.c=makeCalc();st.picked=null}
  return st;
}
function startSession(lid,weakMode){
  stopSpeak();
  const l=lid?lesson(lid):null;let cards,qcm;
  if(weakMode){
    const wl=LESSONS.filter(x=>weakness(x.id)>0).map(x=>x.id);
    cards=CARDS.filter(c=>wl.includes(c.f)&&S.cards[c.id]&&S.cards[c.id].box<=2).slice(0,15);
    qcm=shuffle(QCM.filter(q=>S.qcm[q.id]&&S.qcm[q.id].last===false)).slice(0,5);
    if(qcm.length<5)qcm=qcm.concat(shuffle(QCM.filter(q=>wl.includes(q.f)&&!qcm.includes(q))).slice(0,5-qcm.length));
  }else{
    cards=dueCards().slice(0,12);
    if(l)cards=cards.concat(CARDS.filter(c=>c.f===l.id&&!S.cards[c.id]&&!cards.includes(c)));
    const learned=Object.keys(S.read).concat(l?[l.id]:[]);
    const mine=l?shuffle(QCM.filter(q=>q.f===l.id)).slice(0,2):[];
    const missed=shuffle(QCM.filter(q=>learned.includes(q.f)&&S.qcm[q.id]&&S.qcm[q.id].last===false&&!mine.includes(q)));
    const other=shuffle(QCM.filter(q=>learned.includes(q.f)&&!mine.includes(q)&&!missed.includes(q)));
    qcm=mine.concat(missed,other).slice(0,5);
  }
  qcm=qcm.map(q=>({...q,order:shuffle(q.o.map((_,i)=>i))}));
  const drills=(l&&!weakMode)?null:pickDrills(null,weakMode);
  ses={l,weakMode,step:l&&!weakMode?0:1,cards,ci:0,reveal:false,drills,di:0,dst:null,qcm,qi:0,picked:null,score:0,
       graded:{ok:0,mid:0,ko:0},drillOk:0,start:Date.now(),missed:new Set()};
  advanceEmpty();render();window.scrollTo(0,0);
}
function advanceEmpty(){
  const s=ses;
  if(s.step===1&&!s.cards.length)s.step=2;
  if(s.step===2){
    if(!s.drills)s.drills=pickDrills(s.l,s.weakMode);
    if(!s.drills.length)s.step=3;else if(!s.dst)s.dst=prepDrill(s.drills[s.di]);
  }
  if(s.step===3&&!s.qcm.length)finish();
}
function finish(){ses.step=4;bumpStreak();S.log.push({d:today(),q:ses.score+"/"+ses.qcm.length,l:ses.l?ses.l.id:"weak"});save()}
function go(step){stopSpeak();ses.step=step;advanceEmpty();render();window.scrollTo(0,0)}

function endDrill(ok){
  const s=ses;recordDrill(s.dst.d,ok);if(ok)s.drillOk++;else s.missed.add(s.dst.d.f);
  s.di++;s.dst=null;

function bindDrill(){
  const st=ses.dst,d=st.d,$=id=>document.getElementById(id);
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const p=st.queue[st.i];st.fb={pick:b.dataset.v};if(b.dataset.v!==p[1])st.err++;render()});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const it=st.queue[st.i];st.fb={pick:+b.dataset.c};if(+b.dataset.c!==it[1])st.err++;render()});
  if($("dnext"))$("dnext").onclick=()=>{

  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{

/* ---------- Mock exam ---------- */
const EXAMS={full:{n:125,min:180,t:"Full exam",s:"125 questions, 3 hours, like the real CAT exam"},half:{n:50,min:72,t:"Half exam",s:"50 questions, 72 minutes"},mini:{n:25,min:36,t:"Quick exam",s:"25 questions, 36 minutes"},hard:{n:0,min:0,t:"Hard questions",s:"ISC2-style 'best answer' scenarios, all domains"}};
const qById=id=>QCM.find(q=>q.id===id);
function buildExam(n,hard){
  if(hard)return shuffle(QCM.filter(q=>q.h));
  const quota=DOMAINS.map(d=>Math.round(n*d.w/100));
  let diff=n-quota.reduce((a,b)=>a+b,0),k=0;
  while(diff!==0){quota[k%8]+=diff>0?1:-1;diff+=diff>0?-1:1;k++}
  const out=[],rest=[];
  DOMAINS.forEach((d,i)=>{const p=shuffle(QCM.filter(q=>lesson(q.f).d===d.id));out.push(...p.slice(0,quota[i]));rest.push(...p.slice(quota[i]))});
  if(out.length<n)out.push(...shuffle(rest).slice(0,n-out.length));
  return shuffle(out);
}
function startExam(kind){
  const qs=buildExam(EXAMS[kind].n,kind==="hard");
  S.cur={kind,ids:qs.map(q=>q.id),ord:qs.map(q=>shuffle(q.o.map((_,i)=>i))),ans:[],i:0,pick:null,start:Date.now(),
    min:kind==="hard"?Math.round(qs.length*1.44):EXAMS[kind].min};
  save();render();window.scrollTo(0,0);
}
const examLeft=()=>S.cur.min*60000-(Date.now()-S.cur.start);
function endExam(){
  const c=S.cur;let ok=0;const by={};
  c.ids.forEach((id,k)=>{const q=qById(id);if(!q)return;const d=lesson(q.f).d;by[d]=by[d]||[0,0];by[d][1]++;
    if(k<c.ans.length){const good=c.ans[k]===q.a;if(good){ok++;by[d][0]++}
      const st=S.qcm[q.id]||{ok:0,miss:0};good?st.ok++:st.miss++;st.last=good;S.qcm[q.id]=st}});
  const total=c.ids.length;c.done=true;c.res={ok,total,by,pct:Math.round(ok/total*100),min:Math.max(1,Math.round((Date.now()-c.start)/60000))};
  if(!S.exams)S.exams=[];S.exams.push({d:today(),k:c.kind,ok,total,pct:c.res.pct});
  bumpStreak();save();render();window.scrollTo(0,0);
}
function renderExam(){
  const c=S.cur,$=id=>document.getElementById(id);
  if(c&&!c.done){
    if(examLeft()<=0)return endExam();
    const q=qById(c.ids[c.i]);
    app.innerHTML=`<div class="sessionbar"><div class="clock"><span>Question ${c.i+1} of ${c.ids.length}</span><span id="exclk">${Math.ceil(examLeft()/60000)} min left</span></div>
      <div class="bar"><i style="width:${Math.round(c.i/c.ids.length*100)}%"></i></div></div>
      <p class="muted small">Domain ${lesson(q.f).d}. No feedback until the end and no going back, as in the real exam. Pick the answer that best protects the organization.</p>
      <div class="qen">${esc(q.q)}</div>
      ${c.ord[c.i].map(i=>`<button class="opt ${c.pick===i?"sel":""}" data-x="${i}">${esc(q.o[i])}</button>`).join("")}
      <button class="btn solid full" id="exnext" ${c.pick===null?"disabled":""}>${c.i+1<c.ids.length?"Confirm and continue":"Confirm and finish"}</button>
      <p class="block"><button class="link" id="exstop">Stop now and score</button></p>`;
    document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{c.pick=+b.dataset.x;save();render()});
    $("exnext").onclick=()=>{if(c.pick===null)return;c.ans.push(c.pick);c.pick=null;c.i++;save();
      if(c.i>=c.ids.length)endExam();else{render();window.scrollTo(0,0)}};
    $("exstop").onclick=()=>{if(confirm("Stop the exam? Unanswered questions count as wrong."))endExam()};
    return;
  }
  if(c&&c.done){
    const r=c.res,pass=r.pct>=70;
    const missed=c.ids.map((id,k)=>({q:qById(id),a:c.ans[k]})).filter(x=>x.q&&x.a!==x.q.a);
    app.innerHTML=`<h1>Exam results</h1>
      <div class="board"><div class="row"><div><div class="dest">${esc(EXAMS[c.kind].t)}</div><div class="dest">${r.ok} correct out of ${r.total}, ${r.min} min</div></div>
      <div class="flaps">${flaps(Math.min(r.pct,99))}</div></div><div class="sub">${pass?"Above the 70 % mark. Keep this level on every domain.":"Below the 70 % mark. Work on the weakest domains below."}</div></div>
      <h2>By domain</h2>
      ${DOMAINS.filter(d=>r.by[d.id]).map(d=>{const [o,t]=r.by[d.id],p=Math.round(o/t*100);
        return `<div class="dom"><div class="top"><span>D${d.id}: ${esc(d.name)}</span><span>${o}/${t}</span></div><div class="bar"><i style="width:${p}%;background:${p>=70?"var(--ok)":"var(--ko)"}"></i></div></div>`}).join("")}
      <h2 class="block">Questions to review (${missed.length})</h2>
      ${missed.map(x=>`<div class="card block"><div class="q">${esc(x.q.q)}</div>
        <p class="small">${x.a===undefined?"Not answered.":`Your answer: ${esc(x.q.o[x.a])}`}</p>
        <p class="small"><b>Correct: ${esc(x.q.o[x.q.a])}</b></p><p class="small muted">${esc(x.q.x)}</p>
        <button class="link" data-l="${x.q.f}">Open the lesson</button></div>`).join("")||"<p>No mistakes. Impressive.</p>"}
      <button class="btn solid full block" id="exback">Back to the exam menu</button>`;
    $("exback").onclick=()=>{S.cur=null;save();render();window.scrollTo(0,0)};
    document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{tab="lessons";openLesson=b.dataset.l;render();window.scrollTo(0,0)});
    return;
  }
  const hist=(S.exams||[]).slice(-10).reverse(),nh=QCM.filter(q=>q.h).length;
  app.innerHTML=`<h1>Mock exam</h1>
    <p class="muted">Questions are drawn from all eight domains in proportion to their weight on the exam. You see the results only at the end. Aim for 70 % or more, consistently.</p>
    <button class="go" data-k="full">${EXAMS.full.t}<span>${EXAMS.full.s}</span></button>
    <div class="list block">${["half","mini","hard"].map(k=>`<button class="item" data-k="${k}"><span>${EXAMS[k].t}<br><span class="small muted">${k==="hard"?nh+" questions, "+Math.round(nh*1.44)+" minutes. "+EXAMS[k].s:EXAMS[k].s}</span></span><span class="small muted">Start</span></button>`).join("")}</div>
    <h2 class="block">History</h2>
    ${hist.length?`<div class="list">${hist.map(h=>`<div class="item"><span>${esc(h.d)}: ${esc(EXAMS[h.k].t)}</span><span class="small ${h.pct>=70?"":"muted"}">${h.ok}/${h.total} (${h.pct} %)</span></div>`).join("")}</div>`
      :`<div class="card">No exam yet. Start with a quick exam to get a baseline.</div>`}`;
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>startExam(b.dataset.k));
}
setInterval(()=>{if(tab==="exam"&&!ses&&S.cur&&!S.cur.done){if(examLeft()<=0)endExam();else{const e=document.getElementById("exclk");if(e)e.textContent=Math.ceil(examLeft()/60000)+" min left"}}},15000);

/* ---------- Settings ---------- */
function renderSettings(){
  let th="auto";try{th=localStorage.getItem("cissprep.theme")||"auto"}catch(e){}
  app.innerHTML=`<h1>Settings</h1>
  <h2 class="block">Theme</h2>
  <div class="tabsdom">${["auto","light","dark"].map(t=>`<button data-t="${t}" class="${th===t?"on":""}">${{auto:"Auto",light:"Light",dark:"Dark"}[t]}</button>`).join("")}</div>
  <h2 class="block">Backup</h2>
  <p class="muted small">Your progress is stored in this browser only. To move between phone and computer, copy this text and paste it on the other device.</p>
  <textarea id="exp" readonly>${esc(JSON.stringify(S))}</textarea>
  <button class="btn full" id="copy" style="margin-top:8px">Copy</button>
  <textarea id="imp" placeholder="Paste a backup here" style="margin-top:14px"></textarea>
  <button class="btn full" id="doimp" style="margin-top:8px">Restore this backup</button>
  <h2 class="block">Start over</h2>
  <button class="btn full danger" id="reset">Erase all my progress</button>
  <p class="muted small block">Content: ${LESSONS.length} lessons, ${CARDS.length} cards, ${DRILLS.length} exercises, ${QCM.length} exam questions. All eight domains: Eleventh Hour foundations plus deep dives from the All-in-One and the Sybex Official Study Guide.</p>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{try{localStorage.setItem("cissprep.theme",b.dataset.t)}catch(e){}applyTheme();render()});
  document.getElementById("copy").onclick=()=>{const t=document.getElementById("exp");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}};
  document.getElementById("doimp").onclick=()=>{try{const d=JSON.parse(document.getElementById("imp").value);if(!d.cards)throw 0;S={...blank(),...d};save();setTab("home")}catch(e){alert("This backup cannot be read. Make sure you copied all of the text.")}};
  document.getElementById("reset").onclick=()=>{if(confirm("Erase all progress?")){S=blank();save();setTab("home")}};
}
function applyTheme(){let t="auto";try{t=localStorage.getItem("cissprep.theme")||"auto"}catch(e){}
  if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
applyTheme();
setInterval(()=>{if(ses&&ses.step<4){const c=document.getElementById("clk");if(c)c.textContent=Math.floor((Date.now()-ses.start)/60000)+" / "+SESSION_MIN+" min"}},20000);
render();

</script>
</body>
</html>
