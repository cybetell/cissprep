<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>cissprep.ch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --surface:#FFFFFF; --ink:#15203A; --muted:#566079; --line:#D8DEE8;
  --board:#15203A; --flap:#F2B233; --ok:#1C7C4E; --ko:#B42318; --mid:#A86A00; --focus:#2F6FDB;
  --okbg:#E6F4EC; --kobg:#FCEBEA; --midbg:#FFF4DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1522; --surface:#172033; --ink:#E9EDF4; --muted:#9BA6BB; --line:#2A3550;
    --board:#0A0F1A; --okbg:#12301F; --kobg:#3A1714; --midbg:#33270C; --ok:#4CC38A; --ko:#F2776B; --mid:#F2B233;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1522; --surface:#172033; --ink:#E9EDF4; --muted:#9BA6BB; --line:#2A3550;
  --board:#0A0F1A; --okbg:#12301F; --kobg:#3A1714; --midbg:#33270C; --ok:#4CC38A; --ko:#F2776B; --mid:#F2B233;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:19px;line-height:1.55;-webkit-text-size-adjust:100%;
}
main{max-width:640px;margin:0 auto;padding:20px 18px 120px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.6rem}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* Tableau des départs */
.board{background:var(--board);color:#fff;border-radius:14px;padding:18px 18px 16px;margin-bottom:22px}
.board .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.board .dest{font-size:1rem;color:#C9D2E3}
.flaps{display:flex;gap:4px}
.flap{background:#222E4A;color:var(--flap);font-weight:700;font-size:2.1rem;line-height:1;
  padding:8px 8px 6px;border-radius:5px;min-width:1.2em;text-align:center;position:relative;font-variant-numeric:tabular-nums}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#0A0F1A}
.board .sub{margin-top:10px;font-size:.9rem;color:#C9D2E3}

.go{display:block;width:100%;border:0;border-radius:14px;background:var(--flap);color:#15203A;
  font-weight:700;font-size:1.25rem;padding:20px 18px;text-align:left}
.go span{display:block;font-weight:400;font-size:.92rem;margin-top:4px}
.btn{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:12px 16px;font-weight:700}
.btn.full{display:block;width:100%}
.btn.solid{background:var(--ink);color:var(--paper)}
.link{background:none;border:0;color:var(--focus);padding:0;text-decoration:underline;font-weight:700}

.block{margin-top:26px}
.stat{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.stat div{flex:1;min-width:120px}
.stat b{display:block;font-size:1.5rem}

.dom{padding:12px 0;border-bottom:1px solid var(--line)}
.dom .top{display:flex;justify-content:space-between;gap:10px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.dom.soon{opacity:.55}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
.fiche ul{padding-left:1.2em;margin:.3em 0 .8em}
.fiche li{margin-bottom:.4em}
.terms dt{font-weight:700;margin-top:.6em}
.terms dd{margin:0}
.note{border-left:5px solid var(--mid);background:var(--midbg);padding:12px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.note.trap{border-color:var(--ko);background:var(--kobg)}
.refs{font-size:.9rem;color:var(--muted)}

/* Séance */
.sessionbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:10px 0 8px;z-index:5}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--ink)}
.steps span.done{background:var(--ok)}
.clock{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);margin-top:6px}

.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center}
.flash .q{font-size:1.2rem;font-weight:700}
.flash .a{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.grades button{border:0;border-radius:10px;padding:14px 6px;font-weight:700;color:#fff}
.g-ko{background:var(--ko)} .g-mid{background:var(--mid)} .g-ok{background:var(--ok)}

.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:14px;margin:10px 0}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default}
.qen{font-size:1.1rem;font-weight:700}
.expl{margin-top:12px}

.list button.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;color:var(--ink)}
.chk{font-weight:700;color:var(--ok);white-space:nowrap}
.tabsdom{display:flex;gap:8px;margin:10px 0 4px}
.tabsdom button{border:2px solid var(--line);background:none;color:var(--ink);border-radius:20px;padding:6px 14px}
.tabsdom button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}

textarea{width:100%;min-height:120px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;color:var(--muted);padding:12px 4px 14px;font-size:.88rem;font-weight:700}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--flap)}
@media (prefers-reduced-motion:no-preference){
  .flap{animation:drop .5s ease-out both}
  .flap:nth-child(2){animation-delay:.08s}
  .flap:nth-child(3){animation-delay:.16s}
  @keyframes drop{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
}

.lead{font-size:1.05rem}
.note.hook{border-color:var(--ok);background:var(--okbg)}
.btn.listen{padding:8px 14px;margin:0 0 14px;font-size:.95rem}
.btn.danger{border-color:var(--ko);color:var(--ko)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.cats .opt{margin:6px 0}
ol.built{padding-left:1.3em;margin:8px 0 14px}
ol.built li{color:var(--ok);font-weight:700;margin-bottom:4px}
.card .q{font-size:1.15rem;font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<nav><div>
  <button data-tab="home">Home</button>
  <button data-tab="lessons">Lessons</button>
  <button data-tab="weak">Weak spots</button>
  <button data-tab="settings">Settings</button>
</div></nav>
<script>
/* ================= CONTENT ================= */
const DOMAINS = [
 {id:1,name:"Security and Risk Management",w:16},
 {id:2,name:"Asset Security",w:10},
 {id:3,name:"Security Architecture and Engineering",w:13},
 {id:4,name:"Communication and Network Security",w:13},
 {id:5,name:"Identity and Access Management (IAM)",w:13},
 {id:6,name:"Security Assessment and Testing",w:12},
 {id:7,name:"Security Operations",w:13},
 {id:8,name:"Software Development Security",w:10}
];

/* Lessons: self-contained, written to teach from zero.
   ref: c = Eleventh Hour (Conrad, 3rd ed.), a = All-in-One (9th ed.), o = ISC2 Official Textbook (7th ed.) */
const LESSONS = [
{id:"d1-cia",d:1,t:"The security pillars: CIA, DAD and AAA",
 what:"Almost every CISSP question comes back to three goals: keep information away from the wrong people, keep it accurate, and keep it usable when it is needed. Together they form the CIA triad, the lens through which ISC2 looks at everything.",
 pts:["Confidentiality: only authorized people can read the information. Typical tools: encryption, access control.",
      "Integrity: information is not changed without authorization, and any change can be detected. Typical tools: hashing, digital signatures, change control.",
      "Availability: authorized people can use the information when they need it. Typical tools: redundancy, backups, DDoS protection.",
      "DAD is the attacker's view, the mirror image of CIA: Disclosure breaks confidentiality, Alteration breaks integrity, Destruction breaks availability.",
      "ISC2 also names authenticity (proof of where something came from) and non-repudiation (the author cannot deny the action). Privacy and safety are discussed alongside CIA.",
      "AAA describes how access is managed: Authentication (prove who you are), Authorization (what you are allowed to do), Accounting, also called auditing (record what you did). Some sources write IAAA, adding Identification first."],
 ex:"Ransomware that encrypts a file server attacks availability. If the attackers also publish the files, confidentiality is broken too. A digitally signed purchase order gives integrity and non-repudiation: the supplier cannot later claim they never sent it.",
 terms:[["Non-repudiation","The author of an action cannot credibly deny having performed it. Usually provided by digital signatures."],["Accounting (auditing)","Recording who did what and when, so users can be held accountable."],["Authenticity","Assurance that data or a message genuinely comes from its claimed source."]],
 trap:"The third A in AAA is Accounting (auditing), not Access control.",
 mnem:"CIA protects, DAD attacks: Confidentiality faces Disclosure, Integrity faces Alteration, Availability faces Destruction.",
 ref:{c:"ch. 1, first pages",a:"ch. 1",o:"Domain 1"}},

{id:"d1-ethique",d:1,t:"The ISC2 Code of Ethics",
 what:"Every CISSP must agree to the ISC2 Code of Ethics. It is short and heavily tested. What matters most is the order of its four canons, because ISC2 applies them in that order when they conflict.",
 pts:["The Code has three parts: the preamble (the introduction), the canons (mandatory), and the guidance (advisory only).",
      "Canon 1: Protect society, the common good, necessary public trust and confidence, and the infrastructure.",
      "Canon 2: Act honorably, honestly, justly, responsibly, and legally. If laws from different jurisdictions conflict, give priority to the jurisdiction where the service is provided. Give prudent advice and avoid spreading fear, uncertainty and doubt (FUD).",
      "Canon 3: Provide diligent and competent service to principals (employers and clients). Only take work you are qualified for, protect their confidentiality, avoid conflicts of interest.",
      "Canon 4: Advance and protect the profession. Keep your skills current, share knowledge, and avoid associating with people who could damage the profession.",
      "A violation can lead to a formal complaint and the loss of the certification."],
 ex:"Your employer asks you to stay quiet about a breach that exposes customers' data. Loyalty to your employer is canon 3; protecting society and public trust is canon 1. Canon 1 wins.",
 terms:[["Canons","The four mandatory rules of the Code."],["Principals","The people you serve professionally: employers and clients."],["Common good","The interest of society as a whole."],["FUD","Fear, uncertainty and doubt: exaggerating threats to push a decision."]],
 trap:"When every answer looks ethical, choose the one tied to the highest canon. The most ethical answer is usually the right one.",
 mnem:"S, H, P, P: Society, Honor, Principals, Profession. Society always comes first, the profession last.",
 upd:"Some older books quote canon 1 as 'society, the commonwealth, and the infrastructure'. The current wording adds the common good and public trust. The logic and the order are unchanged.",
 ref:{c:"p. 15 to 16",a:"ch. 1",o:"Domain 1"}},

{id:"d1-codes",d:1,t:"Other codes of ethics",
 what:"Besides ISC2, the exam can mention two older codes. You only need to recognize them and know who published them.",
 pts:["The Computer Ethics Institute published the Ten Commandments of Computer Ethics. Examples: do not use a computer to harm people, do not snoop in other people's files, do not use software you have not paid for, think about the social consequences of the programs you write.",
      "The Internet Activities Board (IAB) published RFC 1087, Ethics and the Internet, in 1989.",
      "RFC 1087 says it is unethical to purposely: seek unauthorized access to Internet resources, disrupt the intended use of the Internet, waste resources (people, capacity, computers), destroy the integrity of computer-based information, or compromise users' privacy."],
 ex:"A question asks which document lists 'wasting resources' as unethical behavior on the Internet. The answer is RFC 1087 from the IAB.",
 terms:[["IAB","Internet Activities Board, today the Internet Architecture Board."],["RFC","Request for Comments: the document series that defines Internet standards."]],
 trap:"On the exam, the ISC2 Code always takes precedence over these other codes.",
 mnem:"RFC 1087 = the Internet's own ethics, written by the Internet's own board (IAB).",
 ref:{c:"p. 16 to 17",a:"ch. 1",o:"Domain 1"}},

{id:"d1-droit",d:1,t:"Legal systems and types of law",
 what:"A security professional works across countries and ends up dealing with lawyers, investigators and regulators. The exam expects you to know the major legal systems and the different branches of law inside them.",
 pts:["Civil law (legal system): the most common system in the world. Laws are written down in codes; judges apply them and past rulings carry little weight. Examples: France, Switzerland, Germany.",
      "Common law: judges' decisions (precedents) shape the law. Used in the US, the UK, Canada and most former British colonies.",
      "Religious law: religious texts are the main source of law, for example Sharia. Customary law: long-accepted customs treated as law.",
      "Inside common law there are three branches. Criminal law: the victim is society; penalties include prison; proof must be beyond a reasonable doubt.",
      "Civil law (branch), also called tort law: disputes between private parties, usually for money; proof by preponderance of the evidence, meaning more likely than not.",
      "Administrative (regulatory) law: rules issued by government agencies, such as HIPAA, FCC or FDA regulations.",
      "Three types of financial damages: statutory (amounts set by law, due even without actual loss), compensatory (repay the actual loss), punitive (punish and deter outrageous behavior)."],
 ex:"'Which legal system relies mainly on written codes rather than precedent?' Answer: civil law, the legal system. 'A company sues a vendor for money after a breach caused by negligence. Which type of law applies?' Answer: civil law, the branch, even though the case happens in the US, a common law country.",
 terms:[["Tort law","The law of civil wrongs: compensating someone harmed outside of a contract, for example through negligence."],["Beyond a reasonable doubt","The high standard of proof required in criminal cases."],["Preponderance of the evidence","The civil standard of proof: more likely than not."],["Statutory damages","Damages whose amount is fixed by law, payable even if no actual loss is proven."]],
 trap:"'Civil law' has two meanings. If the question talks about countries, codes or precedent, it means the legal system. If it talks about a lawsuit, damages or burden of proof, it means the branch of law, as opposed to criminal and administrative law.",
 mnem:"Criminal = society is the victim, prison, beyond doubt. Civil = a person is the victim, money, more likely than not.",
 ref:{c:"p. 6 to 8",a:"ch. 3",o:"Domain 1"}},

{id:"d1-duecare",d:1,t:"Due care, due diligence and gross negligence",
 what:"Courts judge organizations by asking a simple question: did they behave like a reasonable, responsible organization would? Two terms describe that behavior, and ISC2 loves to test the difference.",
 pts:["Due care: doing what a reasonable person would do in the same situation. Also called the prudent man rule. It comes from the idea of a duty of care.",
      "Due diligence: the effort to know, investigate, assess and verify. ISC2's view: due diligence is understanding the risks and checking that things are done; due care is acting on that knowledge.",
      "Another way to put it: due diligence is thinking before (and while) you act, due care is doing the right thing.",
      "Gross negligence is the opposite of due care. Being unable to show due care after an incident puts the organization in a much worse legal position.",
      "Being able to demonstrate due care after a data breach is a strong legal defense."],
 ex:"Before signing with a cloud provider, you review its audit reports and security questionnaire: due diligence. You then encrypt the data you send there and enforce MFA: due care. Afterwards you verify every quarter that MFA is still enforced: due diligence again.",
 terms:[["Prudent man rule","The standard of what a sensible, responsible person would do."],["Due care","Taking the reasonable actions to protect assets."],["Due diligence","Investigating, assessing and verifying, so that you know what needs protecting and that protection works."],["Gross negligence","Failing to exercise even basic care."]],
 trap:"Books phrase it differently. Conrad calls due diligence 'the management of due care'. Follow ISC2 on the exam: diligence = know and verify, care = act.",
 mnem:"Due diligence = do detect. Due care = do correct.",
 ref:{c:"p. 8",a:"ch. 3",o:"Domain 1"}},

{id:"d1-preuves",d:1,t:"Investigations and evidence",
 what:"When an incident ends up in court, how evidence was collected matters as much as what it shows. Sloppy handling can make solid evidence useless.",
 pts:["Real evidence: physical objects, such as a hard drive or a USB key.",
      "Direct evidence: testimony from a witness about what they saw or heard with their own senses.",
      "Circumstantial evidence: establishes circumstances from which a fact can be inferred. Corroborative evidence: supports another piece of evidence.",
      "Hearsay: second-hand evidence, what someone heard from someone else. Secondary evidence: copies of documents or oral descriptions of them. Computer logs are often treated as secondary evidence.",
      "Best evidence rule: courts prefer the original over a copy.",
      "Integrity: take a hash of the evidence before and after analysis; identical hashes prove nothing changed. Chain of custody: document who handled the evidence, when, where and why, from collection to court.",
      "Entrapment: law enforcement pushes someone who had no intention of committing a crime into committing one. It is illegal. Enticement: creating tempting conditions for someone already intent on the crime, such as a honeypot. It is legal."],
 ex:"You image a compromised laptop, compute its SHA-256 hash, seal the original drive in a bag, and log every person who touches it. That is integrity plus chain of custody.",
 terms:[["Chain of custody","A complete record of who handled evidence, when and where."],["Hearsay","Second-hand testimony, generally weaker in court."],["Best evidence rule","Originals are preferred over copies."],["Enticement","Luring someone who already intends to commit a crime."]],
 trap:"A honeypot is enticement, not entrapment.",
 mnem:"Entrapment traps the innocent. Enticement tempts the guilty.",
 upd:"Older books cite MD5 or SHA-1 for evidence hashes. Both are considered weak today; SHA-256 is the usual choice.",
 ref:{c:"p. 9 to 10",a:"ch. 3",o:"Domain 1"}},

{id:"d1-pi",d:1,t:"Intellectual property",
 what:"Intellectual property (IP) protects intangible things created by the mind. Each type protects something different, and the exam tests whether you can match the right protection to the situation.",
 pts:["Trademark: protects a brand, such as a name, logo or slogan, so customers know who makes a product. ™ marks an unregistered trademark, ® a registered one.",
      "Patent: gives the inventor a monopoly on an invention for a limited time, usually 20 years from filing, in exchange for making it public. The invention must be novel and not obvious.",
      "Copyright ©: protects the form of expression, such as text, music or software code, not the underlying idea.",
      "Licenses: contracts between a software vendor and a user, such as an EULA (end-user license agreement), accepted simply by using the software.",
      "Trade secret: confidential business information that gives a competitive edge. Never published; protected by NDAs, non-compete clauses and the company's own due care."],
 ex:"A plantation company's unique process for improving palm oil yield: if it wants legal exclusivity while revealing the method, it files a patent. If it prefers to keep the method secret indefinitely, it treats it as a trade secret and has staff sign NDAs.",
 terms:[["Trade secret","Proprietary information kept secret to stay competitive."],["NDA","Non-disclosure agreement."],["EULA","End-user license agreement."]],
 trap:"If the scenario is about keeping something secret, the answer is trade secret. A patent always requires public disclosure.",
 mnem:"Trademark = brand. Patent = invention. Copyright = expression. Trade secret = secrecy.",
 ref:{c:"p. 10 to 11",a:"ch. 3",o:"Domain 1"}},

{id:"d1-privacy",d:1,t:"Privacy and cross-border data",
 what:"Privacy means protecting the confidentiality of personal information. Because data moves across borders, you need to know the main laws and agreements, and which older ones are no longer valid.",
 pts:["PII (personally identifiable information): data that identifies a person, such as a social security number, salary, bank details or health data.",
      "Core European principles: tell people how their data is used, let them opt out of sharing, require explicit opt-in for the most sensitive data, protect the data reasonably.",
      "The EU only allows personal data to leave the EU if the destination protects it adequately.",
      "The OECD privacy guidelines influence laws worldwide; one principle is collection limitation: collect only what you need, lawfully and fairly.",
      "The Council of Europe Convention on Cybercrime (Budapest Convention) is the main international treaty for cooperation on cybercrime investigations.",
      "Export of cryptography: controlled during the Cold War by CoCom, today by the Wassenaar Arrangement."],
 ex:"A Swiss company sends HR data to a payroll provider in the US. It must check that the transfer is allowed under Swiss and EU rules, for example because the provider is certified under the EU-US or Swiss-US Data Privacy Framework.",
 terms:[["PII","Personally identifiable information."],["Data subject","The person the data is about."],["Transborder data flow","Personal data crossing national borders."]],
 trap:"Older books describe the EU Data Protection Directive and Safe Harbor as current. Both are gone.",
 mnem:"Directive to GDPR (2018). Safe Harbor to Privacy Shield to Data Privacy Framework (2023).",
 upd:"The 1995 EU Data Protection Directive was replaced by the GDPR in 2018. Safe Harbor was invalidated in 2015, Privacy Shield in 2020; the EU-US Data Privacy Framework has applied since 2023. The OECD now has 38 members. Switzerland's revised data protection act (nFADP) has applied since September 2023.",
 ref:{c:"p. 11 to 13",a:"ch. 3",o:"Domain 1"}},

{id:"d1-tiers",d:1,t:"Security and third parties",
 what:"Organizations rely on suppliers, cloud providers and outsourcers for critical services. You cannot control their systems directly, so you control the relationship.",
 pts:["The contract is the primary security control when dealing with a service provider.",
      "Service level agreement (SLA): measurable commitments the vendor must meet, mostly about availability.",
      "Attestation: an independent third party audits the provider against a known baseline and states its opinion on its security. A SOC 2 report is a common example.",
      "Right to audit or right to penetration test: contract clauses letting you test the provider yourself, or have a trusted firm do it. Alternative: the provider hands over a recent third-party audit.",
      "Procurement: involving security early in purchasing is a preventive control.",
      "Acquisitions: perform a full risk assessment, including vulnerability scans and penetration tests, before connecting the acquired company's network.",
      "Divestitures (splitting a company): often riskier than acquisitions. Duplicate accounts, shared passwords, badges and keys must all be revoked."],
 ex:"A plantation wants to deploy a vendor's fuel management software. Before installation, security reviews the vendor, the contract includes security clauses and a right to audit, and the vendor must meet a defined SLA.",
 terms:[["SLA","Service level agreement."],["Attestation","An independent statement on a provider's security posture after an audit."],["Divestiture","Selling or spinning off part of a company."],["Procurement","The process of acquiring products or services from third parties."]],
 trap:"When a question involves a service provider, the contract usually beats a technical answer.",
 mnem:"Contract first, then SLA for availability, then audit to trust but verify.",
 ref:{c:"p. 13 to 14",a:"ch. 2",o:"Domain 1"}},

{id:"d1-docs",d:1,t:"Policies, procedures, standards, guidelines, baselines",
 what:"Security is governed by a hierarchy of documents. Each has a specific role and level of detail, and the exam expects you to tell them apart instantly.",
 pts:["Policy: a high-level directive from management. Mandatory. States what and why, never names a specific technology.",
      "Procedure: step-by-step instructions to complete a task. Mandatory.",
      "Standard: a specific, mandatory use of technology, such as a laptop model or an operating system version.",
      "Guideline: a recommendation or piece of advice. Discretionary.",
      "Baseline: a uniform, minimum level of security for a system, often based on a benchmark such as the CIS Benchmarks. Exceptions require senior management sign-off.",
      "Information security governance: security at the organizational level, led by senior management, who set priorities, staffing and funding."],
 ex:"Policy: 'Systems must protect the confidentiality of PII.' Standard: 'All laptops run Windows 11 Enterprise.' Baseline: 'Harden servers according to the CIS benchmark.' Procedure: 'Step 1, install the hardened image; step 2, apply patches.' Guideline: 'Use a passphrase built from a sentence.'",
 terms:[["Mandatory","Must be followed."],["Discretionary","Optional, a recommendation."],["Hardening","Reducing a system's attack surface by removing and locking down features."],["Governance","Direction and oversight of security by senior management."]],
 trap:"Migrating from Windows to Linux does not change the policy, because a policy never names a technology. Procedures, standards and baselines do change.",
 mnem:"Policy says WHY, standard says WHAT, procedure says HOW, guideline says MAYBE.",
 upd:"Conrad lists baselines as discretionary because the method can vary if the result is as secure. Most sources, including ISC2, treat the baseline as the mandatory minimum level of security.",
 ref:{c:"p. 17 to 19",a:"ch. 1",o:"Domain 1"}},

{id:"d1-personnel",d:1,t:"Personnel security",
 what:"People are the biggest security risk in any organization. Personnel security covers the whole employee life cycle: hiring, daily work, and departure.",
 pts:["Background checks before hiring: criminal records, experience, education, certifications. Lying about degrees and certifications is one of the most common forms of dishonesty in hiring.",
      "Security awareness changes behavior, for example reminders never to share passwords.",
      "Security training teaches a skill, for example how a new help desk agent resets passwords safely.",
      "Termination: revoke all access immediately. The process must also be fair, because a disgruntled former employee, especially from IT, knows where the weak spots are.",
      "Vendors, consultants and contractors must be trained and controlled like employees, with clear rules about where data may be stored.",
      "Outsourcing and offshoring can reduce cost, but laws such as HIPAA, SOX or GLBA do not follow data abroad. Consult legal staff and protect data by contract."],
 ex:"An administrator is dismissed on Friday afternoon. The best practice is to disable their accounts during the meeting, collect badges and keys, and review any shared passwords they knew.",
 terms:[["Awareness","Changing behavior and attitudes."],["Training","Teaching a specific skill."],["Offshoring","Outsourcing to another country."],["Background check","Verification of a candidate's history before hiring."]],
 trap:"Reminding users not to write down passwords is awareness, not training.",
 mnem:"Awareness = attitude. Training = task.",
 ref:{c:"p. 19 to 20",a:"ch. 1",o:"Domain 1"}},

{id:"d1-controles",d:1,t:"Types and categories of controls",
 what:"A control is anything that reduces risk. ISC2 describes every control in two ways: by what it does (its type) and by how it is implemented (its category).",
 pts:["Preventive: stops an action from happening (firewall rule, lock, pre-employment screening).",
      "Detective: alerts during or after an attack (IDS, CCTV watched by guards, burglar alarm).",
      "Corrective: fixes a damaged system or process (antivirus quarantining a file). Recovery: restores normal operations after an incident (restoring from backup, reinstalling from an image).",
      "Deterrent: discourages an action ('Beware of dog' sign, a sanctions policy). Compensating: an extra control that makes up for a weakness in another control.",
      "Categories: administrative, also called directive or managerial (policies, procedures, training); technical or logical (firewalls, encryption); physical (fences, locks, guards).",
      "Every control has both a type and a category. A pre-employment drug test is administrative and preventive."],
 ex:"A legacy server cannot be patched. You isolate it in its own network segment and monitor it closely: those are compensating controls for the missing patch.",
 terms:[["Compensating control","A substitute control used when the primary one is not possible or is weak."],["Deterrent control","A control that discourages rather than blocks."],["Administrative control","A control based on policy, procedure or training."]],
 trap:"A 'Beware of dog' sign is deterrent. The dog itself would be preventive. Antivirus is both detective (scanning) and corrective (quarantine).",
 mnem:"Types: Please Do Call Right Down Carefully (Preventive, Detective, Corrective, Recovery, Deterrent, Compensating). Categories: A, T, P (Administrative, Technical, Physical).",
 ref:{c:"p. 20 to 22",a:"ch. 2",o:"Domain 1"}},

{id:"d1-risque",d:1,t:"Assets, threats, vulnerabilities and the risk matrix",
 what:"Risk analysis decides where money and effort go. It starts with three building blocks and ends with a decision about which risks need urgent action.",
 pts:["Asset: anything of value that needs protection: data, systems, people, buildings.",
      "Threat: a potentially harmful event, such as an earthquake, a power outage or a worm.",
      "Vulnerability: a weakness that allows a threat to cause harm, such as an unpatched server or a data center without backup power.",
      "Risk = Threat × Vulnerability. Sometimes × Impact (or × Cost) is added, where impact is the severity of the damage.",
      "Human life has a near-infinite impact on the exam: any risk to life must be mitigated.",
      "A risk matrix is qualitative: likelihood (rare to almost certain) against consequences (insignificant to catastrophic), giving Low, Medium, High or Extreme.",
      "Low: normal processes. Medium: notify management. High: notify senior management. Extreme: immediate action, a detailed mitigation plan, and senior management notification."],
 ex:"A remote site depends on a single Starlink link (vulnerability). A storm (threat) could cut the site off from its ERP (asset). Likely and major: high risk, senior management should know.",
 terms:[["Threat","A potential cause of harm."],["Vulnerability","A weakness a threat can exploit."],["Likelihood","The probability that a risk occurs."],["Impact","How severe the damage would be."]],
 trap:"If an answer protects human life, it beats every other answer.",
 mnem:"No threat, no risk. No vulnerability, no risk. Risk needs both.",
 ref:{c:"p. 22 to 23",a:"ch. 2",o:"Domain 1"}},

{id:"d1-ale",d:1,t:"Calculating risk: ALE, TCO and ROI",
 what:"Quantitative risk analysis puts a price on risk so management can compare it with the cost of a safeguard. Five formulas do all the work, and you will likely calculate at least one on the exam.",
 pts:["Asset value (AV): what the asset is worth, including data, fines and reputation, not just hardware.",
      "Exposure factor (EF): the percentage of the asset's value lost in one incident.",
      "Single loss expectancy: SLE = AV × EF. The cost of one incident.",
      "Annual rate of occurrence (ARO): how many times per year the incident happens. Annualized loss expectancy: ALE = SLE × ARO. The yearly cost of the risk.",
      "Total cost of ownership (TCO): the full cost of a safeguard, upfront plus ongoing (licences, support, staff hours), expressed per year.",
      "Value of a safeguard per year = ALE before − ALE after − annual TCO. Positive means a good investment."],
 ex:"1,000 laptops with PII. Each lost laptop costs 25,000 (2,500 hardware plus 22,500 of exposed data), EF 100 %, 11 lost per year: ALE = 275,000. Encryption drops the EF to 10 % (only the hardware is lost): new ALE 27,500. Encryption costs 136,667 per year. Value: 275,000 − 27,500 − 136,667 = 110,833 per year. Worth it.",
 terms:[["SLE","Single loss expectancy = AV × EF."],["ARO","Annual rate of occurrence."],["ALE","Annualized loss expectancy = SLE × ARO."],["TCO","Total cost of ownership of a safeguard."]],
 trap:"Always compare yearly figures. A monthly cost must be multiplied by 12 before you compare it with the ALE.",
 mnem:"A-E-S-A-A: AV times EF gives SLE, SLE times ARO gives ALE.",
 ref:{c:"p. 24 to 26",a:"ch. 2",o:"Domain 1"}},

{id:"d1-choix",d:1,t:"Responding to risk",
 what:"Once a risk is assessed, management must decide what to do with it. There are four legitimate options and one that is never acceptable.",
 pts:["Accept: live with the risk. Only for low risks, and only after considering all the options. Never for high or extreme risks, risks to human life, or data protected by law.",
      "Mitigate (reduce): lower the risk to an acceptable level with controls. Removing it completely is called eliminating the risk.",
      "Transfer: pass the financial impact to someone else, typically an insurer.",
      "Avoid: stop the activity or cancel the project that creates the risk.",
      "Quantitative analysis uses hard numbers (ALE). Qualitative analysis uses approximate scales (the risk matrix). Hybrid uses numbers where possible and scales for the rest."],
 ex:"Laptop encryption mitigates the PII risk. A cyber insurance policy transfers the financial part. Cancelling a project to store customer card data yourself avoids the risk.",
 terms:[["Risk acceptance","Consciously deciding to live with a risk."],["Risk transference","Shifting the financial impact, for example through insurance."],["Risk avoidance","Stopping the risky activity."],["Residual risk","The risk that remains after controls."]],
 trap:"Ignoring a known risk (sometimes called rejecting it) is never correct. And transferring a risk does not transfer responsibility.",
 mnem:"A-M-T-A: Accept, Mitigate, Transfer, Avoid. Never Ignore.",
 ref:{c:"p. 26 to 27",a:"ch. 2",o:"Domain 1"}},

{id:"d1-attaquants",d:1,t:"Risk process and types of attackers",
 what:"NIST publishes a well-known guide for running a risk assessment, and the exam expects you to recognize the main types of attackers you are assessing against.",
 pts:["NIST SP 800-30 is the Guide for Conducting Risk Assessments. Its 2002 version had nine steps, from system characterization to results documentation.",
      "Black hat: malicious hacker. White hat: authorized, such as a penetration tester. Hacktivist: attacks for political reasons. Script kiddie: uses tools they do not understand.",
      "Outsiders: no authorized access; they launch most attacks, which defense in depth mostly stops.",
      "Insiders: have legitimate access; the attack can be intentional or accidental, and the impact can be severe.",
      "Bot: an infected computer controlled remotely, also called a zombie. Botnet: many bots controlled through a command and control (C&C) network run by a bot herder.",
      "Phishing: tricking users into giving credentials or PII. Spear phishing: phishing aimed at a specific person. Whaling: spear phishing aimed at executives."],
 ex:"A fake invoice email sent only to the CFO, written with details from LinkedIn, is spear phishing, more precisely whaling.",
 terms:[["Insider threat","Risk from people with legitimate access."],["Bot herder","The person controlling a botnet."],["Spear phishing","Targeted phishing."],["Defense in depth","Several layers of controls, so one failure is not fatal."]],
 trap:"Insiders are rarer than outsiders but can do much more damage, because they are already inside.",
 mnem:"Spear = one target. Whale = a big target (an executive).",
 upd:"NIST SP 800-30 Revision 1 (2012) replaced the nine steps with four: prepare, conduct, communicate, maintain. The broader framework is the NIST Risk Management Framework (SP 800-37).",
 ref:{c:"p. 28 to 29",a:"ch. 2",o:"Domain 1"}},

{id:"d2-classif",d:2,t:"Classifying data: labels, clearances, need to know",
 what:"You cannot protect data properly until you know how sensitive it is. Classification links the sensitivity of data (objects) with the trust placed in people (subjects).",
 pts:["Objects (data) have labels. Subjects (people, processes) have clearances.",
      "US government labels: Top Secret (exceptionally grave damage to national security if disclosed), Secret (serious damage), Confidential (damage).",
      "Private companies use labels such as 'Internal use only' or 'Company proprietary'.",
      "A clearance decides whether a person can be trusted with a given level of information, now and in the future. Assessing future trustworthiness is harder and more expensive.",
      "Formal access approval: documented approval from the data owner, and the subject understands the rules and the consequences of misuse.",
      "Need to know: even with the right clearance, you only access what your job requires. It is decided object by object, which makes it more granular than least privilege. Compartmentalization enforces need to know technically."],
 ex:"An engineer cleared for Secret works on project A. A Secret document about project B is still off limits: the clearance is right, but there is no need to know.",
 terms:[["Label","The sensitivity marking on an object."],["Clearance","A formal decision on how far a subject can be trusted."],["Need to know","Access only to the specific objects a job requires."],["Compartmentalization","Technical separation that enforces need to know."]],
 trap:"Need to know is not the same as least privilege: least privilege groups objects together; need to know decides for each object.",
 mnem:"Top Secret = exceptionally grave. Secret = serious. Confidential = damage. The longer the adjective, the higher the level.",
 upd:"Older books cite Executive Order 12356. It was replaced by EO 13526 in 2009; the three levels are unchanged.",
 ref:{c:"p. 34 to 35",a:"ch. 5",o:"Domain 2"}},

{id:"d2-media",d:2,t:"Sensitive media: handling and retention",
 what:"Sensitive information always lives on some physical media: disks, tapes, paper, USB keys, backups. Protecting data means managing those media for their whole life.",
 pts:["Wherever data exists, processes must prevent loss of availability, disclosure (confidentiality) and alteration (integrity). Backups count as much as primary storage.",
      "Handling: only trusted, vetted people handle sensitive media. Written logs record who is responsible for each item.",
      "Retention: keep data no longer than its useful life or the legal requirement, whichever is longer.",
      "Keeping data too long needlessly exposes it to disclosure.",
      "Historically, backup media have been one of the biggest sources of data loss."],
 ex:"Payroll records have no business use after three years, but the law requires ten. Keep them ten years, then destroy them securely.",
 terms:[["Retention","How long data is kept."],["Media","The physical support on which data is stored."],["Handling","How media are marked, moved, stored and tracked."]],
 trap:"The legal requirement wins over usefulness: if the law says keep it longer, you keep it longer.",
 mnem:"Keep it as long as the longer of: need or law.",
 ref:{c:"p. 35",a:"ch. 5",o:"Domain 2"}},

{id:"d2-roles",d:2,t:"Roles: owners, custodians, controllers, processors",
 what:"Protecting data is a shared job. The exam checks that you know exactly who decides, who executes and who is ultimately responsible.",
 pts:["Business or mission owner (senior management): creates the security program, funds and staffs it, gives it priority. Ultimately responsible for protecting all assets.",
      "Data owner (information owner): a manager responsible for specific data. Decides its sensitivity label and how often it is backed up.",
      "System owner: a manager responsible for the computers that hold the data: patching, hardening, physical security.",
      "Custodian: provides hands-on protection: backups, restores, patches, antivirus. Follows orders and does not make critical decisions.",
      "Users: must follow the rules and know the penalties for breaking them.",
      "Data controller: creates and manages sensitive data, for example HR. Data processor: handles data on behalf of the controller, for example an outsourced payroll company.",
      "Data collection limitation: collect only the minimum personal data needed, lawfully and fairly, with the subject's knowledge or consent where appropriate."],
 ex:"The HR director decides that salary data is 'Confidential' and must be backed up daily (data owner). The infrastructure team runs the backup jobs (custodians). An external payroll firm processes the salaries (data processor).",
 terms:[["Data owner","The manager accountable for a specific data set."],["Custodian","The person doing the hands-on protection."],["Data controller","The party that decides why and how personal data is processed."],["Data processor","The party processing data on the controller's behalf."]],
 trap:"The data owner decides, the custodian executes. An outsourced payroll company is a data processor.",
 mnem:"Owner = orders. Custodian = carries out.",
 upd:"Under the GDPR, the controller is the party that determines the purposes and means of processing.",
 ref:{c:"p. 36 to 37",a:"ch. 5",o:"Domain 2"}},

{id:"d2-memoire",d:2,t:"Memory types and data remanence",
 what:"To destroy data properly, you must understand where it hides. Different memory types keep data in different ways, and some keep it after you think it is gone.",
 pts:["Data remanence: data that persists after non-invasive attempts to delete it.",
      "Volatile memory (RAM) loses its content without power. Non-volatile memory (ROM, disk, tape) keeps it.",
      "Cache is the fastest memory: registers inside the CPU, level 1 cache on the CPU, level 2 cache next to it. Cache uses SRAM.",
      "SRAM (static RAM): uses flip-flops, fast and expensive, no refresh needed. DRAM (dynamic RAM): uses small capacitors, slower and cheaper, must be refreshed constantly because the capacitors leak.",
      "Firmware is stored in ROM chips. PROM: written once. EPROM: erased with ultraviolet light. EEPROM: erased electrically, byte by byte.",
      "Flash memory, such as a USB key, is a type of EEPROM written in larger blocks."],
 ex:"Pulling the power cord wipes a server's RAM, but not the BIOS settings stored in EEPROM, nor anything on its SSD.",
 terms:[["Data remanence","Residual data left after deletion."],["Volatile","Loses data when power is lost."],["Flip-flop","A tiny circuit that holds one bit, used in SRAM."],["Firmware","Software stored in ROM, such as a BIOS."]],
 trap:"SRAM = fast, expensive, flip-flops, cache. DRAM = capacitors, refresh, main memory.",
 mnem:"Static RAM stays still (no refresh). Dynamic RAM needs constant attention (refresh).",
 ref:{c:"p. 37 to 38",a:"ch. 6",o:"Domain 2"}},

{id:"d2-ssd",d:2,t:"Why SSDs are different",
 what:"Solid-state drives do not store data the way magnetic disks do, so the classic wiping methods fail on them. This is a favorite exam topic.",
 pts:["An SSD combines flash memory (EEPROM) with DRAM.",
      "Degaussing has no effect on an SSD: there is nothing magnetic to disrupt.",
      "SSD blocks are logical and mapped to physical blocks. The drive does not overwrite a block in place; it writes to a free block and marks the old one as unallocated.",
      "Garbage collection later cleans the old blocks in the background. The TRIM command helps it, but TRIM does not reliably destroy data.",
      "A sector-by-sector overwrite is therefore unreliable, and so is file-level 'electronic shredding'.",
      "Valid methods: ATA Secure Erase for a working SSD, physical destruction for a damaged one."],
 ex:"A decommissioned laptop SSD goes back to the leasing company. Use the drive's Secure Erase function (or crypto erase if it is encrypted), never a free overwrite tool.",
 terms:[["ATA Secure Erase","A built-in command that makes the drive erase all its cells."],["Garbage collection","Background cleanup of unused SSD blocks."],["TRIM","A command marking blocks as no longer in use."],["Crypto erase","Destroying the encryption key so the data becomes unreadable."]],
 trap:"SSD plus degaussing is always the wrong answer.",
 mnem:"SSD: no magnet, no overwrite. Secure Erase or shred.",
 upd:"NIST SP 800-88 also recognizes cryptographic erase: destroy the key of a self-encrypting drive.",
 ref:{c:"p. 39",a:"ch. 6",o:"Domain 2"}},

{id:"d2-destruction",d:2,t:"Data destruction methods",
 what:"All media must be cleaned or destroyed before disposal. Otherwise attackers can recover information through object reuse.",
 pts:["Object reuse: recovering information from previously used objects, from dumpster diving through paper to reading unallocated blocks on a disk.",
      "Deleting a file only removes its entry in the file allocation table (FAT). Formatting replaces the table. In both cases the data usually remains.",
      "Overwriting (wiping): writing zeros or random characters over every sector. Much better than deleting.",
      "Degaussing: a strong magnetic field destroys the integrity of magnetic media such as tapes and hard disks.",
      "Destruction: incineration, pulverizing, shredding, acid. The most secure method, and the only one for damaged media.",
      "Shredding: the simplest form of physical destruction, for paper and small media such as optical discs."],
 ex:"A failed hard drive that no longer spins cannot be overwritten. Degauss it and then physically destroy it.",
 terms:[["Object reuse","Recovering data from reused or discarded media."],["Dumpster diving","Searching trash for information."],["Degaussing","Erasing magnetic media with a strong magnetic field."],["Wiping","Overwriting all data on a disk."]],
 trap:"Physical destruction is always the most secure answer. Overwriting is impossible on damaged media.",
 mnem:"Delete < Format < Overwrite < Degauss < Destroy.",
 upd:"NIST SP 800-88 groups sanitization into three levels: clear, purge, destroy.",
 ref:{c:"p. 39 to 40",a:"ch. 6",o:"Domain 2"}},

{id:"d2-certif",d:2,t:"Certification, accreditation and Common Criteria",
 what:"Before a system goes live, someone must check that it is secure enough, and someone must formally accept what risk remains. For products, an international standard rates how thoroughly they were evaluated.",
 pts:["Certification: the system has been checked against the data owner's security requirements, considering the system, its controls and the residual risk.",
      "Accreditation: the data owner formally accepts the certification and the residual risk. Required before the system goes into production.",
      "Common Criteria (ISO/IEC 15408): the international standard for evaluating the security of IT products.",
      "Target of Evaluation (ToE): the product being evaluated. Security Target: the document describing the ToE and its security requirements. Protection Profile: an independent set of security requirements for a category of products, such as firewalls.",
      "Evaluation Assurance Levels, each building on the previous one: EAL1 functionally tested, EAL2 structurally tested, EAL3 methodically tested and checked, EAL4 methodically designed, tested and reviewed, EAL5 semiformally designed and tested, EAL6 semiformally verified, designed and tested, EAL7 formally verified, designed and tested."],
 ex:"A new HR system passes its security review (certification). The HR director, as data owner, signs off on the remaining risk and authorizes go-live (accreditation).",
 terms:[["Certification","Technical evaluation against requirements."],["Accreditation","Management's formal acceptance of residual risk."],["Protection Profile","Standard requirements for a product category."],["EAL","Evaluation Assurance Level, 1 to 7."]],
 trap:"Certification is technical. Accreditation is a management decision to accept risk.",
 mnem:"EAL words climb: functionally, structurally, methodically (x2), semiformally (x2), formally.",
 upd:"In current NIST terminology (Risk Management Framework), accreditation is called authorization, or authorization to operate (ATO).",
 ref:{c:"p. 40 to 42",a:"ch. 6",o:"Domain 2"}},

{id:"d2-cadres",d:2,t:"Standards and control frameworks",
 what:"You rarely invent security controls from scratch. Standards and frameworks give you tested catalogs, which you then adapt to your organization.",
 pts:["PCI DSS: the Payment Card Industry Data Security Standard, created by the card brands. Mandatory for organizations that handle card data.",
      "OCTAVE (Carnegie Mellon University): a risk management framework in three phases: identify assets and threats, identify vulnerabilities, analyze risk and plan mitigation.",
      "ISO 27002 (formerly ISO 17799): a code of practice, a catalog of security controls. ISO 27001: the requirements for an information security management system (ISMS). Organizations can be certified against 27001.",
      "COBIT (from ISACA): a framework for IT governance and control.",
      "ITIL: a framework for IT service management.",
      "Scoping: deciding which parts of a standard apply. An organization with no wireless network declares the wireless controls out of scope.",
      "Tailoring: customizing a standard to the organization. It starts with selecting controls, continues with scoping, and ends with compensating controls."],
 ex:"A company adopts ISO 27001. It removes the controls for software development because it develops nothing (scoping), then adds extra monitoring where a control cannot be applied as written (tailoring with compensating controls).",
 terms:[["ISMS","Information security management system."],["Scoping","Choosing which parts of a standard apply."],["Tailoring","Adapting a standard to the organization."],["Control framework","A structured catalog of controls."]],
 trap:"ISO 27001 = requirements, certifiable. ISO 27002 = catalog of controls, not certifiable.",
 mnem:"27001 = the 1 you get certified in. 27002 = the 2nd book, the toolbox.",
 upd:"Current versions: PCI DSS 4.0 (2022, updated 4.0.1 in 2024), ISO/IEC 27001 and 27002:2022 (93 controls in four themes: organizational, people, physical, technological), COBIT 2019, ITIL 4.",
 ref:{c:"p. 40 to 43",a:"ch. 4",o:"Domain 2"}},

{id:"d2-donnees",d:2,t:"Protecting data at rest and in motion",
 what:"Data exists in two main states, and each needs different controls. Data at rest sits on a disk or in a file. Data in motion travels across a network.",
 pts:["Drive and tape encryption protect data at rest, even after physical security has been breached. Recommended for all mobile devices and media leaving a secure site.",
      "Whole-disk encryption is preferred. Partial encryption (encrypted folders or partitions) risks leaving sensitive data in temporary files, swap space or unallocated space.",
      "Backups must be stored offsite, with a bonded and insured company, in secure vehicles, at a site unlikely to be hit by the same disaster. Never at employees' homes.",
      "Data in motion is best protected by standards-based end-to-end encryption, such as an IPsec VPN, especially over untrusted networks like the Internet.",
      "Encrypting traffic on internal networks and private WAN links adds defense in depth."],
 ex:"Sites in Africa send daily backups to a data center in Switzerland over an IPsec VPN (data in motion), and the backup files are encrypted on disk (data at rest).",
 terms:[["Data at rest","Stored data."],["Data in motion","Data travelling across a network."],["Bonded","Covered by a financial guarantee against theft or misconduct."],["Whole-disk encryption","Encrypting the entire drive, including temporary and swap areas."]],
 trap:"Taking backup tapes home is always a wrong answer.",
 mnem:"At rest: encrypt the disk. In motion: encrypt the pipe.",
 ref:{c:"p. 43 to 44",a:"ch. 6",o:"Domain 2"}}
];

/* Recall cards: full questions */
const CARD_SRC = {
"d1-cia":[["What are the three properties of the CIA triad?","Confidentiality, Integrity, Availability."],["What does DAD stand for, and how does it relate to CIA?","Disclosure, Alteration, Destruction: the attacker's view, the opposite of CIA."],["What are the three A's of AAA?","Authentication, Authorization, Accounting (also called auditing)."],["What is non-repudiation?","The author of an action cannot deny having performed it, typically thanks to a digital signature."]],
"d1-ethique":[["List the four ISC2 canons in order.","1. Protect society, the common good, public trust and the infrastructure. 2. Act honorably, honestly, justly, responsibly and legally. 3. Provide diligent and competent service to principals. 4. Advance and protect the profession."],["Which parts of the ISC2 Code are mandatory, and which are advisory?","The canons are mandatory. The guidance is advisory."],["Laws from two countries conflict. Which one should you give priority to, according to the ISC2 Code?","The law of the jurisdiction where the service is provided."],["Who are your 'principals' in the ISC2 Code?","Your employers and clients."]],
"d1-codes":[["Who published RFC 1087, Ethics and the Internet, and when?","The Internet Activities Board (IAB), in 1989."],["Name three behaviors that RFC 1087 considers unethical.","Any three of: seeking unauthorized access, disrupting the intended use of the Internet, wasting resources, destroying the integrity of information, compromising users' privacy."],["Who published the Ten Commandments of Computer Ethics?","The Computer Ethics Institute."]],
"d1-droit":[["What is the burden of proof in a criminal case, and in a civil case?","Criminal: beyond a reasonable doubt. Civil: preponderance of the evidence (more likely than not)."],["What are statutory damages, and what makes them special?","Damages whose amount is fixed by law. They can be awarded even if the victim cannot prove any actual loss."],["What is tort law?","The law of civil wrongs: compensating someone harmed outside a contract, for example through negligence."],["Give two examples of administrative (regulatory) law.","Any two of: HIPAA, FCC regulations, FDA regulations, FAA regulations."],["Which legal system relies mainly on precedent, and which on written codes?","Common law relies on precedent. Civil law (the legal system) relies on written codes."]],
"d1-duecare":[["What is due care?","Doing what a reasonable person would do in the same situation (the prudent man rule): taking the right actions."],["What is due diligence, according to ISC2?","The effort to know: investigating, assessing risks and verifying that protections work."],["What is the opposite of due care?","Gross negligence."]],
"d1-preuves":[["What does the best evidence rule say?","Courts prefer original evidence over copies."],["What is chain of custody?","A record of everyone who handled the evidence, when, where and why, from collection to court."],["Is a honeypot entrapment or enticement? Why?","Enticement: it only tempts someone who already intends to attack."],["What type of evidence are computer logs usually considered?","Secondary evidence."],["How do you prove a forensic image was not altered?","Compare its hash before and after analysis; identical hashes prove integrity."]],
"d1-pi":[["What is the difference between the ™ and ® symbols?","™ marks an unregistered trademark, ® a registered one."],["What does copyright protect, and what does it not protect?","It protects the form of expression, not the underlying idea."],["How long does a patent usually last?","20 years from the filing date."],["How is a trade secret protected?","By keeping it secret: NDAs, non-compete agreements and due care. It is never published."]],
"d1-privacy":[["What replaced the EU Data Protection Directive, and when?","The GDPR, applicable since 2018."],["What is the current legal mechanism for EU to US personal data transfers?","The EU-US Data Privacy Framework (2023), after Safe Harbor and Privacy Shield were invalidated."],["Which agreement controls the export of cryptography today?","The Wassenaar Arrangement (successor of CoCom)."],["What is the Budapest Convention?","The Council of Europe Convention on Cybercrime, for international cooperation on cybercrime."]],
"d1-tiers":[["What is the primary security control when working with a service provider?","The contract."],["What does an SLA mainly address?","Availability."],["What is attestation?","An independent third party audits a provider against a baseline and states its opinion on its security."],["Which is often riskier, an acquisition or a divestiture? Why?","A divestiture: duplicate accounts, shared passwords, badges and keys may remain valid."]],
"d1-docs":[["Which security documents are mandatory, and which is discretionary?","Policies, procedures, standards (and baselines) are mandatory. Guidelines are discretionary."],["Does a security policy name specific technologies such as Windows or Linux? Why?","No. It stays high level, so it does not change when technology changes."],["Give an example of a standard.","'All laptops run Windows 11 Enterprise, 64-bit.'"],["What is a baseline?","A uniform minimum level of security, often based on a benchmark such as CIS. Exceptions need senior management sign-off."]],

const pad=n=>String(n).padStart(2,"0");
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function daysUntil(iso){return Math.round((new Date(iso+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lesson=id=>LESSONS.find(l=>l.id===id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Math.round(n).toLocaleString("en-US");

function dueCards(){const t=today();return CARDS.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t).sort((a,b)=>S.cards[a.id].due.localeCompare(S.cards[b.id].due))}
function nextLesson(){return LESSONS.find(l=>!S.read[l.id])||null}
function weakness(fid){
  let w=0;
  CARDS.filter(c=>c.f===fid).forEach(c=>{const s=S.cards[c.id];if(s&&s.miss&&s.box<=2)w+=s.miss});
  QCM.filter(q=>q.f===fid).forEach(q=>{const s=S.qcm[q.id];if(s&&s.last===false)w+=2});
  DRILLS.filter(d=>d.f===fid).forEach(d=>{const s=S.drills[d.id];if(s&&s.last===false)w+=2});
  return w;
}
function mastery(d){
  const cs=CARDS.filter(c=>lesson(c.f).d===d);if(!cs.length)return null;
  return Math.round(cs.reduce((t,c)=>t+((S.cards[c.id]||{box:0}).box/5),0)/cs.length*100);
}
function grade(card,g){
  const s=S.cards[card.id]||{box:0,miss:0,due:today()};
  if(g===0){s.box=1;s.miss=(s.miss||0)+1;s.due=addDays(today(),1)}
  else if(g===1){s.box=Math.max(1,s.box);s.due=addDays(today(),1)}
  else{s.box=Math.min(5,Math.max(1,s.box+1));s.due=addDays(today(),INTERVALS[s.box])}
  S.cards[card.id]=s;save();
}
function recordDrill(d,ok){const s=S.drills[d.id]||{ok:0,miss:0};ok?s.ok++:s.miss++;s.last=ok;S.drills[d.id]=s;save()}
function bumpStreak(){const t=today(),st=S.streak;if(st.last===t)return;st.count=(st.last===addDays(t,-1))?st.count+1:1;st.last=t;save()}

/* ================= LISTEN (text to speech) ================= */
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.9;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>v.lang==="en-US")||vs.find(v=>v.lang&&v.lang.startsWith("en"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function stopSpeak(){if("speechSynthesis" in window)speechSynthesis.cancel()}
if("speechSynthesis" in window)speechSynthesis.getVoices();
function lessonText(l){return [l.t+".",l.what,...l.pts,"Example. "+l.ex,"Exam trap. "+l.trap,"Memory hook. "+l.mnem].join(" ").replace(/×/g," times ").replace(/−/g," minus ")}

/* ================= CALC DRILL GENERATOR ================= */
function makeCalc(){
  const av=[20,40,50,80,100,150,200][Math.floor(Math.random()*7)]*1000;
  const ef=[10,20,25,40,50,75,100][Math.floor(Math.random()*7)];
  const aro=[0.5,1,2,3,4,6][Math.floor(Math.random()*6)];
  const sle=av*ef/100,ale=sle*aro;
  const wrong=[sle,av*aro,ale*2,ale/2,av*ef/100/aro].filter(x=>x!==ale&&x>0);
  const opts=shuffle([ale,...shuffle([...new Set(wrong)]).slice(0,3)]);
  return {q:`An asset is worth ${fmt(av)}. One incident destroys ${ef} % of its value, and incidents happen ${aro===0.5?"once every two years":aro+" time"+(aro>1?"s":"")+" per year"}. What is the ALE?`,
    o:opts.map(fmt),a:opts.indexOf(ale),x:`SLE = ${fmt(av)} × ${ef} % = ${fmt(sle)}. ARO = ${aro}. ALE = ${fmt(sle)} × ${aro} = ${fmt(ale)}.`};
}

/* ---------- Session ---------- */
function pickDrills(l,weakMode){
  const learned=Object.keys(S.read);
  if(weakMode){
    const missed=shuffle(DRILLS.filter(d=>S.drills[d.id]&&S.drills[d.id].last===false));
    return missed.slice(0,2);
  }
  const out=[];
  if(l){const mine=shuffle(DRILLS.filter(d=>d.f===l.id));if(mine.length)out.push(mine[0])}
  const pool=DRILLS.filter(d=>learned.includes(d.f)&&!out.includes(d)&&(!l||d.f!==l.id));
  const missed=shuffle(pool.filter(d=>S.drills[d.id]&&S.drills[d.id].last===false));
  const fresh=shuffle(pool.filter(d=>!out.some(o=>o.type===d.type)));
  const second=missed[0]||fresh[0]||shuffle(pool)[0];
  if(second)out.push(second);
  return out;
}
function prepDrill(d){
  const st={d,err:0,done:false};
  if(d.type==="match"){st.queue=shuffle(d.pairs);st.i=0;st.opts=shuffle(d.pairs.map(p=>p[1]));st.fb=null}
  if(d.type==="sort"){st.queue=shuffle(d.items);st.i=0;st.fb=null}
  if(d.type==="order"){st.pool=shuffle(d.items);st.built=[];st.fb=null}
  if(d.type==="explain"){st.shown=false}
  if(d.type==="calc"){st.c=makeCalc();st.picked=null}
  return st;
}
function startSession(lid,weakMode){
  stopSpeak();
  const l=lid?lesson(lid):null;let cards,qcm;
  if(weakMode){
    const wl=LESSONS.filter(x=>weakness(x.id)>0).map(x=>x.id);
    cards=CARDS.filter(c=>wl.includes(c.f)&&S.cards[c.id]&&S.cards[c.id].box<=2).slice(0,15);
    qcm=shuffle(QCM.filter(q=>S.qcm[q.id]&&S.qcm[q.id].last===false)).slice(0,5);
    if(qcm.length<5)qcm=qcm.concat(shuffle(QCM.filter(q=>wl.includes(q.f)&&!qcm.includes(q))).slice(0,5-qcm.length));
  }else{
    cards=dueCards().slice(0,12);
    if(l)cards=cards.concat(CARDS.filter(c=>c.f===l.id&&!S.cards[c.id]&&!cards.includes(c)));
    const learned=Object.keys(S.read).concat(l?[l.id]:[]);
    const mine=l?shuffle(QCM.filter(q=>q.f===l.id)).slice(0,2):[];
    const missed=shuffle(QCM.filter(q=>learned.includes(q.f)&&S.qcm[q.id]&&S.qcm[q.id].last===false&&!mine.includes(q)));
    const other=shuffle(QCM.filter(q=>learned.includes(q.f)&&!mine.includes(q)&&!missed.includes(q)));
    qcm=mine.concat(missed,other).slice(0,5);
  }
  qcm=qcm.map(q=>({...q,order:shuffle(q.o.map((_,i)=>i))}));
  const drills=(l&&!weakMode)?null:pickDrills(null,weakMode);
  ses={l,weakMode,step:l&&!weakMode?0:1,cards,ci:0,reveal:false,drills,di:0,dst:null,qcm,qi:0,picked:null,score:0,
       graded:{ok:0,mid:0,ko:0},drillOk:0,start:Date.now(),missed:new Set()};
  advanceEmpty();render();window.scrollTo(0,0);
}
function advanceEmpty(){
  const s=ses;
  if(s.step===1&&!s.cards.length)s.step=2;
  if(s.step===2){
    if(!s.drills)s.drills=pickDrills(s.l,s.weakMode);
    if(!s.drills.length)s.step=3;else if(!s.dst)s.dst=prepDrill(s.drills[s.di]);
  }
  if(s.step===3&&!s.qcm.length)finish();
}
function finish(){ses.step=4;bumpStreak();S.log.push({d:today(),q:ses.score+"/"+ses.qcm.length,l:ses.l?ses.l.id:"weak"});save()}
function go(step){stopSpeak();ses.step=step;advanceEmpty();render();window.scrollTo(0,0)}

function header(){
  const names=["Learn","Recall","Practice","Exam questions","Recap"];
  const min=Math.floor((Date.now()-ses.start)/60000);
  return `<div class="sessionbar"><div class="steps">${names.slice(0,4).map((n,i)=>`<span class="${i<ses.step?"done":i===ses.step?"on":""}"></span>`).join("")}</div>
  <div class="clock"><span>${names[ses.step]}</span><span id="clk">${min} / ${SESSION_MIN} min</span></div></div>`;
}
function lessonHTML(l){
  return `<div class="fiche">
  <p class="muted small">Domain ${l.d}: ${esc(DOMAINS[l.d-1].name)}</p>
  <h1>${esc(l.t)}</h1>
  <button class="btn listen" id="listen">▶ Listen</button>
  <p class="lead">${esc(l.what)}</p>
  <h3>Key points</h3>
  <ul>${l.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
  <h3>Example</h3><p>${esc(l.ex)}</p>
  <h3>ISC2 vocabulary</h3>
  <dl class="terms">${l.terms.map(e=>`<dt>${esc(e[0])}</dt><dd>${esc(e[1])}</dd>`).join("")}</dl>
  <div class="note trap"><b>Exam trap.</b> ${esc(l.trap)}</div>
  <div class="note hook"><b>Memory hook.</b> ${esc(l.mnem)}</div>
  ${l.upd?`<div class="note"><b>Updated since the books.</b> ${esc(l.upd)}</div>`:""}
  <p class="refs">Book references: Eleventh Hour ${esc(l.ref.c)}, All-in-One ${esc(l.ref.a)}, Official Textbook ${esc(l.ref.o)}.</p>
  </div>`;
}
function bindListen(l){const b=document.getElementById("listen");if(!b)return;
  if(!("speechSynthesis" in window)){b.remove();return}
  b.onclick=()=>{if(speechSynthesis.speaking){stopSpeak();b.textContent="▶ Listen"}else{speak(lessonText(l));b.textContent="■ Stop"}}}

function drillHTML(st){
  const d=st.d;let h=`<p class="muted small">Exercise ${ses.di+1} of ${ses.drills.length}. From: ${esc(lesson(d.f).t)}</p><h2>${esc(d.title)}</h2>`;
  if(d.type==="match"){
    if(st.i<st.queue.length){
      const p=st.queue[st.i];
      h+=`<div class="card"><div class="q">${esc(p[0])}</div></div>`+
        st.opts.map(o=>`<button class="opt ${st.fb&&o===p[1]?"right":""} ${st.fb&&st.fb.pick===o&&o!==p[1]?"wrong":""}" data-v="${esc(o)}" ${st.fb?"disabled":""}>${esc(o)}</button>`).join("");
      if(st.fb)h+=`<button class="btn solid full" id="dnext">Next</button>`;
      h+=`<p class="muted small">${st.i+1} of ${st.queue.length}</p>`;
    }
  }
  if(d.type==="sort"){
    if(st.i<st.queue.length){
      const it=st.queue[st.i];
      h+=`<div class="card"><div class="q">${esc(it[0])}</div></div><div class="cats">`+
        d.cats.map((c,ci)=>`<button class="opt ${st.fb&&ci===it[1]?"right":""} ${st.fb&&st.fb.pick===ci&&ci!==it[1]?"wrong":""}" data-c="${ci}" ${st.fb?"disabled":""}>${esc(c)}</button>`).join("")+`</div>`;
      if(st.fb)h+=`<button class="btn solid full" id="dnext">Next</button>`;
      h+=`<p class="muted small">${st.i+1} of ${st.queue.length}</p>`;
    }
  }
  if(d.type==="order"){
    h+=`<p class="muted small">Tap the items in the right order.</p><ol class="built">${st.built.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`+
      st.pool.map(x=>`<button class="opt ${st.fb===x?"wrong":""}" data-o="${esc(x)}">${esc(x)}</button>`).join("");
  }
  if(d.type==="explain"){
    h+=`<div class="card"><div class="q">${esc(d.prompt)}</div></div><p class="muted small">Say your answer out loud, as if explaining to a colleague. Then compare.</p>`;
    h+=st.shown?`<div class="note hook"><b>Model answer.</b> ${esc(d.model)}</div>
      <div class="grades"><button class="g-ko" data-e="0">Missed it</button><button class="g-mid" data-e="1">Partly</button><button class="g-ok" data-e="2">Nailed it</button></div>`
      :`<button class="btn solid full" id="show">Show model answer</button>`;
  }
  if(d.type==="calc"){
    const c=st.c;
    h+=`<div class="qen">${esc(c.q)}</div>`+c.o.map((o,i)=>`<button class="opt ${st.picked!==null&&i===c.a?"right":""} ${st.picked===i&&i!==c.a?"wrong":""}" data-k="${i}" ${st.picked!==null?"disabled":""}>${esc(o)}</button>`).join("");
    if(st.picked!==null)h+=`<div class="note ${st.picked===c.a?"":"trap"}"><b>${st.picked===c.a?"Correct.":"Not quite."}</b> ${esc(c.x)}</div><button class="btn solid full" id="dnext">Next</button>`;
  }
  if(st.done)h+=`<div class="note ${st.err?"trap":""}"><b>${st.err?`Done, with ${st.err} mistake${st.err>1?"s":""}.`:"Perfect."}</b> ${st.err?"This exercise will come back.":""}</div><button class="btn solid full" id="dfinish">Continue</button>`;
  return h;
}
function endDrill(ok){
  const s=ses;recordDrill(s.dst.d,ok);if(ok)s.drillOk++;else s.missed.add(s.dst.d.f);
  s.di++;s.dst=null;
  if(s.di<s.drills.length){s.dst=prepDrill(s.drills[s.di]);render();window.scrollTo(0,0)}else go(3);
}
function bindDrill(){
  const st=ses.dst,d=st.d,$=id=>document.getElementById(id);
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const p=st.queue[st.i];st.fb={pick:b.dataset.v};if(b.dataset.v!==p[1])st.err++;render()});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const it=st.queue[st.i];st.fb={pick:+b.dataset.c};if(+b.dataset.c!==it[1])st.err++;render()});
  if($("dnext"))$("dnext").onclick=()=>{
    if(d.type==="calc"){endDrill(st.picked===st.c.a);return}
    st.fb=null;st.i++;if(st.i>=st.queue.length)st.done=true;render()};
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    const want=d.items[st.built.length];
    if(b.dataset.o===want){st.built.push(want);st.pool=st.pool.filter(x=>x!==want);st.fb=null;if(!st.pool.length)st.done=true}
    else{st.err++;st.fb=b.dataset.o}
    render()});
  if($("show"))$("show").onclick=()=>{st.shown=true;render()};
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>endDrill(+b.dataset.e===2));
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{st.picked=+b.dataset.k;render()});
  if($("dfinish"))$("dfinish").onclick=()=>endDrill(st.err===0);
}

function renderSession(){
  const s=ses;let body="";
  if(s.step===0)body=lessonHTML(s.l)+`<button class="btn solid full" id="next">I've got it: start recall</button>`;
  else if(s.step===1){
    const c=s.cards[s.ci];
    body=`<p class="muted small">Card ${s.ci+1} of ${s.cards.length}. Answer in your head before you flip it.</p>
    <div class="card flash"><div class="q">${esc(c.q)}</div>${s.reveal?`<div class="a">${esc(c.a)}</div>`:""}</div>
    ${s.reveal?`<div class="grades"><button class="g-ko" data-g="0">Missed</button><button class="g-mid" data-g="1">Unsure</button><button class="g-ok" data-g="2">Knew it</button></div>
      <button class="link" id="say" style="margin-top:12px">▶ Hear the answer</button>`
      :`<button class="btn solid full" id="reveal">Show answer</button>`}
    <p class="muted small" style="margin-top:10px">${esc(lesson(c.f).t)}</p>`;
  }
  else if(s.step===2)body=drillHTML(s.dst);
  else if(s.step===3){
    const q=s.qcm[s.qi];
    body=`<p class="muted small">Question ${s.qi+1} of ${s.qcm.length}. Think like a manager: pick the answer that best protects the organization.</p>
    <div class="qen">${esc(q.q)}</div>
    ${q.order.map(i=>{let c="";if(s.picked!==null){if(i===q.a)c="right";else if(i===s.picked)c="wrong"}
      return `<button class="opt ${c}" data-i="${i}" ${s.picked!==null?"disabled":""}>${esc(q.o[i])}</button>`}).join("")}
    ${s.picked!==null?`<div class="note ${s.picked===q.a?"":"trap"}"><b>${s.picked===q.a?"Correct.":"Not quite."}</b> ${esc(q.x)}</div>
      <button class="btn solid full" id="nextq">${s.qi+1<s.qcm.length?"Next question":"See my recap"}</button>`:""}`;
  }else{
    const weak=[...s.missed].map(lesson);
    body=`<h1>Session complete</h1>
    <div class="stat"><div><b>${s.score}/${s.qcm.length}</b><span class="muted small">exam questions</span></div>
    <div><b>${s.graded.ok}/${s.cards.length}</b><span class="muted small">cards known</span></div>
    <div><b>${Math.max(1,Math.round((Date.now()-s.start)/60000))} min</b><span class="muted small">duration</span></div></div>
    ${weak.length?`<div class="block"><h2>To revisit</h2>${weak.map(l=>`<button class="item" data-l="${l.id}"><span>${esc(l.t)}</span><span class="small muted">Open</span></button>`).join("")}</div>`
      :`<p class="block">No mistakes this time. Missed cards will come back tomorrow.</p>`}
    <button class="btn solid full block" id="done">Back to home</button>`;
  }
  app.innerHTML=header()+`<div class="list">${body}</div>`;
  const $=id=>document.getElementById(id);
  if(s.step===0)bindListen(s.l);
  if(s.step===2)bindDrill();
  if($("next"))$("next").onclick=()=>{S.read[s.l.id]=today();save();go(1)};
  if($("reveal"))$("reveal").onclick=()=>{s.reveal=true;render()};
  if($("say"))$("say").onclick=()=>speak(s.cards[s.ci].q+" "+s.cards[s.ci].a);
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g,c=s.cards[s.ci];grade(c,g);s.graded[["ko","mid","ok"][g]]++;if(g===0)s.missed.add(c.f);
    s.ci++;s.reveal=false;stopSpeak();if(s.ci>=s.cards.length)go(2);else{render();window.scrollTo(0,0)}});
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    const q=s.qcm[s.qi];s.picked=+b.dataset.i;const ok=s.picked===q.a;
    const st=S.qcm[q.id]||{ok:0,miss:0};ok?st.ok++:st.miss++;st.last=ok;S.qcm[q.id]=st;save();
    if(ok)s.score++;else s.missed.add(q.f);render()});
  if($("nextq"))$("nextq").onclick=()=>{s.qi++;s.picked=null;if(s.qi>=s.qcm.length)finish();render();window.scrollTo(0,0)};
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ses=null;tab="lessons";openLesson=b.dataset.l;render();window.scrollTo(0,0)});
  if($("done"))$("done").onclick=()=>setTab("home");
}
